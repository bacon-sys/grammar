通工具中間不加冠詞，要寫 by car。"}, {"t": "We eat dinner at six thirty.", "ok": false, "fb": "這句是對的。幾點鐘用 at。"}]}]}, {"id": "which", "title": "Which 的用法", "unit": "第二冊 Unit 4 · B2 L3–4", "points": "<p>Which 和 What 都可以問「哪一個」，差別在<strong>有沒有給你範圍</strong>。</p><h3>What 和 Which 怎麼分</h3><table><tr><th></th><th>用在</th><th>例子</th></tr><tr><td class=\"en\">What</td><td>範圍沒有限制</td><td class=\"en\"><span class=\"k1\">What</span> is your favorite color?</td></tr><tr><td class=\"en\">Which</td><td>在幾個選項中挑</td><td class=\"en\"><span class=\"k1\">Which</span> do you like, tea or coffee?</td></tr></table><p style=\"color:var(--muted);font-size:17px\">判斷方法：句子裡有沒有出現 <span class=\"en\">A or B</span>，或前面有沒有先提到幾個東西。有就用 Which。</p><h3>三種常見句型</h3><p class=\"en\"><span class=\"k1\">Which</span> do you want, the red one <span class=\"k2\">or</span> the blue one?<br><span class=\"k1\">Which one</span> is yours?<br><span class=\"k1\">Which</span> <span class=\"k3\">girl</span> is your sister?　→ Which 後面可以直接接名詞</p><h3>不能用 Yes / No 回答</h3><p class=\"en\">Which is your bag?　<span class=\"bad\">Yes, it is.</span>　→ The black one.</p><p>Which 是疑問詞，和 What、Where 一樣，回答要給出具體內容。</p>", "questions": [{"q": "____ do you like better, apple juice or orange juice?", "opts": [{"t": "What", "ok": false, "fb": "句子裡給了兩個選項，要用 Which。"}, {"t": "Which", "ok": true, "fb": "有 A or B 兩個選項讓你挑，用 Which。"}, {"t": "Who", "ok": false, "fb": "Who 是問人，這裡問的是飲料。"}, {"t": "How", "ok": false, "fb": "How 問方法或狀態，不是在兩個選項中挑。"}]}, {"q": "A: ____ is your favorite subject?　B: Math. I like numbers.", "opts": [{"t": "What", "ok": true, "fb": "沒有給定範圍，所有科目都可以回答，用 What。"}, {"t": "Which", "ok": false, "fb": "句子裡沒有給選項，範圍不受限，要用 What。"}, {"t": "Whose", "ok": false, "fb": "Whose 問東西的主人，這裡問的是喜歡的科目。"}, {"t": "Where", "ok": false, "fb": "回答的是科目名稱，不是地點。"}]}, {"q": "____ girl is your sister, the tall one or the short one?", "opts": [{"t": "What", "ok": false, "fb": "後面給了兩個選項，要用 Which。"}, {"t": "Which", "ok": true, "fb": "Which 後面可以直接接名詞，而且句尾給了兩個選項。"}, {"t": "Who", "ok": false, "fb": "Who 後面不能接名詞，而且這裡是要在兩人中挑一個。"}, {"t": "Whose", "ok": false, "fb": "問的不是誰的東西，是哪一個女生。"}]}, {"q": "A: Which is your bike, the red one or the black one?　B: ____", "opts": [{"t": "Yes, it is.", "ok": false, "fb": "Which 是疑問詞，不能用 Yes 或 No 回答。"}, {"t": "The red one.", "ok": true, "fb": "Which 的回答要指出是哪一個。"}, {"t": "It's a bike.", "ok": false, "fb": "這是回答 What is it? 的答案。"}, {"t": "No, it isn't.", "ok": false, "fb": "疑問詞開頭的問句不能用 Yes / No 回答。"}]}, {"q": "There are three cakes on the table. ____ do you want?", "opts": [{"t": "What", "ok": false, "fb": "前面已經說了只有三個蛋糕，範圍是限定的，用 Which。"}, {"t": "Which one", "ok": true, "fb": "前面提到三個蛋糕，是在有限的選項中挑，用 Which one。"}, {"t": "Who", "ok": false, "fb": "Who 問的是人，但這裡問的是要哪一個蛋糕。"}, {"t": "How", "ok": false, "fb": "How 問方法或狀態，不是挑東西。"}]}, {"q": "下列哪一組問答是錯的？", "opts": [{"t": "A: Which season do you like best?　B: Spring.", "ok": false, "fb": "這組是對的。季節只有四個，範圍有限，用 Which。"}, {"t": "A: What is in your bag?　B: Some books and a pen.", "ok": false, "fb": "這組是對的。沒有給定範圍，用 What。"}, {"t": "A: Which is your seat, this one or that one?　B: Yes, this one.", "ok": true, "fb": "這組錯了。Which 開頭的問句不能加 Yes，直接說 This one 就好。"}, {"t": "A: Which color do you want, black or white?　B: White, please.", "ok": false, "fb": "這組是對的。給了兩個選項用 Which，回答直接說出選擇。"}]}, {"q": "A: ____ do you go to school, by bus or by bike?　B: By bike. It's faster.", "opts": [{"t": "How", "ok": false, "fb": "雖然問交通方式常用 How，但這句給了兩個選項，用 Which 更貼切。"}, {"t": "Which", "ok": true, "fb": "句尾給了 by bus or by bike 兩個選項，用 Which。"}, {"t": "What", "ok": false, "fb": "有明確的兩個選項時要用 Which。"}, {"t": "Where", "ok": false, "fb": "問的不是地點，是交通方式。"}]}, {"q": "A: ____ is your English teacher?　B: Ms. Chen. She is the one with long hair.", "opts": [{"t": "Which", "ok": false, "fb": "回答是一個人名，沒有給定的選項範圍，用 Who 比較自然。"}, {"t": "Who", "ok": true, "fb": "回答是一個人，而且句子裡沒有給選項，用 Who。"}, {"t": "What", "ok": false, "fb": "問「誰是你的老師」要用 Who。"}, {"t": "Whose", "ok": false, "fb": "Whose 問的是東西的主人。"}]}]}, {"id": "ordinal-date", "title": "序數、時間與日期的表達", "unit": "第二冊 Unit 4 · B2 L3–4", "points": "<p>基數是<strong>數量</strong>（有幾個），序數是<strong>順序</strong>（第幾個）。日期一律用序數。</p><h3>要特別記的序數</h3><table><tr><th>基數</th><th>序數</th><th>注意</th></tr><tr><td class=\"en\">one</td><td class=\"en\">first</td><td>整個字換掉</td></tr><tr><td class=\"en\">two</td><td class=\"en\">second</td><td>整個字換掉</td></tr><tr><td class=\"en\">three</td><td class=\"en\">third</td><td>整個字換掉</td></tr><tr><td class=\"en\">five</td><td class=\"en\">fifth</td><td class=\"bad\">fiveth</td></tr><tr><td class=\"en\">nine</td><td class=\"en\">ninth</td><td class=\"bad\">nineth（去掉 e）</td></tr><tr><td class=\"en\">twelve</td><td class=\"en\">twelfth</td><td class=\"bad\">twelveth</td></tr><tr><td class=\"en\">twenty</td><td class=\"en\">twentieth</td><td>y 改成 ie</td></tr></table><p style=\"color:var(--muted);font-size:17px\">其他大多是直接加 -th：four → fourth、six → sixth、ten → tenth。</p><h3>三種問句要分清楚</h3><table><tr><th>問句</th><th>問什麼</th><th>回答</th></tr><tr><td class=\"en\">What time is it?</td><td>幾點</td><td class=\"en\">It's seven o'clock.</td></tr><tr><td class=\"en\">What day is it today?</td><td>星期幾</td><td class=\"en\">It's Monday.</td></tr><tr><td class=\"en\">What's the date today?</td><td>幾月幾號</td><td class=\"en\">It's June 10.</td></tr></table><h3>時間怎麼說</h3><p class=\"en\">7:00 → seven o'clock<br>7:15 → seven fifteen<br>7:30 → seven thirty</p><p style=\"color:var(--muted);font-size:17px\">只有整點才用 o'clock，7:15 不能說成 <span class=\"bad\">seven fifteen o'clock</span>。</p>", "questions": [{"q": "December is the ____ month of the year.", "opts": [{"t": "twelve", "ok": false, "fb": "這是基數，表示數量。講「第幾個」要用序數 twelfth。"}, {"t": "twelveth", "ok": false, "fb": "拼錯了。twelve 的序數要把 ve 改成 f，變成 twelfth。"}, {"t": "twelfth", "ok": true, "fb": "twelve 的序數是 twelfth，ve 要改成 f。"}, {"t": "twelves", "ok": false, "fb": "這是複數形，不是序數。"}]}, {"q": "My birthday is on the ____ of May. I will be thirteen.", "opts": [{"t": "five", "ok": false, "fb": "日期要用序數，不用基數。"}, {"t": "fifth", "ok": true, "fb": "five 的序數是 fifth，注意 ve 要改成 f。"}, {"t": "fiveth", "ok": false, "fb": "拼錯了。five 的序數把 ve 改成 f，寫成 fifth。"}, {"t": "fives", "ok": false, "fb": "這是複數形，不能表示第幾個。"}]}, {"q": "September is the ____ month of the year.", "opts": [{"t": "nineth", "ok": false, "fb": "拼錯了。nine 的序數要去掉 e，寫成 ninth。"}, {"t": "ninth", "ok": true, "fb": "nine 加 th 之前要先去掉字尾的 e。"}, {"t": "nine", "ok": false, "fb": "這是基數，表示數量，不是順序。"}, {"t": "ninenth", "ok": false, "fb": "沒有這種拼法，正確是 ninth。"}]}, {"q": "A: ____ today?　B: It's Wednesday. We have music class.", "opts": [{"t": "What time is it", "ok": false, "fb": "回答的是星期三，不是幾點鐘。"}, {"t": "What day is it", "ok": true, "fb": "回答是星期幾，所以問句要用 What day。"}, {"t": "What's the date", "ok": false, "fb": "這是問幾月幾號，回答會是 It's June 10 這類答案。"}, {"t": "How is it", "ok": false, "fb": "How 問狀態，回答不會是星期幾。"}]}, {"q": "A: ____ today?　B: It's October 10. It's a holiday.", "opts": [{"t": "What day is it", "ok": false, "fb": "這是問星期幾，回答會是 Monday、Tuesday 這類答案。"}, {"t": "What's the date", "ok": true, "fb": "回答是幾月幾號，問句要用 What's the date。"}, {"t": "What time is it", "ok": false, "fb": "回答的是日期，不是時間。"}, {"t": "Which day is it", "ok": false, "fb": "問日期的固定說法是 What's the date，不用 Which。"}]}, {"q": "A: What time is it now?　B: ____ We are late!", "opts": [{"t": "It's Friday.", "ok": false, "fb": "這是回答 What day 的答案。"}, {"t": "It's eight fifteen.", "ok": true, "fb": "What time 問的是幾點幾分。"}, {"t": "It's May 20.", "ok": false, "fb": "這是回答 What's the date 的答案。"}, {"t": "It's sunny.", "ok": false, "fb": "這是回答天氣的答案。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "My classroom is on the third floor.", "ok": false, "fb": "這句是對的。樓層用序數 third。"}, {"t": "It's seven thirty o'clock now.", "ok": true, "fb": "這句錯了。只有整點才能用 o'clock，七點半直接說 seven thirty。"}, {"t": "Today is the first day of school.", "ok": false, "fb": "這句是對的。first 是 one 的序數。"}, {"t": "There are twelve months in a year.", "ok": false, "fb": "這句是對的。講數量用基數 twelve。"}]}, {"q": "Our English classroom is on the ____ floor, and there are ____ students in our class.", "opts": [{"t": "two / twenty", "ok": false, "fb": "樓層講的是順序，要用序數 second。"}, {"t": "second / twenty", "ok": true, "fb": "樓層用序數 second；學生人數是數量，用基數 twenty。"}, {"t": "second / twentieth", "ok": false, "fb": "前半對了，但學生人數是數量，要用基數 twenty。"}, {"t": "two / twentieth", "ok": false, "fb": "兩個都放反了。樓層用序數，人數用基數。"}]}]}, {"id": "frequency", "title": "頻率副詞與 How often", "unit": "第二冊 Unit 4 · B2 L3–4", "points": "<p>頻率副詞的兩個考點：<strong>頻率的高低順序</strong>，以及<strong>放在句子的哪個位置</strong>。</p><h3>從最常到最不常</h3><table><tr><th>副詞</th><th>大約的頻率</th></tr><tr><td class=\"en\">always</td><td>總是（100%）</td></tr><tr><td class=\"en\">usually</td><td>通常</td></tr><tr><td class=\"en\">often</td><td>常常</td></tr><tr><td class=\"en\">sometimes</td><td>有時候</td></tr><tr><td class=\"en\">seldom</td><td>很少</td></tr><tr><td class=\"en\">never</td><td>從不（0%）</td></tr></table><h3>位置：be 動詞後面，一般動詞前面</h3><p class=\"en\">She <span class=\"k1\">is</span> <span class=\"k2\">always</span> happy.　→ be 動詞後面<br>She <span class=\"k2\">always</span> <span class=\"k1\">gets</span> up early.　→ 一般動詞前面</p><p style=\"color:var(--muted);font-size:17px\">記法：頻率副詞喜歡「躲在 be 動詞後面、擋在一般動詞前面」。</p><h3>頻率副詞片語：放句尾</h3><p class=\"en\"><span class=\"k3\">once</span> a week（一週一次）<br><span class=\"k3\">twice</span> a month（一個月兩次）<br><span class=\"k3\">three times</span> a year（一年三次）<br>every day / every Sunday</p><p class=\"en\">I go swimming <span class=\"k3\">twice a week</span>.　→ 片語放在句尾</p><h3>How often 問頻率</h3><p class=\"en\"><span class=\"k1\">How often</span> do you play basketball?<br>→ Twice a week. / Every Sunday. / Never.</p><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">She always is late.</span>　→ 要放在 be 動詞後面</p><p class=\"en\"><span class=\"bad\">He goes never to bed early.</span>　→ 要放在一般動詞前面</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">I once a week go swimming.</span>　→ 片語要放句尾</p></div>", "questions": [{"q": "My father ____ late because his office is far from home.", "opts": [{"t": "always is", "ok": false, "fb": "頻率副詞要放在 be 動詞後面，寫成 is always。"}, {"t": "is always", "ok": true, "fb": "頻率副詞放在 be 動詞的後面。"}, {"t": "is always be", "ok": false, "fb": "句子裡只需要一個 be 動詞。"}, {"t": "always", "ok": false, "fb": "late 是形容詞，前面需要 be 動詞。"}]}, {"q": "I ____ to bed before ten o'clock on school nights.", "opts": [{"t": "go usually", "ok": false, "fb": "頻率副詞要放在一般動詞前面，寫成 usually go。"}, {"t": "usually go", "ok": true, "fb": "頻率副詞放在一般動詞 go 的前面。"}, {"t": "usually goes", "ok": false, "fb": "位置對了，但主詞是 I，動詞不加 s。"}, {"t": "am usually go", "ok": false, "fb": "go 是一般動詞，前面不需要 be 動詞。"}]}, {"q": "Ted ____ eats breakfast. He always gets up late and runs to school.", "opts": [{"t": "always", "ok": false, "fb": "後面說他總是晚起、趕著上學，表示他幾乎不吃早餐。"}, {"t": "usually", "ok": false, "fb": "晚起又要趕去學校，表示他不太可能常常吃早餐。"}, {"t": "never", "ok": true, "fb": "總是晚起、還要用跑的去學校，表示從來沒時間吃早餐。"}, {"t": "often", "ok": false, "fb": "和後面的句子矛盾，晚起趕時間的人不會常吃早餐。"}]}, {"q": "A: How often do you go swimming?　B: ____", "opts": [{"t": "At six in the morning.", "ok": false, "fb": "這是回答 What time 的答案。How often 問的是多久一次。"}, {"t": "Twice a week.", "ok": true, "fb": "How often 問頻率，回答用次數的片語。"}, {"t": "In the swimming pool.", "ok": false, "fb": "這是回答 Where 的答案。"}, {"t": "Yes, I do.", "ok": false, "fb": "How often 是疑問詞，不能用 Yes / No 回答。"}]}, {"q": "My family goes to the night market ____ .", "opts": [{"t": "once a month", "ok": true, "fb": "頻率副詞片語要放在句尾。"}, {"t": "one a month", "ok": false, "fb": "「一次」要用 once，不是 one。"}, {"t": "one time a month", "ok": false, "fb": "一次的固定說法是 once，兩次是 twice，三次以上才用 times。"}, {"t": "a month once", "ok": false, "fb": "順序顛倒了，應該是 once a month。"}]}, {"q": "Amy ____ plays computer games. She played only one time last year.", "opts": [{"t": "always", "ok": false, "fb": "去年只玩過一次，頻率非常低，不可能是 always。"}, {"t": "often", "ok": false, "fb": "一年只玩一次不算常常。"}, {"t": "seldom", "ok": true, "fb": "一年只玩過一次，表示很少玩，用 seldom。"}, {"t": "usually", "ok": false, "fb": "usually 表示通常都會，和一年一次差太多了。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "She is never angry with us.", "ok": false, "fb": "這句是對的。頻率副詞放在 be 動詞後面。"}, {"t": "They sometimes play baseball after school.", "ok": false, "fb": "這句是對的。頻率副詞放在一般動詞前面。"}, {"t": "My mother often is tired after work.", "ok": true, "fb": "這句錯了。頻率副詞要放在 be 動詞後面，寫成 is often tired。"}, {"t": "I visit my grandparents twice a month.", "ok": false, "fb": "這句是對的。頻率片語放在句尾。"}]}, {"q": "A: ____ do you visit your grandparents?　B: ____ . We go there every Sunday.", "opts": [{"t": "How often / Once a week", "ok": true, "fb": "問頻率用 How often；每個星期天去就是一週一次。"}, {"t": "How long / Once a week", "ok": false, "fb": "How long 問的是時間長度，不是多久一次。"}, {"t": "How often / At nine o'clock", "ok": false, "fb": "疑問詞對了，但回答應該說多久一次，不是幾點。"}, {"t": "When / Twice a week", "ok": false, "fb": "回答給的是頻率，而且每週日去是一週一次不是兩次。"}]}]}, {"id": "countable", "title": "可數與不可數名詞、計量單位", "unit": "第二冊 Unit 5 · B2 L5–6", "points": "<p>先判斷這個名詞<strong>能不能一個一個數</strong>，才能決定要不要加 s、能不能加 a。</p><h3>兩種名詞的差別</h3><table><tr><th></th><th>可數名詞</th><th>不可數名詞</th></tr><tr><td>能加 a / an</td><td class=\"en\">a book</td><td class=\"bad\">a water</td></tr><tr><td>能變複數</td><td class=\"en\">books</td><td class=\"bad\">waters</td></tr><tr><td>搭配的字</td><td class=\"en\">many, a few</td><td class=\"en\">much, a little</td></tr></table><h3>常見的不可數名詞</h3><p class=\"en\"><span class=\"k2\">water　milk　juice　tea　coffee<br>rice　bread　money　homework　time</span></p><p style=\"color:var(--muted);font-size:17px\">中文可以說「三個麵包」，但英文的 bread 不能數，要說 three <span class=\"k1\">pieces of</span> bread。</p><h3>計量單位：不可數名詞的量詞</h3><table><tr><th>單位</th><th>用在</th><th>例子</th></tr><tr><td class=\"en\">a glass of</td><td>冷飲</td><td class=\"en\">a glass of water / milk</td></tr><tr><td class=\"en\">a cup of</td><td>熱飲</td><td class=\"en\">a cup of tea / coffee</td></tr><tr><td class=\"en\">a bowl of</td><td>裝在碗裡</td><td class=\"en\">a bowl of rice / soup</td></tr><tr><td class=\"en\">a piece of</td><td>一塊、一片、一張</td><td class=\"en\">a piece of bread / paper</td></tr><tr><td class=\"en\">a bottle of</td><td>一瓶</td><td class=\"en\">a bottle of juice</td></tr></table><p class=\"en\">要變複數時，<strong>變的是單位不是名詞</strong>：<br>two <span class=\"k1\">glasses</span> of water　<span class=\"bad\">two glass of waters</span></p>", "questions": [{"q": "There isn't much ____ left in the bottle. Please buy some more.", "opts": [{"t": "waters", "ok": false, "fb": "water 是不可數名詞，不能加 s。"}, {"t": "water", "ok": true, "fb": "water 是不可數名詞，維持原形，前面用 much。"}, {"t": "a water", "ok": false, "fb": "不可數名詞前面不能加 a。"}, {"t": "many water", "ok": false, "fb": "many 用在可數名詞，而且句中已經有 much 了。"}]}, {"q": "I usually eat two ____ of bread for breakfast.", "opts": [{"t": "piece", "ok": false, "fb": "前面有 two，計量單位要變複數 pieces。"}, {"t": "pieces", "ok": true, "fb": "要變複數的是計量單位 piece，bread 本身不變。"}, {"t": "breads", "ok": false, "fb": "bread 是不可數名詞，不能加 s，要用 pieces of bread。"}, {"t": "pieces of breads", "ok": false, "fb": "單位變複數就好，bread 保持原形。"}]}, {"q": "My mother drinks a ____ of hot coffee every morning.", "opts": [{"t": "cup", "ok": true, "fb": "熱飲用 cup，像 a cup of tea、a cup of coffee。"}, {"t": "glass", "ok": false, "fb": "glass 通常用在冷飲，像 a glass of water。這裡是熱咖啡。"}, {"t": "piece", "ok": false, "fb": "piece 用在一塊、一片的固體，不用在飲料。"}, {"t": "bowl", "ok": false, "fb": "bowl 是碗，用在飯或湯，不用來裝咖啡。"}]}, {"q": "I don't have ____ with me now. Can you lend me one hundred dollars?", "opts": [{"t": "a money", "ok": false, "fb": "money 是不可數名詞，前面不能加 a。"}, {"t": "money", "ok": true, "fb": "money 是不可數名詞，直接用原形。"}, {"t": "moneys", "ok": false, "fb": "money 是不可數名詞，不能加 s。"}, {"t": "many money", "ok": false, "fb": "many 只能用在可數名詞，money 是不可數的。"}]}, {"q": "There are five ____ and a bowl of ____ on the table.", "opts": [{"t": "apple / rice", "ok": false, "fb": "前面有 five，apple 要變複數 apples。"}, {"t": "apples / rice", "ok": true, "fb": "apple 可數所以變複數；rice 不可數，用 a bowl of 計量。"}, {"t": "apples / rices", "ok": false, "fb": "前半對了，但 rice 是不可數名詞，不能加 s。"}, {"t": "apple / rices", "ok": false, "fb": "兩個都錯。apple 要變複數，rice 不能加 s。"}]}, {"q": "Please give me a ____ of milk and a ____ of cake.", "opts": [{"t": "glass / piece", "ok": true, "fb": "牛奶是冷飲用 glass；蛋糕一塊用 piece。"}, {"t": "piece / glass", "ok": false, "fb": "兩個放反了。牛奶要用杯子裝，蛋糕才是一塊。"}, {"t": "cup / bowl", "ok": false, "fb": "牛奶通常是冷的用 glass；蛋糕不會裝在碗裡。"}, {"t": "bowl / glass", "ok": false, "fb": "牛奶不用碗裝，蛋糕也不用杯子裝。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "I have a lot of homework today.", "ok": false, "fb": "這句是對的。homework 是不可數名詞，a lot of 兩種名詞都能用。"}, {"t": "There are three breads on the plate.", "ok": true, "fb": "這句錯了。bread 不可數，要寫成 three pieces of bread。"}, {"t": "She drinks two glasses of water every morning.", "ok": false, "fb": "這句是對的。變複數的是單位 glasses。"}, {"t": "We don't have much time.", "ok": false, "fb": "這句是對的。time 是不可數名詞，配 much。"}]}, {"q": "A: How about some tea?　B: Thanks. I'd like two ____ of tea, please.", "opts": [{"t": "cup", "ok": false, "fb": "前面有 two，單位要變複數 cups。"}, {"t": "cups", "ok": true, "fb": "茶是熱飲用 cup，數量是兩杯所以單位變複數。"}, {"t": "teas", "ok": false, "fb": "tea 是不可數名詞，要靠單位來計量。"}, {"t": "glasses", "ok": false, "fb": "熱飲習慣用 cup，glass 用在冷飲。"}]}]}, {"id": "quantifiers", "title": "數量形容詞、some / any、both / all", "unit": "第二冊 Unit 5 · B2 L5–6", "points": "<p>選數量形容詞的第一步永遠是：<strong>先看後面的名詞可不可數</strong>。</p><h3>可數配可數，不可數配不可數</h3><table><tr><th>意思</th><th>可數名詞</th><th>不可數名詞</th><th>兩種都可以</th></tr><tr><td>很多</td><td class=\"en\">many</td><td class=\"en\">much</td><td class=\"en\">a lot of / lots of</td></tr><tr><td>一些</td><td class=\"en\">a few</td><td class=\"en\">a little</td><td class=\"en\">some</td></tr></table><p class=\"en\"><span class=\"k1\">many</span> books　<span class=\"k2\">much</span> water　<span class=\"k3\">a lot of</span> books / water</p><h3>some 和 any</h3><table><tr><th>句型</th><th>用</th><th>例子</th></tr><tr><td>肯定句</td><td class=\"en\">some</td><td class=\"en\">I have <span class=\"k1\">some</span> money.</td></tr><tr><td>否定句</td><td class=\"en\">any</td><td class=\"en\">I don't have <span class=\"k2\">any</span> money.</td></tr><tr><td>疑問句</td><td class=\"en\">any</td><td class=\"en\">Do you have <span class=\"k2\">any</span> money?</td></tr><tr><td>邀請、請求</td><td class=\"en\">some</td><td class=\"en\">Would you like <span class=\"k1\">some</span> tea?</td></tr></table><p style=\"color:var(--muted);font-size:17px\">最後一列是例外：問句原則上用 any，但如果是<strong>請對方吃喝、或拜託對方</strong>，要用 some。</p><h3>both 和 all</h3><p class=\"en\"><span class=\"k1\">both</span> → 剛好兩個都<br><span class=\"k2\">all</span> → 三個以上，全部</p><p class=\"en\">I have two dogs. <span class=\"k1\">Both</span> of them are white.<br>There are thirty students. <span class=\"k2\">All</span> of them are here.</p>", "questions": [{"q": "There are ____ students on the playground. It's very noisy.", "opts": [{"t": "much", "ok": false, "fb": "students 是可數複數，要用 many。"}, {"t": "many", "ok": true, "fb": "students 可數，用 many。"}, {"t": "a little", "ok": false, "fb": "a little 用在不可數名詞，而且意思是「一點點」。"}, {"t": "much of", "ok": false, "fb": "much 用在不可數名詞，而且這裡的句型不需要 of。"}]}, {"q": "I don't have ____ time today. Let's talk about it tomorrow.", "opts": [{"t": "many", "ok": false, "fb": "time 是不可數名詞，要用 much。"}, {"t": "much", "ok": true, "fb": "time 是不可數名詞，否定句裡用 much。"}, {"t": "a few", "ok": false, "fb": "a few 用在可數名詞。"}, {"t": "a lot", "ok": false, "fb": "要寫成 a lot of 才能接名詞，不能只用 a lot。"}]}, {"q": "I still have ____ money in my pocket, so I can buy a drink.", "opts": [{"t": "a few", "ok": false, "fb": "money 是不可數名詞，要用 a little。"}, {"t": "a little", "ok": true, "fb": "money 不可數，表示「還有一點」用 a little。"}, {"t": "many", "ok": false, "fb": "many 只能用在可數名詞。"}, {"t": "a little of", "ok": false, "fb": "直接接名詞時不需要 of。"}]}, {"q": "I don't have ____ brothers or sisters. I'm the only child in my family.", "opts": [{"t": "some", "ok": false, "fb": "這是否定句，要用 any。"}, {"t": "any", "ok": true, "fb": "否定句裡表示「一個也沒有」，用 any。"}, {"t": "much", "ok": false, "fb": "brothers 和 sisters 是可數名詞，不用 much。"}, {"t": "a", "ok": false, "fb": "後面是複數名詞，前面不能加 a。"}]}, {"q": "A: Would you like ____ juice?　B: Yes, please. I'm really thirsty.", "opts": [{"t": "any", "ok": false, "fb": "這是請對方喝東西的邀請句，雖然是問句，仍然要用 some。"}, {"t": "some", "ok": true, "fb": "Would you like 是邀請，這種問句用 some 不用 any。"}, {"t": "many", "ok": false, "fb": "juice 是不可數名詞，不能用 many。"}, {"t": "a", "ok": false, "fb": "juice 是不可數名詞，前面不加 a。"}]}, {"q": "I have two cats. ____ of them are black.", "opts": [{"t": "All", "ok": false, "fb": "只有兩隻的時候用 Both；All 用在三個以上。"}, {"t": "Both", "ok": true, "fb": "剛好兩個都是，用 Both。"}, {"t": "Much", "ok": false, "fb": "much 是數量形容詞，不能這樣當主詞用。"}, {"t": "Any", "ok": false, "fb": "any 通常用在否定句或疑問句，不用在這種肯定的描述。"}]}, {"q": "There are thirty-five students in our class. ____ of them like our new English teacher.", "opts": [{"t": "Both", "ok": false, "fb": "Both 只能用在剛好兩個的時候，這裡有三十五個人。"}, {"t": "All", "ok": true, "fb": "三個以上的全部要用 All。"}, {"t": "Much", "ok": false, "fb": "students 是可數名詞，而且 much 不能這樣當主詞。"}, {"t": "A little", "ok": false, "fb": "a little 用在不可數名詞。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "There are a few apples in the basket.", "ok": false, "fb": "這句是對的。apples 可數，用 a few。"}, {"t": "How much books do you have?", "ok": true, "fb": "這句錯了。books 是可數名詞，要用 How many。"}, {"t": "She doesn't have any homework today.", "ok": false, "fb": "這句是對的。否定句用 any。"}, {"t": "We have a lot of rain in summer.", "ok": false, "fb": "這句是對的。a lot of 可以接不可數名詞。"}]}]}, {"id": "how-many-much", "title": "How many / How much", "unit": "第二冊 Unit 5 · B2 L5–6", "points": "<p>問數量時，選 many 還是 much，一樣是看<strong>後面的名詞可不可數</strong>。</p><h3>基本句型</h3><table><tr><th>問句</th><th>接什麼</th><th>例子</th></tr><tr><td class=\"en\">How many</td><td>可數名詞複數</td><td class=\"en\">How many <span class=\"k1\">books</span> do you have?</td></tr><tr><td class=\"en\">How much</td><td>不可數名詞</td><td class=\"en\">How much <span class=\"k2\">water</span> do you drink?</td></tr></table><p class=\"en\">How many <span class=\"k1\">students</span> <span class=\"k3\">are there</span> in your class?<br>How much <span class=\"k2\">milk</span> <span class=\"k3\">is there</span> in the fridge?</p><p style=\"color:var(--muted);font-size:17px\">和 There is / are 一起用時，be 動詞也要跟著名詞變：可數複數配 are，不可數配 is。</p><h3>How much 也用來問價錢</h3><p class=\"en\"><span class=\"k2\">How much</span> is this pen?　→ It's fifty dollars.<br><span class=\"k2\">How much</span> are these shoes?　→ They're one thousand dollars.</p><p>問價錢一律用 How much，不管東西可不可數。</p><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">How many money do you have?</span>　→ money 不可數</p><p class=\"en\"><span class=\"bad\">How much books are there?</span>　→ books 可數</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">How many is this bag?</span>　→ 問價錢用 How much</p></div>", "questions": [{"q": "____ students are there in your English class?", "opts": [{"t": "How many", "ok": true, "fb": "students 是可數名詞的複數，用 How many。"}, {"t": "How much", "ok": false, "fb": "How much 用在不可數名詞，students 是可數的。"}, {"t": "How often", "ok": false, "fb": "How often 問的是多久一次，不是數量。"}, {"t": "How", "ok": false, "fb": "單獨的 How 問的是方法或狀態，問數量要加 many。"}]}, {"q": "____ water do you drink every day? You should drink more.", "opts": [{"t": "How many", "ok": false, "fb": "water 是不可數名詞，要用 How much。"}, {"t": "How much", "ok": true, "fb": "water 不可數，問數量用 How much。"}, {"t": "How long", "ok": false, "fb": "How long 問時間長度或長短，不是數量。"}, {"t": "How often", "ok": false, "fb": "How often 問頻率，但這裡問的是喝多少量。"}]}, {"q": "A: ____ is this dictionary?　B: It's three hundred and fifty dollars.", "opts": [{"t": "How many", "ok": false, "fb": "問價錢一律用 How much，不看東西可不可數。"}, {"t": "How much", "ok": true, "fb": "問價錢固定用 How much。"}, {"t": "How old", "ok": false, "fb": "How old 問年齡或使用多久，回答不會是價錢。"}, {"t": "What much", "ok": false, "fb": "英文沒有 What much 這種問法，問價錢固定用 How much。"}]}, {"q": "____ eggs ____ there in the refrigerator? I want to make a cake.", "opts": [{"t": "How many / are", "ok": true, "fb": "eggs 是可數複數，用 How many，be 動詞用 are。"}, {"t": "How many / is", "ok": false, "fb": "疑問詞對了，但 eggs 是複數，be 動詞要用 are。"}, {"t": "How much / is", "ok": false, "fb": "eggs 是可數名詞，要用 How many。"}, {"t": "How much / are", "ok": false, "fb": "eggs 可數，要用 How many 才對。"}]}, {"q": "____ milk ____ there in the bottle? It looks almost empty.", "opts": [{"t": "How many / are", "ok": false, "fb": "milk 是不可數名詞，要用 How much，be 動詞用 is。"}, {"t": "How much / is", "ok": true, "fb": "milk 不可數，用 How much，be 動詞用 is。"}, {"t": "How much / are", "ok": false, "fb": "疑問詞對了，但不可數名詞配單數的 is。"}, {"t": "How many / is", "ok": false, "fb": "milk 不可數，不能用 How many。"}]}, {"q": "A: How many bottles of juice do you need?　B: ____", "opts": [{"t": "Yes, I do.", "ok": false, "fb": "How many 是疑問詞，不能用 Yes / No 回答。"}, {"t": "Three, please.", "ok": true, "fb": "問數量，回答直接給數字。"}, {"t": "It's fifty dollars.", "ok": false, "fb": "這是回答價錢的答案，問句問的是要幾瓶。"}, {"t": "Twice a week.", "ok": false, "fb": "這是回答 How often 的答案。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "How much homework do you have today?", "ok": false, "fb": "這句是對的。homework 是不可數名詞。"}, {"t": "How many money do you need?", "ok": true, "fb": "這句錯了。money 是不可數名詞，要用 How much。"}, {"t": "How much are those apples?", "ok": false, "fb": "這句是對的。問價錢用 How much。"}, {"t": "How many chairs are there in the room?", "ok": false, "fb": "這句是對的。chairs 可數複數，配 How many 和 are。"}]}, {"q": "A: ____ do you want?　B: Two bowls, please. I'm really hungry.", "opts": [{"t": "How much rice", "ok": false, "fb": "雖然 rice 不可數用 How much 沒錯，但回答用了 two bowls，問句用 How many bowls 更貼切。"}, {"t": "How many bowls of rice", "ok": true, "fb": "回答是兩碗，問的是碗數。bowls 是可數的，用 How many。"}, {"t": "How many rice", "ok": false, "fb": "rice 是不可數名詞，不能直接用 How many。"}, {"t": "How much bowls", "ok": false, "fb": "bowls 是可數名詞的複數，要用 How many。"}]}]}, {"id": "past-be", "title": "過去簡單式（be 動詞）", "unit": "第二冊 Unit 5 · B2 L5–6", "points": "<p>過去式的 be 動詞只有兩個字，難的是<strong>判斷這句話講的是過去還是現在</strong>。</p><h3>現在變過去</h3><table><tr><th>主詞</th><th>現在</th><th>過去</th></tr><tr><td>I</td><td class=\"en\">am</td><td class=\"en\"><span class=\"k1\">was</span></td></tr><tr><td>He / She / It、單數名詞</td><td class=\"en\">is</td><td class=\"en\"><span class=\"k1\">was</span></td></tr><tr><td>You / We / They、複數名詞</td><td class=\"en\">are</td><td class=\"en\"><span class=\"k2\">were</span></td></tr></table><h3>否定與疑問</h3><p class=\"en\">否定：I <span class=\"k1\">wasn't</span> at home. / They <span class=\"k2\">weren't</span> happy.<br>疑問：<span class=\"k1\">Was</span> he sick? → Yes, he <span class=\"k1\">was</span>. / No, he <span class=\"k1\">wasn't</span>.<br>　　　<span class=\"k2\">Were</span> you there? → Yes, I <span class=\"k1\">was</span>.</p><p style=\"color:var(--muted);font-size:17px\">注意最後一行：問句用 Were you，但回答的主詞變成 I，所以簡答要用 was。</p><h3>看到這些字就是過去式</h3><p class=\"en\"><span class=\"k3\">yesterday　last night　last week　last year<br>two days ago　in 2020　then　just now</span></p><h3>There was / There were</h3><p class=\"en\">There <span class=\"k1\">was</span> a park here ten years ago.<br>There <span class=\"k2\">were</span> many people at the concert last night.</p><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">We was late.</span>　→ We 要配 were</p><p class=\"en\"><span class=\"bad\">Were you tired? Yes, I were.</span>　→ 主詞變 I 就用 was</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">He is sick yesterday.</span>　→ 有 yesterday 就要用過去式</p></div>", "questions": [{"q": "I ____ at home all day yesterday because it rained.", "opts": [{"t": "am", "ok": false, "fb": "句尾有 yesterday，是過去的事，要用過去式。"}, {"t": "was", "ok": true, "fb": "yesterday 表示過去，主詞 I 用 was。"}, {"t": "were", "ok": false, "fb": "主詞是 I，過去式要用 was。"}, {"t": "is", "ok": false, "fb": "主詞是 I 不能配 is，而且這是過去的事。"}]}, {"q": "Ted and his brother ____ in the park last Sunday afternoon.", "opts": [{"t": "was", "ok": false, "fb": "主詞是兩個人，是複數，過去式要用 were。"}, {"t": "were", "ok": true, "fb": "複數主詞的過去式用 were，last Sunday 表示過去。"}, {"t": "are", "ok": false, "fb": "last Sunday 表示過去，不能用現在式。"}, {"t": "is", "ok": false, "fb": "主詞是複數，而且是過去的事。"}]}, {"q": "The movie ____ interesting at all. I fell asleep in ten minutes.", "opts": [{"t": "wasn't", "ok": true, "fb": "後面說看十分鐘就睡著了，表示不好看；movie 是單數，過去式否定用 wasn't。"}, {"t": "weren't", "ok": false, "fb": "movie 是單數，要用 wasn't。"}, {"t": "isn't", "ok": false, "fb": "後面用了過去式 fell，整句在講過去的事。"}, {"t": "was", "ok": false, "fb": "看十分鐘就睡著，表示不有趣，要用否定。"}]}, {"q": "A: ____ you at the school library yesterday?　B: Yes, I ____ . I studied there for two hours.", "opts": [{"t": "Were / was", "ok": true, "fb": "問句主詞是 you 用 Were；回答主詞變成 I，所以用 was。"}, {"t": "Were / were", "ok": false, "fb": "問句對了，但回答的主詞是 I，要用 was。"}, {"t": "Was / was", "ok": false, "fb": "問句的主詞是 you，要用 Were。"}, {"t": "Are / am", "ok": false, "fb": "句中有 yesterday，是過去的事。"}]}, {"q": "My grandfather ____ a teacher thirty years ago, but now he ____ a farmer.", "opts": [{"t": "was / is", "ok": true, "fb": "thirty years ago 用過去式；now 用現在式。"}, {"t": "is / was", "ok": false, "fb": "兩個放反了。三十年前是過去，now 是現在。"}, {"t": "was / was", "ok": false, "fb": "後半有 now，是現在的狀況，要用現在式。"}, {"t": "is / is", "ok": false, "fb": "前半有 thirty years ago，是過去的事。"}]}, {"q": "There ____ many people at the night market last night.", "opts": [{"t": "was", "ok": false, "fb": "many people 是複數，要用 were。"}, {"t": "were", "ok": true, "fb": "many people 是複數，過去式用 were。"}, {"t": "are", "ok": false, "fb": "last night 表示過去，要用過去式。"}, {"t": "is", "ok": false, "fb": "主詞是複數，而且句子講的是昨晚的事。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "We were late for the movie last Friday.", "ok": false, "fb": "這句是對的。We 配 were，last Friday 是過去。"}, {"t": "She was in Japan two years ago.", "ok": false, "fb": "這句是對的。She 配 was，two years ago 是過去。"}, {"t": "They was very happy at the party.", "ok": true, "fb": "這句錯了。They 是複數，過去式要用 were。"}, {"t": "Was your brother sick yesterday?", "ok": false, "fb": "這句是對的。brother 是單數，過去式疑問句用 Was。"}]}, {"q": "Amy and I ____ classmates in elementary school, but we ____ in different classes now.", "opts": [{"t": "were / are", "ok": true, "fb": "小學時是過去用 were；now 是現在用 are。"}, {"t": "are / were", "ok": false, "fb": "兩個放反了。小學是過去，now 是現在。"}, {"t": "was / are", "ok": false, "fb": "Amy and I 是複數，過去式要用 were。"}, {"t": "were / were", "ok": false, "fb": "後半有 now，講的是現在的狀況。"}]}]}, {"id": "past-verb", "title": "過去簡單式（一般動詞）", "unit": "第三冊 Unit 6 · B3 L1–2", "points": "<p>一般動詞的過去式分<strong>規則變化</strong>和<strong>不規則變化</strong>。規則變化有拼字規則可循，不規則的只能背。</p><h3>規則變化四條</h3><table><tr><th>字尾</th><th>怎麼變</th><th>例子</th></tr><tr><td>一般</td><td>加 -ed</td><td class=\"en\">play → play<span class=\"k2\">ed</span></td></tr><tr><td>字尾是 e</td><td>加 -d</td><td class=\"en\">live → live<span class=\"k2\">d</span></td></tr><tr><td>子音 + y</td><td>去 y 加 -ied</td><td class=\"en\">study → stud<span class=\"k2\">ied</span></td></tr><tr><td>短母音 + 單子音</td><td>重複字尾加 -ed</td><td class=\"en\">stop → stop<span class=\"k2\">ped</span></td></tr></table><p style=\"color:var(--muted);font-size:17px\">這四條和現在進行式加 -ing 的規則幾乎一樣，可以一起記。</p><h3>常考的不規則變化</h3><table><tr><td class=\"en\">go → <span class=\"k1\">went</span></td><td class=\"en\">eat → <span class=\"k1\">ate</span></td><td class=\"en\">see → <span class=\"k1\">saw</span></td></tr><tr><td class=\"en\">have → <span class=\"k1\">had</span></td><td class=\"en\">do → <span class=\"k1\">did</span></td><td class=\"en\">get → <span class=\"k1\">got</span></td></tr><tr><td class=\"en\">come → <span class=\"k1\">came</span></td><td class=\"en\">take → <span class=\"k1\">took</span></td><td class=\"en\">buy → <span class=\"k1\">bought</span></td></tr><tr><td class=\"en\">make → <span class=\"k1\">made</span></td><td class=\"en\">write → <span class=\"k1\">wrote</span></td><td class=\"en\">run → <span class=\"k1\">ran</span></td></tr></table><h3>否定與疑問：助動詞變 did，動詞變回原形</h3><p class=\"en\">否定：I <span class=\"k2\">didn't</span> <span class=\"k3\">go</span> to school.　<span class=\"bad\">didn't went</span><br>疑問：<span class=\"k2\">Did</span> you <span class=\"k3\">go</span> to school?　<span class=\"bad\">Did you went</span><br>簡答：Yes, I <span class=\"k2\">did</span>. / No, I <span class=\"k2\">didn't</span>.</p><p style=\"color:var(--muted);font-size:17px\">只要句子裡出現了 did 或 didn't，過去的意思就已經表達完了，後面的動詞一定回到原形。</p><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">She didn't went home.</span>　→ didn't 後面用原形</p><p class=\"en\"><span class=\"bad\">He goed to Taipei.</span>　→ go 是不規則變化</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">I studyed English.</span>　→ 子音＋y 要改 ied</p></div>", "questions": [{"q": "We ____ English together and then ____ at a coffee shop yesterday.", "hint": "（study / stop）", "opts": [{"t": "studyed / stoped", "ok": false, "fb": "兩個都錯。study 的 y 前面是子音要改 ied；stop 是短母音＋單子音要重複 p。"}, {"t": "studied / stopped", "ok": true, "fb": "study 去 y 加 ied；stop 重複字尾再加 ed。"}, {"t": "studied / stoped", "ok": false, "fb": "study 對了，但 stop 是短母音＋單子音結尾，要重複 p 變成 stopped。"}, {"t": "studyed / stopped", "ok": false, "fb": "stop 對了，但 study 的 y 前面是子音 d，要改成 studied。"}]}, {"q": "Ted ____ to Taipei with his family last weekend.", "opts": [{"t": "goed", "ok": false, "fb": "go 是不規則動詞，過去式是 went，不加 ed。"}, {"t": "went", "ok": true, "fb": "go 的過去式是 went，屬於必須背的不規則變化。"}, {"t": "gone", "ok": false, "fb": "gone 不能單獨當過去式使用。"}, {"t": "going", "ok": false, "fb": "last weekend 是過去的事，而且前面沒有 be 動詞。"}]}, {"q": "I ____ my homework last night. I was too tired.", "opts": [{"t": "didn't did", "ok": false, "fb": "didn't 後面要接動詞原形，應該是 didn't do。"}, {"t": "didn't do", "ok": true, "fb": "否定用 didn't，後面的動詞回到原形 do。"}, {"t": "don't do", "ok": false, "fb": "last night 是過去的事，要用 didn't。"}, {"t": "not did", "ok": false, "fb": "否定要用助動詞 didn't，不能只放 not。"}]}, {"q": "____ you see the new movie last night? I heard it's great.", "opts": [{"t": "Did", "ok": true, "fb": "see 是一般動詞，過去式的疑問句用助動詞 Did。"}, {"t": "Do", "ok": false, "fb": "last night 表示過去，要用 Did。"}, {"t": "Were", "ok": false, "fb": "句子的動詞是 see，不是 be 動詞。"}, {"t": "Was", "ok": false, "fb": "一般動詞的疑問句要用助動詞 Did，不用 be 動詞。"}]}, {"q": "Did your brother ____ the math test last week?", "opts": [{"t": "passed", "ok": false, "fb": "Did 已經表示過去了，後面的動詞要回到原形。"}, {"t": "pass", "ok": true, "fb": "句子裡有 Did，後面的動詞一律用原形。"}, {"t": "passes", "ok": false, "fb": "Did 後面不會有第三人稱單數的變化。"}, {"t": "passing", "ok": false, "fb": "Did 後面接動詞原形，不接 V-ing。"}]}, {"q": "I ____ really tired last night, so I ____ to bed before nine.", "opts": [{"t": "was / went", "ok": true, "fb": "tired 是形容詞配 be 動詞的過去式 was；go 的過去式是 went。"}, {"t": "were / went", "ok": false, "fb": "主詞是 I，be 動詞的過去式要用 was。"}, {"t": "was / goed", "ok": false, "fb": "前半對了，但 go 是不規則動詞，過去式是 went。"}, {"t": "did / went", "ok": false, "fb": "tired 是形容詞，前面要用 be 動詞不是 did。"}]}, {"q": "Amy usually ____ TV after dinner, but last night she ____ for the test.", "hint": "（watch / study）", "opts": [{"t": "watches / studied", "ok": true, "fb": "usually 是平常的習慣用現在簡單式；last night 是過去用過去式。"}, {"t": "watched / studies", "ok": false, "fb": "兩個時態放反了。usually 是習慣，last night 是過去。"}, {"t": "watches / studies", "ok": false, "fb": "後半有 last night，是過去的事，要用過去式。"}, {"t": "watched / studied", "ok": false, "fb": "前半有 usually，講的是平常的習慣，要用現在簡單式。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "She didn't go to school yesterday.", "ok": false, "fb": "這句是對的。didn't 後面用原形 go。"}, {"t": "We watched a baseball game last Sunday.", "ok": false, "fb": "這句是對的。watch 是規則變化，加 ed。"}, {"t": "Did he bought a new bike?", "ok": true, "fb": "這句錯了。Did 後面的動詞要用原形，應該是 Did he buy。"}, {"t": "They ate dinner at a restaurant.", "ok": false, "fb": "這句是對的。eat 的過去式是 ate。"}]}]}, {"id": "because-although", "title": "連接詞 because / so / although / but", "unit": "第三冊 Unit 6 · B3 L1–2", "points": "<p>這四個連接詞兩兩成對。難的不是意思，是<strong>中文可以兩個一起用，英文只能用一個</strong>。</p><h3>原因與結果</h3><p class=\"en\"><span class=\"k1\">Because</span> it was raining, we stayed home.<br>It was raining, <span class=\"k2\">so</span> we stayed home.</p><table><tr><th>連接詞</th><th>後面接</th></tr><tr><td class=\"en\">because</td><td>原因</td></tr><tr><td class=\"en\">so</td><td>結果</td></tr></table><h3>讓步與轉折</h3><p class=\"en\"><span class=\"k1\">Although</span> he was tired, he kept working.<br>He was tired, <span class=\"k2\">but</span> he kept working.</p><table><tr><th>連接詞</th><th>後面接</th></tr><tr><td class=\"en\">although</td><td>和結果相反的事實（雖然）</td></tr><tr><td class=\"en\">but</td><td>轉折（但是）</td></tr></table><h3>最重要的一條規則：只能用一個</h3><p class=\"en\"><span class=\"bad\">Because he was sick, so he didn't come.</span><br><span class=\"bad\">Although it was cold, but he went swimming.</span></p><p>中文說「因為⋯⋯所以⋯⋯」「雖然⋯⋯但是⋯⋯」是成對的，英文<strong>只能留一個</strong>：</p><p class=\"en\"><span class=\"k3\">Because</span> he was sick, he didn't come.　<span class=\"k0\">（或）</span>　He was sick, <span class=\"k3\">so</span> he didn't come.</p><h3>放句首要加逗號</h3><p class=\"en\"><span class=\"k1\">Because</span> I was late, I ran to school.<br>I ran to school <span class=\"k1\">because</span> I was late.</p><p>because 和 although 的子句放句首時，後面要加逗號；放句尾則不用。</p>", "questions": [{"q": "____ it was raining hard, we didn't go to the park.", "opts": [{"t": "Because", "ok": true, "fb": "下大雨是原因，放在句首用 Because。"}, {"t": "So", "ok": false, "fb": "so 後面接結果，而且不能放在句首當連接詞。"}, {"t": "But", "ok": false, "fb": "but 不能放在這個位置連接兩個句子。"}, {"t": "Although", "ok": false, "fb": "下大雨和不去公園是順理成章的，沒有相反的關係。"}]}, {"q": "Ted was very tired, ____ he still finished his homework.", "opts": [{"t": "because", "ok": false, "fb": "很累卻還是寫完功課，兩件事是相反的，不是因果。"}, {"t": "so", "ok": false, "fb": "很累的結果通常不是把功課寫完，這裡是轉折。"}, {"t": "but", "ok": true, "fb": "很累卻還是寫完，和預期相反，用 but。"}, {"t": "although", "ok": false, "fb": "although 要放在表示「雖然」的那半句前面，不是放在這個位置。"}]}, {"q": "____ Amy studied very hard, she didn't do well on the test.", "opts": [{"t": "Because", "ok": false, "fb": "很用功卻考不好，兩件事是相反的，不是因果關係。"}, {"t": "Although", "ok": true, "fb": "很用功卻考不好，和預期相反，用 Although 表示「雖然」。"}, {"t": "So", "ok": false, "fb": "so 不能放在句首連接兩個句子。"}, {"t": "But", "ok": false, "fb": "but 不能放句首，表示「雖然」要用 Although。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "Because he was sick, so he stayed home.", "ok": true, "fb": "這句錯了。英文不能 because 和 so 一起用，只能留一個。"}, {"t": "He was sick, so he stayed home.", "ok": false, "fb": "這句是對的。前面是原因，so 後面接結果。"}, {"t": "Because he was sick, he stayed home.", "ok": false, "fb": "這句是對的。Because 放句首，後面加逗號。"}, {"t": "He stayed home because he was sick.", "ok": false, "fb": "這句是對的。because 放句尾不用逗號。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "Although it was cold, but he went swimming.", "ok": true, "fb": "這句錯了。although 和 but 不能同時出現，只能用一個。"}, {"t": "Although it was cold, he went swimming.", "ok": false, "fb": "這句是對的。用 Although 就不再加 but。"}, {"t": "It was cold, but he went swimming.", "ok": false, "fb": "這句是對的。只用 but 表示轉折。"}, {"t": "He went swimming although it was cold.", "ok": false, "fb": "這句是對的。although 的子句也可以放句尾。"}]}, {"q": "Judy missed the school bus ____ she got up late this morning.", "opts": [{"t": "so", "ok": false, "fb": "晚起是原因，沒趕上公車是結果。so 後面要接結果。"}, {"t": "because", "ok": true, "fb": "空格後面接的是原因（晚起），用 because。"}, {"t": "although", "ok": false, "fb": "晚起和沒趕上公車是順理成章的，不是相反的關係。"}, {"t": "but", "ok": false, "fb": "兩件事之間沒有轉折，是明確的因果。"}]}, {"q": "I really like this restaurant, ____ the food is a little expensive.", "opts": [{"t": "so", "ok": false, "fb": "貴不是喜歡這家餐廳的結果，兩句是相反的。"}, {"t": "because", "ok": false, "fb": "沒有人會因為東西貴才喜歡一家店，這裡是轉折。"}, {"t": "but", "ok": true, "fb": "喜歡卻覺得貴，前後相反，用 but。"}, {"t": "although", "ok": false, "fb": "although 要放在「雖然」那一半的句首，位置不對。"}]}, {"q": "____ my brother is only ten, he can cook very well. He learned it ____ he loves food.", "opts": [{"t": "Although / because", "ok": true, "fb": "才十歲卻很會煮，是相反的用 Although；愛吃是學會的原因用 because。"}, {"t": "Because / although", "ok": false, "fb": "兩個放反了。年紀小和很會煮是相反的，愛吃才是原因。"}, {"t": "Although / so", "ok": false, "fb": "前半對了，但空格後面接的是原因，要用 because。"}, {"t": "Because / so", "ok": false, "fb": "年紀小不是很會煮的原因，兩者是相反的。"}]}]}, {"id": "sub-conj", "title": "從屬連接詞 when / while / before / after / until", "unit": "第三冊 Unit 6 · B3 L1–2", "points": "<p>這五個連接詞用來說明<strong>兩件事發生的先後或同時</strong>。選錯了句子的意思就整個變了。</p><h3>五個連接詞</h3><table><tr><th>連接詞</th><th>意思</th><th>例子</th></tr><tr><td class=\"en\">when</td><td>當⋯⋯的時候</td><td class=\"en\"><span class=\"k1\">When</span> I got home, my mom was cooking.</td></tr><tr><td class=\"en\">while</td><td>在⋯⋯的期間</td><td class=\"en\"><span class=\"k1\">While</span> I was reading, he came in.</td></tr><tr><td class=\"en\">before</td><td>在⋯⋯之前</td><td class=\"en\">Wash your hands <span class=\"k1\">before</span> you eat.</td></tr><tr><td class=\"en\">after</td><td>在⋯⋯之後</td><td class=\"en\">I watch TV <span class=\"k1\">after</span> I finish my homework.</td></tr><tr><td class=\"en\">until</td><td>直到⋯⋯為止</td><td class=\"en\">I waited <span class=\"k1\">until</span> she came back.</td></tr></table><h3>when 和 while 怎麼分</h3><p class=\"en\"><span class=\"k1\">while</span> 後面習慣接<strong>持續中的長動作</strong>，常搭配進行式：<br><span class=\"k1\">While</span> I <span class=\"k2\">was taking</span> a shower, the phone rang.</p><p class=\"en\"><span class=\"k1\">when</span> 後面常接<strong>短暫發生的動作</strong>：<br><span class=\"k1\">When</span> the phone <span class=\"k2\">rang</span>, I was taking a shower.</p><p style=\"color:var(--muted);font-size:17px\">判斷方法：哪一件事做比較久，就放在 while 後面。</p><h3>位置與逗號</h3><p class=\"en\"><span class=\"k3\">Before</span> I go to bed, I brush my teeth.　→ 放句首，加逗號<br>I brush my teeth <span class=\"k3\">before</span> I go to bed.　→ 放句尾，不加逗號</p><p>兩種寫法意思完全一樣，只是順序不同。</p><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">I will call you when I will get home.</span>　→ 時間子句不用未來式</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">While the phone rang, I was sleeping.</span>　→ 短動作要用 when</p></div>", "questions": [{"q": "____ I was taking a shower, the phone suddenly rang.", "opts": [{"t": "While", "ok": true, "fb": "洗澡是持續中的長動作，放在 While 後面。"}, {"t": "Before", "ok": false, "fb": "電話是在洗澡的過程中響的，不是洗澡之前。"}, {"t": "After", "ok": false, "fb": "電話響的時候還在洗澡，不是洗完之後。"}, {"t": "Until", "ok": false, "fb": "until 表示「直到⋯⋯為止」，這裡不是在講持續到某個時間點。"}]}, {"q": "____ the bell rang, all the students ran out of the classroom.", "opts": [{"t": "While", "ok": false, "fb": "鈴響是一瞬間的短動作，要用 When。"}, {"t": "When", "ok": true, "fb": "鈴響是短暫發生的動作，用 When。"}, {"t": "Until", "ok": false, "fb": "句子的意思是鈴一響就衝出去，不是「直到鈴響為止」。"}, {"t": "Before", "ok": false, "fb": "學生是鈴響之後才跑出去的，不是之前。"}]}, {"q": "Please wash your hands ____ you eat dinner.", "opts": [{"t": "after", "ok": false, "fb": "洗手應該在吃飯之前，不是之後。"}, {"t": "before", "ok": true, "fb": "洗手要在吃飯之前，用 before。"}, {"t": "until", "ok": false, "fb": "until 是「直到為止」，意思不通。"}, {"t": "while", "ok": false, "fb": "一邊吃飯一邊洗手不合理。"}]}, {"q": "I usually take a walk ____ I finish my dinner.", "opts": [{"t": "before", "ok": false, "fb": "吃完飯才去散步，所以是吃完之後。"}, {"t": "after", "ok": true, "fb": "finish my dinner 表示吃完了，散步在那之後。"}, {"t": "until", "ok": false, "fb": "until 表示持續到某個時間點，意思不合。"}, {"t": "while", "ok": false, "fb": "一邊吃飯一邊散步不合理。"}]}, {"q": "The little boy cried ____ his mother came back.", "opts": [{"t": "until", "ok": true, "fb": "一直哭到媽媽回來為止，用 until。"}, {"t": "before", "ok": false, "fb": "before 只說明先後，表達不出「一直持續到」的意思。"}, {"t": "while", "ok": false, "fb": "媽媽回來是一瞬間的動作，不適合用 while。"}, {"t": "after", "ok": false, "fb": "意思會變成媽媽回來之後他才開始哭，不合理。"}]}, {"q": "____ my father was watching TV, my mother ____ the dishes.", "opts": [{"t": "While / was washing", "ok": true, "fb": "兩件事同時持續進行，用 While 搭配進行式。"}, {"t": "While / washes", "ok": false, "fb": "前半用了過去進行式，後半也要用過去式。"}, {"t": "Until / was washing", "ok": false, "fb": "這兩件事是同時發生，不是持續到某個時間點。"}, {"t": "Before / was washing", "ok": false, "fb": "兩件事是同時進行的，不是一前一後。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "When I got home, my sister was sleeping.", "ok": false, "fb": "這句是對的。回到家是短動作用 When。"}, {"t": "While the teacher was talking, Ted fell asleep.", "ok": false, "fb": "這句是對的。老師講話是持續的長動作，用 While。"}, {"t": "While the door opened, I was reading a book.", "ok": true, "fb": "這句錯了。開門是一瞬間的短動作，要用 When。"}, {"t": "I stayed in the library until it closed.", "ok": false, "fb": "這句是對的。待到圖書館關門為止，用 until。"}]}, {"q": "____ I was walking to school this morning, I ____ my English teacher.", "opts": [{"t": "While / met", "ok": true, "fb": "走路上學是持續的動作用 While；遇到老師是一瞬間的事，用過去式。"}, {"t": "When / was meeting", "ok": false, "fb": "遇到老師是一瞬間發生的事，不會用進行式。"}, {"t": "Until / met", "ok": false, "fb": "這不是「直到⋯⋯為止」的意思。"}, {"t": "After / met", "ok": false, "fb": "遇到老師是在走路的過程中發生的，不是走完之後。"}]}]}, {"id": "modals", "title": "助動詞 may / might / must / should", "unit": "第三冊 Unit 6 · B3 L1–2", "points": "<p>這四個助動詞表達的是<strong>說話者的態度</strong>：有多確定、該不該做。後面一律接動詞原形。</p><h3>四個助動詞</h3><table><tr><th>助動詞</th><th>意思</th><th>例子</th></tr><tr><td class=\"en\">may</td><td>可能、可以（請求許可）</td><td class=\"en\">It <span class=\"k1\">may</span> rain tomorrow.<br><span class=\"k1\">May</span> I come in?</td></tr><tr><td class=\"en\">might</td><td>可能（比 may 更不確定）</td><td class=\"en\">He <span class=\"k1\">might</span> be at home.</td></tr><tr><td class=\"en\">must</td><td>必須、一定是</td><td class=\"en\">You <span class=\"k1\">must</span> wear a helmet.<br>She <span class=\"k1\">must</span> be tired.</td></tr><tr><td class=\"en\">should</td><td>應該（建議）</td><td class=\"en\">You <span class=\"k1\">should</span> see a doctor.</td></tr></table><h3>確定的程度</h3><p class=\"en\"><span class=\"k1\">must</span>（幾乎確定）　＞　<span class=\"k2\">may</span>（有可能）　＞　<span class=\"k3\">might</span>（也許吧）</p><h3>後面一定接原形</h3><p class=\"en\">He <span class=\"k1\">should</span> <span class=\"k2\">go</span> to bed early.　<span class=\"bad\">should goes</span>　<span class=\"bad\">should to go</span></p><p style=\"color:var(--muted);font-size:17px\">助動詞不隨主詞變化，也不加 s。</p><h3>兩種否定差很多</h3><p class=\"en\">You <span class=\"k1\">mustn't</span> smoke here.　→ <strong>禁止</strong>，絕對不可以<br>You <span class=\"k2\">don't have to</span> come.　→ <strong>不必</strong>，來不來都行</p><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">She musts study.</span>　→ 助動詞不加 s</p><p class=\"en\"><span class=\"bad\">You should to call her.</span>　→ 後面不加 to</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">mustn't = 不必</span>　→ mustn't 是「禁止」</p></div>", "questions": [{"q": "You look really pale. You ____ see a doctor.", "opts": [{"t": "should", "ok": true, "fb": "給對方建議用 should。"}, {"t": "might", "ok": false, "fb": "might 表示可能性，不是在給建議。"}, {"t": "may", "ok": false, "fb": "may 表示可能或請求許可，這裡是建議對方去看醫生。"}, {"t": "must not", "ok": false, "fb": "意思會變成「禁止去看醫生」，和臉色蒼白的情境矛盾。"}]}, {"q": "Dark clouds are coming. It ____ rain this afternoon.", "opts": [{"t": "must not", "ok": false, "fb": "烏雲密布應該是可能會下雨，不是一定不會。"}, {"t": "may", "ok": true, "fb": "表示有可能發生，用 may。"}, {"t": "should", "ok": false, "fb": "should 是建議或應該，不用來講天氣的可能性。"}, {"t": "can", "ok": false, "fb": "can 表示能力或許可，講可能性用 may。"}]}, {"q": "Everyone ____ wear a helmet when riding a scooter. It's the law.", "opts": [{"t": "may", "ok": false, "fb": "法律規定是強制的，may 只表示可能或許可。"}, {"t": "might", "ok": false, "fb": "might 的語氣太弱，法律規定要用 must。"}, {"t": "must", "ok": true, "fb": "法律規定表示必須，用 must。"}, {"t": "should", "ok": false, "fb": "should 只是建議，但這裡說了是法律，語氣要更強。"}]}, {"q": "Judy didn't eat anything all day. She ____ be very hungry now.", "opts": [{"t": "must", "ok": true, "fb": "一整天沒吃東西，幾乎可以確定她很餓，用 must 表示「一定是」。"}, {"t": "might not", "ok": false, "fb": "一整天沒吃東西，不太可能不餓。"}, {"t": "should", "ok": false, "fb": "should 是「應該要做」，不是用來推測事實。"}, {"t": "can", "ok": false, "fb": "can 表示能力，不用來推測。"}]}, {"q": "My sister ____ come to the party, but she isn't sure yet.", "opts": [{"t": "must", "ok": false, "fb": "後面說她還不確定，must 的語氣太強了。"}, {"t": "might", "ok": true, "fb": "還不確定，可能性不高，用 might。"}, {"t": "should", "ok": false, "fb": "should 是建議，不是在講可能性。"}, {"t": "must not", "ok": false, "fb": "「還不確定」不等於「一定不會」。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "You should drink more water.", "ok": false, "fb": "這句是對的。should 後面接原形。"}, {"t": "She musts finish her report today.", "ok": true, "fb": "這句錯了。助動詞不隨主詞變化，不加 s，要寫 must。"}, {"t": "May I use your phone?", "ok": false, "fb": "這句是對的。May 用來請求許可。"}, {"t": "He might not come tonight.", "ok": false, "fb": "這句是對的。might 的否定直接加 not。"}]}, {"q": "A: ____ I open the window?　B: Sure, go ahead.", "opts": [{"t": "Must", "ok": false, "fb": "Must 是「必須」，用來問對方該不該做不合適。"}, {"t": "May", "ok": true, "fb": "有禮貌地請求許可用 May I。"}, {"t": "Should", "ok": false, "fb": "Should I 是在問對方意見，但回答 Sure, go ahead 是在給許可。"}, {"t": "Might", "ok": false, "fb": "might 表示可能性，不用來請求許可。"}]}, {"q": "This is a library. You ____ talk loudly here, but you ____ stay quiet the whole time.", "opts": [{"t": "mustn't / don't have to", "ok": true, "fb": "大聲說話是禁止的用 mustn't；全程安靜不是強制的，用 don't have to。"}, {"t": "don't have to / mustn't", "ok": false, "fb": "兩個放反了。圖書館禁止大聲說話，但沒有強制全程不出聲。"}, {"t": "mustn't / mustn't", "ok": false, "fb": "後半是「不必」而不是「禁止」，要用 don't have to。"}, {"t": "don't have to / don't have to", "ok": false, "fb": "前半在圖書館大聲說話是禁止的，要用 mustn't。"}]}]}, {"id": "past-cont", "title": "過去進行式", "unit": "第三冊 Unit 7 · B3 L3–4", "points": "<p>過去進行式講的是<strong>過去某個時間點，正在進行的事</strong>。公式和現在進行式一樣，只是 be 動詞變成過去式。</p><h3>公式</h3><div class=\"formula\"><span class=\"tag k0\">主詞</span><span class=\"plus\">+</span><span class=\"tag k1\">was / were</span><span class=\"plus\">+</span><span class=\"tag k2\">動詞-ing</span></div><table><tr><th>主詞</th><th>be 動詞</th><th>例子</th></tr><tr><td>I / He / She / It、單數</td><td class=\"en\">was</td><td class=\"en\">I <span class=\"k1\">was</span> <span class=\"k2\">reading</span>.</td></tr><tr><td>You / We / They、複數</td><td class=\"en\">were</td><td class=\"en\">They <span class=\"k1\">were</span> <span class=\"k2\">playing</span>.</td></tr></table><h3>三種時態放在一起看</h3><table><tr><th>時態</th><th>意思</th><th>例子</th></tr><tr><td>現在進行式</td><td>此刻正在</td><td class=\"en\">He <span class=\"k1\">is</span> sleeping.</td></tr><tr><td>過去進行式</td><td>過去某時正在</td><td class=\"en\">He <span class=\"k1\">was</span> sleeping.</td></tr><tr><td>過去簡單式</td><td>過去做了、做完了</td><td class=\"en\">He <span class=\"k3\">slept</span> for ten hours.</td></tr></table><h3>最常考：長動作配短動作</h3><p class=\"en\">I <span class=\"k1\">was taking</span> a shower <span class=\"k0\">when</span> the phone <span class=\"k3\">rang</span>.</p><p>一件事做到一半，另一件事突然發生。<strong>持續的長動作用過去進行式，突然的短動作用過去簡單式。</strong></p><h3>常見的時間提示</h3><p class=\"en\"><span class=\"k2\">at eight last night　at that time　this time yesterday</span></p><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">They was watching TV.</span>　→ They 要配 were</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">I was took a shower.</span>　→ be 後面接 V-ing</p></div>", "questions": [{"q": "I ____ my homework at eight o'clock last night.", "opts": [{"t": "was doing", "ok": true, "fb": "at eight last night 指過去的某個時間點，當時正在進行，用過去進行式。"}, {"t": "were doing", "ok": false, "fb": "主詞是 I，過去式的 be 動詞要用 was。"}, {"t": "am doing", "ok": false, "fb": "last night 是過去的事，不能用現在式。"}, {"t": "was do", "ok": false, "fb": "be 動詞後面要接 V-ing，不是原形。"}]}, {"q": "Ted and his friends ____ basketball when it suddenly started to rain.", "opts": [{"t": "was playing", "ok": false, "fb": "主詞是 Ted 和朋友們，是複數，要用 were。"}, {"t": "were playing", "ok": true, "fb": "複數主詞配 were；打球是持續中的動作，被下雨打斷。"}, {"t": "are playing", "ok": false, "fb": "句子講的是過去發生的事。"}, {"t": "were play", "ok": false, "fb": "be 動詞後面一定接 V-ing。"}]}, {"q": "A: I called you at nine but you didn't answer.　B: Sorry, I ____ a shower then.", "opts": [{"t": "took", "ok": false, "fb": "要表達「當時正在洗」才能解釋為什麼沒接電話，用過去進行式。"}, {"t": "was taking", "ok": true, "fb": "九點當下正在洗澡，所以沒接到電話，用過去進行式。"}, {"t": "am taking", "ok": false, "fb": "講的是九點那時候的事，是過去。"}, {"t": "was take", "ok": false, "fb": "be 動詞後面要用 V-ing。"}]}, {"q": "Yesterday afternoon I ____ TV when the doorbell ____ .", "opts": [{"t": "watched / was ringing", "ok": false, "fb": "兩個放反了。看電視是持續的長動作，門鈴響是一瞬間的事。"}, {"t": "was watching / rang", "ok": true, "fb": "看電視是持續中的動作用進行式；門鈴響是突然發生的，用過去簡單式。"}, {"t": "was watching / was ringing", "ok": false, "fb": "門鈴響是一瞬間的事，不會用進行式。"}, {"t": "watched / rang", "ok": false, "fb": "兩個都用過去簡單式，就看不出是「看到一半被打斷」。"}]}, {"q": "A: ____ you ____ when I called you last night?　B: Yes, I was. Sorry about that.", "opts": [{"t": "Were / sleeping", "ok": true, "fb": "主詞 you 配 Were，後面接 V-ing。"}, {"t": "Was / sleeping", "ok": false, "fb": "主詞是 you，要用 Were。"}, {"t": "Did / sleeping", "ok": false, "fb": "回答用了 Yes, I was，表示問句要用 be 動詞。"}, {"t": "Were / slept", "ok": false, "fb": "be 動詞後面要接 V-ing，不是過去式。"}]}, {"q": "Amy ____ at home last night. She ____ at her friend's birthday party.", "opts": [{"t": "wasn't / was dancing", "ok": true, "fb": "前半是過去的狀態用 wasn't；後半是當時正在做的事，用過去進行式。"}, {"t": "weren't / was dancing", "ok": false, "fb": "主詞 Amy 是單數，要用 wasn't。"}, {"t": "wasn't / danced", "ok": false, "fb": "要表達「當時正在派對上跳舞」，用過去進行式比較貼切。"}, {"t": "isn't / is dancing", "ok": false, "fb": "last night 表示過去的事。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "We were studying in the library at that time.", "ok": false, "fb": "這句是對的。We 配 were，後面接 V-ing。"}, {"t": "My sister was cooking when I got home.", "ok": false, "fb": "這句是對的。長動作用進行式，短動作用過去式。"}, {"t": "The students was listening to the teacher.", "ok": true, "fb": "這句錯了。students 是複數，要用 were listening。"}, {"t": "It was raining hard this time yesterday.", "ok": false, "fb": "這句是對的。It 配 was，後面接 raining。"}]}, {"q": "Look! Ted ____ on the playground now. This time yesterday he ____ there, too.", "opts": [{"t": "is running / was running", "ok": true, "fb": "Look! 和 now 用現在進行式；this time yesterday 用過去進行式。"}, {"t": "was running / is running", "ok": false, "fb": "兩個放反了。now 是現在，yesterday 是過去。"}, {"t": "runs / ran", "ok": false, "fb": "兩個時間點都在強調「當時正在跑」，要用進行式。"}, {"t": "is running / is running", "ok": false, "fb": "後半有 yesterday，是過去的事，be 動詞要用 was。"}]}]}, {"id": "infinitive", "title": "不定詞的用法", "unit": "第三冊 Unit 7 · B3 L3–4", "points": "<p>不定詞長這樣：<strong>to + 動詞原形</strong>。它讓一個動詞可以放進句子的其他位置。</p><h3>兩個主要用法</h3><table><tr><th>用法</th><th>說明</th><th>例子</th></tr><tr><td>當受詞</td><td>放在某些動詞後面</td><td class=\"en\">I want <span class=\"k1\">to go</span>.</td></tr><tr><td>表示目的</td><td>為了做某事</td><td class=\"en\">He went out <span class=\"k1\">to buy</span> milk.</td></tr></table><h3>後面接不定詞的常見動詞</h3><p class=\"en\"><span class=\"k2\">want　need　hope　plan　decide　learn　would like</span></p><p class=\"en\">I <span class=\"k2\">hope</span> <span class=\"k1\">to see</span> you soon.<br>We <span class=\"k2\">decided</span> <span class=\"k1\">to stay</span> home.</p><h3>表示目的：為了⋯⋯</h3><p class=\"en\">I came here <span class=\"k1\">to see</span> you.　<span class=\"bad\">for see you</span></p><p style=\"color:var(--muted);font-size:17px\">中文的「為了」常讓人想用 for，但 for 後面不能接動詞原形。表示目的一律用 to + 原形。</p><h3>助動詞後面不加 to</h3><p class=\"en\">I <span class=\"k3\">want to</span> swim.　<span class=\"k0\">但是</span>　I <span class=\"k3\">can</span> swim.　<span class=\"bad\">can to swim</span></p><p>can、must、should、may 這類助動詞後面直接接原形，不加 to。</p><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">I want be a doctor.</span>　→ 少了 to</p><p class=\"en\"><span class=\"bad\">He went there for buy a book.</span>　→ 目的用 to</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">She must to leave now.</span>　→ 助動詞後不加 to</p></div>", "questions": [{"q": "My little brother wants ____ a scientist in the future.", "opts": [{"t": "be", "ok": false, "fb": "want 後面要接不定詞，少了 to。"}, {"t": "to be", "ok": true, "fb": "want 後面接不定詞 to + 原形。"}, {"t": "being", "ok": false, "fb": "want 後面不接 V-ing，要用不定詞。"}, {"t": "to being", "ok": false, "fb": "to 後面要接動詞原形，不是 V-ing。"}]}, {"q": "Dad went to the supermarket ____ some milk and eggs.", "opts": [{"t": "buy", "ok": false, "fb": "表示目的要用不定詞，前面要加 to。"}, {"t": "to buy", "ok": true, "fb": "去超市的目的是買東西，用 to + 原形表示目的。"}, {"t": "buying", "ok": false, "fb": "表示目的用不定詞，不用 V-ing。"}, {"t": "for buy", "ok": false, "fb": "for 後面不能直接接動詞原形，表示目的要用 to。"}]}, {"q": "It was raining, so we decided ____ at home and watch a movie.", "opts": [{"t": "stay", "ok": false, "fb": "decide 後面要接不定詞，少了 to。"}, {"t": "to stay", "ok": true, "fb": "decide 後面固定接不定詞。"}, {"t": "staying", "ok": false, "fb": "decide 後面不接 V-ing。"}, {"t": "stayed", "ok": false, "fb": "decided 已經表示過去了，後面要接不定詞。"}]}, {"q": "Excuse me, I'd like ____ you a question about the homework.", "opts": [{"t": "ask", "ok": false, "fb": "would like 後面要接不定詞，少了 to。"}, {"t": "to ask", "ok": true, "fb": "would like 後面接不定詞，比 want 更有禮貌。"}, {"t": "asking", "ok": false, "fb": "would like 後面接不定詞，不接 V-ing。"}, {"t": "asked", "ok": false, "fb": "這個位置要用不定詞，不用過去式。"}]}, {"q": "Ted ____ to join the basketball team, and he ____ practice every day.", "opts": [{"t": "wants / must", "ok": true, "fb": "want 後面接不定詞；must 是助動詞，後面直接接原形 practice。"}, {"t": "wants / must to", "ok": false, "fb": "must 是助動詞，後面不加 to。"}, {"t": "want / must", "ok": false, "fb": "主詞 Ted 是第三人稱單數，動詞要加 s。"}, {"t": "wants to / must", "ok": false, "fb": "句子裡已經有 to join 了，不需要再多一個 to。"}]}, {"q": "Amy studies very hard because she hopes ____ a good senior high school.", "opts": [{"t": "enter", "ok": false, "fb": "hope 後面要接不定詞，少了 to。"}, {"t": "to enter", "ok": true, "fb": "hope 後面固定接不定詞。"}, {"t": "entering", "ok": false, "fb": "hope 後面不接 V-ing。"}, {"t": "enters", "ok": false, "fb": "這個位置要用不定詞，不會有第三人稱單數的變化。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "I need to finish my report tonight.", "ok": false, "fb": "這句是對的。need 後面接不定詞。"}, {"t": "She came here for see her grandmother.", "ok": true, "fb": "這句錯了。表示目的要用 to see，for 後面不能接原形動詞。"}, {"t": "We plan to visit Yilan next month.", "ok": false, "fb": "這句是對的。plan 後面接不定詞。"}, {"t": "You should call her right now.", "ok": false, "fb": "這句是對的。should 是助動詞，後面直接接原形。"}]}, {"q": "My sister needs ____ harder because she plans ____ abroad next year.", "opts": [{"t": "to study / to go", "ok": true, "fb": "need 和 plan 後面都接不定詞。"}, {"t": "study / go", "ok": false, "fb": "need 和 plan 都不是助動詞，後面要加 to。"}, {"t": "to study / go", "ok": false, "fb": "前半對了，但 plan 後面也要接不定詞 to go。"}, {"t": "studying / going", "ok": false, "fb": "這兩個動詞後面都接不定詞，不接 V-ing。"}]}]}, {"id": "gerund", "title": "動名詞的用法", "unit": "第三冊 Unit 7 · B3 L3–4", "points": "<p>動名詞長得和現在分詞一樣是 <strong>V-ing</strong>，但它的角色是<strong>名詞</strong>。所以凡是名詞能站的位置，動名詞都能站。</p><h3>三個位置</h3><table><tr><th>位置</th><th>例子</th></tr><tr><td>當主詞</td><td class=\"en\"><span class=\"k1\">Swimming</span> is good exercise.</td></tr><tr><td>當受詞</td><td class=\"en\">I enjoy <span class=\"k1\">reading</span> comic books.</td></tr><tr><td>介系詞後面</td><td class=\"en\">He is good at <span class=\"k2\">playing</span> the guitar.</td></tr></table><p style=\"color:var(--muted);font-size:17px\">第三個位置是最常考的：<strong>介系詞後面一定接動名詞，不能接原形</strong>。</p><h3>後面接動名詞的常見動詞</h3><p class=\"en\"><span class=\"k2\">enjoy　finish　practice　mind　give up　keep</span></p><p class=\"en\">I <span class=\"k2\">finished</span> <span class=\"k1\">doing</span> my homework.<br>He <span class=\"k2\">gave up</span> <span class=\"k1\">eating</span> junk food.</p><h3>和不定詞怎麼分</h3><table><tr><th>只能接不定詞</th><th>只能接動名詞</th><th>兩種都可以</th></tr><tr><td class=\"en\">want, hope, plan,<br>decide, need</td><td class=\"en\">enjoy, finish,<br>practice, give up</td><td class=\"en\">like, love, start</td></tr></table><p class=\"en\">I <span class=\"k3\">want</span> <span class=\"k1\">to swim</span>.　I <span class=\"k3\">enjoy</span> <span class=\"k2\">swimming</span>.<br>I <span class=\"k3\">like</span> <span class=\"k1\">to swim</span>. = I <span class=\"k3\">like</span> <span class=\"k2\">swimming</span>.</p><h3>常見的介系詞片語</h3><p class=\"en\">be good at <span class=\"k2\">V-ing</span>　be interested in <span class=\"k2\">V-ing</span><br>before <span class=\"k2\">V-ing</span>　after <span class=\"k2\">V-ing</span>　thank you for <span class=\"k2\">V-ing</span></p><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">She is interested in collect stamps.</span>　→ 介系詞後接 V-ing</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">I enjoy to read books.</span>　→ enjoy 後面只能接 V-ing</p></div>", "questions": [{"q": "____ every morning is a good way to stay healthy.", "opts": [{"t": "Run", "ok": false, "fb": "句子開頭當主詞要用名詞的形式，動詞原形不能當主詞。"}, {"t": "Running", "ok": true, "fb": "動名詞可以當主詞，放在句首。"}, {"t": "To running", "ok": false, "fb": "to 後面要接原形，而且這裡用動名詞就可以了。"}, {"t": "Runs", "ok": false, "fb": "這是第三人稱單數的動詞變化，不能當主詞。"}]}, {"q": "My father enjoys ____ to music after a long day at work.", "opts": [{"t": "to listen", "ok": false, "fb": "enjoy 後面只能接動名詞，不接不定詞。"}, {"t": "listening", "ok": true, "fb": "enjoy 後面固定接 V-ing。"}, {"t": "listen", "ok": false, "fb": "enjoy 後面要接動名詞，不是原形。"}, {"t": "listened", "ok": false, "fb": "enjoy 後面接的是動名詞，不是過去式。"}]}, {"q": "Judy is really good at ____ pictures. She wants to be an artist.", "opts": [{"t": "draw", "ok": false, "fb": "at 是介系詞，後面一定接動名詞。"}, {"t": "to draw", "ok": false, "fb": "介系詞後面不能接不定詞。"}, {"t": "drawing", "ok": true, "fb": "be good at 的 at 是介系詞，後面接 V-ing。"}, {"t": "draws", "ok": false, "fb": "介系詞後面要接名詞或動名詞。"}]}, {"q": "Ted finished ____ his homework, and then he started ____ TV.", "opts": [{"t": "doing / watching", "ok": true, "fb": "finish 後面只能接動名詞；start 兩種都可以，這裡用 watching 沒問題。"}, {"t": "to do / watching", "ok": false, "fb": "finish 後面只能接動名詞，不能接不定詞。"}, {"t": "do / watch", "ok": false, "fb": "這兩個位置都不能用動詞原形。"}, {"t": "to do / to watch", "ok": false, "fb": "finish 後面不接不定詞。"}]}, {"q": "I want ____ English well, so I practice ____ English songs every day.", "opts": [{"t": "to speak / singing", "ok": true, "fb": "want 後面接不定詞；practice 後面接動名詞。"}, {"t": "speaking / to sing", "ok": false, "fb": "兩個放反了。want 接不定詞，practice 接動名詞。"}, {"t": "to speak / to sing", "ok": false, "fb": "前半對了，但 practice 後面只能接 V-ing。"}, {"t": "speaking / singing", "ok": false, "fb": "want 後面只能接不定詞 to speak。"}]}, {"q": "Remember to turn off the lights before ____ the classroom.", "opts": [{"t": "leave", "ok": false, "fb": "before 在這裡是介系詞，後面要接動名詞。"}, {"t": "leaving", "ok": true, "fb": "介系詞 before 後面接 V-ing。"}, {"t": "to leave", "ok": false, "fb": "介系詞後面不接不定詞。"}, {"t": "left", "ok": false, "fb": "介系詞後面要接動名詞，不是過去式。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "Thank you for helping me with my homework.", "ok": false, "fb": "這句是對的。for 是介系詞，後面接 V-ing。"}, {"t": "My sister is interested in collect stamps.", "ok": true, "fb": "這句錯了。in 是介系詞，後面要接 collecting。"}, {"t": "Reading before bed helps me sleep.", "ok": false, "fb": "這句是對的。動名詞當主詞。"}, {"t": "He gave up playing computer games.", "ok": false, "fb": "這句是對的。give up 後面接動名詞。"}]}, {"q": "My brother gave up ____ computer games, and now he spends more time ____ books.", "opts": [{"t": "playing / reading", "ok": true, "fb": "give up 後面接動名詞；spend time 後面也接 V-ing。"}, {"t": "to play / to read", "ok": false, "fb": "這兩個位置都要用動名詞。"}, {"t": "play / read", "ok": false, "fb": "兩個位置都不能用動詞原形。"}, {"t": "playing / to read", "ok": false, "fb": "前半對了，但 spend time 後面接的是 V-ing。"}]}]}, {"id": "it-subject", "title": "it 當虛主詞", "unit": "第三冊 Unit 7 · B3 L3–4", "points": "<p>英文不喜歡句子的開頭太長。所以先放一個沒有意義的 <strong>it</strong> 佔住主詞的位置，真正的內容移到後面。</p><h3>基本句型</h3><div class=\"formula\"><span class=\"tag k1\">It is</span><span class=\"plus\">+</span><span class=\"tag k0\">形容詞</span><span class=\"plus\">+</span><span class=\"tag k2\">to + 原形</span></div><p class=\"en\"><span class=\"k1\">It</span> is important <span class=\"k2\">to eat breakfast</span>.</p><p>這裡的 it 沒有意思，真正的主詞是後面的 <span class=\"en\">to eat breakfast</span>。</p><h3>加上「對誰而言」</h3><p class=\"en\">It is hard <span class=\"k3\">for me</span> <span class=\"k2\">to get up early</span>.</p><p>用 <span class=\"en\">for + 人</span>，放在形容詞和不定詞中間。</p><h3>It takes：花多少時間</h3><div class=\"formula\"><span class=\"tag k1\">It takes</span><span class=\"plus\">+</span><span class=\"tag k0\">人</span><span class=\"plus\">+</span><span class=\"tag k3\">時間</span><span class=\"plus\">+</span><span class=\"tag k2\">to + 原形</span></div><p class=\"en\">It <span class=\"k1\">takes</span> <span class=\"k0\">me</span> <span class=\"k3\">thirty minutes</span> <span class=\"k2\">to walk</span> to school.<br>問法：<span class=\"k1\">How long</span> does it take to get there?</p><h3>it 的其他用途</h3><p class=\"en\">天氣：<span class=\"k1\">It</span> is rainy today.<br>時間：<span class=\"k1\">It</span> is ten o'clock now.<br>距離：<span class=\"k1\">It</span> is two kilometers from here.</p><p>這些句子裡的 it 同樣沒有實際意思，只是用來當主詞。</p><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">It is easy learning English.</span>　→ 要用 to learn</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">It takes me two hours finish it.</span>　→ 少了 to</p></div>", "questions": [{"q": "____ is very important to eat breakfast every morning.", "opts": [{"t": "It", "ok": true, "fb": "用 It 當虛主詞佔住位置，真正的主詞是後面的不定詞。"}, {"t": "That", "ok": false, "fb": "這個句型固定用 It 開頭。"}, {"t": "This", "ok": false, "fb": "虛主詞只能用 it，不用 this。"}, {"t": "He", "ok": false, "fb": "he 是指人，這裡需要沒有實際意義的虛主詞。"}]}, {"q": "It is not easy ____ a new language well.", "opts": [{"t": "learn", "ok": false, "fb": "這個句型後面要接不定詞，少了 to。"}, {"t": "to learn", "ok": true, "fb": "It is + 形容詞 + to + 原形，這是固定句型。"}, {"t": "learning", "ok": false, "fb": "這個句型後面接的是不定詞，不是動名詞。"}, {"t": "learns", "ok": false, "fb": "這個位置要用不定詞。"}]}, {"q": "It ____ me about thirty minutes to ride to school every day.", "opts": [{"t": "take", "ok": false, "fb": "主詞是 It，是第三人稱單數，動詞要加 s。"}, {"t": "takes", "ok": true, "fb": "It takes + 人 + 時間 + to + 原形，主詞 It 配 takes。"}, {"t": "spends", "ok": false, "fb": "這個句型固定用 take，spend 的主詞要是人。"}, {"t": "is taking", "ok": false, "fb": "這是講平常固定花的時間，用現在簡單式。"}]}, {"q": "It is really hard ____ my little brother to sit still for an hour.", "opts": [{"t": "of", "ok": false, "fb": "這個句型表示「對某人而言」要用 for。"}, {"t": "for", "ok": true, "fb": "要說明是對誰而言，用 for + 人。"}, {"t": "to", "ok": false, "fb": "to 後面要接動詞原形，不是人。"}, {"t": "with", "ok": false, "fb": "這個句型固定用 for 來表示對象。"}]}, {"q": "A: ____ does it take to walk from here to the station?　B: About ten minutes.", "opts": [{"t": "How long", "ok": true, "fb": "問需要花多久時間用 How long。"}, {"t": "How many", "ok": false, "fb": "How many 問的是數量，不是時間長度。"}, {"t": "How often", "ok": false, "fb": "How often 問的是多久一次，不是花多久。"}, {"t": "How far", "ok": false, "fb": "How far 問的是距離，但回答給的是時間。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "It is dangerous to swim in this river.", "ok": false, "fb": "這句是對的。It is + 形容詞 + to + 原形。"}, {"t": "It is fun learning new things.", "ok": true, "fb": "這句錯了。這個句型要接不定詞，應該是 It is fun to learn new things。"}, {"t": "It takes him an hour to finish the work.", "ok": false, "fb": "這句是對的。It takes + 人 + 時間 + to + 原形。"}, {"t": "It is ten thirty now.", "ok": false, "fb": "這句是對的。講時間用 It 當主詞。"}]}, {"q": "____ was cloudy yesterday, and ____ is sunny today.", "opts": [{"t": "It / it", "ok": true, "fb": "講天氣的句子固定用 it 當主詞，沒有實際意思。"}, {"t": "That / that", "ok": false, "fb": "講天氣只能用 it。"}, {"t": "The weather / the weather", "ok": false, "fb": "文法上不算錯，但講天氣最自然的說法是用 it。"}, {"t": "It / that", "ok": false, "fb": "前半對了，但後半講天氣也要用 it。"}]}, {"q": "It ____ me two hours ____ the report, and it was not easy ____ me.", "opts": [{"t": "took / to finish / for", "ok": true, "fb": "It took + 人 + 時間 + to + 原形；表示對誰而言用 for。"}, {"t": "spent / to finish / for", "ok": false, "fb": "這個句型主詞是 It，要用 take，不用 spend。"}, {"t": "took / finishing / for", "ok": false, "fb": "這個句型後面接的是不定詞，不是動名詞。"}, {"t": "took / to finish / to", "ok": false, "fb": "表示「對我而言」要用 for me，不是 to me。"}]}]}, {"id": "directions", "title": "問路與搭乘交通工具", "unit": "第三冊 Unit 8 · B3 L5–6", "points": "<p>這個主題考的是<strong>固定說法</strong>。意思猜得出來，但用字錯一個就扣分，所以要整句記。</p><h3>怎麼問路</h3><p class=\"en\"><span class=\"k1\">Excuse me.</span> How can I <span class=\"k2\">get to</span> the train station?<br><span class=\"k1\">Excuse me.</span> Where is the post office?<br>Is there a bank <span class=\"k2\">near here</span>?</p><p style=\"color:var(--muted);font-size:17px\">「到達某地」固定說 <span class=\"en\">get to</span>，不說 go to the station 來問路。</p><h3>怎麼指路</h3><table><tr><th>說法</th><th>意思</th></tr><tr><td class=\"en\">Go straight.</td><td>直走</td></tr><tr><td class=\"en\">Turn left / right.</td><td>左轉／右轉</td></tr><tr><td class=\"en\">Go down Zhongshan Road.</td><td>沿著中山路走</td></tr><tr><td class=\"en\">It's on your left.</td><td>在你的左手邊</td></tr><tr><td class=\"en\">It's across from the park.</td><td>在公園對面</td></tr></table><p class=\"en\"><span class=\"bad\">Turn to left</span>　→ 正確是 <span class=\"k1\">turn left</span>，中間不加 to</p><h3>交通工具的三種說法</h3><table><tr><th>說法</th><th>例子</th></tr><tr><td class=\"en\">take + the + 交通工具</td><td class=\"en\">I <span class=\"k1\">take the bus</span> to school.</td></tr><tr><td class=\"en\">by + 交通工具</td><td class=\"en\">I go to school <span class=\"k1\">by bus</span>.</td></tr><tr><td class=\"en\">走路</td><td class=\"en\">I go to school <span class=\"k1\">on foot</span>.</td></tr></table><p class=\"en\"><span class=\"bad\">by a bus</span>　<span class=\"bad\">by foot</span>　→ by 後面不加冠詞，走路固定說 on foot</p><h3>上下車</h3><p class=\"en\"><span class=\"k2\">get on</span> the bus（上車）　<span class=\"k2\">get off</span> the bus（下車）</p>", "questions": [{"q": "Excuse me. How can I ____ the train station from here?", "opts": [{"t": "get to", "ok": true, "fb": "問路時「到達某地」的固定說法是 get to。"}, {"t": "go", "ok": false, "fb": "go 後面要有 to，而且問路習慣用 get to。"}, {"t": "take", "ok": false, "fb": "take 後面接的是交通工具，不是地點。"}, {"t": "arrive", "ok": false, "fb": "arrive 後面要接 at 或 in，而且問路的固定說法是 get to。"}]}, {"q": "Go straight for two blocks, and then ____ at the first corner.", "opts": [{"t": "turn left", "ok": true, "fb": "左轉固定說 turn left，中間不加 to。"}, {"t": "turn to left", "ok": false, "fb": "turn 和 left 中間不加 to。"}, {"t": "turn the left", "ok": false, "fb": "left 前面不加冠詞。"}, {"t": "turning left", "ok": false, "fb": "這是祈使句，要用動詞原形開頭。"}]}, {"q": "My school is far from my home, so I ____ to school every day.", "opts": [{"t": "take the bus", "ok": true, "fb": "take + the + 交通工具，是搭乘的固定說法。"}, {"t": "take bus", "ok": false, "fb": "用 take 時，交通工具前面要加 the。"}, {"t": "by the bus", "ok": false, "fb": "by 後面不加冠詞，而且 by bus 前面需要動詞 go。"}, {"t": "ride bus", "ok": false, "fb": "ride 用在腳踏車、機車這類跨坐的交通工具。"}]}, {"q": "The bookstore is just around the corner. You can go there ____ .", "opts": [{"t": "by foot", "ok": false, "fb": "走路不說 by foot，固定說法是 on foot。"}, {"t": "on foot", "ok": true, "fb": "走路的固定說法是 on foot。"}, {"t": "by walk", "ok": false, "fb": "沒有這種說法。walk 是動詞，走路的固定片語是 on foot。"}, {"t": "on feet", "ok": false, "fb": "固定片語是 on foot，用單數。"}]}, {"q": "We're almost there. Let's ____ the bus at the next stop.", "opts": [{"t": "get on", "ok": false, "fb": "get on 是上車，但我們已經在車上，快到了要下車。"}, {"t": "get off", "ok": true, "fb": "下車固定說 get off。"}, {"t": "get in", "ok": false, "fb": "公車用 get on / get off，get in 用在小客車。"}, {"t": "get to", "ok": false, "fb": "get to 後面接地點，不是交通工具。"}]}, {"q": "A: Excuse me. Is there a post office near here?　B: ____ It's across from the bank.", "opts": [{"t": "Yes, there is.", "ok": true, "fb": "Is there 開頭的問句，簡答用 there is。"}, {"t": "Yes, it is.", "ok": false, "fb": "問句用了 Is there，簡答也要用 there。"}, {"t": "Yes, I do.", "ok": false, "fb": "問句不是用助動詞 do 開頭。"}, {"t": "Yes, there has.", "ok": false, "fb": "這個句型用 be 動詞，不用 have。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "Go down this street and you'll see it on your right.", "ok": false, "fb": "這句是對的。go down 是沿著某條路走。"}, {"t": "My father goes to work by a car.", "ok": true, "fb": "這句錯了。by 後面不加冠詞，要寫 by car。"}, {"t": "The hospital is across from the park.", "ok": false, "fb": "這句是對的。across from 是在對面。"}, {"t": "We got on the train at Yilan Station.", "ok": false, "fb": "這句是對的。上車用 get on。"}]}, {"q": "A: ____ me. How ____ I get to the night market?　B: Take the MRT and get off at the next stop.", "opts": [{"t": "Excuse / can", "ok": true, "fb": "問路先說 Excuse me；問怎麼去用 How can I get to。"}, {"t": "Sorry / can", "ok": false, "fb": "向陌生人搭話用 Excuse me，Sorry 是道歉用的。"}, {"t": "Excuse / do", "ok": false, "fb": "這個固定問法是 How can I get to，不用 do。"}, {"t": "Excuse / will", "ok": false, "fb": "問路的固定說法用 can，不用 will。"}]}]}, {"id": "future", "title": "未來式", "unit": "第三冊 Unit 8 · B3 L5–6", "points": "<p>未來式有兩種說法，意思相近但語感不同：<strong>will 用在當下決定或預測，be going to 用在早就計畫好的事</strong>。</p><h3>兩種句型</h3><table><tr><th>句型</th><th>結構</th><th>例子</th></tr><tr><td class=\"en\">will</td><td class=\"en\">will + 原形</td><td class=\"en\">I <span class=\"k1\">will call</span> you later.</td></tr><tr><td class=\"en\">be going to</td><td class=\"en\">am/is/are going to + 原形</td><td class=\"en\">I <span class=\"k2\">am going to visit</span> Japan.</td></tr></table><p class=\"en\">電話響了 → I <span class=\"k1\">will</span> answer it.　（當下才決定）<br>機票買好了 → I <span class=\"k2\">am going to</span> fly to Japan.　（早就計畫）</p><h3>否定與疑問</h3><p class=\"en\">否定：I <span class=\"k1\">won't</span> go.　<span class=\"bad\">willn't</span>　<span class=\"bad\">don't will</span><br>疑問：<span class=\"k1\">Will</span> you be at home? → Yes, I <span class=\"k1\">will</span>. / No, I <span class=\"k1\">won't</span>.<br>　　　<span class=\"k2\">Are</span> you <span class=\"k2\">going to</span> watch the game?</p><h3>will 後面一定是原形</h3><p class=\"en\">Ted <span class=\"k1\">will be</span> fourteen next month.　<span class=\"bad\">will is</span><br>She <span class=\"k1\">will go</span> to Japan.　<span class=\"bad\">will goes</span></p><h3>時間子句裡不用未來式</h3><p class=\"en\">I will call you <span class=\"k3\">when I get home</span>.　<span class=\"bad\">when I will get home</span></p><p style=\"color:var(--muted);font-size:17px\">when、before、after 這類時間子句裡，<strong>用現在式代替未來式</strong>。主要子句才用 will。</p><h3>常見的時間提示</h3><p class=\"en\"><span class=\"k2\">tomorrow　next week　next year　soon　later　tonight</span></p>", "questions": [{"q": "Don't worry about the report. I ____ help you with it.", "opts": [{"t": "will", "ok": true, "fb": "當下才決定要幫忙，用 will。"}, {"t": "am going to", "ok": false, "fb": "be going to 用在早就計畫好的事，這裡是聽到對方煩惱才決定幫忙。"}, {"t": "help", "ok": false, "fb": "這句在講未來要做的事，要加未來式。"}, {"t": "will to", "ok": false, "fb": "will 後面直接接原形，不加 to。"}]}, {"q": "I ____ go to the party tonight. I have too much homework.", "opts": [{"t": "won't", "ok": true, "fb": "will 的否定縮寫是 won't。"}, {"t": "willn't", "ok": false, "fb": "沒有這種拼法，will not 的縮寫是 won't。"}, {"t": "don't will", "ok": false, "fb": "will 本身就是助動詞，不需要再加 don't。"}, {"t": "am not will", "ok": false, "fb": "will 前面不加 be 動詞。"}]}, {"q": "Ted ____ fifteen years old next month. His family will have a party for him.", "opts": [{"t": "will is", "ok": false, "fb": "will 後面一定接動詞原形，is 要改成 be。"}, {"t": "will be", "ok": true, "fb": "will 後面接原形，be 動詞的原形是 be。"}, {"t": "is", "ok": false, "fb": "next month 表示未來，要用未來式。"}, {"t": "will was", "ok": false, "fb": "will 後面接原形，不接過去式。"}]}, {"q": "A: Will you be at home this evening?　B: ____ I have to go to my aunt's house.", "opts": [{"t": "Yes, I will.", "ok": false, "fb": "後面說要去阿姨家，表示不在家。"}, {"t": "No, I won't.", "ok": true, "fb": "要去阿姨家表示不在家，Will 開頭的問句用 won't 否定簡答。"}, {"t": "No, I don't.", "ok": false, "fb": "問句用 Will 開頭，簡答也要用 will 或 won't。"}, {"t": "No, I'm not.", "ok": false, "fb": "問句沒有用 be 動詞當助動詞。"}]}, {"q": "A: What ____ you ____ do this weekend?　B: I'm going to visit my grandparents.", "opts": [{"t": "are / going to", "ok": true, "fb": "回答用了 be going to，問句也用同樣的句型。"}, {"t": "will / going to", "ok": false, "fb": "going to 前面要用 be 動詞，不是 will。"}, {"t": "do / going to", "ok": false, "fb": "be going to 的疑問句要把 be 動詞提前。"}, {"t": "are / go to", "ok": false, "fb": "固定句型是 be going to，不是 be go to。"}]}, {"q": "I will give you a call when I ____ to the station.", "opts": [{"t": "will get", "ok": false, "fb": "when 引導的時間子句裡不用未來式，用現在式代替。"}, {"t": "get", "ok": true, "fb": "時間子句用現在式代替未來式，主要子句才用 will。"}, {"t": "got", "ok": false, "fb": "整句講的是未來的事，不用過去式。"}, {"t": "am getting", "ok": false, "fb": "這裡用現在簡單式就可以了。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "She will goes to Japan next summer.", "ok": true, "fb": "這句錯了。will 後面接原形，應該是 will go。"}, {"t": "They are going to move to Taipei.", "ok": false, "fb": "這句是對的。be going to 後面接原形。"}, {"t": "It won't rain tomorrow.", "ok": false, "fb": "這句是對的。won't 後面接原形。"}, {"t": "We will be back before six.", "ok": false, "fb": "這句是對的。will 後面用 be 動詞的原形。"}]}, {"q": "A: The phone is ringing!　B: OK, I ____ answer it.　A: Thanks. I ____ cook dinner now, so I can't.", "opts": [{"t": "will / am going to", "ok": true, "fb": "接電話是當下決定用 will；準備煮晚餐是本來就要做的事，用 be going to。"}, {"t": "am going to / will", "ok": false, "fb": "兩個放反了。聽到電話響才決定去接，是當下的決定。"}, {"t": "will / will", "ok": false, "fb": "後半是本來就要做的事，用 be going to 更貼切。"}, {"t": "answer / am going to", "ok": false, "fb": "前半在講接下來要做的事，要用未來式。"}]}]}, {"id": "weather", "title": "詢問天氣的用法", "unit": "第三冊 Unit 8 · B3 L5–6", "points": "<p>天氣題的兩個考點：<strong>問句的固定說法</strong>，以及<strong>天氣字的名詞和形容詞不一樣</strong>。</p><h3>兩種問法，意思一樣</h3><p class=\"en\"><span class=\"k1\">How's the weather</span> in Yilan?<br><span class=\"k1\">What's the weather like</span> in Yilan?<br>→ <span class=\"k2\">It's</span> rainy and cool.</p><p style=\"color:var(--muted);font-size:17px\">注意 What's the weather <strong>like</strong> 不能少掉 like，而 How's the weather 不能加 like。</p><h3>名詞變形容詞：加 -y</h3><table><tr><th>名詞</th><th>形容詞</th></tr><tr><td class=\"en\">rain（雨）</td><td class=\"en\">rain<span class=\"k2\">y</span></td></tr><tr><td class=\"en\">wind（風）</td><td class=\"en\">wind<span class=\"k2\">y</span></td></tr><tr><td class=\"en\">cloud（雲）</td><td class=\"en\">cloud<span class=\"k2\">y</span></td></tr><tr><td class=\"en\">snow（雪）</td><td class=\"en\">snow<span class=\"k2\">y</span></td></tr><tr><td class=\"en\">sun（太陽）</td><td class=\"en\">sun<span class=\"k2\">ny</span>（n 要重複）</td></tr></table><h3>It's raining 和 It's rainy</h3><p class=\"en\">It <span class=\"k1\">is raining</span> now.　→ rain 當<strong>動詞</strong>，現在正在下<br>It <span class=\"k2\">is rainy</span> today.　→ rainy 當<strong>形容詞</strong>，形容今天的天氣</p><p class=\"en\"><span class=\"bad\">It's rain today.</span>　→ 要用形容詞 rainy</p><h3>冷熱的形容詞</h3><p class=\"en\"><span class=\"k3\">hot</span>（熱）　<span class=\"k3\">warm</span>（溫暖）　<span class=\"k3\">cool</span>（涼爽）　<span class=\"k3\">cold</span>（冷）</p>", "questions": [{"q": "A: ____ the weather like in Taipei today?　B: It's cloudy and cool.", "opts": [{"t": "What's", "ok": true, "fb": "What's the weather like 是固定問法，不能少掉 like。"}, {"t": "How's", "ok": false, "fb": "How's the weather 後面不加 like，兩種問法不能混用。"}, {"t": "How is it", "ok": false, "fb": "這樣問文法不通，問天氣要用 How is the weather 或 What is the weather like。"}, {"t": "What", "ok": false, "fb": "少了 be 動詞，應該是 What's 或 What is。"}]}, {"q": "A: ____ the weather in Yilan?　B: It's rainy almost every day in winter.", "opts": [{"t": "What's", "ok": false, "fb": "用 What's 的話句尾要加 like，這句沒有 like。"}, {"t": "How's", "ok": true, "fb": "How's the weather 後面不加 like，直接問。"}, {"t": "How's like", "ok": false, "fb": "How's 後面不加 like。"}, {"t": "What like", "ok": false, "fb": "語序不對，應該是 What's the weather like。"}]}, {"q": "Look outside! It's ____ hard. Don't forget your umbrella.", "opts": [{"t": "rain", "ok": false, "fb": "be 動詞後面要接形容詞或 V-ing，不能接原形動詞。"}, {"t": "raining", "ok": true, "fb": "Look! 表示現在正在下，rain 當動詞用進行式。"}, {"t": "rainy", "ok": false, "fb": "rainy 是形容詞，後面不能接 hard 這個副詞。"}, {"t": "rained", "ok": false, "fb": "Look outside 表示現在正在發生。"}]}, {"q": "It was very ____ yesterday. My umbrella almost flew away.", "opts": [{"t": "wind", "ok": false, "fb": "wind 是名詞，要用形容詞 windy。"}, {"t": "windy", "ok": true, "fb": "形容天氣要用形容詞，wind 加 y 變成 windy。"}, {"t": "winding", "ok": false, "fb": "沒有這種天氣形容詞。"}, {"t": "winds", "ok": false, "fb": "這是名詞的複數，不能用來形容天氣。"}]}, {"q": "It's a beautiful day today. It's ____ and warm.", "opts": [{"t": "suny", "ok": false, "fb": "拼錯了。sun 加 y 時 n 要重複，寫成 sunny。"}, {"t": "sunny", "ok": true, "fb": "sun 變形容詞時要重複 n，再加 y。"}, {"t": "sun", "ok": false, "fb": "sun 是名詞，形容天氣要用 sunny。"}, {"t": "sunning", "ok": false, "fb": "沒有這種天氣形容詞，正確是 sunny。"}]}, {"q": "A: How's the weather in Yilan in winter?　B: ____", "opts": [{"t": "It's Monday.", "ok": false, "fb": "這是回答星期幾的答案。"}, {"t": "It's cold and rainy.", "ok": true, "fb": "問天氣就回答天氣狀況。"}, {"t": "It's five o'clock.", "ok": false, "fb": "這是回答時間的答案。"}, {"t": "Yes, it is.", "ok": false, "fb": "疑問詞開頭的問句不能用 Yes / No 回答。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "It's snowy on the mountain today.", "ok": fals
