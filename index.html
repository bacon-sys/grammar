e, "fb": "這句是對的。snow 加 y 變成形容詞。"}, {"t": "It's rain in Taipei now.", "ok": true, "fb": "這句錯了。要寫 It's raining 或 It's rainy。"}, {"t": "What's the weather like tomorrow?", "ok": false, "fb": "這句是對的。What's 的問法要加 like。"}, {"t": "It was cloudy all day yesterday.", "ok": false, "fb": "這句是對的。cloudy 是形容詞，配過去式 was。"}]}, {"q": "A: ____ was the weather like last weekend?　B: It ____ really hot, so we stayed home.", "opts": [{"t": "What / was", "ok": true, "fb": "What... like 的問法；last weekend 是過去，be 動詞用 was。"}, {"t": "How / was", "ok": false, "fb": "句尾有 like，疑問詞要用 What。"}, {"t": "What / is", "ok": false, "fb": "last weekend 表示過去，be 動詞要用 was。"}, {"t": "How / is", "ok": false, "fb": "句尾有 like 要用 What，而且時態也錯了。"}]}]}, {"id": "ditransitive", "title": "授與動詞", "unit": "第四冊 Unit 9 · B4 L1–2", "points": "<p>授與動詞就是「<strong>給誰什麼東西</strong>」的動詞。它後面可以接兩個受詞，而且有兩種排法。</p><h3>兩種寫法，意思一樣</h3><div class=\"formula\"><span class=\"tag k1\">動詞</span><span class=\"plus\">+</span><span class=\"tag k0\">人</span><span class=\"plus\">+</span><span class=\"tag k2\">物</span></div><div class=\"formula\"><span class=\"tag k1\">動詞</span><span class=\"plus\">+</span><span class=\"tag k2\">物</span><span class=\"plus\">+</span><span class=\"tag k3\">to / for</span><span class=\"plus\">+</span><span class=\"tag k0\">人</span></div><p class=\"en\">He gave <span class=\"k0\">me</span> <span class=\"k2\">a book</span>.<br>He gave <span class=\"k2\">a book</span> <span class=\"k3\">to</span> <span class=\"k0\">me</span>.</p><p style=\"color:var(--muted);font-size:17px\">換成第二種寫法時，<strong>介系詞不能漏掉</strong>，而且人要用受格。</p><h3>用 to 還是 for？</h3><table><tr><th>介系詞</th><th>動詞</th><th>概念</th></tr><tr><td class=\"en\"><span class=\"k1\">to</span></td><td class=\"en\">give, send, show,<br>teach, tell, write, lend, pass</td><td>東西從我這裡「傳到」對方</td></tr><tr><td class=\"en\"><span class=\"k2\">for</span></td><td class=\"en\">buy, make, cook, get, sing</td><td>我「為了」對方做這件事</td></tr></table><p class=\"en\">My mom made <span class=\"k2\">a cake</span> <span class=\"k2\">for</span> me.　<span class=\"bad\">made a cake to me</span><br>She sent <span class=\"k1\">a letter</span> <span class=\"k1\">to</span> me.　<span class=\"bad\">sent a letter for me</span></p><h3>人換成代名詞時</h3><p class=\"en\">He gave <span class=\"k0\">me</span> a book.　<span class=\"bad\">gave I a book</span></p><p>人的位置一律用受格：me、him、her、us、them。</p>", "questions": [{"q": "My grandmother gave ____ a red envelope on Chinese New Year.", "opts": [{"t": "I", "ok": false, "fb": "動詞後面的人要用受格，I 是主格。"}, {"t": "me", "ok": true, "fb": "授與動詞後面的人要用受格 me。"}, {"t": "my", "ok": false, "fb": "my 是所有格形容詞，後面要接名詞。"}, {"t": "mine", "ok": false, "fb": "mine 是所有格代名詞，意思是「我的東西」。"}]}, {"q": "Ted showed his new comic book ____ his classmates.", "opts": [{"t": "for", "ok": false, "fb": "show 是把東西拿給對方看，東西傳到對方那裡，要用 to。"}, {"t": "to", "ok": true, "fb": "show 屬於用 to 的那一組。"}, {"t": "with", "ok": false, "fb": "這個句型只會用 to 或 for。"}, {"t": "不填", "ok": false, "fb": "東西放在前面時，後面的人前面一定要有介系詞。"}]}, {"q": "My mother made a birthday cake ____ me yesterday.", "opts": [{"t": "to", "ok": false, "fb": "make 是「為了某人做」，要用 for。"}, {"t": "for", "ok": true, "fb": "make、buy、cook 這類「為某人做某事」的動詞用 for。"}, {"t": "at", "ok": false, "fb": "這個句型只會用 to 或 for。"}, {"t": "不填", "ok": false, "fb": "東西放在人前面時，人前面必須有介系詞。"}]}, {"q": "Could you please pass ____ ?", "opts": [{"t": "me the salt", "ok": true, "fb": "動詞後面先接人再接物，兩個受詞中間不加介系詞。"}, {"t": "the salt me", "ok": false, "fb": "物放前面時，人的前面要加介系詞，寫成 the salt to me。"}, {"t": "to me the salt", "ok": false, "fb": "人放在物前面時不加介系詞。"}, {"t": "the salt for me", "ok": false, "fb": "pass 是把東西遞給對方，要用 to 不是 for。"}]}, {"q": "Mr. Lin teaches ____ . He is a very patient teacher.", "opts": [{"t": "English us", "ok": false, "fb": "順序錯了。人放前面是 us English，物放前面要加 to。"}, {"t": "us English", "ok": true, "fb": "動詞後面先人後物，中間不加介系詞。"}, {"t": "English for us", "ok": false, "fb": "teach 屬於用 to 的那一組，不用 for。"}, {"t": "to us English", "ok": false, "fb": "人放在前面時不需要介系詞。"}]}, {"q": "My father bought a new bike ____ my little brother for his birthday.", "opts": [{"t": "to", "ok": false, "fb": "buy 是「為某人買」，要用 for。"}, {"t": "for", "ok": true, "fb": "buy 屬於用 for 的那一組。"}, {"t": "of", "ok": false, "fb": "這個句型只會用 to 或 for。"}, {"t": "不填", "ok": false, "fb": "物放在人前面時，人前面要有介系詞。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "She sent a postcard to her friend in Japan.", "ok": false, "fb": "這句是對的。send 用 to。"}, {"t": "He cooked dinner to his family last night.", "ok": true, "fb": "這句錯了。cook 是為某人做菜，要用 for his family。"}, {"t": "Please give me your phone number.", "ok": false, "fb": "這句是對的。人在前、物在後，中間不加介系詞。"}, {"t": "My sister wrote a letter to her teacher.", "ok": false, "fb": "這句是對的。write 用 to。"}]}, {"q": "Amy showed her drawing ____ , and then she gave ____ as a gift.", "opts": [{"t": "to me / it to me", "ok": true, "fb": "物放前面時人前要加 to；第二個空格的物是代名詞 it，也要放在人前面加 to。"}, {"t": "me / me it", "ok": false, "fb": "第一個空格的物已經放前面了，人前面要加 to。"}, {"t": "for me / it for me", "ok": false, "fb": "show 和 give 都屬於用 to 的那一組。"}, {"t": "to me / me it", "ok": false, "fb": "前半對了，但後半的順序怪怪的，應該是 gave it to me。"}]}]}, {"id": "linking-verbs", "title": "連綴動詞", "unit": "第四冊 Unit 9 · B4 L1–2", "points": "<p>連綴動詞不是在講「做什麼動作」，而是在<strong>描述主詞的狀態</strong>。所以它後面接的是<strong>形容詞，不是副詞</strong>。</p><h3>常見的連綴動詞</h3><table><tr><th>動詞</th><th>意思</th><th>例子</th></tr><tr><td class=\"en\">look</td><td>看起來</td><td class=\"en\">You <span class=\"k1\">look</span> <span class=\"k2\">tired</span>.</td></tr><tr><td class=\"en\">sound</td><td>聽起來</td><td class=\"en\">That <span class=\"k1\">sounds</span> <span class=\"k2\">great</span>.</td></tr><tr><td class=\"en\">taste</td><td>嚐起來</td><td class=\"en\">It <span class=\"k1\">tastes</span> <span class=\"k2\">sweet</span>.</td></tr><tr><td class=\"en\">smell</td><td>聞起來</td><td class=\"en\">It <span class=\"k1\">smells</span> <span class=\"k2\">good</span>.</td></tr><tr><td class=\"en\">feel</td><td>感覺</td><td class=\"en\">I <span class=\"k1\">feel</span> <span class=\"k2\">happy</span>.</td></tr><tr><td class=\"en\">become / get</td><td>變得</td><td class=\"en\">It <span class=\"k1\">becomes</span> <span class=\"k2\">cold</span>.</td></tr></table><h3>後面接形容詞，不接副詞</h3><p class=\"en\">You look <span class=\"k2\">tired</span>.　<span class=\"bad\">look tiredly</span><br>It sounds <span class=\"k2\">good</span>.　<span class=\"bad\">sounds well</span></p><p style=\"color:var(--muted);font-size:17px\">判斷方法：把連綴動詞換成 be 動詞，句子意思還通，就表示後面要接形容詞。<span class=\"en\">You look tired. ≈ You are tired.</span></p><h3>後面要接名詞時，加 like</h3><p class=\"en\">She looks <span class=\"k2\">young</span>.　→ 接形容詞<br>She looks <span class=\"k3\">like</span> <span class=\"k2\">her mother</span>.　→ 接名詞要加 like</p><p class=\"en\"><span class=\"bad\">She looks her mother.</span>　<span class=\"bad\">It sounds like great.</span></p><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">The cake tastes well.</span>　→ 要用形容詞 good</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">He looks like sad.</span>　→ 接形容詞不加 like</p></div>", "questions": [{"q": "You ____ today. Did you sleep well last night?", "opts": [{"t": "look tiredly", "ok": false, "fb": "look 是連綴動詞，後面接形容詞不接副詞。"}, {"t": "look tired", "ok": true, "fb": "連綴動詞 look 後面接形容詞 tired。"}, {"t": "look like tired", "ok": false, "fb": "後面接形容詞時不加 like。"}, {"t": "looks tired", "ok": false, "fb": "主詞是 You，動詞不加 s。"}]}, {"q": "A: Let's go to the night market tonight.　B: That ____ ! I'm in.", "opts": [{"t": "sounds great", "ok": true, "fb": "sound 是連綴動詞，後面接形容詞 great。"}, {"t": "sounds greatly", "ok": false, "fb": "連綴動詞後面接形容詞，不接副詞。"}, {"t": "sounds like great", "ok": false, "fb": "great 是形容詞，前面不加 like。"}, {"t": "sound great", "ok": false, "fb": "主詞 That 是第三人稱單數，動詞要加 s。"}]}, {"q": "This soup ____ . Did you put too much salt in it?", "opts": [{"t": "tastes salty", "ok": true, "fb": "taste 是連綴動詞，後面接形容詞 salty。"}, {"t": "tastes saltily", "ok": false, "fb": "連綴動詞後面要用形容詞。"}, {"t": "taste salty", "ok": false, "fb": "主詞 This soup 是單數，動詞要加 s。"}, {"t": "tastes like salty", "ok": false, "fb": "salty 是形容詞，前面不加 like。"}]}, {"q": "Judy ____ her mother. They have the same eyes and smile.", "opts": [{"t": "looks", "ok": false, "fb": "後面接的是名詞 her mother，要加 like。"}, {"t": "looks like", "ok": true, "fb": "連綴動詞後面接名詞時要加 like。"}, {"t": "looks as", "ok": false, "fb": "這個用法固定是 look like。"}, {"t": "look like", "ok": false, "fb": "主詞 Judy 是第三人稱單數，動詞要加 s。"}]}, {"q": "Something ____ in the kitchen. Is Mom baking cookies?", "opts": [{"t": "smells good", "ok": true, "fb": "smell 是連綴動詞，後面接形容詞 good。"}, {"t": "smells well", "ok": false, "fb": "well 是副詞，連綴動詞後面要用形容詞 good。"}, {"t": "smell good", "ok": false, "fb": "Something 當主詞視為單數，動詞要加 s。"}, {"t": "is smelling good", "ok": false, "fb": "連綴動詞通常不用進行式。"}]}, {"q": "It ____ cold in the evening. You should take a jacket with you.", "opts": [{"t": "gets", "ok": true, "fb": "get 當連綴動詞是「變得」，後面接形容詞。"}, {"t": "gets to", "ok": false, "fb": "get to 是「到達」，後面接地點。"}, {"t": "get", "ok": false, "fb": "主詞 It 是第三人稱單數，動詞要加 s。"}, {"t": "gets like", "ok": false, "fb": "cold 是形容詞，前面不加 like。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "The music sounds beautiful.", "ok": false, "fb": "這句是對的。連綴動詞後面接形容詞。"}, {"t": "I feel happy about the good news.", "ok": false, "fb": "這句是對的。feel 後面接形容詞。"}, {"t": "These cookies taste well.", "ok": true, "fb": "這句錯了。well 是副詞，應該用形容詞 good。"}, {"t": "He looks like a basketball player.", "ok": false, "fb": "這句是對的。後面是名詞，要加 like。"}]}, {"q": "Amy ____ sad today, and she also ____ her sister when she's upset.", "opts": [{"t": "looks / sounds like", "ok": true, "fb": "sad 是形容詞不加 like；her sister 是名詞要加 like。"}, {"t": "looks like / sounds", "ok": false, "fb": "兩個放反了。形容詞前不加 like，名詞前才要加。"}, {"t": "looks like / sounds like", "ok": false, "fb": "sad 是形容詞，前面不加 like。"}, {"t": "looks / sounds", "ok": false, "fb": "後半接的是名詞 her sister，要加 like。"}]}]}, {"id": "if-clause", "title": "if 條件句", "unit": "第四冊 Unit 9 · B4 L1–2", "points": "<p>if 條件句講的是「<strong>如果⋯⋯就會⋯⋯</strong>」。整個主題只有一條核心規則，但考得非常密集。</p><h3>核心規則：前現在、後未來</h3><div class=\"formula\"><span class=\"tag k1\">If + 現在簡單式</span><span class=\"plus\">,</span><span class=\"tag k2\">will + 原形</span></div><p class=\"en\"><span class=\"k1\">If it rains</span> tomorrow, <span class=\"k2\">I will stay</span> home.</p><p style=\"color:var(--muted);font-size:17px\">雖然講的是明天的事，但 <strong>if 的那一半不能用 will</strong>。這是這個主題唯一也是最重要的考點。</p><p class=\"en\"><span class=\"bad\">If it will rain tomorrow, I will stay home.</span></p><h3>兩種順序都可以</h3><p class=\"en\"><span class=\"k1\">If you study hard</span>, you <span class=\"k2\">will pass</span> the test.<br>You <span class=\"k2\">will pass</span> the test <span class=\"k1\">if you study hard</span>.</p><p>if 子句放句首要加逗號，放句尾不用。</p><h3>主要子句也可以是祈使句或助動詞</h3><p class=\"en\">If you <span class=\"k1\">are</span> tired, <span class=\"k2\">take</span> a rest.<br>If you <span class=\"k1\">don't hurry</span>, you <span class=\"k2\">may miss</span> the bus.</p><h3>和 when 的差別</h3><p class=\"en\"><span class=\"k3\">If</span> it rains, we won't go.　→ 會不會下雨還不知道<br><span class=\"k3\">When</span> I get home, I will call you.　→ 一定會到家，只是時間問題</p><p>if 是「不確定會不會發生」，when 是「一定會發生」。兩者後面都用現在式。</p><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">If he will come, I will be happy.</span>　→ if 子句用現在式</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">If it rains, I stay home.</span>　→ 主要子句要用 will</p></div>", "questions": [{"q": "If it ____ tomorrow, we will cancel the picnic.", "opts": [{"t": "will rain", "ok": false, "fb": "if 子句裡不用未來式，要用現在簡單式。"}, {"t": "rains", "ok": true, "fb": "雖然講的是明天，但 if 子句要用現在簡單式。"}, {"t": "rained", "ok": false, "fb": "講的是明天的事，不用過去式。"}, {"t": "is raining", "ok": false, "fb": "這裡用現在簡單式就可以了。"}]}, {"q": "If you study hard, you ____ the exam next week.", "opts": [{"t": "pass", "ok": false, "fb": "主要子句要用未來式，加上 will。"}, {"t": "will pass", "ok": true, "fb": "if 子句用現在式，主要子句用 will + 原形。"}, {"t": "passed", "ok": false, "fb": "next week 是未來的事。"}, {"t": "will passes", "ok": false, "fb": "will 後面接動詞原形，不加 s。"}]}, {"q": "We ____ go hiking if the weather ____ nice this Sunday.", "opts": [{"t": "will / is", "ok": true, "fb": "主要子句用 will，if 子句用現在式。"}, {"t": "will / will be", "ok": false, "fb": "if 子句不用未來式，要用現在式 is。"}, {"t": "are / is", "ok": false, "fb": "主要子句講的是這個星期天的計畫，要用 will。"}, {"t": "will / was", "ok": false, "fb": "this Sunday 是未來，不用過去式。"}]}, {"q": "If you ____ tired, ____ a short rest.", "opts": [{"t": "are / take", "ok": true, "fb": "if 子句用現在式；主要子句是祈使句，用動詞原形。"}, {"t": "will be / take", "ok": false, "fb": "if 子句不用未來式。"}, {"t": "are / will take", "ok": false, "fb": "這裡是在給建議，用祈使句比較自然。"}, {"t": "are / taking", "ok": false, "fb": "祈使句要用動詞原形開頭。"}]}, {"q": "If you ____ now, you may miss the school bus.", "opts": [{"t": "won't hurry", "ok": false, "fb": "if 子句的否定用 don't，不用 won't。"}, {"t": "don't hurry", "ok": true, "fb": "if 子句用現在簡單式，否定用 don't。"}, {"t": "didn't hurry", "ok": false, "fb": "講的是現在和接下來的事，不用過去式。"}, {"t": "not hurry", "ok": false, "fb": "否定要用助動詞 don't。"}]}, {"q": "I ____ call you ____ I get to the airport. My flight lands at six.", "opts": [{"t": "will / when", "ok": true, "fb": "一定會到機場，所以用 when；主要子句用 will，時間子句用現在式。"}, {"t": "will / if", "ok": false, "fb": "班機會降落是確定的事，用 when 比 if 合適。"}, {"t": "am / when", "ok": false, "fb": "主要子句講的是未來要做的事，要用 will。"}, {"t": "will / because", "ok": false, "fb": "這裡在講時間先後，不是在說原因。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "If he comes, I will tell him the news.", "ok": false, "fb": "這句是對的。if 子句用現在式，主要子句用 will。"}, {"t": "If it will snow tomorrow, we won't go out.", "ok": true, "fb": "這句錯了。if 子句不能用未來式，要改成 If it snows。"}, {"t": "You will be late if you don't leave now.", "ok": false, "fb": "這句是對的。if 子句放句尾不加逗號。"}, {"t": "If you are hungry, eat something first.", "ok": false, "fb": "這句是對的。主要子句可以是祈使句。"}]}, {"q": "If Ted ____ to the party, Amy ____ very happy. But he isn't sure yet.", "opts": [{"t": "comes / will be", "ok": true, "fb": "if 子句用現在式且主詞是第三人稱單數要加 s；主要子句用 will be。"}, {"t": "will come / will be", "ok": false, "fb": "if 子句不用未來式。"}, {"t": "come / will be", "ok": false, "fb": "主詞 Ted 是第三人稱單數，動詞要加 s。"}, {"t": "comes / is", "ok": false, "fb": "主要子句講的是如果發生後的結果，要用 will。"}]}]}, {"id": "compound-pronouns", "title": "複合不定代名詞", "unit": "第四冊 Unit 9 · B4 L1–2", "points": "<p>這類字由 <span class=\"en\">some / any / no / every</span> 加上 <span class=\"en\">thing / one / body</span> 組成，用來指<strong>不特定的人或東西</strong>。</p><h3>組合表</h3><table><tr><th></th><th>東西</th><th>人</th></tr><tr><td>某個</td><td class=\"en\">something</td><td class=\"en\">someone / somebody</td></tr><tr><td>任何（否定、疑問）</td><td class=\"en\">anything</td><td class=\"en\">anyone / anybody</td></tr><tr><td>沒有任何</td><td class=\"en\">nothing</td><td class=\"en\">no one / nobody</td></tr><tr><td>每個、全部</td><td class=\"en\">everything</td><td class=\"en\">everyone / everybody</td></tr></table><h3>規則一：一律當單數</h3><p class=\"en\"><span class=\"k1\">Everyone is</span> here.　<span class=\"bad\">Everyone are here.</span><br><span class=\"k1\">Something is</span> wrong.　<span class=\"bad\">Something are wrong.</span></p><p style=\"color:var(--muted);font-size:17px\">就算 everyone 感覺是很多人，文法上仍然是單數，動詞要加 s。</p><h3>規則二：形容詞放後面</h3><p class=\"en\">I want to eat something <span class=\"k2\">special</span>.　<span class=\"bad\">special something</span><br>Is there anything <span class=\"k2\">new</span>?</p><p>一般形容詞放名詞前面，但這類字的形容詞要放<strong>後面</strong>。</p><h3>規則三：some 系列用肯定，any 系列用否定和疑問</h3><p class=\"en\">I have <span class=\"k1\">something</span> to tell you.<br>I don't have <span class=\"k3\">anything</span> to do.<br>Is there <span class=\"k3\">anyone</span> in the room?</p><h3>nothing 本身就是否定</h3><p class=\"en\">I have <span class=\"k2\">nothing</span> to say.　= I <span class=\"k3\">don't</span> have <span class=\"k3\">anything</span> to say.<br><span class=\"bad\">I don't have nothing to say.</span></p><p>一個句子裡不能有兩個否定。</p>", "questions": [{"q": "Everyone in my class ____ ready for the English test.", "opts": [{"t": "are", "ok": false, "fb": "Everyone 文法上當單數看，要用 is。"}, {"t": "is", "ok": true, "fb": "everyone 雖然指很多人，文法上是單數主詞。"}, {"t": "were", "ok": false, "fb": "everyone 是單數，而且句子講的是現在。"}, {"t": "be", "ok": false, "fb": "be 是原形，句子裡要用 is。"}]}, {"q": "I'm hungry. I want to eat ____ .", "opts": [{"t": "something hot", "ok": true, "fb": "這類字的形容詞要放在後面。"}, {"t": "hot something", "ok": false, "fb": "位置錯了。something 的形容詞放後面。"}, {"t": "anything hot", "ok": false, "fb": "這是肯定句，用 something。"}, {"t": "nothing hot", "ok": false, "fb": "意思會變成不想吃東西，和肚子餓矛盾。"}]}, {"q": "I looked everywhere, but I didn't find ____ .", "opts": [{"t": "something", "ok": false, "fb": "這是否定句，要用 anything。"}, {"t": "anything", "ok": true, "fb": "否定句裡用 anything。"}, {"t": "nothing", "ok": false, "fb": "句子已經有 didn't 了，再用 nothing 會變成雙重否定。"}, {"t": "everything", "ok": false, "fb": "意思會變成「沒找到全部」，和句意不合。"}]}, {"q": "A: Is there ____ at the door?　B: No, I don't hear anything.", "opts": [{"t": "someone", "ok": false, "fb": "疑問句通常用 anyone。"}, {"t": "anyone", "ok": true, "fb": "疑問句裡用 anyone。"}, {"t": "no one", "ok": false, "fb": "問句不會用 no one 來問。"}, {"t": "everyone", "ok": false, "fb": "門口不會是「每個人」，這裡問的是有沒有人。"}]}, {"q": "____ was in the classroom. All the students went to the playground.", "opts": [{"t": "No one", "ok": true, "fb": "後面說學生都去操場了，表示教室裡一個人也沒有。"}, {"t": "Everyone", "ok": false, "fb": "後面說學生都去操場，教室裡不會有每個人。"}, {"t": "Anyone", "ok": false, "fb": "anyone 不會放在句首當肯定句的主詞。"}, {"t": "Someone", "ok": false, "fb": "後面說學生都去操場了，和「有某個人在」矛盾。"}]}, {"q": "I have ____ to tell you. Can we talk after class?", "opts": [{"t": "something important", "ok": true, "fb": "這是肯定句用 something，形容詞放後面。"}, {"t": "important something", "ok": false, "fb": "形容詞要放在 something 後面。"}, {"t": "anything important", "ok": false, "fb": "這是肯定句，用 something。"}, {"t": "nothing important", "ok": false, "fb": "意思會變成沒什麼重要的事，和「想談一談」矛盾。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "Everybody likes the new teacher.", "ok": false, "fb": "這句是對的。Everybody 當單數，動詞加 s。"}, {"t": "I don't have nothing to say.", "ok": true, "fb": "這句錯了。一句話不能有兩個否定，要改成 anything 或拿掉 don't。"}, {"t": "Is there anything wrong with your phone?", "ok": false, "fb": "這句是對的。疑問句用 anything，形容詞放後面。"}, {"t": "Nobody knows the answer.", "ok": false, "fb": "這句是對的。Nobody 本身就是否定，動詞用肯定形式。"}]}, {"q": "____ wrong with the computer. ____ can turn it on.", "opts": [{"t": "Something is / No one", "ok": true, "fb": "something 當單數主詞配 is；沒有人能開機用 No one。"}, {"t": "Something are / No one", "ok": false, "fb": "something 是單數，要用 is。"}, {"t": "Anything is / Everyone", "ok": false, "fb": "肯定句用 something；而且如果每個人都能開機就不算故障。"}, {"t": "Something is / Anyone", "ok": false, "fb": "前半對了，但 anyone 不能放在句首當肯定句的主詞。"}]}]}, {"id": "adj-degree", "title": "形容詞的級", "unit": "第四冊 Unit 10 · B4 L3–4", "points": "<p>形容詞有三個等級：<strong>原級</strong>（一樣）、<strong>比較級</strong>（比較）、<strong>最高級</strong>（最）。先看句子裡有沒有 than 或 the，就知道要用哪一級。</p><h3>三個等級的句型</h3><table><tr><th>等級</th><th>句型</th><th>例子</th></tr><tr><td>原級</td><td class=\"en\">as + 原級 + as</td><td class=\"en\">Ted is <span class=\"k1\">as tall as</span> Amy.</td></tr><tr><td>比較級</td><td class=\"en\">比較級 + than</td><td class=\"en\">Ted is <span class=\"k2\">taller than</span> Amy.</td></tr><tr><td>最高級</td><td class=\"en\">the + 最高級</td><td class=\"en\">Ted is <span class=\"k3\">the tallest</span> in our class.</td></tr></table><h3>變化規則</h3><table><tr><th>情況</th><th>比較級</th><th>最高級</th></tr><tr><td>短的形容詞</td><td class=\"en\">tall → tall<span class=\"k2\">er</span></td><td class=\"en\">tall<span class=\"k3\">est</span></td></tr><tr><td>字尾是 e</td><td class=\"en\">nice → nice<span class=\"k2\">r</span></td><td class=\"en\">nice<span class=\"k3\">st</span></td></tr><tr><td>子音 + y</td><td class=\"en\">easy → eas<span class=\"k2\">ier</span></td><td class=\"en\">eas<span class=\"k3\">iest</span></td></tr><tr><td>短母音＋單子音</td><td class=\"en\">hot → ho<span class=\"k2\">tter</span></td><td class=\"en\">ho<span class=\"k3\">ttest</span></td></tr><tr><td>長的形容詞</td><td class=\"en\"><span class=\"k2\">more</span> interesting</td><td class=\"en\"><span class=\"k3\">most</span> interesting</td></tr></table><h3>不規則變化</h3><p class=\"en\">good / well → <span class=\"k1\">better</span> → <span class=\"k1\">best</span><br>bad → <span class=\"k1\">worse</span> → <span class=\"k1\">worst</span><br>many / much → <span class=\"k1\">more</span> → <span class=\"k1\">most</span></p><h3>最高級後面：in 還是 of</h3><p class=\"en\">the tallest <span class=\"k1\">in</span> my class　→ in + 地方、團體<br>the tallest <span class=\"k2\">of</span> the three boys　→ of + 數量、複數</p><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">He is more taller than me.</span>　→ 不能同時用 more 和 -er</p><p class=\"en\"><span class=\"bad\">She is tallest girl.</span>　→ 最高級前面要加 the</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">as taller as</span>　→ as...as 中間用原級</p></div>", "questions": [{"q": "Ted is two years older, so he is ____ than his little brother.", "opts": [{"t": "tall", "ok": false, "fb": "句子裡有 than，要用比較級。"}, {"t": "taller", "ok": true, "fb": "有 than 就用比較級，tall 加 er。"}, {"t": "tallest", "ok": false, "fb": "最高級不會和 than 一起用。"}, {"t": "more tall", "ok": false, "fb": "tall 是短形容詞，直接加 er，不用 more。"}]}, {"q": "Amy is ____ student in our class. She always gets the highest score.", "opts": [{"t": "smarter", "ok": false, "fb": "句子裡沒有 than，而且 in our class 表示範圍，要用最高級。"}, {"t": "the smartest", "ok": true, "fb": "in our class 表示在某個範圍內最⋯⋯，用最高級且前面加 the。"}, {"t": "smartest", "ok": false, "fb": "最高級前面要加 the。"}, {"t": "the most smart", "ok": false, "fb": "smart 是短形容詞，直接加 est。"}]}, {"q": "This book is ____ than the one I read last week.", "opts": [{"t": "interestinger", "ok": false, "fb": "interesting 是長形容詞，不能直接加 er。"}, {"t": "more interesting", "ok": true, "fb": "音節多的長形容詞，比較級用 more。"}, {"t": "most interesting", "ok": false, "fb": "句子裡有 than，要用比較級不是最高級。"}, {"t": "more interestinger", "ok": false, "fb": "more 和 er 不能同時使用。"}]}, {"q": "The food here is ____ than the food at that restaurant.", "opts": [{"t": "gooder", "ok": false, "fb": "good 是不規則變化，比較級是 better。"}, {"t": "better", "ok": true, "fb": "good 的比較級是 better，屬於不規則變化。"}, {"t": "more good", "ok": false, "fb": "good 有自己的不規則變化，不用 more。"}, {"t": "best", "ok": false, "fb": "句子裡有 than，要用比較級。"}]}, {"q": "Ted is ____ his sister. They are both 160 centimeters tall.", "opts": [{"t": "as tall as", "ok": true, "fb": "兩人一樣高，用 as + 原級 + as。"}, {"t": "as taller as", "ok": false, "fb": "as...as 中間要用原級，不用比較級。"}, {"t": "taller than", "ok": false, "fb": "兩個人一樣高，不是比較高。"}, {"t": "as tallest as", "ok": false, "fb": "as...as 中間用原級。"}]}, {"q": "Judy is the youngest ____ the four sisters in her family.", "opts": [{"t": "in", "ok": false, "fb": "後面是「四個姊妹」這種數量，要用 of。"}, {"t": "of", "ok": true, "fb": "最高級後面接數量或複數時用 of。"}, {"t": "at", "ok": false, "fb": "最高級後面只用 in 或 of。"}, {"t": "than", "ok": false, "fb": "than 用在比較級，不用在最高級。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "My bag is heavier than yours.", "ok": false, "fb": "這句是對的。heavy 的 y 前面是子音，改成 ier。"}, {"t": "He runs more faster than me.", "ok": true, "fb": "這句錯了。more 和 er 不能同時用，應該是 faster。"}, {"t": "This is the hottest day of the year.", "ok": false, "fb": "這句是對的。hot 要重複 t 再加 est。"}, {"t": "Math is as difficult as English for me.", "ok": false, "fb": "這句是對的。as...as 中間用原級。"}]}, {"q": "Today is ____ than yesterday, but last Sunday was ____ day of this month.", "opts": [{"t": "hotter / the hottest", "ok": true, "fb": "有 than 用比較級；of this month 表示範圍，用最高級加 the。"}, {"t": "hot / the hottest", "ok": false, "fb": "前半有 than，要用比較級 hotter。"}, {"t": "hotter / hottest", "ok": false, "fb": "前半對了，但最高級前面要加 the。"}, {"t": "the hottest / hotter", "ok": false, "fb": "兩個放反了。有 than 的那半要用比較級。"}]}]}, {"id": "causative", "title": "使役動詞與感官動詞", "unit": "第四冊 Unit 10 · B4 L3–4", "points": "<p>這兩類動詞有一個共同的特徵：<strong>後面接「受詞 + 原形動詞」，中間不加 to</strong>。</p><h3>使役動詞：叫某人做某事</h3><div class=\"formula\"><span class=\"tag k1\">make / let / have</span><span class=\"plus\">+</span><span class=\"tag k0\">人</span><span class=\"plus\">+</span><span class=\"tag k2\">原形動詞</span></div><table><tr><td class=\"en\">make</td><td>強迫、使得</td><td class=\"en\">My mom <span class=\"k1\">made</span> me <span class=\"k2\">clean</span> my room.</td></tr><tr><td class=\"en\">let</td><td>允許</td><td class=\"en\">My dad <span class=\"k1\">lets</span> me <span class=\"k2\">play</span> games.</td></tr><tr><td class=\"en\">have</td><td>請、要求</td><td class=\"en\">I'll <span class=\"k1\">have</span> him <span class=\"k2\">call</span> you.</td></tr></table><h3>感官動詞：看到、聽到某人做某事</h3><div class=\"formula\"><span class=\"tag k1\">see / hear / watch / feel</span><span class=\"plus\">+</span><span class=\"tag k0\">人</span><span class=\"plus\">+</span><span class=\"tag k2\">原形動詞</span></div><p class=\"en\">I <span class=\"k1\">saw</span> Ted <span class=\"k2\">walk</span> into the classroom.<br>I <span class=\"k1\">heard</span> someone <span class=\"k2\">call</span> my name.</p><h3>關鍵：中間不加 to</h3><p class=\"en\">She made me <span class=\"k2\">wait</span>.　<span class=\"bad\">made me to wait</span><br>I saw him <span class=\"k2\">leave</span>.　<span class=\"bad\">saw him to leave</span></p><p style=\"color:var(--muted);font-size:17px\">對照一下：<span class=\"en\">want / ask / tell</span> 這類動詞後面<strong>要加 to</strong>。<br><span class=\"en\">She <span class=\"k3\">told</span> me <span class=\"k3\">to wait</span>.</span></p><h3>help 兩種都可以</h3><p class=\"en\">Can you help me <span class=\"k2\">carry</span> this? = Can you help me <span class=\"k3\">to carry</span> this?</p>", "questions": [{"q": "My mother made me ____ my room before I went out.", "opts": [{"t": "clean", "ok": true, "fb": "使役動詞 make 後面接原形動詞，中間不加 to。"}, {"t": "to clean", "ok": false, "fb": "make 後面不加 to。"}, {"t": "cleaned", "ok": false, "fb": "make 後面接原形，不接過去式。"}, {"t": "cleaning", "ok": false, "fb": "使役動詞後面接原形動詞。"}]}, {"q": "My parents don't let me ____ out alone at night.", "opts": [{"t": "go", "ok": true, "fb": "let 後面接原形動詞。"}, {"t": "to go", "ok": false, "fb": "let 是使役動詞，後面不加 to。"}, {"t": "going", "ok": false, "fb": "let 後面接原形，不接 V-ing。"}, {"t": "goes", "ok": false, "fb": "let 後面用原形，不會有第三人稱單數變化。"}]}, {"q": "I heard someone ____ my name, but when I turned around, nobody was there.", "opts": [{"t": "call", "ok": true, "fb": "感官動詞 hear 後面接原形動詞。"}, {"t": "to call", "ok": false, "fb": "感官動詞後面不加 to。"}, {"t": "calls", "ok": false, "fb": "這個位置用原形動詞。"}, {"t": "to calling", "ok": false, "fb": "感官動詞後面直接接原形。"}]}, {"q": "We watched the children ____ soccer on the playground for an hour.", "opts": [{"t": "to play", "ok": false, "fb": "watch 是感官動詞，後面不加 to。"}, {"t": "play", "ok": true, "fb": "感官動詞 watch 後面接原形動詞。"}, {"t": "plays", "ok": false, "fb": "這個位置要用原形動詞。"}, {"t": "to playing", "ok": false, "fb": "感官動詞後面直接接原形。"}]}, {"q": "Excuse me, can you help me ____ this heavy box to the office?", "opts": [{"t": "carry", "ok": true, "fb": "help 後面接原形或不定詞都可以，carry 是正確的。"}, {"t": "carrying", "ok": false, "fb": "help 後面接原形或 to + 原形，不接 V-ing。"}, {"t": "carried", "ok": false, "fb": "這個位置要用原形。"}, {"t": "to carrying", "ok": false, "fb": "to 後面要接原形動詞。"}]}, {"q": "The teacher ____ us ____ quiet during the test.", "opts": [{"t": "told / to be", "ok": true, "fb": "tell 不是使役動詞，後面要接不定詞。"}, {"t": "told / be", "ok": false, "fb": "tell 後面要加 to，和 make、let 不一樣。"}, {"t": "made / to be", "ok": false, "fb": "make 後面不加 to。"}, {"t": "let / to be", "ok": false, "fb": "let 後面不加 to。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "She made me to wait for an hour.", "ok": true, "fb": "這句錯了。make 後面接原形，應該是 made me wait。"}, {"t": "I saw him leave the classroom.", "ok": false, "fb": "這句是對的。感官動詞後面接原形。"}, {"t": "My father let me use his computer.", "ok": false, "fb": "這句是對的。let 後面接原形。"}, {"t": "He asked me to close the window.", "ok": false, "fb": "這句是對的。ask 後面要接不定詞。"}]}, {"q": "My father made me ____ my homework first, and then he let me ____ TV.", "opts": [{"t": "finish / watch", "ok": true, "fb": "make 和 let 都是使役動詞，後面都接原形動詞。"}, {"t": "to finish / to watch", "ok": false, "fb": "使役動詞後面不加 to。"}, {"t": "finish / to watch", "ok": false, "fb": "前半對了，但 let 後面也不加 to。"}, {"t": "finishing / watching", "ok": false, "fb": "使役動詞後面接原形，不接 V-ing。"}]}]}, {"id": "possessive-reflexive", "title": "所有格代名詞與反身代名詞", "unit": "第四冊 Unit 9–10 · B4", "points": "<p>這兩種代名詞都用來避免重複，但功能完全不同：所有格代名詞代替「<strong>某人的東西</strong>」，反身代名詞代替「<strong>自己</strong>」。</p><h3>所有格代名詞：後面不接名詞</h3><table><tr><th>所有格形容詞</th><th>所有格代名詞</th></tr><tr><td class=\"en\">my book</td><td class=\"en\">mine</td></tr><tr><td class=\"en\">your book</td><td class=\"en\">yours</td></tr><tr><td class=\"en\">his book</td><td class=\"en\">his</td></tr><tr><td class=\"en\">her book</td><td class=\"en\">hers</td></tr><tr><td class=\"en\">our book</td><td class=\"en\">ours</td></tr><tr><td class=\"en\">their book</td><td class=\"en\">theirs</td></tr></table><p class=\"en\">This is <span class=\"k1\">my</span> bag.　→ my 後面接名詞<br>This bag is <span class=\"k2\">mine</span>.　→ mine 後面什麼都不接</p><h3>反身代名詞</h3><table><tr><td class=\"en\">myself</td><td class=\"en\">yourself</td><td class=\"en\">himself</td><td class=\"en\">herself</td></tr><tr><td class=\"en\">itself</td><td class=\"en\">ourselves</td><td class=\"en\">yourselves</td><td class=\"en\">themselves</td></tr></table><p style=\"color:var(--muted);font-size:17px\">單數結尾是 -self，複數結尾是 -selves。</p><h3>反身代名詞的三種用法</h3><table><tr><th>用法</th><th>例子</th></tr><tr><td>受詞和主詞是同一人</td><td class=\"en\">He hurt <span class=\"k1\">himself</span>.</td></tr><tr><td>加強語氣（親自）</td><td class=\"en\">I made it <span class=\"k1\">myself</span>.</td></tr><tr><td class=\"en\">by oneself（獨自）</td><td class=\"en\">She lives <span class=\"k1\">by herself</span>.</td></tr></table><p class=\"en\">He hurt <span class=\"k1\">himself</span>.　→ 傷到的是他自己<br>He hurt <span class=\"k2\">him</span>.　→ 傷到的是別人</p><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">This book is my.</span>　→ 後面沒接名詞要用 mine</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">They enjoyed themself.</span>　→ 複數要用 themselves</p></div>", "questions": [{"q": "That umbrella isn't mine. I think it's ____ .", "opts": [{"t": "her", "ok": false, "fb": "her 後面要接名詞，這裡後面沒有名詞，要用 hers。"}, {"t": "hers", "ok": true, "fb": "後面沒接名詞，用所有格代名詞 hers。"}, {"t": "herself", "ok": false, "fb": "herself 是反身代名詞，不表示「她的東西」。"}, {"t": "she", "ok": false, "fb": "she 是主格，不能表示所有。"}]}, {"q": "Be careful with the knife! Don't cut ____ .", "opts": [{"t": "you", "ok": false, "fb": "受詞和主詞是同一個人時，要用反身代名詞。"}, {"t": "yourself", "ok": true, "fb": "叫對方別切到自己，受詞和主詞同一人，用 yourself。"}, {"t": "yours", "ok": false, "fb": "yours 是「你的東西」，不是「你自己」。"}, {"t": "your", "ok": false, "fb": "your 後面要接名詞。"}]}, {"q": "The cake looks great! Did you make it ____ ?", "opts": [{"t": "yourself", "ok": true, "fb": "強調「你親自做的」，用反身代名詞加強語氣。"}, {"t": "yours", "ok": false, "fb": "yours 表示「你的東西」，語意不通。"}, {"t": "you", "ok": false, "fb": "句子已經有主詞 you 了，這裡要用反身代名詞。"}, {"t": "your", "ok": false, "fb": "your 後面要接名詞。"}]}, {"q": "My grandmother lives ____ in the countryside, but she isn't lonely.", "opts": [{"t": "by hers", "ok": false, "fb": "固定片語是 by + 反身代名詞。"}, {"t": "by herself", "ok": true, "fb": "by oneself 是「獨自」的固定說法。"}, {"t": "by her", "ok": false, "fb": "這個片語要用反身代名詞 herself。"}, {"t": "herself", "ok": false, "fb": "表示「獨自」要加上 by。"}]}, {"q": "The students enjoyed ____ very much at the school trip.", "opts": [{"t": "themself", "ok": false, "fb": "students 是複數，反身代名詞要用 themselves。"}, {"t": "themselves", "ok": true, "fb": "複數主詞的反身代名詞結尾是 -selves。"}, {"t": "them", "ok": false, "fb": "玩得開心的是他們自己，要用反身代名詞。"}, {"t": "theirs", "ok": false, "fb": "theirs 表示「他們的東西」。"}]}, {"q": "Our classroom is on the second floor. Where is ____ ?", "opts": [{"t": "your", "ok": false, "fb": "後面沒有接名詞，要用所有格代名詞 yours。"}, {"t": "yours", "ok": true, "fb": "yours 代替 your classroom，後面不接名詞。"}, {"t": "yourself", "ok": false, "fb": "問的是你們的教室，不是你自己。"}, {"t": "you", "ok": false, "fb": "問的是教室在哪裡，不是人在哪裡。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "These books are ours, not theirs.", "ok": false, "fb": "這句是對的。兩個所有格代名詞後面都沒接名詞。"}, {"t": "He looked at himself in the mirror.", "ok": false, "fb": "這句是對的。看的是他自己，用反身代名詞。"}, {"t": "This new bike is my.", "ok": true, "fb": "這句錯了。後面沒接名詞，要用 mine。"}, {"t": "We painted the wall by ourselves.", "ok": false, "fb": "這句是對的。複數用 ourselves。"}]}, {"q": "This seat is ____ , not yours. And please don't talk to ____ like that.", "opts": [{"t": "mine / me", "ok": true, "fb": "前面後面沒接名詞用 mine；介系詞 to 後面用受格 me。"}, {"t": "my / myself", "ok": false, "fb": "my 後面要接名詞；對方跟我講話，受詞不是我自己。"}, {"t": "mine / myself", "ok": false, "fb": "前半對了，但說話的是對方，受詞要用 me 不是 myself。"}, {"t": "my / me", "ok": false, "fb": "後面沒有接名詞，第一個空格要用 mine。"}]}]}, {"id": "adverbs", "title": "情態副詞與副詞的級", "unit": "第四冊 Unit 11 · B4 L5–6", "points": "<p>副詞用來修飾<strong>動詞</strong>，說明動作怎麼進行。形容詞則修飾名詞。考題幾乎都在考這兩者的分辨。</p><h3>形容詞變副詞</h3><table><tr><th>規則</th><th>例子</th></tr><tr><td>一般加 -ly</td><td class=\"en\">careful → careful<span class=\"k2\">ly</span></td></tr><tr><td>子音 + y 改 -ily</td><td class=\"en\">happy → happ<span class=\"k2\">ily</span>　easy → eas<span class=\"k2\">ily</span></td></tr><tr><td>字尾是 le 改 -ly</td><td class=\"en\">simple → simp<span class=\"k2\">ly</span></td></tr></table><h3>長得一樣的和特別的</h3><p class=\"en\">fast → <span class=\"k1\">fast</span>　hard → <span class=\"k1\">hard</span>　early → <span class=\"k1\">early</span>　late → <span class=\"k1\">late</span><br>good → <span class=\"k3\">well</span>　（這個最常考）</p><p class=\"en\">He is a <span class=\"k0\">good</span> singer.　→ 形容詞修飾名詞<br>He sings <span class=\"k3\">well</span>.　→ 副詞修飾動詞</p><h3>怎麼判斷該用哪個</h3><p>看它在修飾什麼：修飾<strong>名詞</strong>用形容詞，修飾<strong>動詞</strong>用副詞。</p><p class=\"en\">She is a <span class=\"k0\">careful</span> driver.　<span class=\"k0\">（修飾 driver）</span><br>She drives <span class=\"k2\">carefully</span>.　<span class=\"k2\">（修飾 drives）</span></p><h3>副詞的比較級與最高級</h3><table><tr><th>副詞類型</th><th>比較級</th><th>最高級</th></tr><tr><td class=\"en\">-ly 的副詞</td><td class=\"en\"><span class=\"k2\">more</span> carefully</td><td class=\"en\"><span class=\"k3\">most</span> carefully</td></tr><tr><td class=\"en\">fast, hard, early</td><td class=\"en\">fast<span class=\"k2\">er</span></td><td class=\"en\">fast<span class=\"k3\">est</span></td></tr><tr><td class=\"en\">well</td><td class=\"en\"><span class=\"k1\">better</span></td><td class=\"en\"><span class=\"k1\">best</span></td></tr></table>", "questions": [{"q": "Please listen ____ . I will only say it once.", "opts": [{"t": "careful", "ok": false, "fb": "這裡修飾的是動詞 listen，要用副詞。"}, {"t": "carefully", "ok": true, "fb": "修飾動詞 listen，用副詞 carefully。"}, {"t": "care", "ok": false, "fb": "care 是名詞或動詞，不能修飾另一個動詞。"}, {"t": "carefuly", "ok": false, "fb": "拼錯了，careful 加 ly 是 carefully，兩個 l。"}]}, {"q": "My brother is a ____ swimmer. He swims very ____ .", "opts": [{"t": "good / well", "ok": true, "fb": "修飾名詞 swimmer 用形容詞 good；修飾動詞 swims 用副詞 well。"}, {"t": "well / good", "ok": false, "fb": "兩個放反了。名詞前用形容詞，動詞後用副詞。"}, {"t": "good / good", "ok": false, "fb": "後半修飾的是動詞 swims，要用副詞 well。"}, {"t": "well / well", "ok": false, "fb": "前半修飾名詞 swimmer，要用形容詞 good。"}]}, {"q": "The children smiled ____ when they saw the presents.", "opts": [{"t": "happy", "ok": false, "fb": "修飾動詞 smiled 要用副詞。"}, {"t": "happily", "ok": true, "fb": "happy 的 y 前面是子音，改成 happily。"}, {"t": "happyly", "ok": false, "fb": "拼錯了。子音＋y 要改成 ily。"}, {"t": "happiness", "ok": false, "fb": "這是名詞，不能修飾動詞。"}]}, {"q": "Ted runs ____ than anyone else in our class.", "opts": [{"t": "more fast", "ok": false, "fb": "fast 是短副詞，直接加 er。"}, {"t": "faster", "ok": true, "fb": "fast 的副詞和形容詞長得一樣，比較級直接加 er。"}, {"t": "more faster", "ok": false, "fb": "more 和 er 不能同時使用。"}, {"t": "fastly", "ok": false, "fb": "沒有 fastly 這個字，fast 本身就是副詞。"}]}, {"q": "My sister sings ____ than I do, so she joined the school choir.", "opts": [{"t": "gooder", "ok": false, "fb": "修飾動詞要用副詞 well，而且 good 的變化是不規則的。"}, {"t": "better", "ok": true, "fb": "well 的比較級是 better，修飾動詞 sings。"}, {"t": "more well", "ok": false, "fb": "well 有自己的不規則變化 better。"}, {"t": "best", "ok": false, "fb": "句子裡有 than，要用比較級。"}]}, {"q": "You should drive ____ in the rain. The road is slippery.", "opts": [{"t": "more slowly", "ok": true, "fb": "slowly 是 -ly 結尾的副詞，比較級用 more。"}, {"t": "slowlier", "ok": false, "fb": "-ly 結尾的副詞不加 er，要用 more。"}, {"t": "more slow", "ok": false, "fb": "修飾動詞 drive 要用副詞 slowly。"}, {"t": "most slowly", "ok": false, "fb": "這裡是比較而不是最高級。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "She speaks English very well.", "ok": false, "fb": "這句是對的。修飾動詞 speaks 用副詞 well。"}, {"t": "He is a careful student.", "ok": false, "fb": "這句是對的。修飾名詞 student 用形容詞。"}, {"t": "The old man walked slow to the park.", "ok": true, "fb": "這句錯了。修飾動詞 walked 要用副詞 slowly。"}, {"t": "My father gets up early every day.", "ok": false, "fb": "這句是對的。early 本身就是副詞。"}]}, {"q": "Amy worked ____ on the project, and she finished it ____ than the others.", "opts": [{"t": "hard / earlier", "ok": true, "fb": "hard 本身就是副詞；early 的比較級是 earlier。"}, {"t": "hardly / earlier", "ok": false, "fb": "hardly 的意思是「幾乎不」，和努力工作的意思相反。"}, {"t": "hard / more early", "ok": false, "fb": "前半對了，但 early 是短副詞，比較級直接加 ier。"}, {"t": "hardly / more early", "ok": false, "fb": "兩個都錯。hardly 是「幾乎不」，而 early 的比較級是 earlier。"}]}]}, {"id": "indefinite-pronouns", "title": "不定代名詞與數量代名詞", "unit": "第四冊 Unit 11 · B4 L5–6", "points": "<p>這類代名詞用來<strong>代替前面提過的名詞</strong>，避免一直重複同一個字。</p><h3>one 和 ones</h3><p class=\"en\">This bag is too big. Do you have a smaller <span class=\"k1\">one</span>?　→ 代替單數 bag<br>These shoes are too small. I want bigger <span class=\"k1\">ones</span>.　→ 代替複數 shoes</p><p style=\"color:var(--muted);font-size:17px\">one 代替<strong>同類但不同個</strong>的東西；it 代替<strong>同一個</strong>東西。<br><span class=\"en\">I lost my pen. I'll buy a new <span class=\"k1\">one</span>.</span>（買另一枝）<br><span class=\"en\">I lost my pen. I found <span class=\"k2\">it</span> later.</span>（找回同一枝）</p><h3>another 和 the other</h3><table><tr><th>用法</th><th>意思</th><th>例子</th></tr><tr><td class=\"en\">another</td><td>再一個（還有很多）</td><td class=\"en\">This is too small. Show me <span class=\"k1\">another</span>.</td></tr><tr><td class=\"en\">the other</td><td>剩下的那一個（只有兩個）</td><td class=\"en\">I have two pens. One is red; <span class=\"k2\">the other</span> is blue.</td></tr><tr><td class=\"en\">the others</td><td>剩下的全部</td><td class=\"en\">Two are mine; <span class=\"k2\">the others</span> are hers.</td></tr></table><h3>數量代名詞</h3><p class=\"en\">I have three brothers. <span class=\"k3\">All of them</span> like sports.<br>I have two cats. <span class=\"k3\">Both of them</span> are black.<br><span class=\"k3\">None of them</span> came to the party.</p><table><tr><td class=\"en\">both</td><td>兩個都</td></tr><tr><td class=\"en\">all</td><td>三個以上全部</td></tr><tr><td class=\"en\">none</td><td>一個也沒有</td></tr><tr><td class=\"en\">some</td><td>其中一些</td></tr></table>", "questions": [{"q": "This shirt is too big for me. Do you have a smaller ____ ?", "opts": [{"t": "it", "ok": false, "fb": "it 指同一件衣服，但這裡要的是另一件比較小的。"}, {"t": "one", "ok": true, "fb": "one 代替同類但不同件的東西。"}, {"t": "ones", "ok": false, "fb": "shirt 是單數，要用 one。"}, {"t": "other", "ok": false, "fb": "other 不能單獨這樣用，而且這裡用 one 就可以。"}]}, {"q": "These shoes are too small. Could you show me some bigger ____ ?", "opts": [{"t": "one", "ok": false, "fb": "shoes 是複數，要用 ones。"}, {"t": "ones", "ok": true, "fb": "代替複數名詞要用 ones。"}, {"t": "it", "ok": false, "fb": "it 指的是同一雙鞋，而且是單數。"}, {"t": "them", "ok": false, "fb": "them 指的是同樣那幾雙，這裡要的是別雙。"}]}, {"q": "I have two sisters. One is a teacher, and ____ is a nurse.", "opts": [{"t": "another", "ok": false, "fb": "only 兩個人的時候，剩下的那一個要用 the other。"}, {"t": "the other", "ok": true, "fb": "總共兩個，說完一個之後剩下的那一個用 the other。"}, {"t": "other", "ok": false, "fb": "other 不能單獨當代名詞用，要加 the。"}, {"t": "the others", "ok": false, "fb": "the others 指剩下的「全部」，但這裡只剩一個人。"}]}, {"q": "This cake is delicious. Can I have ____ piece?", "opts": [{"t": "the other", "ok": false, "fb": "the other 用在只剩最後一個的情況，這裡還有很多。"}, {"t": "another", "ok": true, "fb": "再要一個、而且還有很多，用 another。"}, {"t": "other", "ok": false, "fb": "other 後面接單數名詞時要加 the 或 an。"}, {"t": "the others", "ok": false, "fb": "the others 是複數，後面不接單數名詞 piece。"}]}, {"q": "I have two dogs, and ____ of them are very friendly.", "opts": [{"t": "all", "ok": false, "fb": "只有兩隻的時候用 both，all 用在三個以上。"}, {"t": "both", "ok": true, "fb": "剛好兩隻都很友善，用 both。"}, {"t": "none", "ok": false, "fb": "none 是一隻也沒有，和句意相反。"}, {"t": "another", "ok": false, "fb": "another 是「再一個」，不能用在這個句型。"}]}, {"q": "I invited ten friends, but ____ of them came. I was really disappointed.", "opts": [{"t": "all", "ok": false, "fb": "後面說很失望，表示沒有人來。"}, {"t": "none", "ok": true, "fb": "一個也沒來，用 none，正好對應後面的失望。"}, {"t": "both", "ok": false, "fb": "both 用在剛好兩個的情況，這裡有十個人。"}, {"t": "another", "ok": false, "fb": "another 不能用在這個句型。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "There are five eggs. Some of them are broken.", "ok": false, "fb": "這句是對的。some of them 表示其中一些。"}, {"t": "I lost my key. I have to buy a new one.", "ok": false, "fb": "這句是對的。one 代替同類的另一把鑰匙。"}, {"t": "I have two pens. One is red, and another is black.", "ok": true, "fb": "這句錯了。總共只有兩枝，剩下的那一枝要用 the other。"}, {"t": "These apples are small. I want bigger ones.", "ok": false, "fb": "這句是對的。複數用 ones。"}]}, {"q": "There are thirty students in my class. ____ of them are girls, and ____ are boys.", "opts": [{"t": "Some / the others", "ok": true, "fb": "其中一些是女生用 Some；剩下的全部是男生用 the others。"}, {"t": "Some / another", "ok": false, "fb": "剩下的是一群人，要用 the others。"}, {"t": "Both / the others", "ok": false, "fb": "全班有三十個人，Both 只能用在剛好兩個的情況。"}, {"t": "None / the others", "ok": false, "fb": "None 表示一個也沒有，和後面的句子矛盾。"}]}]}, {"id": "spend-cost-take", "title": "花費動詞 spend / take / cost / pay", "unit": "第四冊 Unit 11 · B4 L5–6", "points": "<p>這四個動詞都在講「花費」，差別在<strong>主詞是誰</strong>，以及<strong>花的是時間還是錢</strong>。先看主詞，答案就出來了。</p><h3>四個句型</h3><table><tr><th>動詞</th><th>主詞</th><th>句型</th></tr><tr><td class=\"en\">spend</td><td>人</td><td class=\"en\">人 + spend + 時間/錢 + <span class=\"k1\">on</span> 名詞</td></tr><tr><td class=\"en\">take</td><td class=\"k2\">It</td><td class=\"en\">It + take + 人 + 時間 + <span class=\"k1\">to</span> 原形</td></tr><tr><td class=\"en\">cost</td><td>物</td><td class=\"en\">物 + cost + 人 + 錢</td></tr><tr><td class=\"en\">pay</td><td>人</td><td class=\"en\">人 + pay + 錢 + <span class=\"k1\">for</span> 物</td></tr></table><h3>例句對照</h3><p class=\"en\">I <span class=\"k1\">spent</span> two hours <span class=\"k3\">on</span> my homework.<br>I <span class=\"k1\">spent</span> 500 dollars <span class=\"k3\">on</span> this book.<br><span class=\"k2\">It took</span> me two hours <span class=\"k3\">to finish</span> my homework.<br>This book <span class=\"k1\">cost</span> me 500 dollars.<br>I <span class=\"k1\">paid</span> 500 dollars <span class=\"k3\">for</span> this book.</p><p style=\"color:var(--muted);font-size:17px\">同一件事可以用四種說法，但主詞和介系詞要跟著換。</p><h3>spend 的另一種用法</h3><p class=\"en\">I spent two hours <span class=\"k2\">doing</span> my homework.</p><p>spend 後面接動作時，用 <strong>V-ing</strong>，不是不定詞。</p><h3>過去式</h3><p class=\"en\">spend → <span class=\"k1\">spent</span>　take → <span class=\"k1\">took</span><br>cost → <span class=\"k1\">cost</span>（不變）　pay → <span class=\"k1\">paid</span></p><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">I spent two hours to do my homework.</span>　→ spend 後面接 V-ing</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">It costs me two hours.</span>　→ cost 用在錢，時間要用 take</p></div>", "questions": [{"q": "It ____ me about forty minutes to ride my bike to school.", "opts": [{"t": "takes", "ok": true, "fb": "主詞是 It、花的是時間，用 take。"}, {"t": "spends", "ok": false, "fb": "spend 的主詞要是人，不是 It。"}, {"t": "costs", "ok": false, "fb": "cost 用在花錢，而且主詞要是物品。"}, {"t": "pays", "ok": false, "fb": "pay 的主詞是人，而且用在花錢。"}]}, {"q": "This new smartphone ____ me twenty thousand dollars.", "opts": [{"t": "took", "ok": false, "fb": "take 的主詞是 It，而且用在時間。"}, {"t": "cost", "ok": true, "fb": "主詞是物品、花的是錢，用 cost。過去式也是 cost。"}, {"t": "spent", "ok": false, "fb": "spend 的主詞要是人。"}, {"t": "paid", "ok": false, "fb": "pay 的主詞要是人，不是手機。"}]}, {"q": "My sister ____ three hours ____ her science project last night.", "opts": [{"t": "spent / on", "ok": true, "fb": "主詞是人用 spend，後面接名詞時用介系詞 on。"}, {"t": "spent / for", "ok": false, "fb": "spend 後面接名詞時用 on，不是 for。"}, {"t": "took / on", "ok": false, "fb": "take 的主詞是 It，不是人。"}, {"t": "cost / on", "ok": false, "fb": "cost 的主詞是物品，而且用在錢。"}]}, {"q": "I ____ five hundred dollars ____ this pair of shoes.", "opts": [{"t": "paid / for", "ok": true, "fb": "主詞是人用 pay，後面接物品時用介系詞 for。"}, {"t": "paid / on", "ok": false, "fb": "pay 後面接物品時用 for，用 on 的是 spend。"}, {"t": "cost / for", "ok": false, "fb": "cost 的主詞要是物品，不是人。"}, {"t": "took / for", "ok": false, "fb": "take 用在花時間，主詞是 It。"}]}, {"q": "Ted spent the whole afternoon ____ computer games.", "opts": [{"t": "to play", "ok": false, "fb": "spend 後面接動作時要用 V-ing。"}, {"t": "playing", "ok": true, "fb": "spend + 時間 + V-ing，這是固定用法。"}, {"t": "play", "ok": false, "fb": "spend 後面接動作要用 V-ing。"}, {"t": "played", "ok": false, "fb": "spend 後面接的是動名詞。"}]}, {"q": "A: How long does it ____ to get to Taipei by train?　B: About an hour.", "opts": [{"t": "take", "ok": true, "fb": "問花多久時間用 It takes，疑問句裡用原形 take。"}, {"t": "spend", "ok": false, "fb": "spend 的主詞要是人。"}, {"t": "cost", "ok": false, "fb": "回答給的是時間，cost 用在錢。"}, {"t": "pay", "ok": false, "fb": "pay 用在花錢，而且主詞要是人。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "It cost me two hours to finish the report.", "ok": true, "fb": "這句錯了。花時間要用 take，cost 用在花錢。"}, {"t": "I spent two hours doing my homework.", "ok": false, "fb": "這句是對的。spend 後面接 V-ing。"}, {"t": "The ticket cost him 300 dollars.", "ok": false, "fb": "這句是對的。主詞是物品、花的是錢。"}, {"t": "She paid 50 dollars for the drink.", "ok": false, "fb": "這句是對的。pay 後面接物品用 for。"}]}, {"q": "The concert ticket ____ me 1,500 dollars, and it ____ me two hours to get to the concert hall.", "opts": [{"t": "cost / took", "ok": true, "fb": "票是物品、花的是錢用 cost；花時間用 It takes 的過去式 took。"}, {"t": "took / cost", "ok": false, "fb": "兩個放反了。錢用 cost，時間用 take。"}, {"t": "spent / took", "ok": false, "fb": "spend 的主詞要是人，不是票。"}, {"t": "cost / spent", "ok": false, "fb": "前半對了，但主詞是 it，花時間要用 took。"}]}]}];

  return e;

      b.appendChild(el('span','nm', t.title));
      const rec = store[t.id];
      const st = el('span','st');
      if (rec && typeof rec.best === 'number'){
        st.textContent = '本次 ' + rec.best + '%';
        if (rec.best === 100) st.className = 'st done';
      } else {
        st.textContent = '未練習';
      }
      b.appendChild(st);
      b.addEventListener('click', () => showTopic(idx));
      list.appendChild(b);
    });
    app.appendChild(list);
  });
}

let cur = null;

function showTopic(idx){
  const t = TOPICS[idx];
  cur = { idx: idx, i: 0, result: new Array(t.questions.length).fill(null), wrong: [] };
  hTitle.textContent = t.title;
  hSub.textContent = t.unit;
  backBtn.style.display = 'inline-block';
  app.innerHTML = '';
  window.scrollTo(0,0);

  const pc = el('div','card');
  pc.appendChild(el('h2',null,'先看重點'));
  const holder = el('div');
  holder.innerHTML = t.points;
  holder.querySelectorAll('table').forEach(tb => {
    const w = el('div','tablescroll');
    tb.parentNode.insertBefore(w, tb);
    w.appendChild(tb);
  });
  pc.appendChild(holder);
  app.appendChild(pc);

  const qc = el('div','card');
  qc.appendChild(el('h2',null,'換你試試看'));
  const prog = el('div','progress'); prog.id = 'progress';
  const body = el('div'); body.id = 'quizBody';
  qc.appendChild(prog); qc.appendChild(body);
  app.appendChild(qc);

  render();
}

function drawProgress(){
  const t = TOPICS[cur.idx];
  const prog = document.getElementById('progress');
  prog.innerHTML = '';
  t.questions.forEach((_, i) => {
    let cls = 'dot';
    if (cur.result[i] === true) cls += ' done';
    else if (cur.result[i] === false) cls += ' miss';
    else if (i === cur.i) cls += ' now';
    prog.appendChild(el('span', cls));
  });
}

function render(){
  const t = TOPICS[cur.idx];
  if (cur.i >= t.questions.length) return finish();
  drawProgress();
  const item = t.questions[cur.i];
  const body = document.getElementById('quizBody');
  body.innerHTML = '';

  body.appendChild(el('p','qnum','第 ' + (cur.i+1) + ' 題 / 共 ' + t.questions.length + ' 題'));

  const qt = el('p','qtext en', item.q);
  if (item.hint) qt.appendChild(el('span','hintword','　' + item.hint));
  body.appendChild(qt);

  const box = el('div'); body.appendChild(box);
  const fbBox = el('div'); body.appendChild(fbBox);
  let missed = false;

  item.opts.forEach((o, i) => {
    const b = el('button','opt');
    b.type = 'button';
    b.appendChild(el('span','letter','(' + 'ABCD'[i] + ')'));
    b.appendChild(document.createTextNode(o.t));
    b.addEventListener('click', () => {
      if (o.ok){
        b.classList.add('picked-right');
        Array.prototype.forEach.call(box.children, x => { x.disabled = true; });
        if (cur.result[cur.i] === null) cur.result[cur.i] = !missed;
        showFeedback(fbBox, true, o.fb, missed);
      } else {
        missed = true;
        cur.result[cur.i] = false;
        b.classList.add('picked-wrong');
        b.disabled = true;
        if (!cur.wrong.some(w => w.q === item.q && w.pick === o.t)){
          cur.wrong.push({ q: item.q, pick: o.t, fb: o.fb });
        }
        showFeedback(fbBox, false, o.fb, missed);
      }
      drawProgress();
    });
    box.appendChild(b);
  });
}

function showFeedback(host, ok, text, missed){
  const t = TOPICS[cur.idx];
  host.innerHTML = '';
  const d = el('div','fb ' + (ok ? 'yes' : 'no'));
  d.appendChild(el('strong', null, ok ? (missed ? '這次對了' : '答對了') : '再看一次'));
  d.appendChild(document.createTextNode(text));
  host.appendChild(d);

  if (ok){
    const n = el('button','btn', cur.i === t.questions.length - 1 ? '看結果' : '下一題');
    n.type = 'button';
    n.addEventListener('click', () => { cur.i++; render(); });
    host.appendChild(n);
  } else {
    const p = el('p', null, '選選看其他選項。');
    p.style.cssText = 'margin:12px 0 0;color:var(--muted);font-size:17px';
    host.appendChild(p);
  }
}

function finish(){
  const t = TOPICS[cur.idx];
  drawProgress();
  const right = cur.result.filter(r => r === true).length;
  const pct = Math.round(right / t.questions.length * 100);

  const rec = store[t.id] || {};
  rec.best = Math.max(rec.best || 0, pct);
  rec.last = pct;
  store[t.id] = rec;
  save();

  const body = document.getElementById('quizBody');
  body.innerHTML = '';
  body.appendChild(el('p','score', pct + '%'));
  body.appendChild(el('p','scorelabel', t.questions.length + ' 題中，一次就答對 ' + right + ' 題'));

  if (cur.wrong.length){
    body.appendChild(el('h3',null,'這些地方要再看一次'));
    const box = el('div','review');
    const ul = document.createElement('ul');
    ul.style.margin = '0';
    cur.wrong.forEach(w => {
      const li = document.createElement('li');
      li.appendChild(el('strong', null, '你選了 ' + w.pick + '：'));
      li.appendChild(document.createTextNode(w.fb));
      ul.appendChild(li);
    });
    box.appendChild(ul);
    body.appendChild(box);
  } else {
    body.appendChild(el('p', null, '全部一次答對，這個主題你已經掌握了。'));
  }

  const again = el('button','btn ghost','再練一次');
  again.type = 'button';
  again.addEventListener('click', () => showTopic(cur.idx));
  body.appendChild(again);

  const back = el('button','btn','換一個主題');
  back.type = 'button';
  back.addEventListener('click', showMenu);
  body.appendChild(back);
}

showMenu();
</script>
