<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>七、八年級英語文法小助手 · 大同國中</title>
<style>
  :root{
    --ink:#1B2440; --paper:#FFFFFF; --wash:#F1F3F8; --line:#D8DDE9;
    --k0:#5A6478; --k1:#1668A8; --k2:#B85419; --k3:#12704A;
    --right:#12704A; --wrong:#A82521; --muted:#6B7386;
  }
  *{box-sizing:border-box;}
  body{margin:0;padding:0 0 64px;background:var(--wash);color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    font-size:18px;line-height:1.85;-webkit-text-size-adjust:100%;}
  .wrap{max-width:760px;margin:0 auto;padding:0 16px;}

  header{background:var(--ink);color:#fff;padding:18px 0 20px;margin-bottom:20px;}
  .school{font-size:15px;letter-spacing:.06em;color:#A9B4CE;margin:0 0 5px;}
  header h1{font-size:26px;margin:0;font-weight:700;line-height:1.4;}
  header .sub{font-size:16px;color:#A9B4CE;margin:6px 0 0;}
  .backbtn{background:none;border:1px solid #4A5578;color:#C7D0E6;border-radius:8px;
    padding:8px 16px;font-size:16px;font-family:inherit;cursor:pointer;margin-top:14px;}
  .backbtn:hover{background:#2A3453;}
  .backbtn:focus-visible{outline:3px solid #7FA8D6;outline-offset:2px;}

  .card{background:var(--paper);border:1px solid var(--line);border-radius:10px;
    padding:22px;margin-bottom:20px;}
  h2{font-size:21px;margin:0 0 14px;font-weight:700;}
  h3{font-size:18px;margin:20px 0 8px;font-weight:700;}
  p{margin:0 0 10px;}

  .grouphead{display:flex;align-items:baseline;gap:12px;margin:24px 0 12px;}
  .grouphead h2{margin:0;}
  .grouphead span{color:var(--muted);font-size:16px;}
  .topiclist{display:grid;gap:10px;}
  .topicbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    background:var(--paper);border:1px solid var(--line);border-radius:10px;
    padding:16px 18px;font-size:19px;font-family:inherit;color:var(--ink);cursor:pointer;line-height:1.5;}
  .topicbtn:hover{border-color:var(--ink);}
  .topicbtn:focus-visible{outline:3px solid var(--k1);outline-offset:2px;}
  .topicbtn .no{flex:none;width:34px;color:var(--muted);font-size:16px;}
  .topicbtn .nm{flex:1;font-weight:700;}
  .topicbtn .st{flex:none;font-size:15px;color:var(--muted);}
  .topicbtn .st.done{color:var(--right);font-weight:700;}

  .intro{background:var(--paper);border:1px solid var(--line);border-radius:10px;
    padding:18px 20px;margin-bottom:8px;font-size:17px;color:var(--muted);}

  .en{font-size:19px;}
  .k0{color:var(--k0);font-weight:700;}
  .k1{color:var(--k1);font-weight:700;}
  .k2{color:var(--k2);font-weight:700;}
  .k3{color:var(--k3);font-weight:700;}
  .bad{color:var(--wrong);text-decoration:line-through;}
  .formula{background:var(--wash);border-radius:8px;padding:16px;text-align:center;
    font-size:20px;margin:14px 0 18px;line-height:2.2;}
  .tag{padding:3px 10px;border-radius:6px;font-weight:700;white-space:nowrap;display:inline-block;}
  .tag.k0{background:#E4E7EE;color:var(--k0);}
  .tag.k1{background:#DCEBF7;color:var(--k1);}
  .tag.k2{background:#F8E5D6;color:var(--k2);}
  .tag.k3{background:#DDEEE5;color:var(--k3);}
  .plus{color:var(--muted);padding:0 6px;}
  table{width:100%;border-collapse:collapse;margin:10px 0 6px;font-size:17px;}
  th,td{border:1px solid var(--line);padding:9px 12px;text-align:left;vertical-align:top;}
  th{background:var(--wash);font-weight:700;}
  ul{margin:6px 0 10px;padding-left:22px;}
  li{margin-bottom:6px;}
  .warn{border-left:4px solid var(--wrong);background:#FBEDEC;padding:14px 16px;
    border-radius:0 8px 8px 0;margin-top:16px;}
  .warn strong{display:block;margin-bottom:6px;}
  details summary{cursor:pointer;font-weight:700;font-size:19px;padding:4px 0;}
  details summary:focus-visible{outline:3px solid var(--k1);outline-offset:3px;}
  .tablescroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}

  .progress{display:flex;gap:7px;margin-bottom:16px;flex-wrap:wrap;}
  .dot{width:12px;height:12px;border-radius:50%;background:var(--line);}
  .dot.done{background:var(--right);}
  .dot.miss{background:var(--wrong);}
  .dot.now{background:var(--ink);}
  .qnum{font-size:15px;color:var(--muted);margin-bottom:4px;}
  .qtext{font-size:20px;line-height:1.9;margin-bottom:16px;}
  .hintword{color:var(--muted);font-size:17px;}
  .opt{display:block;width:100%;text-align:left;background:var(--paper);
    border:2px solid var(--line);border-radius:9px;padding:14px 16px;margin-bottom:10px;
    font-size:19px;font-family:inherit;color:var(--ink);cursor:pointer;line-height:1.6;}
  .opt:hover:not(:disabled){border-color:var(--ink);}
  .opt:focus-visible{outline:3px solid var(--k1);outline-offset:2px;}
  .opt .letter{font-weight:700;margin-right:10px;color:var(--muted);}
  .opt.picked-wrong{border-color:var(--wrong);background:#FBEDEC;}
  .opt.picked-right{border-color:var(--right);background:#E8F4EE;}
  .opt:disabled{cursor:default;opacity:.55;}
  .opt.picked-wrong:disabled,.opt.picked-right:disabled{opacity:1;}
  .fb{border-radius:9px;padding:15px 17px;margin-top:14px;font-size:17.5px;}
  .fb.no{background:#FBEDEC;border-left:4px solid var(--wrong);}
  .fb.yes{background:#E8F4EE;border-left:4px solid var(--right);}
  .fb strong{display:block;margin-bottom:5px;}
  .btn{background:var(--ink);color:#fff;border:none;border-radius:9px;padding:14px 26px;
    font-size:18px;font-family:inherit;font-weight:700;cursor:pointer;margin-top:16px;}
  .btn:focus-visible{outline:3px solid var(--k1);outline-offset:2px;}
  .btn.ghost{background:var(--paper);color:var(--ink);border:2px solid var(--line);margin-right:10px;}
  .score{font-size:44px;font-weight:700;line-height:1.2;margin:6px 0 2px;}
  .scorelabel{color:var(--muted);font-size:16px;margin-bottom:18px;}
  .review{background:var(--wash);border-radius:8px;padding:14px 16px;margin-top:6px;font-size:17px;}
  footer{text-align:center;color:var(--muted);font-size:15px;margin-top:8px;}

  @media (max-width:480px){
    body{font-size:17.5px;}
    header h1{font-size:23px;}
    .formula{font-size:17px;}
    .card{padding:18px 16px;}
    .topicbtn{font-size:18px;padding:14px 15px;}
  }
  @media print{
    body{background:#fff;}
    .btn,.backbtn,.opt{display:none;}
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <p class="school">大同國中 · 七、八年級英語</p>
    <h1 id="hTitle">文法小助手</h1>
    <p class="sub" id="hSub">模擬考範圍 · 第一冊到第四冊</p>
    <button class="backbtn" id="backBtn" type="button" style="display:none">← 回主題選單</button>
  </div>
</header>

<div class="wrap" id="app"></div>
<footer id="ft">大同國中英語科 · 共 44 個文法主題、350 題</footer>

<script>
const TOPICS = [{"id": "noun-plural", "title": "名詞單複數與所有格", "unit": "第一冊 Unit 1 · B1 L1–3", "points": "<p>名詞要不要加 s、加什麼樣的 s，決定在<strong>字尾長什麼樣子</strong>。所有格則是決定在<strong>那個名詞本身有沒有 s</strong>。</p><h3>複數變化五條規則</h3><table><tr><th>字尾</th><th>怎麼變</th><th>例子</th></tr><tr><td>一般</td><td>加 -s</td><td class=\"en\">book → book<span class=\"k2\">s</span></td></tr><tr><td>s, x, ch, sh</td><td>加 -es</td><td class=\"en\">box → box<span class=\"k2\">es</span>　watch → watch<span class=\"k2\">es</span></td></tr><tr><td>子音 + y</td><td>去 y 加 -ies</td><td class=\"en\">city → cit<span class=\"k2\">ies</span></td></tr><tr><td>母音 + y</td><td>直接加 -s</td><td class=\"en\">boy → boy<span class=\"k2\">s</span></td></tr><tr><td>f, fe</td><td>去掉改 -ves</td><td class=\"en\">knife → kni<span class=\"k2\">ves</span></td></tr></table><h3>不規則變化（只能背）</h3><p class=\"en\">man → men　woman → women　child → children<br>foot → feet　tooth → teeth<br>fish → fish　sheep → sheep（不變）</p><h3>所有格：看名詞尾巴有沒有 s</h3><table><tr><th>情況</th><th>怎麼加</th><th>例子</th></tr><tr><td>單數名詞</td><td>加 <span class=\"k1\">'s</span></td><td class=\"en\">Tom<span class=\"k1\">'s</span> book</td></tr><tr><td>複數字尾有 s</td><td>只加 <span class=\"k1\">'</span></td><td class=\"en\">the students<span class=\"k1\">'</span> desks</td></tr><tr><td>複數字尾沒有 s</td><td>加 <span class=\"k1\">'s</span></td><td class=\"en\">the children<span class=\"k1\">'s</span> toys</td></tr><tr><td>沒有生命的東西</td><td>用 <span class=\"k1\">of</span></td><td class=\"en\">the color <span class=\"k1\">of</span> the bag</td></tr></table><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">two womans</span>　→ 不規則變化沒背熟</p><p class=\"en\"><span class=\"bad\">my two brother's room</span>　→ 兩個哥哥要寫 brothers'</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">many citys</span>　→ 子音＋y 要改 ies</p></div>", "questions": [{"q": "There are three ____ and two ____ on the kitchen table.", "hint": "（box / knife）", "opts": [{"t": "boxs / knifes", "ok": false, "fb": "兩個都錯。box 的字尾是 x，要加 -es；knife 的字尾是 fe，要改成 -ves。"}, {"t": "boxes / knifes", "ok": false, "fb": "box 對了，但 knife 的字尾是 fe，要去掉改成 knives，不是直接加 s。"}, {"t": "boxs / knives", "ok": false, "fb": "knife 對了，但 box 的字尾是 x，發音上加不了單獨的 s，要加 -es 變成 boxes。"}, {"t": "boxes / knives", "ok": true, "fb": "x 結尾加 -es，fe 結尾改 -ves。這兩條是段考最常一起考的規則。"}]}, {"q": "My ____ are all seven years old. They are in the same class.", "hint": "（child）", "opts": [{"t": "childs", "ok": false, "fb": "child 是不規則變化，不能加 s。正確的複數是 children。"}, {"t": "childrens", "ok": false, "fb": "children 本身已經是複數了，後面不用再加 s。"}, {"t": "children", "ok": true, "fb": "child 的複數是 children，屬於必須背下來的不規則變化。"}, {"t": "child", "ok": false, "fb": "後面的 They are 和 the same class 都表示不只一個，要用複數。"}]}, {"q": "I have two brothers. The ____ room is next to mine.", "opts": [{"t": "brothers", "ok": false, "fb": "這裡要表達「哥哥們的」房間，是所有格，不能只寫複數。"}, {"t": "brother's", "ok": false, "fb": "這樣寫變成「一個哥哥的」。前面說了 two brothers，要用複數所有格。"}, {"t": "brothers'", "ok": true, "fb": "複數 brothers 的字尾已經有 s，所有格只要在後面加一撇。"}, {"t": "brothers's", "ok": false, "fb": "字尾已經有 s 了就不再加 's，只加一撇即可。"}]}, {"q": "The ____ books are on the top shelf. Don't let them take the books down by themselves.", "hint": "（children）", "opts": [{"t": "childrens", "ok": false, "fb": "children 已經是複數，不用再加 s；而且這裡要的是所有格。"}, {"t": "children's", "ok": true, "fb": "children 是不規則複數，字尾沒有 s，所有格要完整加上 's。"}, {"t": "childrens'", "ok": false, "fb": "多加了一個 s。children 字尾本來就沒有 s，直接加 's 就好。"}, {"t": "children", "ok": false, "fb": "少了所有格符號。「小朋友的書」要寫成 children's books。"}]}, {"q": "The ____ in my class like to play with ____ after school.", "hint": "（boy / toy）", "opts": [{"t": "boies / toies", "ok": false, "fb": "boy 和 toy 的 y 前面都是母音 o，直接加 s 就好，不改成 ies。"}, {"t": "boys / toys", "ok": true, "fb": "母音＋y 直接加 s。要改成 ies 的是子音＋y，像 city → cities。"}, {"t": "boyes / toyes", "ok": false, "fb": "加 -es 的是 s、x、ch、sh 結尾的字，y 結尾不適用。"}, {"t": "boys / toies", "ok": false, "fb": "boy 對了，toy 的規則完全一樣，也是母音＋y，直接加 s。"}]}, {"q": "Taiwan has many beautiful ____ , and Yilan is one of them.", "hint": "（city）", "opts": [{"t": "citys", "ok": false, "fb": "city 的 y 前面是子音 t，要去掉 y 改成 -ies。"}, {"t": "cityes", "ok": false, "fb": "沒有這種變化。子音＋y 是把 y 去掉，換成 ies。"}, {"t": "cities", "ok": true, "fb": "city 的 y 前面是子音，去 y 加 ies 變成 cities。"}, {"t": "city", "ok": false, "fb": "前面有 many，表示不只一個，要用複數。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "These are Mary and Tom's desks.", "ok": false, "fb": "這句是對的。兩個人共有時，只在最後一個名字加 's。"}, {"t": "The dog's name is Lucky.", "ok": false, "fb": "這句是對的。dog 是單數，所有格加 's。"}, {"t": "There are two womans in the office.", "ok": true, "fb": "這句錯了。woman 的複數是 women，不能加 s。"}, {"t": "My parents' car is very old.", "ok": false, "fb": "這句是對的。parents 字尾有 s，所有格只加一撇。"}]}, {"q": "I really like the ____ of this bag, but I don't like my two ____ bags.", "hint": "（color / sister）", "opts": [{"t": "color's / sisters'", "ok": false, "fb": "後半對了，但 bag 沒有生命，「袋子的顏色」要用 the color of this bag。"}, {"t": "color / sister's", "ok": false, "fb": "前半對了，但前面說了 two sisters，複數所有格要寫 sisters'。"}, {"t": "color / sisters'", "ok": true, "fb": "沒有生命的東西用 of；複數 sisters 字尾有 s，所有格只加一撇。"}, {"t": "color's / sister's", "ok": false, "fb": "兩個都錯。沒生命的東西不用 's，而 two sisters 是複數。"}]}]}, {"id": "articles", "title": "冠詞 a / an / the", "unit": "第一冊 Unit 1 · B1 L1–3", "points": "<p>a 和 an 的差別不在字母，在<strong>發音</strong>；a/an 和 the 的差別在<strong>對方知不知道你在講哪一個</strong>。</p><h3>a 還是 an？聽第一個音</h3><table><tr><th>第一個音</th><th>用</th><th>例子</th></tr><tr><td>子音開頭</td><td><span class=\"k1\">a</span></td><td class=\"en\">a book　a cat　a school</td></tr><tr><td>母音開頭（a, e, i, o, u 的音）</td><td><span class=\"k1\">an</span></td><td class=\"en\">an apple　an egg　an orange</td></tr></table><p style=\"color:var(--muted);font-size:17px\">陷阱字：<span class=\"en\">an <span class=\"k2\">h</span>our</span>（h 不發音，聽起來是母音）、<span class=\"en\">a <span class=\"k2\">u</span>niversity</span>（u 發成「you」的音，是子音）。</p><h3>什麼時候改用 the</h3><ul><li>前面已經提過的東西 —— <span class=\"en\">I see <span class=\"k1\">a</span> dog. <span class=\"k1\">The</span> dog is white.</span></li><li>全世界只有一個 —— <span class=\"en\">the sun、the moon</span></li><li>雙方都知道在講哪一個 —— <span class=\"en\">Close <span class=\"k1\">the</span> door.</span></li></ul><h3>什麼時候不加冠詞</h3><ul><li>複數名詞泛指一整類 —— <span class=\"en\">I like <span class=\"k3\">dogs</span>.</span>（狗這種動物）</li><li>人名、國名、地名 —— <span class=\"en\">Amy、Taiwan、Yilan</span></li></ul><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">a hour</span>　→ hour 的 h 不發音</p><p class=\"en\"><span class=\"bad\">an university</span>　→ u 這裡發「you」的音</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">Do you like the apples?</span>　→ 泛指一整類水果不加 the</p></div>", "questions": [{"q": "My uncle is ____ English teacher at a junior high school.", "opts": [{"t": "a", "ok": false, "fb": "English 的第一個音是母音 /e/，要用 an。"}, {"t": "an", "ok": true, "fb": "English 以母音開頭，用 an。"}, {"t": "the", "ok": false, "fb": "這裡第一次提到他的職業，是「一位英文老師」，用 an 比較自然。"}, {"t": "不填", "ok": false, "fb": "teacher 是單數可數名詞，前面一定要有冠詞。"}]}, {"q": "I have a dog and a cat. ____ dog is white, and ____ cat is black.", "opts": [{"t": "A / a", "ok": false, "fb": "前一句已經提過這隻狗和這隻貓了，第二次提到要用 the。"}, {"t": "The / the", "ok": true, "fb": "前面用 a 介紹過，後面再提到同一個就改用 the。"}, {"t": "An / an", "ok": false, "fb": "dog 和 cat 都是子音開頭，而且這裡是第二次提到，要用 the。"}, {"t": "The / a", "ok": false, "fb": "前半對了，但貓也是前面提過的那一隻，同樣要用 the。"}]}, {"q": "The movie is about ____ hour long, so we can watch it before dinner.", "opts": [{"t": "a", "ok": false, "fb": "hour 的 h 不發音，唸起來是母音開頭，要用 an。"}, {"t": "an", "ok": true, "fb": "看的是發音不是字母。hour 的 h 不發音，聽起來像母音開頭。"}, {"t": "the", "ok": false, "fb": "這裡是說「大約一個小時」，不是指某個特定的小時。"}, {"t": "不填", "ok": false, "fb": "hour 是單數可數名詞，前面需要冠詞。"}]}, {"q": "Ted's sister is ____ university student. She studies math.", "opts": [{"t": "a", "ok": true, "fb": "university 的 u 發成「you」的音，是子音開頭，所以用 a。"}, {"t": "an", "ok": false, "fb": "雖然 u 是母音字母，但 university 唸起來是「you-ni-」，開頭是子音的音。"}, {"t": "the", "ok": false, "fb": "這裡只是說她是「一名大學生」，不是特指某一位。"}, {"t": "不填", "ok": false, "fb": "student 是單數可數名詞，前面要有冠詞。"}]}, {"q": "A: Do you like ____ apples?　B: Yes, I eat one every day.", "opts": [{"t": "a", "ok": false, "fb": "apples 是複數，a 只能放在單數名詞前面。"}, {"t": "an", "ok": false, "fb": "an 也只能放單數名詞前面，apples 是複數。"}, {"t": "the", "ok": false, "fb": "加了 the 會變成「那些特定的蘋果」，但這裡問的是喜不喜歡蘋果這種水果。"}, {"t": "不填", "ok": true, "fb": "泛指一整類東西時，複數名詞前面不加冠詞。"}]}, {"q": "Look at ____ moon tonight! It's really big and bright.", "opts": [{"t": "a", "ok": false, "fb": "月亮只有一個，全世界都知道你在講哪一個，要用 the。"}, {"t": "an", "ok": false, "fb": "moon 是子音開頭；而且獨一無二的東西要用 the。"}, {"t": "the", "ok": true, "fb": "世界上獨一無二的東西用 the，像 the sun、the moon。"}, {"t": "不填", "ok": false, "fb": "moon 是單數名詞，而且是特指的那一個，要加 the。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "There is an old man in the park.", "ok": false, "fb": "這句是對的。old 以母音開頭，用 an。"}, {"t": "My father goes to work by a bus.", "ok": true, "fb": "這句錯了。交通工具用 by 時不加冠詞，要寫 by bus。"}, {"t": "I want to be a doctor.", "ok": false, "fb": "這句是對的。doctor 是子音開頭的單數名詞，用 a。"}, {"t": "The sun rises in the east.", "ok": false, "fb": "這句是對的。太陽獨一無二，用 the。"}]}, {"q": "There is ____ old woman at the door. ____ woman says she is looking for you.", "opts": [{"t": "a / A", "ok": false, "fb": "old 是母音開頭要用 an；第二次提到同一個人要用 The。"}, {"t": "an / A", "ok": false, "fb": "前半對了，但第二句講的是同一位女士，要用 The。"}, {"t": "an / The", "ok": true, "fb": "第一次出現用 an（old 是母音開頭），第二次提到同一個人改用 The。"}, {"t": "the / The", "ok": false, "fb": "第一次介紹一個對方還不認識的人，要先用 a 或 an。"}]}]}, {"id": "pronouns", "title": "人稱代名詞與指示代名詞", "unit": "第一冊 Unit 1 · B1 L1–3", "points": "<p>代名詞用哪一個格，看它在句子裡<strong>站的位置</strong>：動詞前面用主格，動詞或介系詞後面用受格。</p><h3>四種格</h3><table><tr><th>主格<br><span style=\"font-weight:400;font-size:15px\">動詞前</span></th><th>受格<br><span style=\"font-weight:400;font-size:15px\">動詞/介系詞後</span></th><th>所有格形容詞<br><span style=\"font-weight:400;font-size:15px\">後面要接名詞</span></th><th>所有格代名詞<br><span style=\"font-weight:400;font-size:15px\">後面不接名詞</span></th></tr><tr><td>I</td><td>me</td><td>my</td><td>mine</td></tr><tr><td>you</td><td>you</td><td>your</td><td>yours</td></tr><tr><td>he</td><td>him</td><td>his</td><td>his</td></tr><tr><td>she</td><td>her</td><td>her</td><td>hers</td></tr><tr><td>it</td><td>it</td><td>its</td><td>—</td></tr><tr><td>we</td><td>us</td><td>our</td><td>ours</td></tr><tr><td>they</td><td>them</td><td>their</td><td>theirs</td></tr></table><h3>所有格形容詞 vs. 所有格代名詞</h3><p class=\"en\">This is <span class=\"k1\">my</span> book.　→ my 後面接名詞<br>This book is <span class=\"k2\">mine</span>.　→ mine 後面什麼都不接</p><h3>指示代名詞：看遠近，也看單複數</h3><table><tr><th></th><th>近的</th><th>遠的</th></tr><tr><td>單數</td><td class=\"en\">this</td><td class=\"en\">that</td></tr><tr><td>複數</td><td class=\"en\">these</td><td class=\"en\">those</td></tr></table><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">Me and Amy are friends.</span>　→ 動詞前要用主格 Amy and I</p><p class=\"en\"><span class=\"bad\">This book is my.</span>　→ 後面沒接名詞，要用 mine</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">The dog is eating it's food.</span>　→ it's 是 it is，所有格是 its</p></div>", "questions": [{"q": "I don't know that tall girl. Do you know ____ ?", "opts": [{"t": "she", "ok": false, "fb": "know 是動詞，後面要接受格。she 是主格，只能放動詞前面。"}, {"t": "her", "ok": true, "fb": "動詞 know 後面要用受格，she 的受格是 her。"}, {"t": "hers", "ok": false, "fb": "hers 是所有格代名詞，意思是「她的東西」，不是「她」。"}, {"t": "her's", "ok": false, "fb": "代名詞的所有格不用加一撇，沒有 her's 這種寫法。"}]}, {"q": "This blue umbrella isn't mine. I think it's ____ .", "opts": [{"t": "her", "ok": false, "fb": "her 後面要接名詞，像 her umbrella。這裡後面沒有名詞，要用 hers。"}, {"t": "hers", "ok": true, "fb": "後面沒有接名詞，所以用所有格代名詞 hers，等於 her umbrella。"}, {"t": "she", "ok": false, "fb": "she 是主格，不能表示「她的」。"}, {"t": "she's", "ok": false, "fb": "she's 是 she is 的縮寫，意思完全不同。"}]}, {"q": "____ are my new shoes. I got them yesterday.", "opts": [{"t": "This", "ok": false, "fb": "shoes 是複數，而且 be 動詞用 are，指示代名詞要用 These 或 Those。"}, {"t": "That", "ok": false, "fb": "That 是單數用的，配 is。這裡是 are，要用複數的 These 或 Those。"}, {"t": "These", "ok": true, "fb": "shoes 是複數，配 are；剛拿到、在身邊的東西用 These。"}, {"t": "It", "ok": false, "fb": "It 是單數，要配 is，不能配 are。"}]}, {"q": "____ and I are in the same basketball team.", "opts": [{"t": "Him", "ok": false, "fb": "這個空格是句子的主詞，在動詞 are 前面，要用主格 He。"}, {"t": "He", "ok": true, "fb": "空格和 I 一起當主詞，放在動詞前面，要用主格。"}, {"t": "His", "ok": false, "fb": "his 是所有格，後面要接名詞，不能單獨當主詞。"}, {"t": "He's", "ok": false, "fb": "He's 是 He is 的縮寫，句子後面已經有 are 了，會變成兩個動詞。"}]}, {"q": "____ book here is mine, and ____ one over there is Amy's.", "opts": [{"t": "This / that", "ok": true, "fb": "here 表示近的用 This，over there 表示遠的用 that。"}, {"t": "That / this", "ok": false, "fb": "遠近顛倒了。here 是近的，over there 是遠的。"}, {"t": "These / those", "ok": false, "fb": "book 和 one 都是單數，要用單數的 this 和 that。"}, {"t": "This / these", "ok": false, "fb": "前半對了，但 one 是單數，而且在遠處，要用 that。"}]}, {"q": "The dog is looking for ____ ball. It can't find it.", "opts": [{"t": "it", "ok": false, "fb": "it 不能表示「它的」。後面接了名詞 ball，要用所有格 its。"}, {"t": "it's", "ok": false, "fb": "it's 是 it is 的縮寫。把它代回去會變成「the dog is looking for it is ball」。"}, {"t": "its", "ok": true, "fb": "its 是 it 的所有格形容詞，後面接名詞 ball。注意沒有一撇。"}, {"t": "its'", "ok": false, "fb": "沒有 its' 這種寫法。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "Our teacher often helps us with our homework.", "ok": false, "fb": "這句是對的。helps 後面用受格 us，homework 前面用所有格 our。"}, {"t": "Me and my brother go to school together.", "ok": true, "fb": "這句錯了。放在動詞前面當主詞要用主格，應該是 My brother and I。"}, {"t": "Those pens on the desk are theirs.", "ok": false, "fb": "這句是對的。pens 是複數用 Those，句尾沒接名詞用 theirs。"}, {"t": "Is this yours or hers?", "ok": false, "fb": "這句是對的。後面都沒有接名詞，用所有格代名詞。"}]}, {"q": "Tom and Jack are my classmates. ____ often sit next to ____ in class.", "opts": [{"t": "Them / I", "ok": false, "fb": "兩個都放反了。動詞前面要用主格 They，介系詞 to 後面要用受格 me。"}, {"t": "They / me", "ok": true, "fb": "They 在動詞 sit 前面用主格；me 在介系詞 next to 後面用受格。"}, {"t": "They / I", "ok": false, "fb": "前半對了，但 next to 是介系詞，後面要接受格 me。"}, {"t": "Their / me", "ok": false, "fb": "their 是所有格形容詞，後面要接名詞，不能單獨當主詞。"}]}]}, {"id": "be-qa", "title": "be 動詞的問答句", "unit": "第一冊 Unit 1 · B1 L1–3", "points": "<p>be 動詞的問句就是<strong>把 be 動詞搬到最前面</strong>，回答時再把它搬回來。難的地方在：簡答要用哪個 be 動詞、以及主詞要不要換人。</p><h3>三個 be 動詞的配對</h3><table><tr><th>主詞</th><th>be 動詞</th></tr><tr><td>I</td><td class=\"en\">am</td></tr><tr><td>He / She / It、單數名詞</td><td class=\"en\">is</td></tr><tr><td>You / We / They、複數名詞</td><td class=\"en\">are</td></tr></table><h3>肯定 → 疑問 → 簡答</h3><p class=\"en\">You <span class=\"k1\">are</span> a student.<br>→ <span class=\"k1\">Are</span> you a student?<br>→ Yes, I <span class=\"k1\">am</span>. / No, I'm not.</p><p>問「你」的時候，回答要換成「我」。問「你們」的時候，回答要換成「我們」。</p><h3>簡答的縮寫規則</h3><table><tr><th>肯定簡答</th><th>否定簡答</th></tr><tr><td class=\"en\">Yes, I am.　<span class=\"bad\">Yes, I'm.</span></td><td class=\"en\">No, I'm not.</td></tr><tr><td class=\"en\">Yes, he is.　<span class=\"bad\">Yes, he's.</span></td><td class=\"en\">No, he isn't.</td></tr></table><p style=\"color:var(--muted);font-size:17px\">記法：肯定簡答不能縮寫，否定簡答可以。</p><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">Yes, I'm.</span>　→ 肯定簡答不縮寫</p><p class=\"en\"><span class=\"bad\">Are you a teacher? Yes, you are.</span>　→ 問你，要回答我</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">Is your parents at home?</span>　→ parents 是複數要用 Are</p></div>", "questions": [{"q": "A: ____ your parents at home now?　B: No, they aren't.", "opts": [{"t": "Is", "ok": false, "fb": "parents 是複數名詞，be 動詞要用 Are。"}, {"t": "Are", "ok": true, "fb": "parents 是複數，用 Are；回答也用了 they aren't，前後一致。"}, {"t": "Am", "ok": false, "fb": "am 只能跟 I 搭配。"}, {"t": "Do", "ok": false, "fb": "句子裡沒有一般動詞，主要動詞就是 be，所以問句要把 be 提前，不用 Do。"}]}, {"q": "A: Are you a new student here?　B: ____", "opts": [{"t": "Yes, I'm.", "ok": false, "fb": "肯定簡答不能縮寫，要完整寫成 Yes, I am."}, {"t": "Yes, I am.", "ok": true, "fb": "問句問「你」，回答換成 I；肯定簡答要用完整的 am。"}, {"t": "Yes, you are.", "ok": false, "fb": "對方問的是你，回答時要換成 I。"}, {"t": "Yes, I do.", "ok": false, "fb": "問句是 Are 開頭，回答就要用 be 動詞，不能換成 do。"}]}, {"q": "A: Is Mr. Lin your English teacher?　B: ____ He teaches us math.", "opts": [{"t": "Yes, he is.", "ok": false, "fb": "後面說他教數學，表示答案是否定的。"}, {"t": "No, he isn't.", "ok": true, "fb": "後一句說他教數學，所以不是英文老師，用否定簡答。"}, {"t": "No, he doesn't.", "ok": false, "fb": "問句用 Is 開頭，簡答也要用 be 動詞。"}, {"t": "No, it isn't.", "ok": false, "fb": "問的是 Mr. Lin 這個人，簡答要用 he。"}]}, {"q": "A: Are you and your sister in the same class?　B: ____", "opts": [{"t": "Yes, I am.", "ok": false, "fb": "問的是你和你姊姊兩個人，回答要用 we。"}, {"t": "Yes, we are.", "ok": true, "fb": "問句包含兩個人，回答時換成 we，配 are。"}, {"t": "Yes, they are.", "ok": false, "fb": "問句裡有 you，代表包含你自己，要回答 we 不是 they。"}, {"t": "Yes, you are.", "ok": false, "fb": "對方問你，回答時要從自己的角度說，不能用 you。"}]}, {"q": "____ these your new shoes? They look really nice.", "opts": [{"t": "Is", "ok": false, "fb": "these 和 shoes 都是複數，要用 Are。"}, {"t": "Are", "ok": true, "fb": "these shoes 是複數，be 動詞用 Are。"}, {"t": "Am", "ok": false, "fb": "am 只跟 I 搭配。"}, {"t": "Be", "ok": false, "fb": "be 是原形，不能直接放在句子裡，要變成 am / is / are。"}]}, {"q": "A: ____ it cold outside?　B: Yes, ____ . Take your coat with you.", "opts": [{"t": "Is / it is", "ok": true, "fb": "問天氣用 it 當主詞，配 is；肯定簡答完整寫成 it is。"}, {"t": "Is / it's", "ok": false, "fb": "前半對了，但肯定簡答不能縮寫成 it's。"}, {"t": "Are / they are", "ok": false, "fb": "講天氣時主詞是 it，是單數，要用 Is。"}, {"t": "Does / it does", "ok": false, "fb": "cold 是形容詞，句子的動詞是 be，問句要用 Is。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "Is your brother good at math?", "ok": false, "fb": "這句是對的。brother 是單數，用 Is。"}, {"t": "Am I late for class?", "ok": false, "fb": "這句是對的。主詞是 I，用 Am。"}, {"t": "Are Judy and Tina in the music club? Yes, they're.", "ok": true, "fb": "這句錯了。肯定簡答不能縮寫，要寫成 Yes, they are."}, {"t": "No, we aren't. We are in Class 3.", "ok": false, "fb": "這句是對的。否定簡答可以縮寫成 aren't。"}]}, {"q": "A: ____ your bag? It's on my chair.　B: Yes, ____ . Thank you!", "opts": [{"t": "Is this / it is", "ok": true, "fb": "指一個東西用 this 配 Is；簡答時用 it 代替那個包包，完整寫成 it is。"}, {"t": "Are these / they are", "ok": false, "fb": "後面用 It's 指單一個東西，所以問句也要用單數。"}, {"t": "Is this / this is", "ok": false, "fb": "簡答時習慣用 it 代替前面提到的東西，回答 it is 而不是 this is。"}, {"t": "Is this / it's", "ok": false, "fb": "前半對了，但肯定簡答不縮寫。"}]}]}, {"id": "adjectives", "title": "形容詞的用法", "unit": "第一冊 Unit 1 · B1 L1–3", "points": "<p>形容詞只有兩個位置可以站：<strong>名詞前面</strong>，或<strong>be 動詞後面</strong>。站錯位置就是錯句。</p><h3>兩個位置</h3><p class=\"en\">She is a <span class=\"k1\">kind</span> teacher.　→ 放在名詞 teacher 前面<br>Her teacher is <span class=\"k1\">kind</span>.　→ 放在 be 動詞後面</p><h3>形容詞沒有單複數</h3><p class=\"en\">They are <span class=\"k1\">tall</span> boys.　<span class=\"bad\">talls boys</span><br>名詞變複數，形容詞不變。</p><h3>加上程度：very / so / too</h3><p class=\"en\">The bag is <span class=\"k2\">very</span> heavy.　（很重）<br>The bag is <span class=\"k2\">too</span> heavy. I can't carry it.　（太重了，重到有問題）</p><p style=\"color:var(--muted);font-size:17px\">too 帶有「超過負荷、造成困擾」的意思，不是單純的「很」。</p><h3>a 還是 an，看形容詞</h3><p class=\"en\">an <span class=\"k1\">old</span> man　→ 冠詞看的是後面緊接著的那個字<br>a <span class=\"k1\">nice</span> apple　→ 雖然 apple 是母音，但緊接在冠詞後的是 nice</p><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">She is a girl beautiful.</span>　→ 形容詞要放名詞前面</p><p class=\"en\"><span class=\"bad\">They are happys.</span>　→ 形容詞不加 s</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">an nice apple</span>　→ 要看 nice 不是 apple</p></div>", "questions": [{"q": "My grandmother is ____ . She always helps her neighbors.", "opts": [{"t": "a kind", "ok": false, "fb": "be 動詞後面直接接形容詞就好，加了 a 就必須再接名詞。"}, {"t": "kind", "ok": true, "fb": "形容詞可以直接放在 be 動詞後面。"}, {"t": "kindly", "ok": false, "fb": "kindly 是副詞，用來修飾動詞。be 動詞後面要接形容詞。"}, {"t": "a kind woman is", "ok": false, "fb": "句子已經有 is 了，不能再放一個動詞。"}]}, {"q": "There are two ____ in my classroom.", "opts": [{"t": "news desks", "ok": false, "fb": "形容詞永遠不加 s，要寫 new desks。"}, {"t": "new desks", "ok": true, "fb": "形容詞放在名詞前面，而且不隨名詞變複數。"}, {"t": "desks new", "ok": false, "fb": "位置錯了。形容詞要放在名詞前面。"}, {"t": "new desk", "ok": false, "fb": "前面有 two，名詞要用複數 desks。"}]}, {"q": "This box is ____ heavy. I can't move it by myself.", "opts": [{"t": "very", "ok": false, "fb": "後面說「我搬不動」，表示重到造成困擾，用 too 比 very 精準。"}, {"t": "too", "ok": true, "fb": "too 表示「太⋯⋯以致於有問題」，正好對應後面的 I can't move it。"}, {"t": "so much", "ok": false, "fb": "so much 不能直接修飾形容詞。"}, {"t": "a", "ok": false, "fb": "be 動詞後面直接接形容詞，不需要冠詞。"}]}, {"q": "Mr. Wang is ____ . Everyone in our school likes him.", "opts": [{"t": "a funny", "ok": false, "fb": "用了 a 就必須接名詞，像 a funny teacher。這裡後面沒有名詞。"}, {"t": "funny", "ok": true, "fb": "be 動詞後面直接接形容詞，不加冠詞也不加名詞。"}, {"t": "funnys", "ok": false, "fb": "形容詞永遠不加 s，不管主詞是單數還是複數。"}, {"t": "a funny man is", "ok": false, "fb": "句子已經有 is，不能再加一個。"}]}, {"q": "Look at that ____ ! It's so cute.", "opts": [{"t": "small dog", "ok": true, "fb": "形容詞 small 放在名詞 dog 前面。"}, {"t": "dog small", "ok": false, "fb": "順序錯了。英文的形容詞放在名詞前面，跟中文一樣是「小狗」不是「狗小」。"}, {"t": "small", "ok": false, "fb": "that 後面需要一個名詞，只放形容詞句子不完整。"}, {"t": "smalls dog", "ok": false, "fb": "形容詞不加 s，而且 dog 是單數，寫成 small dog。"}]}, {"q": "Ted's father is ____ engineer, and his mother is ____ nurse.", "opts": [{"t": "a / an", "ok": false, "fb": "engineer 是母音開頭要用 an；nurse 是子音開頭要用 a。"}, {"t": "an / a", "ok": true, "fb": "engineer 以母音開頭用 an，nurse 以子音開頭用 a。"}, {"t": "an / an", "ok": false, "fb": "前半對了，但 nurse 的 n 是子音，要用 a。"}, {"t": "a / a", "ok": false, "fb": "engineer 的 e 是母音，要用 an。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "She has a beautiful voice.", "ok": false, "fb": "這句是對的。形容詞放在名詞前面。"}, {"t": "The students are all very tireds.", "ok": true, "fb": "這句錯了。形容詞不能加 s，要寫 tired。"}, {"t": "It is an interesting book.", "ok": false, "fb": "這句是對的。interesting 是母音開頭，用 an。"}, {"t": "My new bike is red.", "ok": false, "fb": "這句是對的。new 在名詞前，red 在 be 動詞後，兩個位置都正確。"}]}, {"q": "Amy is ____ girl, and her sister is ____ , too.", "opts": [{"t": "a smart / smart", "ok": true, "fb": "前面接名詞 girl 所以要有冠詞；後面在 be 動詞後直接放形容詞。"}, {"t": "smart / a smart", "ok": false, "fb": "兩邊放反了。girl 前面要有冠詞，第二個空格後面沒有名詞就不加冠詞。"}, {"t": "a smart / a smart", "ok": false, "fb": "第二個空格後面沒有名詞，加了 a 句子就不完整。"}, {"t": "smart / smart", "ok": false, "fb": "第一個空格後面有名詞 girl，是單數可數名詞，前面需要冠詞 a。"}]}]}, {"id": "wh-questions", "title": "Wh- 疑問句", "unit": "第一冊 Unit 1 · B1 L1–3", "points": "<p>Wh- 問句的關鍵是：<strong>先看回答，再決定用哪個疑問詞</strong>。段考題常常先給你答句，要你回推問句。</p><h3>疑問詞對照</h3><table><tr><th>疑問詞</th><th>問什麼</th><th>回答會出現</th></tr><tr><td class=\"en\">What</td><td>什麼東西</td><td>物品、名字、職業</td></tr><tr><td class=\"en\">Who</td><td>誰</td><td>人</td></tr><tr><td class=\"en\">Where</td><td>哪裡</td><td>地點</td></tr><tr><td class=\"en\">When</td><td>什麼時候</td><td>時間</td></tr><tr><td class=\"en\">How</td><td>如何、怎麼樣</td><td>狀態、方法</td></tr><tr><td class=\"en\">How old</td><td>幾歲</td><td>年齡</td></tr><tr><td class=\"en\">Whose</td><td>誰的</td><td>所有格、某人的東西</td></tr></table><h3>句型結構</h3><p class=\"en\"><span class=\"k1\">疑問詞</span> + <span class=\"k2\">be 動詞</span> + 主詞 ?<br><span class=\"k1\">Where</span> <span class=\"k2\">is</span> your school?</p><p>疑問詞放最前面，be 動詞緊接在後，然後才是主詞。</p><h3>Wh- 問句不能用 Yes / No 回答</h3><p class=\"en\">Where is your bag?　<span class=\"bad\">Yes, it is.</span>　→ It's on the desk.</p><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">Where your book is?</span>　→ be 動詞要提到主詞前面</p><p class=\"en\"><span class=\"bad\">Who is your bag?</span>　→ 問東西的主人要用 Whose</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">How old are you? — I'm fine.</span>　→ 問年齡不是問狀況</p></div>", "questions": [{"q": "A: ____ is your new teacher?　B: She is Ms. Chen.", "opts": [{"t": "What", "ok": false, "fb": "回答是一個人名，要用 Who 來問人。"}, {"t": "Who", "ok": true, "fb": "回答 She is Ms. Chen 是一個人，所以問句用 Who。"}, {"t": "Where", "ok": false, "fb": "回答的是一個人名，不是地點，所以不用 Where。"}, {"t": "How", "ok": false, "fb": "How 問的是狀態或方法，但回答給的是一個人。"}]}, {"q": "A: ____ bag is this?　B: It's Judy's.", "opts": [{"t": "Who", "ok": false, "fb": "回答是 Judy's，強調的是「誰的」，要用 Whose。"}, {"t": "Whose", "ok": true, "fb": "回答用了所有格 Judy's，表示問的是東西的主人。"}, {"t": "What", "ok": false, "fb": "問的不是這是什麼東西，而是這是誰的東西。"}, {"t": "Which", "ok": false, "fb": "Which 是在幾個選項中挑一個，這裡沒有給選項。"}]}, {"q": "A: ____ are your grandparents?　B: They are in Yilan.", "opts": [{"t": "When", "ok": false, "fb": "回答 in Yilan 是地點，不是時間。"}, {"t": "Where", "ok": true, "fb": "回答的是一個人名，不是地點，所以不用 Where。"}, {"t": "How", "ok": false, "fb": "How 問狀態或方法，回答會是 fine、by bus 這類答案。"}, {"t": "What", "ok": false, "fb": "回答的是地方，不是東西。"}]}, {"q": "下列哪一組問答是錯的？", "opts": [{"t": "A: How old is your brother?　B: He is twelve.", "ok": false, "fb": "這組是對的。How old 問年齡。"}, {"t": "A: What is your father?　B: He is a police officer.", "ok": false, "fb": "這組是對的。What 也可以用來問職業。"}, {"t": "A: Where is your dog?　B: Yes, it is.", "ok": true, "fb": "這組錯了。Wh- 問句不能用 Yes / No 回答，應該回答地點。"}, {"t": "A: Who are those men?　B: They are my uncles.", "ok": false, "fb": "這組是對的。Who 問人，回答是人。"}]}, {"q": "____ your English class? It's at nine in the morning.", "opts": [{"t": "When is", "ok": true, "fb": "回答 at nine 是時間，用 When；主詞是單數 class，用 is。"}, {"t": "When are", "ok": false, "fb": "疑問詞對了，但 class 是單數，要用 is。"}, {"t": "Where is", "ok": false, "fb": "回答的是時間不是地點。"}, {"t": "What is", "ok": false, "fb": "雖然文法通順，但回答明確給了時間，用 When 才對應。"}]}, {"q": "A: How is your grandmother?　B: ____", "opts": [{"t": "She is seventy.", "ok": false, "fb": "這是回答 How old 的答案。How 單獨用是問狀況。"}, {"t": "She is fine, thank you.", "ok": true, "fb": "How 單獨使用時問的是「過得如何、身體如何」。"}, {"t": "She is in the kitchen.", "ok": false, "fb": "這是回答 Where 的答案。"}, {"t": "She is my grandmother.", "ok": false, "fb": "這是回答 Who 的答案。"}]}, {"q": "下列哪一句的語序是正確的？", "opts": [{"t": "Where your new school is?", "ok": false, "fb": "be 動詞要放在主詞前面，應該是 Where is your new school?"}, {"t": "What is your favorite color?", "ok": true, "fb": "疑問詞、be 動詞、主詞，順序正確。"}, {"t": "Who your best friend is?", "ok": false, "fb": "be 動詞位置錯了，應該是 Who is your best friend?"}, {"t": "How old you are?", "ok": false, "fb": "be 動詞要提前，應該是 How old are you?"}]}, {"q": "A: ____ those students over there?　B: They are my classmates from Class 5.", "opts": [{"t": "Who is", "ok": false, "fb": "疑問詞對了，但 those students 是複數，be 動詞要用 are。"}, {"t": "Who are", "ok": true, "fb": "問的是人用 Who，主詞 those students 是複數用 are。"}, {"t": "What are", "ok": false, "fb": "回答是「我的同學」，是人，要用 Who。"}, {"t": "Whose are", "ok": false, "fb": "Whose 問的是東西的主人，這裡問的是那些人是誰。"}]}]}, {"id": "greetings", "title": "招呼用語與稱呼語", "unit": "第一冊 Unit 1–2 · B1", "points": "<p>這個主題考的不是文法，是<strong>情境合不合適</strong>。看清楚題目給的時間、場合、和對方是誰。</p><h3>稱呼語：一律接姓，不接名</h3><table><tr><th>稱呼</th><th>用在誰身上</th></tr><tr><td class=\"en\">Mr.</td><td>男性，不分已婚未婚</td></tr><tr><td class=\"en\">Mrs.</td><td>已婚女性</td></tr><tr><td class=\"en\">Miss</td><td>未婚女性</td></tr><tr><td class=\"en\">Ms.</td><td>女性，不確定或不強調婚姻狀況</td></tr></table><p class=\"en\">老師叫 David Lin　→ <span class=\"k1\">Mr. Lin</span>　<span class=\"bad\">Mr. David</span>　<span class=\"bad\">Teacher Lin</span></p><p style=\"color:var(--muted);font-size:17px\">英文沒有「Teacher 加姓」這種叫法，這是中文直譯出來的錯誤。</p><h3>招呼語：看時間</h3><table><tr><th>時間</th><th>說什麼</th></tr><tr><td>早上</td><td class=\"en\">Good morning.</td></tr><tr><td>中午到傍晚</td><td class=\"en\">Good afternoon.</td></tr><tr><td>晚上見面時</td><td class=\"en\">Good evening.</td></tr><tr><td>睡前或晚上道別</td><td class=\"en\">Good night.</td></tr></table><p style=\"color:var(--muted);font-size:17px\">Good night 不是打招呼，是道別。晚上遇到人要說 Good evening。</p><h3>成對的問答</h3><p class=\"en\">Nice to meet you. → Nice to meet you, <span class=\"k1\">too</span>.<br>How are you? → I'm fine, thank you. And you?<br>See you tomorrow. → See you.</p>", "questions": [{"q": "____ Lin is our new math teacher. He is very tall and friendly.", "opts": [{"t": "Mr.", "ok": true, "fb": "後面說 He，是男性，用 Mr.。"}, {"t": "Miss", "ok": false, "fb": "Miss 用在未婚女性身上，但這裡說的是 He。"}, {"t": "Mrs.", "ok": false, "fb": "Mrs. 用在已婚女性身上，但這裡說的是 He。"}, {"t": "Ms.", "ok": false, "fb": "Ms. 是女性的稱呼，這位老師是男性。"}]}, {"q": "My English teacher's name is David Lin. In class I should call him ____ .", "opts": [{"t": "Mr. David", "ok": false, "fb": "Mr. 後面要接姓，David 是名字。他的姓是 Lin。"}, {"t": "Mr. Lin", "ok": true, "fb": "Mr. 後面接姓氏。David 是名，Lin 是姓。"}, {"t": "Teacher Lin", "ok": false, "fb": "英文不會把 Teacher 當稱呼用，這是中文直接翻譯造成的錯誤。"}, {"t": "Teacher David", "ok": false, "fb": "英文沒有這種叫法，而且也用錯了名字的部分。"}]}, {"q": "It's eight o'clock in the evening. Ted meets his neighbor on the street and says, \"____\"", "opts": [{"t": "Good morning.", "ok": false, "fb": "現在是晚上八點，不是早上。"}, {"t": "Good afternoon.", "ok": false, "fb": "afternoon 是中午到傍晚，八點已經是晚上了。"}, {"t": "Good evening.", "ok": true, "fb": "晚上見到人打招呼用 Good evening。"}, {"t": "Good night.", "ok": false, "fb": "Good night 是道別或睡前才說的，不是見面時的招呼。"}]}, {"q": "A: Nice to meet you, Ms. Wang.　B: ____", "opts": [{"t": "Nice to meet you, too.", "ok": true, "fb": "初次見面的固定回應，記得加 too。"}, {"t": "I'm fine, thank you.", "ok": false, "fb": "這是回答 How are you? 的答案，不是初次見面的回應。"}, {"t": "You're welcome.", "ok": false, "fb": "這是對方道謝時才說的。"}, {"t": "See you tomorrow.", "ok": false, "fb": "這是道別用的，但兩人才剛見面。"}]}, {"q": "The class is over. Ted will see Amy again at school tomorrow. He says, \"____\"", "opts": [{"t": "How are you?", "ok": false, "fb": "這是見面時的問候，但他們正要分開。"}, {"t": "See you tomorrow.", "ok": true, "fb": "下課要分開、明天還會再見面，用 See you tomorrow。"}, {"t": "Nice to meet you.", "ok": false, "fb": "這句用在第一次見面，他們早就認識了。"}, {"t": "Good night.", "ok": false, "fb": "Good night 用在晚上道別或睡前，現在是下課時間。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "Good morning, Mr. Wang.", "ok": false, "fb": "這句是對的。Mr. 加姓氏，時間也對應。"}, {"t": "Hello, Teacher Chen.", "ok": true, "fb": "這句錯了。英文不用 Teacher 當稱呼，應該說 Ms. Chen 或 Mr. Chen。"}, {"t": "Nice to meet you, Miss Lee.", "ok": false, "fb": "這句是對的。Miss 加姓氏沒有問題。"}, {"t": "How are you, Mrs. Lin?", "ok": false, "fb": "這句是對的。Mrs. 用在已婚女性，後面接姓氏。"}]}]}, {"id": "imperative", "title": "祈使句", "unit": "第一冊 Unit 2 · B1 L4–6", "points": "<p>祈使句用來叫人做事或不要做事。特徵是<strong>句子開頭直接就是動詞原形，沒有主詞</strong>。</p><h3>四種基本形式</h3><table><tr><th>要人做</th><td class=\"en\"><span class=\"k1\">Close</span> the door.</td></tr><tr><th>要人不要做</th><td class=\"en\"><span class=\"k2\">Don't</span> <span class=\"k1\">close</span> the door.</td></tr><tr><th>形容詞開頭</th><td class=\"en\"><span class=\"k1\">Be</span> quiet.</td></tr><tr><th>形容詞的否定</th><td class=\"en\"><span class=\"k2\">Don't be</span> late.</td></tr></table><p style=\"color:var(--muted);font-size:17px\">要注意的是 <span class=\"en\">Don't <span class=\"k1\">be</span></span>。中文說「不要遲到」沒有動詞，但英文的 late 是形容詞，前面必須有 be。</p><h3>加上 please 更客氣</h3><p class=\"en\"><span class=\"k3\">Please</span> sit down.　=　Sit down, <span class=\"k3\">please</span>.</p><p>please 放句尾時，前面要加逗號。</p><h3>Let's：提議一起做</h3><p class=\"en\"><span class=\"k1\">Let's</span> go to the park.　<span class=\"bad\">Let's to go</span></p><p>Let's 後面直接接動詞原形，不加 to。</p><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">Not open the window.</span>　→ 否定要用 Don't</p><p class=\"en\"><span class=\"bad\">Don't late for school.</span>　→ late 是形容詞，要寫 Don't be late</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">You close the door.</span>　→ 祈使句不放主詞</p></div>", "questions": [{"q": "____ the door, please. It's really cold outside.", "opts": [{"t": "Closing", "ok": false, "fb": "祈使句要用動詞原形開頭，不能用 V-ing。"}, {"t": "Close", "ok": true, "fb": "祈使句直接用動詞原形開頭，不需要主詞。"}, {"t": "Closes", "ok": false, "fb": "祈使句沒有主詞，動詞不用加 s。"}, {"t": "To close", "ok": false, "fb": "祈使句的開頭是動詞原形，不加 to。"}]}, {"q": "____ late for school again! Your teacher will be angry.", "opts": [{"t": "Don't be", "ok": true, "fb": "late 是形容詞，前面一定要有 be。否定祈使句是 Don't be。"}, {"t": "Don't", "ok": false, "fb": "少了 be。late 是形容詞，不是動詞，不能直接接在 Don't 後面。"}, {"t": "Not be", "ok": false, "fb": "祈使句的否定要用 Don't，不能只用 Not。"}, {"t": "Aren't", "ok": false, "fb": "祈使句的否定固定用 Don't，不會用 Aren't 開頭。"}]}, {"q": "____ quiet in the library. Other people are reading.", "opts": [{"t": "Be", "ok": true, "fb": "quiet 是形容詞，祈使句要用 Be 開頭。"}, {"t": "Are", "ok": false, "fb": "祈使句沒有主詞，be 動詞要用原形 Be，不是 Are。"}, {"t": "Do", "ok": false, "fb": "Do 後面要接動詞，但 quiet 是形容詞。"}, {"t": "Being", "ok": false, "fb": "祈使句用原形開頭，不用 V-ing。"}]}, {"q": "It's a nice day today. ____ go to the beach!", "opts": [{"t": "Let's", "ok": true, "fb": "提議一起做某件事用 Let's，後面直接接動詞原形。"}, {"t": "Let", "ok": false, "fb": "少了 us。提議「我們一起」要用 Let's。"}, {"t": "Let's to", "ok": false, "fb": "Let's 後面直接接原形動詞，不加 to。"}, {"t": "Lets", "ok": false, "fb": "少了那一撇。Let's 是 Let us 的縮寫。"}]}, {"q": "Your friend looks worried about tomorrow's test. You want to tell him to relax. You say: ____", "opts": [{"t": "Don't worry.", "ok": true, "fb": "叫人不要做某事，用 Don't 加動詞原形。"}, {"t": "Not worry.", "ok": false, "fb": "祈使句的否定要用 Don't，不能只用 Not。"}, {"t": "Doesn't worry.", "ok": false, "fb": "祈使句沒有主詞，不會有第三人稱單數的變化。"}, {"t": "Don't worried.", "ok": false, "fb": "Don't 後面要接動詞原形，不是過去式或形容詞形。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "Don't run in the hallway.", "ok": false, "fb": "這句是對的。Don't 加動詞原形。"}, {"t": "Please sit down.", "ok": false, "fb": "這句是對的。please 放句首不用逗號。"}, {"t": "Not open the window.", "ok": true, "fb": "這句錯了。否定祈使句要用 Don't open the window。"}, {"t": "Be careful!", "ok": false, "fb": "這句是對的。careful 是形容詞，用 Be 開頭。"}]}, {"q": "下列哪一句正確表達「請幫我開燈」？", "opts": [{"t": "You turn on the light, please.", "ok": false, "fb": "祈使句不放主詞，加了 You 就變成一般敘述句。"}, {"t": "Turn on the light, please.", "ok": true, "fb": "動詞原形開頭，沒有主詞，句尾加逗號和 please。"}, {"t": "Turning on the light, please.", "ok": false, "fb": "祈使句用原形開頭，不用 V-ing。"}, {"t": "To turn on the light, please.", "ok": false, "fb": "祈使句的開頭不加 to。"}]}, {"q": "____ your homework first, and ____ play computer games before dinner.", "opts": [{"t": "Do / don't", "ok": true, "fb": "前半是肯定祈使句用原形 Do，後半是否定祈使句用 don't。"}, {"t": "Doing / not", "ok": false, "fb": "祈使句用原形開頭，否定要用 don't。"}, {"t": "Does / doesn't", "ok": false, "fb": "祈使句沒有主詞，不會有第三人稱單數變化。"}, {"t": "Do / not", "ok": false, "fb": "前半對了，但否定祈使句要用 don't，不能只用 not。"}]}]}, {"id": "place-prep", "title": "地方介系詞與同位語", "unit": "第一冊 Unit 2 · B1 L4–6", "points": "<p>介系詞的題目很少直接問「in 是什麼意思」，而是給你一個情境，要你判斷<strong>東西實際在哪個位置</strong>。</p><h3>常用的地方介系詞</h3><table><tr><th>介系詞</th><th>位置</th><th>例子</th></tr><tr><td class=\"en\">in</td><td>在裡面</td><td class=\"en\">in the box</td></tr><tr><td class=\"en\">on</td><td>在上面、有接觸</td><td class=\"en\">on the wall</td></tr><tr><td class=\"en\">under</td><td>在下面</td><td class=\"en\">under the desk</td></tr><tr><td class=\"en\">behind</td><td>在後面</td><td class=\"en\">behind the door</td></tr><tr><td class=\"en\">in front of</td><td>在前面</td><td class=\"en\">in front of the school</td></tr><tr><td class=\"en\">next to</td><td>在旁邊</td><td class=\"en\">next to the bank</td></tr><tr><td class=\"en\">between A and B</td><td>在兩者之間</td><td class=\"en\">between the park and the store</td></tr><tr><td class=\"en\">near</td><td>在附近</td><td class=\"en\">near my house</td></tr></table><h3>at 和 in 的差別</h3><p class=\"en\">She is <span class=\"k1\">at</span> home.　→ 把地點看成一個點<br>She is <span class=\"k2\">in</span> the kitchen.　→ 強調在某個空間裡面</p><h3>同位語：換句話說同一個人</h3><p class=\"en\">My best friend<span class=\"k3\">,</span> Judy<span class=\"k3\">,</span> is from Yilan.</p><p>Judy 就是 my best friend，兩個講的是同一個人。同位語<strong>前後都要有逗號</strong>，少一個就錯。</p><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">between the park or the store</span>　→ between 固定配 and</p><p class=\"en\"><span class=\"bad\">in front the school</span>　→ in front of 少了 of</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">My friend, Amy is a nurse.</span>　→ 同位語後面也要逗號</p></div>", "questions": [{"q": "The ball is ____ the box, so you can't see it. The box is closed.", "opts": [{"t": "on", "ok": false, "fb": "如果在盒子上面就看得見了。看不見表示在裡面。"}, {"t": "in", "ok": true, "fb": "盒子是關著的、看不到球，表示球在盒子裡面。"}, {"t": "under", "ok": false, "fb": "在盒子下面通常還是看得到一部分，而且題目說盒子是關著的。"}, {"t": "behind", "ok": false, "fb": "「盒子是關著的」這個線索指向裡面，不是後面。"}]}, {"q": "Ted sits ____ me in class, so I can only see his back.", "opts": [{"t": "behind", "ok": false, "fb": "如果他坐在我後面，我要回頭才看得到他，不會一直看到他的背。"}, {"t": "in front of", "ok": true, "fb": "看得到他的背，表示他坐在我前面。"}, {"t": "next to", "ok": false, "fb": "坐旁邊會看到他的側面，不是背面。"}, {"t": "under", "ok": false, "fb": "人不會坐在別人下面。"}]}, {"q": "The bank is ____ the post office ____ the school.", "opts": [{"t": "between / and", "ok": true, "fb": "between 固定和 and 一起用，表示在兩者之間。"}, {"t": "between / or", "ok": false, "fb": "between 只能配 and，不能配 or。"}, {"t": "in / and", "ok": false, "fb": "in 表示在裡面，不能用來說兩個地方的中間。"}, {"t": "next / to", "ok": false, "fb": "next to 是「在旁邊」，而且不能拆開來放在兩個空格。"}]}, {"q": "A: Where is your mother?　B: She is ____ home. She is cooking ____ the kitchen.", "opts": [{"t": "at / in", "ok": true, "fb": "at home 是固定用法，把家當成一個地點；廚房是一個空間，用 in。"}, {"t": "in / at", "ok": false, "fb": "兩個放反了。at home 是固定說法，而 in the kitchen 強調在那個空間裡。"}, {"t": "on / in", "ok": false, "fb": "on 表示接觸表面，不能用在 home。"}, {"t": "at / on", "ok": false, "fb": "前半對了，但在廚房裡面要用 in。"}]}, {"q": "A: Where is my pencil?　B: It's ____ your book. Just lift the book and you'll see it.", "opts": [{"t": "on", "ok": false, "fb": "如果在書上面，不用把書拿起來就看得到了。"}, {"t": "under", "ok": true, "fb": "要把書拿起來才看得到，表示鉛筆壓在書下面。"}, {"t": "behind", "ok": false, "fb": "平放的書談不上前後，而且線索是「拿起來」。"}, {"t": "in", "ok": false, "fb": "如果夾在書裡面，會說 in the book，但線索是把書整本拿起來。"}]}, {"q": "There are some beautiful pictures ____ the wall of my bedroom.", "opts": [{"t": "in", "ok": false, "fb": "畫貼在牆面上是接觸表面，不是在牆的裡面。"}, {"t": "on", "ok": true, "fb": "接觸到表面就用 on，掛在牆上是 on the wall。"}, {"t": "under", "ok": false, "fb": "under 是在下面，畫是掛在牆面上。"}, {"t": "at", "ok": false, "fb": "at 把地點看成一個點，不用來描述貼在表面上。"}]}, {"q": "下列哪一句的標點是正確的？", "opts": [{"t": "My best friend, Judy is from Yilan.", "ok": false, "fb": "同位語前後都要有逗號，Judy 後面也要加一個。"}, {"t": "My best friend, Judy, is from Yilan.", "ok": true, "fb": "同位語 Judy 前後都用逗號隔開，這是正確寫法。"}, {"t": "My best friend Judy, is from Yilan.", "ok": false, "fb": "逗號只放了後面，前面也需要一個。"}, {"t": "My, best friend Judy is from Yilan.", "ok": false, "fb": "逗號放錯位置了，切斷了 my 和 best friend。"}]}, {"q": "My school is ____ the park and the hospital, and it's ____ Zhongshan Road.", "opts": [{"t": "between / on", "ok": true, "fb": "夾在兩個地方中間用 between... and；街道用 on。"}, {"t": "in front of / on", "ok": false, "fb": "句中有 and 連接兩個地點，表示夾在中間，要用 between。"}, {"t": "between / in", "ok": false, "fb": "前半對了，但說某條路上要用 on Zhongshan Road。"}, {"t": "next to / in", "ok": false, "fb": "next to 只能講一個地方的旁邊，而且街道要用 on。"}]}]}, {"id": "there-be", "title": "There is / There are", "unit": "第一冊 Unit 2 · B1 L4–6", "points": "<p>There is / are 用來說「某個地方有什麼」。決定用 is 還是 are 的，是<strong>後面緊接著的那個名詞</strong>，不是 there。</p><h3>基本判斷</h3><table><tr><th>後面的名詞</th><th>用</th><th>例子</th></tr><tr><td>單數</td><td class=\"en\">There is</td><td class=\"en\">There <span class=\"k1\">is</span> a cat in the yard.</td></tr><tr><td>複數</td><td class=\"en\">There are</td><td class=\"en\">There <span class=\"k1\">are</span> two cats in the yard.</td></tr><tr><td>不可數</td><td class=\"en\">There is</td><td class=\"en\">There <span class=\"k1\">is</span> some water in the cup.</td></tr></table><h3>兩樣東西並列時，看最靠近的那個</h3><p class=\"en\">There <span class=\"k1\">is</span> <span class=\"k2\">a bed</span> and two chairs in the room.<br>There <span class=\"k1\">are</span> <span class=\"k2\">two chairs</span> and a bed in the room.</p><p style=\"color:var(--muted);font-size:17px\">be 動詞跟著離它最近的名詞走。這是段考很愛考的細節。</p><h3>否定與疑問</h3><p class=\"en\">There <span class=\"k1\">isn't</span> a park near my house.<br><span class=\"k1\">Is there</span> a park near your house? → Yes, there <span class=\"k1\">is</span>. / No, there <span class=\"k1\">isn't</span>.<br><span class=\"k1\">Are there</span> any students in the room? → Yes, there <span class=\"k1\">are</span>.</p><p>簡答的主詞還是 there，不會換成 it 或 they。</p><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">There have a park near my house.</span>　→ 不能用 have，要用 is</p><p class=\"en\"><span class=\"bad\">Are there any books? Yes, they are.</span>　→ 簡答仍然用 there</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">There are a bed and two chairs.</span>　→ 看最近的 a bed，要用 is</p></div>", "questions": [{"q": "____ some interesting books on my desk.", "opts": [{"t": "There is", "ok": false, "fb": "books 是複數，要用 There are。"}, {"t": "There are", "ok": true, "fb": "後面接的 books 是複數，用 There are。"}, {"t": "It is", "ok": false, "fb": "「某處有某物」的句型固定用 There is / There are 開頭。"}, {"t": "They are", "ok": false, "fb": "They are 是「它們是」，不能表達「有」。"}]}, {"q": "There ____ a bed and two chairs in my room.", "opts": [{"t": "is", "ok": true, "fb": "be 動詞跟著離它最近的名詞走，最近的是 a bed，所以用 is。"}, {"t": "are", "ok": false, "fb": "雖然總共有三樣東西，但 be 動詞要跟最靠近的 a bed 一致。"}, {"t": "have", "ok": false, "fb": "There 後面不能接 have，這個句型固定用 be 動詞。"}, {"t": "has", "ok": false, "fb": "There 後面固定接 be 動詞，不用 has。"}]}, {"q": "____ any milk in the fridge. Please buy some on your way home.", "opts": [{"t": "There isn't", "ok": true, "fb": "milk 是不可數名詞，當成單數處理，用 There isn't。"}, {"t": "There aren't", "ok": false, "fb": "milk 是不可數名詞，不能當複數看，要用 isn't。"}, {"t": "There is", "ok": false, "fb": "後面說請去買，表示現在沒有，要用否定。"}, {"t": "There have not", "ok": false, "fb": "這個句型不用 have，而且否定要寫成 There isn't。"}]}, {"q": "A: Are there any students in the music room?　B: ____ They are practicing for the show.", "opts": [{"t": "Yes, there are.", "ok": true, "fb": "Are there 開頭的問句，簡答主詞仍然用 there。"}, {"t": "Yes, they are.", "ok": false, "fb": "簡答時主詞不會換成 they，還是要用 there。"}, {"t": "Yes, there is.", "ok": false, "fb": "問句用了 Are there，簡答也要用 are。"}, {"t": "Yes, it is.", "ok": false, "fb": "這個句型的簡答固定用 there，不用 it。"}]}, {"q": "A: ____ a hospital near your house?　B: Yes, ____ . It's just behind the park.", "opts": [{"t": "Is there / there is", "ok": true, "fb": "a hospital 是單數用 Is there，簡答也用 there is。"}, {"t": "Are there / there are", "ok": false, "fb": "a hospital 是單數，要用 Is there。"}, {"t": "Is it / it is", "ok": false, "fb": "問「有沒有」要用 There is 的句型，不是 Is it。"}, {"t": "Does there have / there does", "ok": false, "fb": "這個句型不用 have，也不用助動詞 does。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "There are four people in my family.", "ok": false, "fb": "這句是對的。people 是複數，用 are。"}, {"t": "There have a big tree in front of my school.", "ok": true, "fb": "這句錯了。「有」在這個句型用 be 動詞，應該是 There is a big tree。"}, {"t": "There isn't a dog in the yard.", "ok": false, "fb": "這句是對的。單數的否定用 isn't。"}, {"t": "Is there a bank near here?", "ok": false, "fb": "這句是對的。單數的疑問句把 is 提到 there 前面。"}]}, {"q": "There ____ two boys and a girl in the picture. They are all wearing school uniforms.", "opts": [{"t": "are", "ok": true, "fb": "離 be 動詞最近的是 two boys，是複數，所以用 are。"}, {"t": "is", "ok": false, "fb": "最靠近的名詞是 two boys，是複數，要用 are。"}, {"t": "have", "ok": false, "fb": "這個句型不用 have。"}, {"t": "be", "ok": false, "fb": "be 是原形，句子裡要用 is 或 are。"}]}, {"q": "A: How many chairs ____ in the classroom?　B: ____ thirty.", "opts": [{"t": "are there / There are", "ok": true, "fb": "問數量時把 there 和 be 動詞倒裝；chairs 是複數，用 are。"}, {"t": "there are / There are", "ok": false, "fb": "疑問句要把 be 動詞提到 there 前面，寫成 are there。"}, {"t": "is there / There is", "ok": false, "fb": "chairs 是複數，要用 are。"}, {"t": "do there have / There have", "ok": false, "fb": "這個句型不用 have，也不用助動詞 do。"}]}]}, {"id": "present-cont", "title": "現在進行式", "unit": "第一冊 Unit 2 · B1 L4–6", "points": "<p>用來說<strong>此刻正在發生</strong>的事。難的不是拼字，是判斷句子到底在講「現在正在做」還是「平常都會做」。</p><div class=\"formula\"><span class=\"tag k0\">主詞</span><span class=\"plus\">+</span><span class=\"tag k1\">be 動詞</span><span class=\"plus\">+</span><span class=\"tag k2\">動詞-ing</span></div><p class=\"en\">She <span class=\"k1\">is</span> <span class=\"k2\">reading</span> a book.<span class=\"hintword\">　她正在看書。</span></p><h3>be 動詞要跟主詞配對</h3><table><tr><th>主詞</th><th>be 動詞</th><th>例句</th></tr><tr><td>I</td><td>am</td><td class=\"en\">I <span class=\"k1\">am</span> <span class=\"k2\">eating</span>.</td></tr><tr><td>He / She / It<br>單數名詞</td><td>is</td><td class=\"en\">Tom <span class=\"k1\">is</span> <span class=\"k2\">running</span>.</td></tr><tr><td>You / We / They<br>複數名詞</td><td>are</td><td class=\"en\">They <span class=\"k1\">are</span> <span class=\"k2\">singing</span>.</td></tr></table><h3>動詞加 -ing 的三種拼法</h3><table><tr><th>情況</th><th>怎麼做</th><th>例子</th></tr><tr><td>一般動詞</td><td>直接加 -ing</td><td class=\"en\">play → play<span class=\"k2\">ing</span></td></tr><tr><td>字尾是 e</td><td>去 e 再加 -ing</td><td class=\"en\">write → writ<span class=\"k2\">ing</span></td></tr><tr><td>短母音＋單子音</td><td>重複字尾再加 -ing</td><td class=\"en\">run → run<span class=\"k2\">ning</span></td></tr></table><h3>什麼時候該用？三種線索</h3><table><tr><th>線索</th><th>怎麼看</th><th>例子</th></tr><tr><td>時間詞</td><td>句中有 now、right now、at the moment、today、tonight</td><td class=\"en\">He is sleeping <strong>now</strong>.</td></tr><tr><td>開頭的提醒</td><td>Look!、Listen!、Be careful! 開頭，表示叫你注意眼前的事</td><td class=\"en\"><strong>Listen!</strong> Someone is crying.</td></tr><tr><td>句意暗示</td><td>沒有任何關鍵字，要從前後句判斷</td><td class=\"en\">Don't go in. Dad <span class=\"k1\">is</span> <span class=\"k2\">sleeping</span>.</td></tr></table><p style=\"color:var(--muted);font-size:17px\">第三種最常出現在段考。像「Please call back later.」「Don't turn off the computer.」這種句子沒有 now，但意思就是此刻正在發生。</p><p style=\"margin-top:16px\">對照組：句中有 <strong>every day、usually、always、on Sundays</strong> 這類字，講的是平常的習慣，要用現在簡單式，不能用進行式。</p><h3>否定句與疑問句</h3><ul><li class=\"en\">否定：把 not 放在 be 後面 —— He <span class=\"k1\">is</span> <strong>not</strong> <span class=\"k2\">sleeping</span>.</li><li class=\"en\">疑問：把 be 移到最前面 —— <span class=\"k1\">Are</span> you <span class=\"k2\">cooking</span>?</li><li class=\"en\">簡答：Yes, I <span class=\"k1\">am</span>. / No, I'm not.</li></ul><div class=\"warn\"><strong>最容易被扣分的三個地方</strong><p class=\"en\"><span class=\"bad\">He playing basketball.</span>　→ 漏掉 be 動詞</p><p class=\"en\"><span class=\"bad\">They is running.</span>　→ be 動詞跟主詞不合</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">I am play.</span>　→ 動詞忘了變 -ing</p></div><details style=\"margin-top:18px\"><summary>學生常問的問題</summary><p style=\"margin-top:10px\"><strong>Q：Yes, I am. 可以縮寫成 Yes, I'm. 嗎？</strong><br>不行。簡答的肯定句一定要用完整的 am / is / are，否定才可以縮寫成 No, I'm not.</p><p><strong>Q：怎麼判斷該用現在進行式還是現在簡單式？</strong><br>看句子在講「此刻正在做」還是「平常都會做」。有 now、Look! 用進行式；有 every day、usually 用簡單式。</p><p style=\"margin-bottom:0\"><strong>Q：run 為什麼要變成 running？</strong><br>因為 run 是「短母音 u ＋單子音 n」結尾。write 的字尾是 e，不適用這條規則，所以是 writing 不是 writting。</p></details>", "questions": [{"q": "Kevin usually ____ to school, but it's raining today, so his mom ____ him.", "opts": [{"t": "walks / is driving", "ok": true, "fb": "usually 表示平常的習慣，用現在簡單式；today 加上下雨這個情況，是今天才發生的事，用現在進行式。"}, {"t": "is walking / drives", "ok": false, "fb": "兩個時態放反了。usually 是習慣，today 才是現在的狀況。"}, {"t": "walks / drives", "ok": false, "fb": "前半句對了，但後半句在講今天因為下雨才發生的事，要用現在進行式 is driving。"}, {"t": "is walking / is driving", "ok": false, "fb": "後半句對了，但 usually 是平常的習慣，要用現在簡單式 walks。"}]}, {"q": "Listen! The children next door ____ again.", "opts": [{"t": "is shouting", "ok": false, "fb": "時態判斷對了，但 children 是複數，be 動詞要用 are。"}, {"t": "are shouting", "ok": true, "fb": "Listen! 表示此刻正在發生，用進行式；children 是複數，配 are。"}, {"t": "shout", "ok": false, "fb": "Listen! 是叫你注意「現在」聽到的聲音，不是講他們平常會做的事。"}, {"t": "shouting", "ok": false, "fb": "少了 be 動詞。V-ing 前面一定要有 am / is / are。"}]}, {"q": "A: Can I talk to David?　B: Sorry, he ____ a shower. Please call back later.", "opts": [{"t": "takes", "ok": false, "fb": "「等一下再打來」代表他現在正在洗，不是講他平常的習慣。要用進行式。"}, {"t": "is taking", "ok": true, "fb": "句中沒有 now，但「Please call back later」就是暗示他此刻正在洗澡。這種靠句意判斷的題目最常考。"}, {"t": "take", "ok": false, "fb": "主詞 he 是第三人稱單數，動詞不能用原形；而且這裡要用進行式。"}, {"t": "is take", "ok": false, "fb": "be 動詞後面要接 V-ing，應該是 is taking。"}]}, {"q": "Don't turn off the computer. Your sister ____ it to do her report.", "opts": [{"t": "uses", "ok": false, "fb": "「不要關掉電腦」代表她現在正在用。現在簡單式講的是平常習慣。"}, {"t": "used", "ok": false, "fb": "used 是過去式，但這句話講的是眼前的狀況。"}, {"t": "is using", "ok": true, "fb": "沒有 now，但「不要關掉」這個提醒本身就代表她此刻正在使用。"}, {"t": "is use", "ok": false, "fb": "be 動詞後面必須接 V-ing，要寫 is using。"}]}, {"q": "A: ____ your brother doing in the kitchen?　B: He is making a sandwich.", "opts": [{"t": "What is", "ok": true, "fb": "疑問詞 What 放最前面，接著把 be 動詞提前。主詞 brother 是單數，用 is。"}, {"t": "What are", "ok": false, "fb": "疑問詞用對了，但主詞 your brother 是單數，be 動詞要用 is。"}, {"t": "What does", "ok": false, "fb": "回答句用了 is making，是進行式。疑問句也要用 be 動詞，不能用 does。"}, {"t": "How is", "ok": false, "fb": "回答是「做三明治」，問的是「做什麼」，要用 What；How 是問方法或狀態。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "Look! It's raining outside.", "ok": false, "fb": "這句是對的。Look! 配進行式，It's 是 It is 的縮寫。"}, {"t": "They aren't playing basketball now.", "ok": false, "fb": "這句是對的。否定句把 not 放在 be 後面，aren't playing 沒有問題。"}, {"t": "Is your sister do her homework?", "ok": true, "fb": "這句錯了。be 動詞提前之後，後面的動詞要變成 V-ing，應該是 Is your sister doing her homework?"}, {"t": "We are having lunch in the park.", "ok": false, "fb": "這句是對的。have 在這裡是「吃」，可以用進行式。"}]}, {"q": "The students are ____ on the floor and ____ to the story.", "hint": "（sit / listen）", "opts": [{"t": "siting / listenning", "ok": false, "fb": "兩個都拼錯了。sit 要重複 t 變 sitting；listen 直接加 -ing 就好。"}, {"t": "sitting / listening", "ok": true, "fb": "sit 是短母音 i ＋單子音 t，要重複字尾；listen 不符合這條規則，直接加 -ing。"}, {"t": "siting / listening", "ok": false, "fb": "listen 對了，但 sit 是短母音＋單子音結尾，要重複 t 變成 sitting。"}, {"t": "sitting / listenning", "ok": false, "fb": "sit 對了，但 listen 的重音不在最後一個音節，不重複字尾，直接寫 listening。"}]}, {"q": "My grandparents ____ in Yilan, but this month they ____ with us in Taipei.", "opts": [{"t": "live / are staying", "ok": true, "fb": "住在宜蘭是長期的事實，用現在簡單式；this month 表示這段期間的暫時狀況，用進行式。"}, {"t": "are living / stay", "ok": false, "fb": "兩個放反了。長住宜蘭是事實，這個月來台北才是暫時的。"}, {"t": "live / stay", "ok": false, "fb": "前半句對了，但 this month 表示暫時的、正在進行的狀況，要用 are staying。"}, {"t": "are living / are staying", "ok": false, "fb": "後半句對了，但長期住在宜蘭是不變的事實，用現在簡單式 live。"}]}]}, {"id": "conjunctions", "title": "對等連接詞 and / but / or / so", "unit": "第二冊 Unit 3 · B2 L1–2", "points": "<p>四個連接詞的差別在<strong>前後兩句的關係</strong>。看懂關係就選得出來，不用背。</p><h3>四個連接詞</h3><table><tr><th>連接詞</th><th>關係</th><th>例子</th></tr><tr><td class=\"en\">and</td><td>並列、順著講下去</td><td class=\"en\">He is tall <span class=\"k1\">and</span> thin.</td></tr><tr><td class=\"en\">but</td><td>轉折、和預期相反</td><td class=\"en\">I'm tired, <span class=\"k1\">but</span> I can't sleep.</td></tr><tr><td class=\"en\">or</td><td>二選一</td><td class=\"en\">Tea <span class=\"k1\">or</span> coffee?</td></tr><tr><td class=\"en\">so</td><td>因此、前面是原因</td><td class=\"en\">It's raining, <span class=\"k1\">so</span> we stay home.</td></tr></table><h3>否定句裡的 and 要換成 or</h3><p class=\"en\">I like carrots <span class=\"k1\">and</span> onions.<br>I don't like carrots <span class=\"k2\">or</span> onions.　<span class=\"bad\">and onions</span></p><p style=\"color:var(--muted);font-size:17px\">這是很常考的一個小陷阱：肯定句用 and，改成否定句時要改成 or。</p><h3>逗號怎麼放</h3><p class=\"en\">連接兩個完整句子時，but 和 so 前面加逗號：<br>I want to go<span class=\"k3\">,</span> but I'm busy.</p><p class=\"en\">連接三個以上的東西時，最後一個前面用 and：<br>I have a dog, a cat<span class=\"k3\">,</span> and two birds.</p><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">I don't like tea and coffee.</span>　→ 否定句要用 or</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">I'm hungry, but I want to eat.</span>　→ 前後不衝突，應該用 so</p></div>", "questions": [{"q": "I really like math, ____ I don't like history at all.", "opts": [{"t": "and", "ok": false, "fb": "前面說喜歡、後面說不喜歡，兩句是相反的，要用 but。"}, {"t": "but", "ok": true, "fb": "喜歡數學但不喜歡歷史，前後相反，用轉折的 but。"}, {"t": "or", "ok": false, "fb": "or 是二選一，但這句是在陳述兩件事實。"}, {"t": "so", "ok": false, "fb": "so 表示結果，但不喜歡歷史並不是喜歡數學造成的。"}]}, {"q": "It was raining hard yesterday, ____ we stayed at home all day.", "opts": [{"t": "and", "ok": false, "fb": "雖然文法通順，但兩句有明顯的因果關係，用 so 更精準。"}, {"t": "but", "ok": false, "fb": "下大雨待在家並不衝突，不需要轉折。"}, {"t": "or", "ok": false, "fb": "這裡不是在給兩個選項。"}, {"t": "so", "ok": true, "fb": "下大雨是原因，待在家是結果，用 so。"}]}, {"q": "I don't like carrots ____ onions. I never eat them.", "opts": [{"t": "and", "ok": false, "fb": "這是否定句。肯定句用 and，改成否定句時要換成 or。"}, {"t": "or", "ok": true, "fb": "否定句裡連接兩個東西要用 or，表示兩個都不喜歡。"}, {"t": "but", "ok": false, "fb": "兩樣都是不喜歡的東西，沒有轉折關係。"}, {"t": "so", "ok": false, "fb": "兩者之間沒有因果關係。"}]}, {"q": "Would you like some tea ____ juice? We have both.", "opts": [{"t": "and", "ok": false, "fb": "後面說兩種都有，是要你挑一種，用 or。"}, {"t": "but", "ok": false, "fb": "兩個選項之間沒有衝突關係。"}, {"t": "or", "ok": true, "fb": "提供兩個選項讓對方選一個，用 or。"}, {"t": "so", "ok": false, "fb": "這句在問要哪一種，不是在講結果。"}]}, {"q": "Amy has a fever today, ____ she can't come to school.", "opts": [{"t": "but", "ok": false, "fb": "發燒不能上學是很合理的結果，沒有轉折。"}, {"t": "so", "ok": true, "fb": "發燒是原因，不能上學是結果。"}, {"t": "or", "ok": false, "fb": "這句在說明發燒造成的結果，不是給兩個選項讓人挑。"}, {"t": "and", "ok": false, "fb": "文法上說得通，但兩句是明確的因果關係，用 so 才精準。"}]}, {"q": "下列哪一句的意思不合理？", "opts": [{"t": "It's very hot, so I turn on the fan.", "ok": false, "fb": "這句合理。天氣熱是原因，開電扇是結果。"}, {"t": "I'm very hungry, but I want to eat something.", "ok": true, "fb": "這句不合理。肚子餓和想吃東西不衝突，應該用 so。"}, {"t": "Tom likes music, and he can play the piano.", "ok": false, "fb": "這句合理。兩件事順著講，用 and。"}, {"t": "You can call me or send me an e-mail.", "ok": false, "fb": "這句合理。給兩個聯絡方式讓對方選，用 or。"}]}, {"q": "There are a desk, a chair, ____ two bookcases in my room.", "opts": [{"t": "and", "ok": true, "fb": "連接三樣以上的東西時，最後一個前面用 and。"}, {"t": "or", "ok": false, "fb": "這句是在列出房間裡有什麼，不是在二選一。"}, {"t": "but", "ok": false, "fb": "三樣東西是並列關係，沒有轉折。"}, {"t": "so", "ok": false, "fb": "so 用來連接原因和結果，不用在列舉。"}]}, {"q": "Judy wants to go to the movies, ____ she doesn't have any money, ____ she stays home.", "opts": [{"t": "but / so", "ok": true, "fb": "想去卻沒錢是轉折用 but；沒錢所以待在家是結果用 so。"}, {"t": "so / but", "ok": false, "fb": "兩個放反了。想去和沒錢是衝突，沒錢和待在家是因果。"}, {"t": "and / but", "ok": false, "fb": "想去卻沒錢是相反的，第一個空格要用 but。"}, {"t": "or / so", "ok": false, "fb": "第一個空格不是二選一，是轉折關係。"}]}]}, {"id": "too-either-also", "title": "too / either / also 與程度副詞", "unit": "第二冊 Unit 3 · B2 L1–2", "points": "<p>too、either、also 都是「也」，差別在<strong>句子是肯定還是否定</strong>，以及<strong>放在哪個位置</strong>。</p><h3>三個「也」</h3><table><tr><th>字</th><th>用在</th><th>位置</th><th>例子</th></tr><tr><td class=\"en\">too</td><td>肯定句</td><td>句尾</td><td class=\"en\">I like it<span class=\"k3\">,</span> <span class=\"k1\">too</span>.</td></tr><tr><td class=\"en\">either</td><td>否定句</td><td>句尾</td><td class=\"en\">I don't like it<span class=\"k3\">,</span> <span class=\"k1\">either</span>.</td></tr><tr><td class=\"en\">also</td><td>肯定句</td><td>句中</td><td class=\"en\">She <span class=\"k1\">also</span> likes it.</td></tr></table><p style=\"color:var(--muted);font-size:17px\">also 的位置規則：be 動詞<strong>後面</strong>、一般動詞<strong>前面</strong>。<br><span class=\"en\">She is <span class=\"k1\">also</span> a singer.　He <span class=\"k1\">also</span> plays baseball.</span></p><h3>程度副詞：放在形容詞前面</h3><table><tr><th>副詞</th><th>意思</th><th>語氣</th></tr><tr><td class=\"en\">very</td><td>很</td><td>中性</td></tr><tr><td class=\"en\">so</td><td>好、真是</td><td>帶感情</td></tr><tr><td class=\"en\">really</td><td>真的很</td><td>強調</td></tr><tr><td class=\"en\">too</td><td>太⋯⋯（過頭了）</td><td>負面</td></tr></table><p class=\"en\">The soup is <span class=\"k2\">very</span> hot. It tastes good.<br>The soup is <span class=\"k2\">too</span> hot. I can't eat it.</p><p style=\"color:var(--muted);font-size:17px\">too 一定帶有「造成困擾」的意思。後面常接一句話說明有什麼問題。</p><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">I don't like it, too.</span>　→ 否定句要用 either</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">She also is a teacher.</span>　→ also 要放在 be 動詞後面</p></div>", "questions": [{"q": "I love chocolate ice cream. My little sister loves it, ____ .", "opts": [{"t": "too", "ok": true, "fb": "肯定句表示「也」，放在句尾用 too，前面加逗號。"}, {"t": "either", "ok": false, "fb": "either 只用在否定句，這句是肯定的。"}, {"t": "also", "ok": false, "fb": "also 要放在句子中間，不放句尾。"}, {"t": "so", "ok": false, "fb": "so 不能單獨放句尾表示「也」。"}]}, {"q": "I don't like coffee. My brother doesn't like it, ____ .", "opts": [{"t": "too", "ok": false, "fb": "這是否定句，句尾的「也」要用 either。"}, {"t": "either", "ok": true, "fb": "否定句表示「也不」，句尾用 either。"}, {"t": "also", "ok": false, "fb": "also 放句中，而且通常用在肯定句。"}, {"t": "neither", "ok": false, "fb": "neither 不能這樣放在句尾，它有自己的句型。"}]}, {"q": "Amy is a good student. She is ____ a wonderful singer.", "opts": [{"t": "too", "ok": false, "fb": "too 要放句尾，不放在句子中間。"}, {"t": "also", "ok": true, "fb": "also 放在 be 動詞 is 的後面。"}, {"t": "either", "ok": false, "fb": "either 用在否定句，而且放句尾。"}, {"t": "very", "ok": false, "fb": "very 是程度副詞，用來修飾形容詞，不是「也」的意思。"}]}, {"q": "Ted plays basketball after school. He ____ plays baseball on weekends.", "opts": [{"t": "also", "ok": true, "fb": "also 放在一般動詞 plays 的前面。"}, {"t": "too", "ok": false, "fb": "too 要放在句尾，不放動詞前面。"}, {"t": "either", "ok": false, "fb": "這是肯定句，而且 either 要放句尾。"}, {"t": "so", "ok": false, "fb": "so 不能放在動詞前面表示「也」。"}]}, {"q": "The soup is ____ hot. I have to wait for a few minutes.", "opts": [{"t": "very", "ok": false, "fb": "後面說要等一下才能喝，表示熱到有問題，用 too 更精準。"}, {"t": "too", "ok": true, "fb": "too 表示「太⋯⋯以致於有困擾」，正好對應後面要等一下。"}, {"t": "so much", "ok": false, "fb": "so much 不能直接修飾形容詞。"}, {"t": "also", "ok": false, "fb": "also 是「也」，不是程度副詞。"}]}, {"q": "That movie is ____ interesting. I want to watch it again.", "opts": [{"t": "too", "ok": false, "fb": "too 帶有負面意思，但後面說想再看一次，是正面的。"}, {"t": "very", "ok": true, "fb": "very 是中性的「很」，配得上後面想再看一次的正面語氣。"}, {"t": "either", "ok": false, "fb": "either 是「也不」，不是程度副詞。"}, {"t": "much", "ok": false, "fb": "much 不能直接修飾形容詞。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "My father is a teacher, and my mother is a teacher, too.", "ok": false, "fb": "這句是對的。肯定句句尾用 too。"}, {"t": "I can't swim, and my sister can't swim, too.", "ok": true, "fb": "這句錯了。否定句句尾要用 either。"}, {"t": "He is also good at drawing.", "ok": false, "fb": "這句是對的。also 放在 be 動詞後面。"}, {"t": "She also likes to read comic books.", "ok": false, "fb": "這句是對的。also 放在一般動詞前面。"}]}, {"q": "A: I don't have any money with me.　B: I don't have any, ____ . Let's just walk home.", "opts": [{"t": "too", "ok": false, "fb": "B 說的是否定句，要用 either。"}, {"t": "either", "ok": true, "fb": "兩個人都沒有錢，是否定的「也」，用 either。"}, {"t": "also", "ok": false, "fb": "also 放句中，而且不用在這種否定的句尾。"}, {"t": "so", "ok": false, "fb": "so 不能單獨放句尾表示「也不」。"}]}]}, {"id": "can-haveto", "title": "助動詞 can 與 have to", "unit": "第二冊 Unit 3 · B2 L1–2", "points": "<p>can 講「能不能」，have to 講「必須不必須」。兩個後面都<strong>一定接動詞原形</strong>。</p><h3>can 的三種用法</h3><table><tr><th>用法</th><th>例子</th></tr><tr><td>能力</td><td class=\"en\">She <span class=\"k1\">can</span> play the piano.</td></tr><tr><td>請求</td><td class=\"en\"><span class=\"k1\">Can</span> you help me?</td></tr><tr><td>許可</td><td class=\"en\">You <span class=\"k1\">can</span> use my phone.</td></tr></table><p class=\"en\">否定：can<span class=\"k2\">'t</span>　　疑問：<span class=\"k1\">Can</span> you swim? → Yes, I <span class=\"k1\">can</span>. / No, I <span class=\"k2\">can't</span>.</p><p style=\"color:var(--muted);font-size:17px\">can 不管主詞是誰都不變。<span class=\"en\"><span class=\"bad\">He cans</span>　<span class=\"bad\">She can swims</span></span></p><h3>have to / has to</h3><table><tr><th>主詞</th><th>用</th><th>例子</th></tr><tr><td>I / You / We / They</td><td class=\"en\">have to</td><td class=\"en\">They <span class=\"k1\">have to</span> go now.</td></tr><tr><td>He / She / It、單數名詞</td><td class=\"en\">has to</td><td class=\"en\">He <span class=\"k1\">has to</span> go now.</td></tr></table><h3>兩種否定，意思完全不同</h3><p class=\"en\">You <span class=\"k2\">don't have to</span> come.　→ 你<strong>不必</strong>來（來不來都可以）<br>You <span class=\"k2\">can't</span> come.　→ 你<strong>不可以</strong>來（禁止）</p><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">She can sings well.</span>　→ can 後面接原形</p><p class=\"en\"><span class=\"bad\">He have to study.</span>　→ 第三人稱單數要用 has to</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">Can you swim? Yes, I do.</span>　→ 簡答要用 can</p></div>", "questions": [{"q": "My cousin can ____ five languages. She is really amazing.", "opts": [{"t": "speaks", "ok": false, "fb": "can 後面一定接動詞原形，不加 s。"}, {"t": "speak", "ok": true, "fb": "can 後面固定接動詞原形。"}, {"t": "speaking", "ok": false, "fb": "can 後面不接 V-ing。"}, {"t": "to speak", "ok": false, "fb": "can 後面不加 to。"}]}, {"q": "My brother ____ get up at six every morning because his school is far away.", "opts": [{"t": "have to", "ok": false, "fb": "主詞 My brother 是第三人稱單數，要用 has to。"}, {"t": "has to", "ok": true, "fb": "第三人稱單數主詞配 has to。"}, {"t": "is have to", "ok": false, "fb": "have to 前面不加 be 動詞。"}, {"t": "has", "ok": false, "fb": "少了 to。表示「必須」要用完整的 has to。"}]}, {"q": "A: Can you ride a bike?　B: ____ My father taught me last summer.", "opts": [{"t": "Yes, I do.", "ok": false, "fb": "問句用 Can 開頭，簡答也要用 can。"}, {"t": "Yes, I can.", "ok": true, "fb": "Can 開頭的問句，簡答用 Yes, I can。"}, {"t": "Yes, I am.", "ok": false, "fb": "問句沒有用 be 動詞，簡答不能用 am。"}, {"t": "Yes, I could.", "ok": false, "fb": "問句是現在式的 Can，簡答要對應用 can。"}]}, {"q": "Tomorrow is Sunday, so you ____ get up early. You can sleep in.", "opts": [{"t": "don't have to", "ok": true, "fb": "後面說可以睡晚一點，表示「不必」早起，用 don't have to。"}, {"t": "can't", "ok": false, "fb": "can't 是「不可以」，但這裡的意思是「不必」，沒有禁止的意思。"}, {"t": "have to", "ok": false, "fb": "後面說可以睡晚一點，和「必須早起」互相矛盾。"}, {"t": "aren't", "ok": false, "fb": "be 動詞後面不能直接接原形動詞 get。"}]}, {"q": "The baby is sleeping. You ____ make any noise in the living room.", "opts": [{"t": "don't have to", "ok": false, "fb": "這是「不必」的意思，但寶寶在睡覺是禁止吵鬧，語氣不對。"}, {"t": "can't", "ok": true, "fb": "寶寶在睡覺，表示「不可以」吵鬧，是禁止，用 can't。"}, {"t": "have to", "ok": false, "fb": "變成「必須製造噪音」，意思相反了。"}, {"t": "can", "ok": false, "fb": "變成「可以吵鬧」，和寶寶在睡覺互相矛盾。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "She can't come to the party tonight.", "ok": false, "fb": "這句是對的。can't 後面接原形 come。"}, {"t": "Do I have to finish it today?", "ok": false, "fb": "這句是對的。have to 的疑問句用助動詞 Do。"}, {"t": "My sister cans play the violin.", "ok": true, "fb": "這句錯了。can 不管主詞是誰都不加 s。"}, {"t": "We have to wear school uniforms.", "ok": false, "fb": "這句是對的。主詞 We 配 have to。"}]}, {"q": "A: ____ your sister swim?　B: No, she ____ . But she wants to learn.", "opts": [{"t": "Can / can't", "ok": true, "fb": "問能力用 Can 開頭，簡答也用 can't，而且 can 不隨主詞變化。"}, {"t": "Cans / can't", "ok": false, "fb": "can 不加 s，不管主詞是誰。"}, {"t": "Does / doesn't", "ok": false, "fb": "後面說她想學游泳，問的是「會不會」這個能力，要用 Can。"}, {"t": "Is / isn't", "ok": false, "fb": "swim 是原形動詞，前面不能直接接 be 動詞。"}]}, {"q": "I ____ swim at all, so I ____ take swimming lessons this summer.", "opts": [{"t": "can't / have to", "ok": true, "fb": "完全不會游泳是能力的否定，因此必須去上課。"}, {"t": "can / have to", "ok": false, "fb": "at all 通常用在否定句，而且會游泳就不需要非上課不可。"}, {"t": "can't / don't have to", "ok": false, "fb": "前半對了，但不會游泳應該是需要上課，不是不必上課。"}, {"t": "can / has to", "ok": false, "fb": "主詞是 I，不能用 has to。"}]}]}, {"id": "present-simple", "title": "現在簡單式", "unit": "第二冊 Unit 3 · B2 L1–2", "points": "<p>現在簡單式講的不是「現在正在做」，而是<strong>平常都這樣、一直都是這樣</strong>。這是它和現在進行式最大的差別。</p><h3>三種用法</h3><table><tr><th>用法</th><th>例子</th></tr><tr><td>習慣</td><td class=\"en\">I <span class=\"k1\">get</span> up at six every day.</td></tr><tr><td>事實</td><td class=\"en\">The sun <span class=\"k1\">rises</span> in the east.</td></tr><tr><td>狀態</td><td class=\"en\">She <span class=\"k1\">lives</span> in Yilan.</td></tr></table><h3>主詞是他/她/它時，動詞要加 s</h3><table><tr><th>字尾</th><th>怎麼變</th><th>例子</th></tr><tr><td>一般</td><td>加 -s</td><td class=\"en\">play → play<span class=\"k2\">s</span></td></tr><tr><td>s, x, ch, sh, o</td><td>加 -es</td><td class=\"en\">go → go<span class=\"k2\">es</span>　watch → watch<span class=\"k2\">es</span></td></tr><tr><td>子音 + y</td><td>去 y 加 -ies</td><td class=\"en\">study → stud<span class=\"k2\">ies</span></td></tr><tr><td>have</td><td>不規則</td><td class=\"en\">have → <span class=\"k2\">has</span></td></tr></table><h3>否定與疑問要用助動詞</h3><table><tr><th>主詞</th><th>否定</th><th>疑問</th></tr><tr><td>I / You / We / They</td><td class=\"en\">don't + 原形</td><td class=\"en\">Do ... 原形?</td></tr><tr><td>He / She / It</td><td class=\"en\">doesn't + 原形</td><td class=\"en\">Does ... 原形?</td></tr></table><p style=\"color:var(--muted);font-size:17px\">重點：助動詞出現後，後面的動詞就變回原形。<span class=\"en\"><span class=\"bad\">He doesn't likes it.</span></span></p><h3>和現在進行式怎麼分</h3><table><tr><th></th><th>現在簡單式</th><th>現在進行式</th></tr><tr><td>意思</td><td>平常都會</td><td>此刻正在</td></tr><tr><td>提示詞</td><td class=\"en\">every day, usually, always, on Sundays</td><td class=\"en\">now, right now, Look!, Listen!</td></tr></table><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">She don't like it.</span>　→ 第三人稱單數要用 doesn't</p><p class=\"en\"><span class=\"bad\">Does he likes music?</span>　→ Does 後面用原形</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">He studys hard.</span>　→ 子音＋y 要改 ies</p></div>", "questions": [{"q": "My father ____ to work by bus every morning.", "opts": [{"t": "go", "ok": false, "fb": "主詞 My father 是第三人稱單數，動詞要加變化。"}, {"t": "goes", "ok": true, "fb": "go 的字尾是 o，第三人稱單數要加 -es。"}, {"t": "going", "ok": false, "fb": "every morning 表示習慣，用現在簡單式，不是進行式。"}, {"t": "is go", "ok": false, "fb": "be 動詞後面不能直接接原形動詞。"}]}, {"q": "My sister ____ English for an hour every night.", "opts": [{"t": "studys", "ok": false, "fb": "study 的 y 前面是子音 d，要去 y 加 ies。"}, {"t": "studies", "ok": true, "fb": "子音＋y 結尾，去掉 y 加 -ies。"}, {"t": "studyes", "ok": false, "fb": "沒有這種變化，子音＋y 是改成 ies。"}, {"t": "study", "ok": false, "fb": "主詞 My sister 是第三人稱單數，動詞要變化。"}]}, {"q": "Tom ____ carrots. He never eats them.", "opts": [{"t": "doesn't likes", "ok": false, "fb": "助動詞 doesn't 後面要接原形，不能再加 s。"}, {"t": "doesn't like", "ok": true, "fb": "第三人稱單數的否定用 doesn't，後面接原形動詞。"}, {"t": "don't like", "ok": false, "fb": "主詞 Tom 是第三人稱單數，要用 doesn't。"}, {"t": "isn't like", "ok": false, "fb": "like 是一般動詞，否定要用助動詞，不用 be 動詞。"}]}, {"q": "____ your parents work on Saturdays?", "opts": [{"t": "Do", "ok": true, "fb": "parents 是複數，一般動詞的疑問句用助動詞 Do。"}, {"t": "Does", "ok": false, "fb": "Does 用在第三人稱單數，但 parents 是複數。"}, {"t": "Are", "ok": false, "fb": "work 是一般動詞，疑問句要用助動詞 Do，不用 be 動詞。"}, {"t": "Is", "ok": false, "fb": "句子的動詞是 work，不是 be 動詞。"}]}, {"q": "A: Does Judy live near the school?　B: ____ She walks to school every day.", "opts": [{"t": "Yes, she does.", "ok": true, "fb": "Does 開頭的問句，簡答用 does。"}, {"t": "Yes, she is.", "ok": false, "fb": "問句用助動詞 Does，簡答也要用 does。"}, {"t": "Yes, she do.", "ok": false, "fb": "第三人稱單數要用 does，不是 do。"}, {"t": "Yes, she lives.", "ok": false, "fb": "簡答要用助動詞，不重複原本的動詞。"}]}, {"q": "My mom usually ____ dinner, but tonight my dad ____ in the kitchen.", "opts": [{"t": "cooks / is cooking", "ok": true, "fb": "usually 表示平常的習慣用簡單式；tonight 表示此刻用進行式。"}, {"t": "is cooking / cooks", "ok": false, "fb": "兩個時態放反了。usually 是習慣，tonight 是現在。"}, {"t": "cooks / cooks", "ok": false, "fb": "後半在講今晚正在發生的事，要用進行式。"}, {"t": "is cooking / is cooking", "ok": false, "fb": "前半有 usually，是平常的習慣，要用現在簡單式。"}]}, {"q": "Look at Ted! He ____ his new bike. He ____ it to school every day.", "opts": [{"t": "rides / is riding", "ok": false, "fb": "兩個放反了。Look! 表示現在正在做，every day 表示習慣。"}, {"t": "is riding / rides", "ok": true, "fb": "Look! 配進行式；every day 配現在簡單式。"}, {"t": "is riding / is riding", "ok": false, "fb": "後半有 every day，是平常的習慣，要用簡單式。"}, {"t": "rides / rides", "ok": false, "fb": "前面有 Look!，是叫你看眼前正在發生的事。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "He watches TV every night.", "ok": false, "fb": "這句是對的。watch 的字尾是 ch，加 -es。"}, {"t": "She don't have a bike.", "ok": true, "fb": "這句錯了。主詞 She 是第三人稱單數，要用 doesn't have。"}, {"t": "Do you like pop music?", "ok": false, "fb": "這句是對的。主詞 you 配助動詞 Do。"}, {"t": "It rains a lot in Yilan.", "ok": false, "fb": "這句是對的。It 是第三人稱單數，動詞加 s。"}]}]}, {"id": "time-prep", "title": "時間介系詞與常用介系詞", "unit": "第二冊 Unit 3–4 · B2", "points": "<p>時間介系詞的口訣是<strong>從大到小</strong>：範圍最大用 in，中等用 on，最小的一個時間點用 at。</p><h3>at / on / in</h3><table><tr><th>介系詞</th><th>接什麼</th><th>例子</th></tr><tr><td class=\"en\">at</td><td>幾點鐘、中午、晚上</td><td class=\"en\">at 7:00　at noon　at night</td></tr><tr><td class=\"en\">on</td><td>星期、日期、特定某天</td><td class=\"en\">on Monday　on May 5　on Sunday morning</td></tr><tr><td class=\"en\">in</td><td>月、年、季節、早上下午晚上</td><td class=\"en\">in July　in 2026　in summer　in the morning</td></tr></table><p style=\"color:var(--muted);font-size:17px\">要小心：<span class=\"en\">in the morning</span> 用 in，但講到某一天的早上就變成 <span class=\"en\">on Sunday morning</span>。前面一有特定日期，就改用 on。</p><h3>這些字前面不加介系詞</h3><p class=\"en\"><span class=\"k2\">today　tomorrow　tonight　yesterday<br>every day　this morning　next week</span></p><p class=\"en\"><span class=\"bad\">on tomorrow</span>　<span class=\"bad\">in every day</span></p><h3>其他常用介系詞</h3><table><tr><td class=\"en\">with</td><td>和某人一起</td><td class=\"en\">I go with my sister.</td></tr><tr><td class=\"en\">by</td><td>搭乘某種交通工具</td><td class=\"en\">by bus　by bike</td></tr><tr><td class=\"en\">for</td><td>持續多久、給某人</td><td class=\"en\">for an hour</td></tr><tr><td class=\"en\">from ... to ...</td><td>從⋯⋯到⋯⋯</td><td class=\"en\">from nine to five</td></tr></table><p style=\"color:var(--muted);font-size:17px\">交通工具用 by 時中間不加冠詞：<span class=\"en\">by bus</span>，不是 <span class=\"bad\">by a bus</span>。</p>", "questions": [{"q": "My birthday is ____ May 5. We are going to have a party.", "opts": [{"t": "in", "ok": false, "fb": "in 用在整個月份，像 in May。但這裡有明確的日期，要用 on。"}, {"t": "on", "ok": true, "fb": "有具體日期時用 on。"}, {"t": "at", "ok": false, "fb": "at 用在幾點鐘這種時間點，不用在日期。"}, {"t": "不填", "ok": false, "fb": "日期前面需要介系詞。"}]}, {"q": "School starts ____ eight o'clock ____ the morning.", "opts": [{"t": "at / in", "ok": true, "fb": "幾點鐘用 at；the morning 這種時段用 in。"}, {"t": "in / at", "ok": false, "fb": "兩個放反了。時刻用 at，早上這個時段用 in。"}, {"t": "on / in", "ok": false, "fb": "on 用在星期或日期，不用在幾點鐘。"}, {"t": "at / on", "ok": false, "fb": "前半對了，但 the morning 前面沒有特定日期，用 in。"}]}, {"q": "I usually play basketball with my friends ____ Sunday afternoon.", "opts": [{"t": "in", "ok": false, "fb": "前面有 Sunday 這個特定的一天，要改用 on。"}, {"t": "on", "ok": true, "fb": "一提到特定某一天的早上或下午，就用 on 而不是 in。"}, {"t": "at", "ok": false, "fb": "at 用在幾點鐘，不用在星期幾。"}, {"t": "不填", "ok": false, "fb": "Sunday afternoon 前面需要介系詞。"}]}, {"q": "We have an English test ____ tomorrow. Don't forget to study.", "opts": [{"t": "on", "ok": false, "fb": "tomorrow 前面不加介系詞。"}, {"t": "in", "ok": false, "fb": "tomorrow 是不加介系詞的字之一。"}, {"t": "at", "ok": false, "fb": "tomorrow 直接使用，前面不放介系詞。"}, {"t": "不填", "ok": true, "fb": "today、tomorrow、tonight、every day 這些字前面都不加介系詞。"}]}, {"q": "It gets very hot ____ summer, but it's quite cool ____ night.", "opts": [{"t": "in / at", "ok": true, "fb": "季節用 in；at night 是固定用法。"}, {"t": "at / in", "ok": false, "fb": "兩個放反了。季節用 in，而晚上固定說 at night。"}, {"t": "on / at", "ok": false, "fb": "on 用在星期或日期，不用在季節。"}, {"t": "in / in", "ok": false, "fb": "前半對了，但「在晚上」固定說 at night。"}]}, {"q": "I go to school ____ my brother ____ bike every day.", "opts": [{"t": "with / by", "ok": true, "fb": "和某人一起用 with；騎腳踏車這種交通方式用 by。"}, {"t": "by / with", "ok": false, "fb": "兩個放反了。人用 with，交通工具用 by。"}, {"t": "with / on", "ok": false, "fb": "前半對了，但講交通方式的固定說法是 by bike。"}, {"t": "and / by", "ok": false, "fb": "and 是連接詞，不能放在這個位置當介系詞用。"}]}, {"q": "The library is open ____ nine ____ five every day.", "opts": [{"t": "from / to", "ok": true, "fb": "表示一段時間的起點和終點，用 from... to...。"}, {"t": "at / at", "ok": false, "fb": "at 只能標出一個時間點，無法表示一整段時間。"}, {"t": "in / to", "ok": false, "fb": "起點要用 from，不是 in。"}, {"t": "from / at", "ok": false, "fb": "前半對了，但終點要用 to 和 from 搭配。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "My family goes to Yilan in July.", "ok": false, "fb": "這句是對的。月份用 in。"}, {"t": "I have a piano lesson on Wednesday.", "ok": false, "fb": "這句是對的。星期用 on。"}, {"t": "He goes to work by a car.", "ok": true, "fb": "這句錯了。by 加交
