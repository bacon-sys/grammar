d>句尾</td><td class=\"en\">I don't like it<span class=\"k3\">,</span> <span class=\"k1\">either</span>.</td></tr><tr><td class=\"en\">also</td><td>肯定句</td><td>句中</td><td class=\"en\">She <span class=\"k1\">also</span> likes it.</td></tr></table><p style=\"color:var(--muted);font-size:17px\">also 的位置規則：be 動詞<strong>後面</strong>、一般動詞<strong>前面</strong>。<br><span class=\"en\">She is <span class=\"k1\">also</span> a singer.　He <span class=\"k1\">also</span> plays baseball.</span></p><h3>程度副詞：放在形容詞前面</h3><table><tr><th>副詞</th><th>意思</th><th>語氣</th></tr><tr><td class=\"en\">very</td><td>很</td><td>中性</td></tr><tr><td class=\"en\">so</td><td>好、真是</td><td>帶感情</td></tr><tr><td class=\"en\">really</td><td>真的很</td><td>強調</td></tr><tr><td class=\"en\">too</td><td>太⋯⋯（過頭了）</td><td>負面</td></tr></table><p class=\"en\">The soup is <span class=\"k2\">very</span> hot. It tastes good.<br>The soup is <span class=\"k2\">too</span> hot. I can't eat it.</p><p style=\"color:var(--muted);font-size:17px\">too 一定帶有「造成困擾」的意思。後面常接一句話說明有什麼問題。</p><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">I don't like it, too.</span>　→ 否定句要用 either</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">She also is a teacher.</span>　→ also 要放在 be 動詞後面</p></div>", "questions": [{"q": "I love chocolate ice cream. My little sister loves it, ____ .", "opts": [{"t": "too", "ok": true, "fb": "肯定句表示「也」，放在句尾用 too，前面加逗號。"}, {"t": "either", "ok": false, "fb": "either 只用在否定句，這句是肯定的。"}, {"t": "also", "ok": false, "fb": "also 要放在句子中間，不放句尾。"}, {"t": "so", "ok": false, "fb": "so 不能單獨放句尾表示「也」。"}]}, {"q": "I don't like coffee. My brother doesn't like it, ____ .", "opts": [{"t": "too", "ok": false, "fb": "這是否定句，句尾的「也」要用 either。"}, {"t": "either", "ok": true, "fb": "否定句表示「也不」，句尾用 either。"}, {"t": "also", "ok": false, "fb": "also 放句中，而且通常用在肯定句。"}, {"t": "neither", "ok": false, "fb": "neither 不能這樣放在句尾，它有自己的句型。"}]}, {"q": "Amy is a good student. She is ____ a wonderful singer.", "opts": [{"t": "too", "ok": false, "fb": "too 要放句尾，不放在句子中間。"}, {"t": "also", "ok": true, "fb": "also 放在 be 動詞 is 的後面。"}, {"t": "either", "ok": false, "fb": "either 用在否定句，而且放句尾。"}, {"t": "very", "ok": false, "fb": "very 是程度副詞，用來修飾形容詞，不是「也」的意思。"}]}, {"q": "Ted plays basketball after school. He ____ plays baseball on weekends.", "opts": [{"t": "also", "ok": true, "fb": "also 放在一般動詞 plays 的前面。"}, {"t": "too", "ok": false, "fb": "too 要放在句尾，不放動詞前面。"}, {"t": "either", "ok": false, "fb": "這是肯定句，而且 either 要放句尾。"}, {"t": "so", "ok": false, "fb": "so 不能放在動詞前面表示「也」。"}]}, {"q": "The soup is ____ hot. I have to wait for a few minutes.", "opts": [{"t": "very", "ok": false, "fb": "後面說要等一下才能喝，表示熱到有問題，用 too 更精準。"}, {"t": "too", "ok": true, "fb": "too 表示「太⋯⋯以致於有困擾」，正好對應後面要等一下。"}, {"t": "so much", "ok": false, "fb": "so much 不能直接修飾形容詞。"}, {"t": "also", "ok": false, "fb": "also 是「也」，不是程度副詞。"}]}, {"q": "That movie is ____ interesting. I want to watch it again.", "opts": [{"t": "too", "ok": false, "fb": "too 帶有負面意思，但後面說想再看一次，是正面的。"}, {"t": "very", "ok": true, "fb": "very 是中性的「很」，配得上後面想再看一次的正面語氣。"}, {"t": "either", "ok": false, "fb": "either 是「也不」，不是程度副詞。"}, {"t": "much", "ok": false, "fb": "much 不能直接修飾形容詞。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "My father is a teacher, and my mother is a teacher, too.", "ok": false, "fb": "這句是對的。肯定句句尾用 too。"}, {"t": "I can't swim, and my sister can't swim, too.", "ok": true, "fb": "這句錯了。否定句句尾要用 either。"}, {"t": "He is also good at drawing.", "ok": false, "fb": "這句是對的。also 放在 be 動詞後面。"}, {"t": "She also likes to read comic books.", "ok": false, "fb": "這句是對的。also 放在一般動詞前面。"}]}, {"q": "A: I don't have any money with me.　B: I don't have any, ____ . Let's just walk home.", "opts": [{"t": "too", "ok": false, "fb": "B 說的是否定句，要用 either。"}, {"t": "either", "ok": true, "fb": "兩個人都沒有錢，是否定的「也」，用 either。"}, {"t": "also", "ok": false, "fb": "also 放句中，而且不用在這種否定的句尾。"}, {"t": "so", "ok": false, "fb": "so 不能單獨放句尾表示「也不」。"}]}], "kkN": 0, "stars": 0, "listenN": 1, "kk": [{"kind": "listen", "src": "113 年會考聽力 第 7 題", "audio": "../audio/113-07.mp3", "q": "聽一聽，選出最適合的回應。", "script": "I want to order another cheesecake. Would you like one too?", "opts": [{"t": "No, I can't eat any more.", "ok": true, "fb": "Would you like one too?（你也要一個嗎？）→ 不了，我吃不下了。"}, {"t": "Sure, I never say no to meat.", "ok": false, "fb": "cheesecake 是起司蛋糕，不是肉。"}, {"t": "Sorry, but we don't have it today.", "ok": false, "fb": "這是店員的話，但問你的是朋友。"}]}, {"kind": "rw", "src": "會考風格改寫", "q": "A: I don't like carrots.\nB: I don't like them, ＿＿＿.", "opts": [{"t": "too", "ok": false, "fb": "too 用在肯定句；否定句的「也」要用 either。"}, {"t": "either", "ok": true, "fb": "否定句的「也不」→ either。"}, {"t": "also", "ok": false, "fb": "also 不放在否定句句尾。"}, {"t": "so", "ok": false, "fb": "so 不能這樣放在句尾。"}]}, {"kind": "rw", "src": "會考風格改寫", "q": "Ben can sing well, and he can ＿＿＿ play the guitar.", "opts": [{"t": "too", "ok": false, "fb": "too 要放在句尾。"}, {"t": "also", "ok": true, "fb": "also 放在助動詞後、動詞前：can also play。"}, {"t": "either", "ok": false, "fb": "either 用在否定句。"}, {"t": "so", "ok": false, "fb": "so 不表示「也」。"}]}]}, {"id": "can-haveto", "title": "助動詞 can 與 have to", "unit": "第二冊 Unit 3 · B2 L1–2", "points": "<p>can 講「能不能」，have to 講「必須不必須」。兩個後面都<strong>一定接動詞原形</strong>。</p><h3>can 的三種用法</h3><table><tr><th>用法</th><th>例子</th></tr><tr><td>能力</td><td class=\"en\">She <span class=\"k1\">can</span> play the piano.</td></tr><tr><td>請求</td><td class=\"en\"><span class=\"k1\">Can</span> you help me?</td></tr><tr><td>許可</td><td class=\"en\">You <span class=\"k1\">can</span> use my phone.</td></tr></table><p class=\"en\">否定：can<span class=\"k2\">'t</span>　　疑問：<span class=\"k1\">Can</span> you swim? → Yes, I <span class=\"k1\">can</span>. / No, I <span class=\"k2\">can't</span>.</p><p style=\"color:var(--muted);font-size:17px\">can 不管主詞是誰都不變。<span class=\"en\"><span class=\"bad\">He cans</span>　<span class=\"bad\">She can swims</span></span></p><h3>have to / has to</h3><table><tr><th>主詞</th><th>用</th><th>例子</th></tr><tr><td>I / You / We / They</td><td class=\"en\">have to</td><td class=\"en\">They <span class=\"k1\">have to</span> go now.</td></tr><tr><td>He / She / It、單數名詞</td><td class=\"en\">has to</td><td class=\"en\">He <span class=\"k1\">has to</span> go now.</td></tr></table><h3>兩種否定，意思完全不同</h3><p class=\"en\">You <span class=\"k2\">don't have to</span> come.　→ 你<strong>不必</strong>來（來不來都可以）<br>You <span class=\"k2\">can't</span> come.　→ 你<strong>不可以</strong>來（禁止）</p><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">She can sings well.</span>　→ can 後面接原形</p><p class=\"en\"><span class=\"bad\">He have to study.</span>　→ 第三人稱單數要用 has to</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">Can you swim? Yes, I do.</span>　→ 簡答要用 can</p></div>", "questions": [{"q": "My cousin can ____ five languages. She is really amazing.", "opts": [{"t": "speaks", "ok": false, "fb": "can 後面一定接動詞原形，不加 s。"}, {"t": "speak", "ok": true, "fb": "can 後面固定接動詞原形。"}, {"t": "speaking", "ok": false, "fb": "can 後面不接 V-ing。"}, {"t": "to speak", "ok": false, "fb": "can 後面不加 to。"}]}, {"q": "My brother ____ get up at six every morning because his school is far away.", "opts": [{"t": "have to", "ok": false, "fb": "主詞 My brother 是第三人稱單數，要用 has to。"}, {"t": "has to", "ok": true, "fb": "第三人稱單數主詞配 has to。"}, {"t": "is have to", "ok": false, "fb": "have to 前面不加 be 動詞。"}, {"t": "has", "ok": false, "fb": "少了 to。表示「必須」要用完整的 has to。"}]}, {"q": "A: Can you ride a bike?　B: ____ My father taught me last summer.", "opts": [{"t": "Yes, I do.", "ok": false, "fb": "問句用 Can 開頭，簡答也要用 can。"}, {"t": "Yes, I can.", "ok": true, "fb": "Can 開頭的問句，簡答用 Yes, I can。"}, {"t": "Yes, I am.", "ok": false, "fb": "問句沒有用 be 動詞，簡答不能用 am。"}, {"t": "Yes, I could.", "ok": false, "fb": "問句是現在式的 Can，簡答要對應用 can。"}]}, {"q": "Tomorrow is Sunday, so you ____ get up early. You can sleep in.", "opts": [{"t": "don't have to", "ok": true, "fb": "後面說可以睡晚一點，表示「不必」早起，用 don't have to。"}, {"t": "can't", "ok": false, "fb": "can't 是「不可以」，但這裡的意思是「不必」，沒有禁止的意思。"}, {"t": "have to", "ok": false, "fb": "後面說可以睡晚一點，和「必須早起」互相矛盾。"}, {"t": "aren't", "ok": false, "fb": "be 動詞後面不能直接接原形動詞 get。"}]}, {"q": "The baby is sleeping. You ____ make any noise in the living room.", "opts": [{"t": "don't have to", "ok": false, "fb": "這是「不必」的意思，但寶寶在睡覺是禁止吵鬧，語氣不對。"}, {"t": "can't", "ok": true, "fb": "寶寶在睡覺，表示「不可以」吵鬧，是禁止，用 can't。"}, {"t": "have to", "ok": false, "fb": "變成「必須製造噪音」，意思相反了。"}, {"t": "can", "ok": false, "fb": "變成「可以吵鬧」，和寶寶在睡覺互相矛盾。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "She can't come to the party tonight.", "ok": false, "fb": "這句是對的。can't 後面接原形 come。"}, {"t": "Do I have to finish it today?", "ok": false, "fb": "這句是對的。have to 的疑問句用助動詞 Do。"}, {"t": "My sister cans play the violin.", "ok": true, "fb": "這句錯了。can 不管主詞是誰都不加 s。"}, {"t": "We have to wear school uniforms.", "ok": false, "fb": "這句是對的。主詞 We 配 have to。"}]}, {"q": "A: ____ your sister swim?　B: No, she ____ . But she wants to learn.", "opts": [{"t": "Can / can't", "ok": true, "fb": "問能力用 Can 開頭，簡答也用 can't，而且 can 不隨主詞變化。"}, {"t": "Cans / can't", "ok": false, "fb": "can 不加 s，不管主詞是誰。"}, {"t": "Does / doesn't", "ok": false, "fb": "後面說她想學游泳，問的是「會不會」這個能力，要用 Can。"}, {"t": "Is / isn't", "ok": false, "fb": "swim 是原形動詞，前面不能直接接 be 動詞。"}]}, {"q": "I ____ swim at all, so I ____ take swimming lessons this summer.", "opts": [{"t": "can't / have to", "ok": true, "fb": "完全不會游泳是能力的否定，因此必須去上課。"}, {"t": "can / have to", "ok": false, "fb": "at all 通常用在否定句，而且會游泳就不需要非上課不可。"}, {"t": "can't / don't have to", "ok": false, "fb": "前半對了，但不會游泳應該是需要上課，不是不必上課。"}, {"t": "can / has to", "ok": false, "fb": "主詞是 I，不能用 has to。"}]}], "kkN": 0, "stars": 0, "listenN": 2, "kk": [{"kind": "listen", "src": "112 年會考聽力 第 5 題", "audio": "../audio/112-05.mp3", "q": "聽一聽，選出最適合的回應。", "script": "Excuse me, but you can't eat in the metro.", "opts": [{"t": "Oh, you're hungry, too?", "ok": false, "fb": "對方是在提醒規定，不是說他也餓了。"}, {"t": "Why not? That's my seat.", "ok": false, "fb": "被提醒不能吃東西，回答座位答非所問。"}, {"t": "Oh, sorry. I didn't know that.", "ok": true, "fb": "can't 表示「不可以」→ 抱歉，我不知道。"}]}, {"kind": "listen", "src": "107 年會考聽力 第 10 題", "audio": "../audio/107-10.mp3", "q": "聽一聽，選出最適合的回應。", "script": "Can I borrow you for a second? There's something I want to show you.", "opts": [{"t": "I also need it, I'm afraid.", "ok": false, "fb": "borrow you 是「借你一下（找你過來）」，不是借東西。"}, {"t": "Sure, it's my favorite show.", "ok": false, "fb": "show 在這裡是動詞「給你看」，不是節目。"}, {"t": "Sorry, but I'm a little busy now.", "ok": true, "fb": "Can I borrow you…? 是請你過來一下 → 抱歉，我現在有點忙。"}]}, {"kind": "rw", "src": "會考風格改寫", "q": "Tomorrow is Sunday. We ＿＿＿ go to school, so let's sleep late.", "opts": [{"t": "have to", "ok": false, "fb": "週日要去上學和 sleep late 矛盾。"}, {"t": "can", "ok": false, "fb": "can 是「可以」，和睡晚一點不合。"}, {"t": "don't have to", "ok": true, "fb": "週日不用上學，所以可以晚點起：don't have to。"}, {"t": "has to", "ok": false, "fb": "主詞 We 不用 has。"}]}, {"kind": "rw", "src": "會考風格改寫", "q": "My brother is only two years old, but he ＿＿＿ count to ten.", "opts": [{"t": "can", "ok": true, "fb": "才兩歲卻「會」數到十：can 表示能力。"}, {"t": "cans", "ok": false, "fb": "can 是助動詞，不加 s。"}, {"t": "can to", "ok": false, "fb": "can 後面直接接原形，不加 to。"}, {"t": "have to", "ok": false, "fb": "have to 是「必須」，和 but 的語氣不合。"}]}]}, {"id": "present-simple", "title": "現在簡單式", "unit": "第二冊 Unit 3 · B2 L1–2", "points": "<p>現在簡單式講的不是「現在正在做」，而是<strong>平常都這樣、一直都是這樣</strong>。這是它和現在進行式最大的差別。</p><h3>三種用法</h3><table><tr><th>用法</th><th>例子</th></tr><tr><td>習慣</td><td class=\"en\">I <span class=\"k1\">get</span> up at six every day.</td></tr><tr><td>事實</td><td class=\"en\">The sun <span class=\"k1\">rises</span> in the east.</td></tr><tr><td>狀態</td><td class=\"en\">She <span class=\"k1\">lives</span> in Yilan.</td></tr></table><h3>主詞是他/她/它時，動詞要加 s</h3><table><tr><th>字尾</th><th>怎麼變</th><th>例子</th></tr><tr><td>一般</td><td>加 -s</td><td class=\"en\">play → play<span class=\"k2\">s</span></td></tr><tr><td>s, x, ch, sh, o</td><td>加 -es</td><td class=\"en\">go → go<span class=\"k2\">es</span>　watch → watch<span class=\"k2\">es</span></td></tr><tr><td>子音 + y</td><td>去 y 加 -ies</td><td class=\"en\">study → stud<span class=\"k2\">ies</span></td></tr><tr><td>have</td><td>不規則</td><td class=\"en\">have → <span class=\"k2\">has</span></td></tr></table><h3>否定與疑問要用助動詞</h3><table><tr><th>主詞</th><th>否定</th><th>疑問</th></tr><tr><td>I / You / We / They</td><td class=\"en\">don't + 原形</td><td class=\"en\">Do ... 原形?</td></tr><tr><td>He / She / It</td><td class=\"en\">doesn't + 原形</td><td class=\"en\">Does ... 原形?</td></tr></table><p style=\"color:var(--muted);font-size:17px\">重點：助動詞出現後，後面的動詞就變回原形。<span class=\"en\"><span class=\"bad\">He doesn't likes it.</span></span></p><h3>和現在進行式怎麼分</h3><table><tr><th></th><th>現在簡單式</th><th>現在進行式</th></tr><tr><td>意思</td><td>平常都會</td><td>此刻正在</td></tr><tr><td>提示詞</td><td class=\"en\">every day, usually, always, on Sundays</td><td class=\"en\">now, right now, Look!, Listen!</td></tr></table><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">She don't like it.</span>　→ 第三人稱單數要用 doesn't</p><p class=\"en\"><span class=\"bad\">Does he likes music?</span>　→ Does 後面用原形</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">He studys hard.</span>　→ 子音＋y 要改 ies</p></div>", "questions": [{"q": "My father ____ to work by bus every morning.", "opts": [{"t": "go", "ok": false, "fb": "主詞 My father 是第三人稱單數，動詞要加變化。"}, {"t": "goes", "ok": true, "fb": "go 的字尾是 o，第三人稱單數要加 -es。"}, {"t": "going", "ok": false, "fb": "every morning 表示習慣，用現在簡單式，不是進行式。"}, {"t": "is go", "ok": false, "fb": "be 動詞後面不能直接接原形動詞。"}]}, {"q": "My sister ____ English for an hour every night.", "opts": [{"t": "studys", "ok": false, "fb": "study 的 y 前面是子音 d，要去 y 加 ies。"}, {"t": "studies", "ok": true, "fb": "子音＋y 結尾，去掉 y 加 -ies。"}, {"t": "studyes", "ok": false, "fb": "沒有這種變化，子音＋y 是改成 ies。"}, {"t": "study", "ok": false, "fb": "主詞 My sister 是第三人稱單數，動詞要變化。"}]}, {"q": "Tom ____ carrots. He never eats them.", "opts": [{"t": "doesn't likes", "ok": false, "fb": "助動詞 doesn't 後面要接原形，不能再加 s。"}, {"t": "doesn't like", "ok": true, "fb": "第三人稱單數的否定用 doesn't，後面接原形動詞。"}, {"t": "don't like", "ok": false, "fb": "主詞 Tom 是第三人稱單數，要用 doesn't。"}, {"t": "isn't like", "ok": false, "fb": "like 是一般動詞，否定要用助動詞，不用 be 動詞。"}]}, {"q": "____ your parents work on Saturdays?", "opts": [{"t": "Do", "ok": true, "fb": "parents 是複數，一般動詞的疑問句用助動詞 Do。"}, {"t": "Does", "ok": false, "fb": "Does 用在第三人稱單數，但 parents 是複數。"}, {"t": "Are", "ok": false, "fb": "work 是一般動詞，疑問句要用助動詞 Do，不用 be 動詞。"}, {"t": "Is", "ok": false, "fb": "句子的動詞是 work，不是 be 動詞。"}]}, {"q": "A: Does Judy live near the school?　B: ____ She walks to school every day.", "opts": [{"t": "Yes, she does.", "ok": true, "fb": "Does 開頭的問句，簡答用 does。"}, {"t": "Yes, she is.", "ok": false, "fb": "問句用助動詞 Does，簡答也要用 does。"}, {"t": "Yes, she do.", "ok": false, "fb": "第三人稱單數要用 does，不是 do。"}, {"t": "Yes, she lives.", "ok": false, "fb": "簡答要用助動詞，不重複原本的動詞。"}]}, {"q": "My mom usually ____ dinner, but tonight my dad ____ in the kitchen.", "opts": [{"t": "cooks / is cooking", "ok": true, "fb": "usually 表示平常的習慣用簡單式；tonight 表示此刻用進行式。"}, {"t": "is cooking / cooks", "ok": false, "fb": "兩個時態放反了。usually 是習慣，tonight 是現在。"}, {"t": "cooks / cooks", "ok": false, "fb": "後半在講今晚正在發生的事，要用進行式。"}, {"t": "is cooking / is cooking", "ok": false, "fb": "前半有 usually，是平常的習慣，要用現在簡單式。"}]}, {"q": "Look at Ted! He ____ his new bike. He ____ it to school every day.", "opts": [{"t": "rides / is riding", "ok": false, "fb": "兩個放反了。Look! 表示現在正在做，every day 表示習慣。"}, {"t": "is riding / rides", "ok": true, "fb": "Look! 配進行式；every day 配現在簡單式。"}, {"t": "is riding / is riding", "ok": false, "fb": "後半有 every day，是平常的習慣，要用簡單式。"}, {"t": "rides / rides", "ok": false, "fb": "前面有 Look!，是叫你看眼前正在發生的事。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "He watches TV every night.", "ok": false, "fb": "這句是對的。watch 的字尾是 ch，加 -es。"}, {"t": "She don't have a bike.", "ok": true, "fb": "這句錯了。主詞 She 是第三人稱單數，要用 doesn't have。"}, {"t": "Do you like pop music?", "ok": false, "fb": "這句是對的。主詞 you 配助動詞 Do。"}, {"t": "It rains a lot in Yilan.", "ok": false, "fb": "這句是對的。It 是第三人稱單數，動詞加 s。"}]}], "kkN": 2, "stars": 2, "listenN": 0, "kk": [{"kind": "orig", "src": "110 年會考 第 6 題", "q": "Our teacher Ms. Wu seldom laughs, but when she ＿＿＿, everyone in the same building can hear her.", "opts": [{"t": "can", "ok": false, "fb": "can 後面要接原形動詞，這裡沒有動詞。"}, {"t": "does", "ok": true, "fb": "用 does 代替前面的 laughs，避免重複：when she does (= laughs)。"}, {"t": "has", "ok": false, "fb": "has 不能代替 laughs。"}, {"t": "will", "ok": false, "fb": "will 是未來式；when 子句說的是平常的情況，要用現在式。"}]}, {"kind": "orig", "src": "111 年會考 第 11 題", "q": "Aunt Gina has lived in this town for more than sixty years, so she ＿＿＿ it very well.", "opts": [{"t": "will know", "ok": false, "fb": "will know 是未來，但她現在就很熟了。"}, {"t": "knew", "ok": false, "fb": "knew 是過去式，但她還住在這裡，現在也很熟。"}, {"t": "knows", "ok": true, "fb": "住了六十多年，所以「現在」很熟悉，用現在式 knows。"}, {"t": "was going to know", "ok": false, "fb": "was going to know 是「過去打算知道」，句意不通。"}]}, {"kind": "rw", "src": "仿 111 年第 11 題", "q": "Mr. Chen has taught at this school for twenty years, so he ＿＿＿ every student's name.", "opts": [{"t": "knew", "ok": false, "fb": "過去式，但他現在仍然在這裡教書。"}, {"t": "knows", "ok": true, "fb": "教了二十年，所以「現在」知道每個人的名字：knows。"}, {"t": "will know", "ok": false, "fb": "未來式，但他已經知道了。"}, {"t": "is knowing", "ok": false, "fb": "know 表示狀態，通常不用進行式。"}]}]}, {"id": "time-prep", "title": "時間介系詞與常用介系詞", "unit": "第二冊 Unit 3–4 · B2", "points": "<p>時間介系詞的口訣是<strong>從大到小</strong>：範圍最大用 in，中等用 on，最小的一個時間點用 at。</p><h3>at / on / in</h3><table><tr><th>介系詞</th><th>接什麼</th><th>例子</th></tr><tr><td class=\"en\">at</td><td>幾點鐘、中午、晚上</td><td class=\"en\">at 7:00　at noon　at night</td></tr><tr><td class=\"en\">on</td><td>星期、日期、特定某天</td><td class=\"en\">on Monday　on May 5　on Sunday morning</td></tr><tr><td class=\"en\">in</td><td>月、年、季節、早上下午晚上</td><td class=\"en\">in July　in 2026　in summer　in the morning</td></tr></table><p style=\"color:var(--muted);font-size:17px\">要小心：<span class=\"en\">in the morning</span> 用 in，但講到某一天的早上就變成 <span class=\"en\">on Sunday morning</span>。前面一有特定日期，就改用 on。</p><h3>這些字前面不加介系詞</h3><p class=\"en\"><span class=\"k2\">today　tomorrow　tonight　yesterday<br>every day　this morning　next week</span></p><p class=\"en\"><span class=\"bad\">on tomorrow</span>　<span class=\"bad\">in every day</span></p><h3>其他常用介系詞</h3><table><tr><td class=\"en\">with</td><td>和某人一起</td><td class=\"en\">I go with my sister.</td></tr><tr><td class=\"en\">by</td><td>搭乘某種交通工具</td><td class=\"en\">by bus　by bike</td></tr><tr><td class=\"en\">for</td><td>持續多久、給某人</td><td class=\"en\">for an hour</td></tr><tr><td class=\"en\">from ... to ...</td><td>從⋯⋯到⋯⋯</td><td class=\"en\">from nine to five</td></tr></table><p style=\"color:var(--muted);font-size:17px\">交通工具用 by 時中間不加冠詞：<span class=\"en\">by bus</span>，不是 <span class=\"bad\">by a bus</span>。</p>", "questions": [{"q": "My birthday is ____ May 5. We are going to have a party.", "opts": [{"t": "in", "ok": false, "fb": "in 用在整個月份，像 in May。但這裡有明確的日期，要用 on。"}, {"t": "on", "ok": true, "fb": "有具體日期時用 on。"}, {"t": "at", "ok": false, "fb": "at 用在幾點鐘這種時間點，不用在日期。"}, {"t": "不填", "ok": false, "fb": "日期前面需要介系詞。"}]}, {"q": "School starts ____ eight o'clock ____ the morning.", "opts": [{"t": "at / in", "ok": true, "fb": "幾點鐘用 at；the morning 這種時段用 in。"}, {"t": "in / at", "ok": false, "fb": "兩個放反了。時刻用 at，早上這個時段用 in。"}, {"t": "on / in", "ok": false, "fb": "on 用在星期或日期，不用在幾點鐘。"}, {"t": "at / on", "ok": false, "fb": "前半對了，但 the morning 前面沒有特定日期，用 in。"}]}, {"q": "I usually play basketball with my friends ____ Sunday afternoon.", "opts": [{"t": "in", "ok": false, "fb": "前面有 Sunday 這個特定的一天，要改用 on。"}, {"t": "on", "ok": true, "fb": "一提到特定某一天的早上或下午，就用 on 而不是 in。"}, {"t": "at", "ok": false, "fb": "at 用在幾點鐘，不用在星期幾。"}, {"t": "不填", "ok": false, "fb": "Sunday afternoon 前面需要介系詞。"}]}, {"q": "We have an English test ____ tomorrow. Don't forget to study.", "opts": [{"t": "on", "ok": false, "fb": "tomorrow 前面不加介系詞。"}, {"t": "in", "ok": false, "fb": "tomorrow 是不加介系詞的字之一。"}, {"t": "at", "ok": false, "fb": "tomorrow 直接使用，前面不放介系詞。"}, {"t": "不填", "ok": true, "fb": "today、tomorrow、tonight、every day 這些字前面都不加介系詞。"}]}, {"q": "It gets very hot ____ summer, but it's quite cool ____ night.", "opts": [{"t": "in / at", "ok": true, "fb": "季節用 in；at night 是固定用法。"}, {"t": "at / in", "ok": false, "fb": "兩個放反了。季節用 in，而晚上固定說 at night。"}, {"t": "on / at", "ok": false, "fb": "on 用在星期或日期，不用在季節。"}, {"t": "in / in", "ok": false, "fb": "前半對了，但「在晚上」固定說 at night。"}]}, {"q": "I go to school ____ my brother ____ bike every day.", "opts": [{"t": "with / by", "ok": true, "fb": "和某人一起用 with；騎腳踏車這種交通方式用 by。"}, {"t": "by / with", "ok": false, "fb": "兩個放反了。人用 with，交通工具用 by。"}, {"t": "with / on", "ok": false, "fb": "前半對了，但講交通方式的固定說法是 by bike。"}, {"t": "and / by", "ok": false, "fb": "and 是連接詞，不能放在這個位置當介系詞用。"}]}, {"q": "The library is open ____ nine ____ five every day.", "opts": [{"t": "from / to", "ok": true, "fb": "表示一段時間的起點和終點，用 from... to...。"}, {"t": "at / at", "ok": false, "fb": "at 只能標出一個時間點，無法表示一整段時間。"}, {"t": "in / to", "ok": false, "fb": "起點要用 from，不是 in。"}, {"t": "from / at", "ok": false, "fb": "前半對了，但終點要用 to 和 from 搭配。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "My family goes to Yilan in July.", "ok": false, "fb": "這句是對的。月份用 in。"}, {"t": "I have a piano lesson on Wednesday.", "ok": false, "fb": "這句是對的。星期用 on。"}, {"t": "He goes to work by a car.", "ok": true, "fb": "這句錯了。by 加交通工具中間不加冠詞，要寫 by car。"}, {"t": "We eat dinner at six thirty.", "ok": false, "fb": "這句是對的。幾點鐘用 at。"}]}], "kkN": 2, "stars": 2, "listenN": 0, "kk": [{"kind": "orig", "src": "110 年會考 第 13 題", "q": "Beverly eats lots of snacks ＿＿＿ meals. That's why she is often too full to eat anything at mealtimes.", "opts": [{"t": "after", "ok": false, "fb": "after meals 是「飯後」，但後面說她到吃飯時間已經太飽。"}, {"t": "between", "ok": true, "fb": "between meals 是「兩餐之間」：正餐之間一直吃零食，所以吃飯時吃不下。"}, {"t": "during", "ok": false, "fb": "during meals 是「吃飯時」，那她吃飯時就不會吃不下。"}, {"t": "from", "ok": false, "fb": "from 後面要有 to（from … to …），不能單獨這樣用。"}]}, {"kind": "orig", "src": "115 年會考 第 6 題", "q": "Little Eric chose the doll ＿＿＿ big brown eyes because it was the cutest in the store.", "opts": [{"t": "at", "ok": false, "fb": "at 不能表示「帶有、有著」。"}, {"t": "in", "ok": false, "fb": "in 不能表示娃娃「有著」大眼睛。"}, {"t": "on", "ok": false, "fb": "on 是「在…上面」，不是「有著」。"}, {"t": "with", "ok": true, "fb": "with 表示「有著、帶著」：有著棕色大眼睛的娃娃。"}]}, {"kind": "rw", "src": "仿 110 年第 13 題", "q": "The store is closed ＿＿＿ 12:00 and 1:00 for lunch.", "opts": [{"t": "during", "ok": false, "fb": "during 後面接一段時間的名稱（during lunch），不能接 A and B。"}, {"t": "from", "ok": false, "fb": "from 要配 to：from 12:00 to 1:00。"}, {"t": "between", "ok": true, "fb": "between A and B：在十二點到一點之間。"}, {"t": "at", "ok": false, "fb": "at 只接一個時間點。"}]}]}, {"id": "which", "title": "Which 的用法", "unit": "第二冊 Unit 4 · B2 L3–4", "points": "<p>Which 和 What 都可以問「哪一個」，差別在<strong>有沒有給你範圍</strong>。</p><h3>What 和 Which 怎麼分</h3><table><tr><th></th><th>用在</th><th>例子</th></tr><tr><td class=\"en\">What</td><td>範圍沒有限制</td><td class=\"en\"><span class=\"k1\">What</span> is your favorite color?</td></tr><tr><td class=\"en\">Which</td><td>在幾個選項中挑</td><td class=\"en\"><span class=\"k1\">Which</span> do you like, tea or coffee?</td></tr></table><p style=\"color:var(--muted);font-size:17px\">判斷方法：句子裡有沒有出現 <span class=\"en\">A or B</span>，或前面有沒有先提到幾個東西。有就用 Which。</p><h3>三種常見句型</h3><p class=\"en\"><span class=\"k1\">Which</span> do you want, the red one <span class=\"k2\">or</span> the blue one?<br><span class=\"k1\">Which one</span> is yours?<br><span class=\"k1\">Which</span> <span class=\"k3\">girl</span> is your sister?　→ Which 後面可以直接接名詞</p><h3>不能用 Yes / No 回答</h3><p class=\"en\">Which is your bag?　<span class=\"bad\">Yes, it is.</span>　→ The black one.</p><p>Which 是疑問詞，和 What、Where 一樣，回答要給出具體內容。</p>", "questions": [{"q": "____ do you like better, apple juice or orange juice?", "opts": [{"t": "What", "ok": false, "fb": "句子裡給了兩個選項，要用 Which。"}, {"t": "Which", "ok": true, "fb": "有 A or B 兩個選項讓你挑，用 Which。"}, {"t": "Who", "ok": false, "fb": "Who 是問人，這裡問的是飲料。"}, {"t": "How", "ok": false, "fb": "How 問方法或狀態，不是在兩個選項中挑。"}]}, {"q": "A: ____ is your favorite subject?　B: Math. I like numbers.", "opts": [{"t": "What", "ok": true, "fb": "沒有給定範圍，所有科目都可以回答，用 What。"}, {"t": "Which", "ok": false, "fb": "句子裡沒有給選項，範圍不受限，要用 What。"}, {"t": "Whose", "ok": false, "fb": "Whose 問東西的主人，這裡問的是喜歡的科目。"}, {"t": "Where", "ok": false, "fb": "回答的是科目名稱，不是地點。"}]}, {"q": "____ girl is your sister, the tall one or the short one?", "opts": [{"t": "What", "ok": false, "fb": "後面給了兩個選項，要用 Which。"}, {"t": "Which", "ok": true, "fb": "Which 後面可以直接接名詞，而且句尾給了兩個選項。"}, {"t": "Who", "ok": false, "fb": "Who 後面不能接名詞，而且這裡是要在兩人中挑一個。"}, {"t": "Whose", "ok": false, "fb": "問的不是誰的東西，是哪一個女生。"}]}, {"q": "A: Which is your bike, the red one or the black one?　B: ____", "opts": [{"t": "Yes, it is.", "ok": false, "fb": "Which 是疑問詞，不能用 Yes 或 No 回答。"}, {"t": "The red one.", "ok": true, "fb": "Which 的回答要指出是哪一個。"}, {"t": "It's a bike.", "ok": false, "fb": "這是回答 What is it? 的答案。"}, {"t": "No, it isn't.", "ok": false, "fb": "疑問詞開頭的問句不能用 Yes / No 回答。"}]}, {"q": "There are three cakes on the table. ____ do you want?", "opts": [{"t": "What", "ok": false, "fb": "前面已經說了只有三個蛋糕，範圍是限定的，用 Which。"}, {"t": "Which one", "ok": true, "fb": "前面提到三個蛋糕，是在有限的選項中挑，用 Which one。"}, {"t": "Who", "ok": false, "fb": "Who 問的是人，但這裡問的是要哪一個蛋糕。"}, {"t": "How", "ok": false, "fb": "How 問方法或狀態，不是挑東西。"}]}, {"q": "下列哪一組問答是錯的？", "opts": [{"t": "A: Which season do you like best?　B: Spring.", "ok": false, "fb": "這組是對的。季節只有四個，範圍有限，用 Which。"}, {"t": "A: What is in your bag?　B: Some books and a pen.", "ok": false, "fb": "這組是對的。沒有給定範圍，用 What。"}, {"t": "A: Which is your seat, this one or that one?　B: Yes, this one.", "ok": true, "fb": "這組錯了。Which 開頭的問句不能加 Yes，直接說 This one 就好。"}, {"t": "A: Which color do you want, black or white?　B: White, please.", "ok": false, "fb": "這組是對的。給了兩個選項用 Which，回答直接說出選擇。"}]}, {"q": "A: ____ do you go to school, by bus or by bike?　B: By bike. It's faster.", "opts": [{"t": "How", "ok": false, "fb": "雖然問交通方式常用 How，但這句給了兩個選項，用 Which 更貼切。"}, {"t": "Which", "ok": true, "fb": "句尾給了 by bus or by bike 兩個選項，用 Which。"}, {"t": "What", "ok": false, "fb": "有明確的兩個選項時要用 Which。"}, {"t": "Where", "ok": false, "fb": "問的不是地點，是交通方式。"}]}, {"q": "A: ____ is your English teacher?　B: Ms. Chen. She is the one with long hair.", "opts": [{"t": "Which", "ok": false, "fb": "回答是一個人名，沒有給定的選項範圍，用 Who 比較自然。"}, {"t": "Who", "ok": true, "fb": "回答是一個人，而且句子裡沒有給選項，用 Who。"}, {"t": "What", "ok": false, "fb": "問「誰是你的老師」要用 Who。"}, {"t": "Whose", "ok": false, "fb": "Whose 問的是東西的主人。"}]}], "kkN": 0, "stars": 0, "listenN": 1, "kk": [{"kind": "listen", "src": "111 年會考聽力 第 5 題", "audio": "../audio/111-05.mp3", "q": "聽一聽，選出最適合的回應。", "script": "Excuse me, which way is the restroom?", "opts": [{"t": "Yes, I'm on my way.", "ok": false, "fb": "Which way 不能用 Yes 回答。"}, {"t": "OK, let's take a rest.", "ok": false, "fb": "rest 和 restroom 聲音像，是陷阱。"}, {"t": "Oh, it's just over there.", "ok": true, "fb": "Which way is the restroom? → 就在那邊。"}]}, {"kind": "rw", "src": "會考風格改寫", "q": "A: ＿＿＿ do you like better, cats or dogs?\nB: Dogs. They're friendly.", "opts": [{"t": "What", "ok": false, "fb": "有兩個選項讓人選，用 Which。"}, {"t": "Which", "ok": true, "fb": "在 cats 和 dogs 之間二選一 → Which。"}, {"t": "Who", "ok": false, "fb": "Who 問人。"}, {"t": "How", "ok": false, "fb": "How 問方式或狀態。"}]}, {"kind": "rw", "src": "會考風格改寫", "q": "A: There are three bags here. ＿＿＿ is yours?\nB: The black one.", "opts": [{"t": "Which one", "ok": true, "fb": "三個裡選一個 → Which one。"}, {"t": "Whose", "ok": false, "fb": "回答的是哪一個，不是誰的。"}, {"t": "What one", "ok": false, "fb": "沒有這種說法。"}, {"t": "Where", "ok": false, "fb": "回答不是地點。"}]}]}, {"id": "ordinal-date", "title": "序數、時間與日期的表達", "unit": "第二冊 Unit 4 · B2 L3–4", "points": "<p>基數是<strong>數量</strong>（有幾個），序數是<strong>順序</strong>（第幾個）。日期一律用序數。</p><h3>要特別記的序數</h3><table><tr><th>基數</th><th>序數</th><th>注意</th></tr><tr><td class=\"en\">one</td><td class=\"en\">first</td><td>整個字換掉</td></tr><tr><td class=\"en\">two</td><td class=\"en\">second</td><td>整個字換掉</td></tr><tr><td class=\"en\">three</td><td class=\"en\">third</td><td>整個字換掉</td></tr><tr><td class=\"en\">five</td><td class=\"en\">fifth</td><td class=\"bad\">fiveth</td></tr><tr><td class=\"en\">nine</td><td class=\"en\">ninth</td><td class=\"bad\">nineth（去掉 e）</td></tr><tr><td class=\"en\">twelve</td><td class=\"en\">twelfth</td><td class=\"bad\">twelveth</td></tr><tr><td class=\"en\">twenty</td><td class=\"en\">twentieth</td><td>y 改成 ie</td></tr></table><p style=\"color:var(--muted);font-size:17px\">其他大多是直接加 -th：four → fourth、six → sixth、ten → tenth。</p><h3>三種問句要分清楚</h3><table><tr><th>問句</th><th>問什麼</th><th>回答</th></tr><tr><td class=\"en\">What time is it?</td><td>幾點</td><td class=\"en\">It's seven o'clock.</td></tr><tr><td class=\"en\">What day is it today?</td><td>星期幾</td><td class=\"en\">It's Monday.</td></tr><tr><td class=\"en\">What's the date today?</td><td>幾月幾號</td><td class=\"en\">It's June 10.</td></tr></table><h3>時間怎麼說</h3><p class=\"en\">7:00 → seven o'clock<br>7:15 → seven fifteen<br>7:30 → seven thirty</p><p style=\"color:var(--muted);font-size:17px\">只有整點才用 o'clock，7:15 不能說成 <span class=\"bad\">seven fifteen o'clock</span>。</p>", "questions": [{"q": "December is the ____ month of the year.", "opts": [{"t": "twelve", "ok": false, "fb": "這是基數，表示數量。講「第幾個」要用序數 twelfth。"}, {"t": "twelveth", "ok": false, "fb": "拼錯了。twelve 的序數要把 ve 改成 f，變成 twelfth。"}, {"t": "twelfth", "ok": true, "fb": "twelve 的序數是 twelfth，ve 要改成 f。"}, {"t": "twelves", "ok": false, "fb": "這是複數形，不是序數。"}]}, {"q": "My birthday is on the ____ of May. I will be thirteen.", "opts": [{"t": "five", "ok": false, "fb": "日期要用序數，不用基數。"}, {"t": "fifth", "ok": true, "fb": "five 的序數是 fifth，注意 ve 要改成 f。"}, {"t": "fiveth", "ok": false, "fb": "拼錯了。five 的序數把 ve 改成 f，寫成 fifth。"}, {"t": "fives", "ok": false, "fb": "這是複數形，不能表示第幾個。"}]}, {"q": "September is the ____ month of the year.", "opts": [{"t": "nineth", "ok": false, "fb": "拼錯了。nine 的序數要去掉 e，寫成 ninth。"}, {"t": "ninth", "ok": true, "fb": "nine 加 th 之前要先去掉字尾的 e。"}, {"t": "nine", "ok": false, "fb": "這是基數，表示數量，不是順序。"}, {"t": "ninenth", "ok": false, "fb": "沒有這種拼法，正確是 ninth。"}]}, {"q": "A: ____ today?　B: It's Wednesday. We have music class.", "opts": [{"t": "What time is it", "ok": false, "fb": "回答的是星期三，不是幾點鐘。"}, {"t": "What day is it", "ok": true, "fb": "回答是星期幾，所以問句要用 What day。"}, {"t": "What's the date", "ok": false, "fb": "這是問幾月幾號，回答會是 It's June 10 這類答案。"}, {"t": "How is it", "ok": false, "fb": "How 問狀態，回答不會是星期幾。"}]}, {"q": "A: ____ today?　B: It's October 10. It's a holiday.", "opts": [{"t": "What day is it", "ok": false, "fb": "這是問星期幾，回答會是 Monday、Tuesday 這類答案。"}, {"t": "What's the date", "ok": true, "fb": "回答是幾月幾號，問句要用 What's the date。"}, {"t": "What time is it", "ok": false, "fb": "回答的是日期，不是時間。"}, {"t": "Which day is it", "ok": false, "fb": "問日期的固定說法是 What's the date，不用 Which。"}]}, {"q": "A: What time is it now?　B: ____ We are late!", "opts": [{"t": "It's Friday.", "ok": false, "fb": "這是回答 What day 的答案。"}, {"t": "It's eight fifteen.", "ok": true, "fb": "What time 問的是幾點幾分。"}, {"t": "It's May 20.", "ok": false, "fb": "這是回答 What's the date 的答案。"}, {"t": "It's sunny.", "ok": false, "fb": "這是回答天氣的答案。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "My classroom is on the third floor.", "ok": false, "fb": "這句是對的。樓層用序數 third。"}, {"t": "It's seven thirty o'clock now.", "ok": true, "fb": "這句錯了。只有整點才能用 o'clock，七點半直接說 seven thirty。"}, {"t": "Today is the first day of school.", "ok": false, "fb": "這句是對的。first 是 one 的序數。"}, {"t": "There are twelve months in a year.", "ok": false, "fb": "這句是對的。講數量用基數 twelve。"}]}, {"q": "Our English classroom is on the ____ floor, and there are ____ students in our class.", "opts": [{"t": "two / twenty", "ok": false, "fb": "樓層講的是順序，要用序數 second。"}, {"t": "second / twenty", "ok": true, "fb": "樓層用序數 second；學生人數是數量，用基數 twenty。"}, {"t": "second / twentieth", "ok": false, "fb": "前半對了，但學生人數是數量，要用基數 twenty。"}, {"t": "two / twentieth", "ok": false, "fb": "兩個都放反了。樓層用序數，人數用基數。"}]}], "kkN": 0, "stars": 0, "listenN": 2, "kk": [{"kind": "listen", "src": "111 年會考聽力 第 9 題", "audio": "../audio/111-09.mp3", "q": "聽一聽，選出最適合的回應。", "script": "What time will Chris's birthday party begin?", "opts": [{"t": "At noon.", "ok": true, "fb": "What time 問幾點 → 中午。"}, {"t": "October 24.", "ok": false, "fb": "這是日期，回答的是 When / What day，不是幾點。"}, {"t": "Don't be late.", "ok": false, "fb": "這是提醒，沒有說幾點開始。"}]}, {"kind": "listen", "src": "108 年會考聽力 第 12 題", "audio": "../audio/108-12.mp3", "q": "聽對話，回答問題。", "script": "W: When will we hold the party next week?\nM: Lucy wants it to be on February 13th or 14th.\nW: But don't you think it's easier for everyone to come on Saturday?\nM: Then the party should be on February 15th?\nW: I think so. I'll ask Lucy first if the date is okay.\nQuestion: When does the woman want to have the party?", "opts": [{"t": "February 13.", "ok": false, "fb": "這是 Lucy 想要的日期，不是女生想要的。"}, {"t": "February 14.", "ok": false, "fb": "這也是 Lucy 的選項。"}, {"t": "February 15.", "ok": true, "fb": "女生想要週六，也就是 2 月 15 日（fifteenth）。"}]}, {"kind": "rw", "src": "會考風格改寫", "q": "My birthday is on May ＿＿＿. Please come to my party.", "opts": [{"t": "twenty", "ok": false, "fb": "日期要用序數。"}, {"t": "two", "ok": false, "fb": "日期要用序數。"}, {"t": "twentieth", "ok": true, "fb": "日期用序數：May twentieth（5 月 20 日）。"}, {"t": "the twenty", "ok": false, "fb": "序數要用 twentieth。"}]}, {"kind": "rw", "src": "會考風格改寫", "q": "Our classroom is on the ＿＿＿ floor. Take the stairs and go up two floors from the first floor.", "opts": [{"t": "three", "ok": false, "fb": "樓層要用序數。"}, {"t": "second", "ok": false, "fb": "從一樓往上兩層是三樓。"}, {"t": "thirdth", "ok": false, "fb": "third 本身就是序數，不加 th。"}, {"t": "third", "ok": true, "fb": "一樓往上兩層 → the third floor。"}]}]}, {"id": "frequency", "title": "頻率副詞與 How often", "unit": "第二冊 Unit 4 · B2 L3–4", "points": "<p>頻率副詞的兩個考點：<strong>頻率的高低順序</strong>，以及<strong>放在句子的哪個位置</strong>。</p><h3>從最常到最不常</h3><table><tr><th>副詞</th><th>大約的頻率</th></tr><tr><td class=\"en\">always</td><td>總是（100%）</td></tr><tr><td class=\"en\">usually</td><td>通常</td></tr><tr><td class=\"en\">often</td><td>常常</td></tr><tr><td class=\"en\">sometimes</td><td>有時候</td></tr><tr><td class=\"en\">seldom</td><td>很少</td></tr><tr><td class=\"en\">never</td><td>從不（0%）</td></tr></table><h3>位置：be 動詞後面，一般動詞前面</h3><p class=\"en\">She <span class=\"k1\">is</span> <span class=\"k2\">always</span> happy.　→ be 動詞後面<br>She <span class=\"k2\">always</span> <span class=\"k1\">gets</span> up early.　→ 一般動詞前面</p><p style=\"color:var(--muted);font-size:17px\">記法：頻率副詞喜歡「躲在 be 動詞後面、擋在一般動詞前面」。</p><h3>頻率副詞片語：放句尾</h3><p class=\"en\"><span class=\"k3\">once</span> a week（一週一次）<br><span class=\"k3\">twice</span> a month（一個月兩次）<br><span class=\"k3\">three times</span> a year（一年三次）<br>every day / every Sunday</p><p class=\"en\">I go swimming <span class=\"k3\">twice a week</span>.　→ 片語放在句尾</p><h3>How often 問頻率</h3><p class=\"en\"><span class=\"k1\">How often</span> do you play basketball?<br>→ Twice a week. / Every Sunday. / Never.</p><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">She always is late.</span>　→ 要放在 be 動詞後面</p><p class=\"en\"><span class=\"bad\">He goes never to bed early.</span>　→ 要放在一般動詞前面</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">I once a week go swimming.</span>　→ 片語要放句尾</p></div>", "questions": [{"q": "My father ____ late because his office is far from home.", "opts": [{"t": "always is", "ok": false, "fb": "頻率副詞要放在 be 動詞後面，寫成 is always。"}, {"t": "is always", "ok": true, "fb": "頻率副詞放在 be 動詞的後面。"}, {"t": "is always be", "ok": false, "fb": "句子裡只需要一個 be 動詞。"}, {"t": "always", "ok": false, "fb": "late 是形容詞，前面需要 be 動詞。"}]}, {"q": "I ____ to bed before ten o'clock on school nights.", "opts": [{"t": "go usually", "ok": false, "fb": "頻率副詞要放在一般動詞前面，寫成 usually go。"}, {"t": "usually go", "ok": true, "fb": "頻率副詞放在一般動詞 go 的前面。"}, {"t": "usually goes", "ok": false, "fb": "位置對了，但主詞是 I，動詞不加 s。"}, {"t": "am usually go", "ok": false, "fb": "go 是一般動詞，前面不需要 be 動詞。"}]}, {"q": "Ted ____ eats breakfast. He always gets up late and runs to school.", "opts": [{"t": "always", "ok": false, "fb": "後面說他總是晚起、趕著上學，表示他幾乎不吃早餐。"}, {"t": "usually", "ok": false, "fb": "晚起又要趕去學校，表示他不太可能常常吃早餐。"}, {"t": "never", "ok": true, "fb": "總是晚起、還要用跑的去學校，表示從來沒時間吃早餐。"}, {"t": "often", "ok": false, "fb": "和後面的句子矛盾，晚起趕時間的人不會常吃早餐。"}]}, {"q": "A: How often do you go swimming?　B: ____", "opts": [{"t": "At six in the morning.", "ok": false, "fb": "這是回答 What time 的答案。How often 問的是多久一次。"}, {"t": "Twice a week.", "ok": true, "fb": "How often 問頻率，回答用次數的片語。"}, {"t": "In the swimming pool.", "ok": false, "fb": "這是回答 Where 的答案。"}, {"t": "Yes, I do.", "ok": false, "fb": "How often 是疑問詞，不能用 Yes / No 回答。"}]}, {"q": "My family goes to the night market ____ .", "opts": [{"t": "once a month", "ok": true, "fb": "頻率副詞片語要放在句尾。"}, {"t": "one a month", "ok": false, "fb": "「一次」要用 once，不是 one。"}, {"t": "one time a month", "ok": false, "fb": "一次的固定說法是 once，兩次是 twice，三次以上才用 times。"}, {"t": "a month once", "ok": false, "fb": "順序顛倒了，應該是 once a month。"}]}, {"q": "Amy ____ plays computer games. She played only one time last year.", "opts": [{"t": "always", "ok": false, "fb": "去年只玩過一次，頻率非常低，不可能是 always。"}, {"t": "often", "ok": false, "fb": "一年只玩一次不算常常。"}, {"t": "seldom", "ok": true, "fb": "一年只玩過一次，表示很少玩，用 seldom。"}, {"t": "usually", "ok": false, "fb": "usually 表示通常都會，和一年一次差太多了。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "She is never angry with us.", "ok": false, "fb": "這句是對的。頻率副詞放在 be 動詞後面。"}, {"t": "They sometimes play baseball after school.", "ok": false, "fb": "這句是對的。頻率副詞放在一般動詞前面。"}, {"t": "My mother often is tired after work.", "ok": true, "fb": "這句錯了。頻率副詞要放在 be 動詞後面，寫成 is often tired。"}, {"t": "I visit my grandparents twice a month.", "ok": false, "fb": "這句是對的。頻率片語放在句尾。"}]}, {"q": "A: ____ do you visit your grandparents?　B: ____ . We go there every Sunday.", "opts": [{"t": "How often / Once a week", "ok": true, "fb": "問頻率用 How often；每個星期天去就是一週一次。"}, {"t": "How long / Once a week", "ok": false, "fb": "How long 問的是時間長度，不是多久一次。"}, {"t": "How often / At nine o'clock", "ok": false, "fb": "疑問詞對了，但回答應該說多久一次，不是幾點。"}, {"t": "When / Twice a week", "ok": false, "fb": "回答給的是頻率，而且每週日去是一週一次不是兩次。"}]}], "kkN": 0, "stars": 0, "listenN": 2, "kk": [{"kind": "listen", "src": "111 年會考聽力 第 7 題", "audio": "../audio/111-07.mp3", "q": "聽一聽，選出最適合的回應。", "script": "How often do you shop for clothes?", "opts": [{"t": "Almost every month.", "ok": true, "fb": "How often 問頻率 → 幾乎每個月。"}, {"t": "Yeah, it's getting cold.", "ok": false, "fb": "How often 不能用 Yeah 回答，也沒有說次數。"}, {"t": "I like shopping online.", "ok": false, "fb": "這在說喜歡怎麼買，沒有說多久買一次。"}]}, {"kind": "listen", "src": "107 年會考聽力 第 5 題", "audio": "../audio/107-05.mp3", "q": "聽一聽，選出最適合的回應。", "script": "Do you go to the gym a lot?", "opts": [{"t": "It's near my office.", "ok": false, "fb": "問的是常不常去，不是健身房在哪裡。"}, {"t": "A lot of people go there.", "ok": false, "fb": "問的是「你」常不常去，不是很多人去。"}, {"t": "About four or five times a week.", "ok": true, "fb": "a lot（常常）→ 回答次數：一週四、五次。"}]}, {"kind": "rw", "src": "會考風格改寫", "q": "Mia ＿＿＿ late for school. She gets up at six every day.", "opts": [{"t": "is never", "ok": true, "fb": "頻率副詞放在 be 動詞後面：is never late。每天六點起床，所以從不遲到。"}, {"t": "never is", "ok": false, "fb": "頻率副詞要放在 be 動詞後面。"}, {"t": "is always", "ok": false, "fb": "每天六點起床，不會總是遲到。"}, {"t": "always is", "ok": false, "fb": "位置錯，意思也不對。"}]}, {"kind": "rw", "src": "會考風格改寫", "q": "A: ＿＿＿ do you clean your room?\nB: Twice a week.", "opts": [{"t": "How long", "ok": false, "fb": "How long 問多久（時間長度）。"}, {"t": "How many", "ok": false, "fb": "How many 問數量。"}, {"t": "How often", "ok": true, "fb": "Twice a week 是頻率 → How often。"}, {"t": "How much", "ok": false, "fb": "How much 問價錢或量。"}]}]}, {"id": "countable", "title": "可數與不可數名詞、計量單位", "unit": "第二冊 Unit 5 · B2 L5–6", "points": "<p>先判斷這個名詞<strong>能不能一個一個數</strong>，才能決定要不要加 s、能不能加 a。</p><h3>兩種名詞的差別</h3><table><tr><th></th><th>可數名詞</th><th>不可數名詞</th></tr><tr><td>能加 a / an</td><td class=\"en\">a book</td><td class=\"bad\">a water</td></tr><tr><td>能變複數</td><td class=\"en\">books</td><td class=\"bad\">waters</td></tr><tr><td>搭配的字</td><td class=\"en\">many, a few</td><td class=\"en\">much, a little</td></tr></table><h3>常見的不可數名詞</h3><p class=\"en\"><span class=\"k2\">water　milk　juice　tea　coffee<br>rice　bread　money　homework　time</span></p><p style=\"color:var(--muted);font-size:17px\">中文可以說「三個麵包」，但英文的 bread 不能數，要說 three <span class=\"k1\">pieces of</span> bread。</p><h3>計量單位：不可數名詞的量詞</h3><table><tr><th>單位</th><th>用在</th><th>例子</th></tr><tr><td class=\"en\">a glass of</td><td>冷飲</td><td class=\"en\">a glass of water / milk</td></tr><tr><td class=\"en\">a cup of</td><td>熱飲</td><td class=\"en\">a cup of tea / coffee</td></tr><tr><td class=\"en\">a bowl of</td><td>裝在碗裡</td><td class=\"en\">a bowl of rice / soup</td></tr><tr><td class=\"en\">a piece of</td><td>一塊、一片、一張</td><td class=\"en\">a piece of bread / paper</td></tr><tr><td class=\"en\">a bottle of</td><td>一瓶</td><td class=\"en\">a bottle of juice</td></tr></table><p class=\"en\">要變複數時，<strong>變的是單位不是名詞</strong>：<br>two <span class=\"k1\">glasses</span> of water　<span class=\"bad\">two glass of waters</span></p>", "questions": [{"q": "There isn't much ____ left in the bottle. Please buy some more.", "opts": [{"t": "waters", "ok": false, "fb": "water 是不可數名詞，不能加 s。"}, {"t": "water", "ok": true, "fb": "water 是不可數名詞，維持原形，前面用 much。"}, {"t": "a water", "ok": false, "fb": "不可數名詞前面不能加 a。"}, {"t": "many water", "ok": false, "fb": "many 用在可數名詞，而且句中已經有 much 了。"}]}, {"q": "I usually eat two ____ of bread for breakfast.", "opts": [{"t": "piece", "ok": false, "fb": "前面有 two，計量單位要變複數 pieces。"}, {"t": "pieces", "ok": true, "fb": "要變複數的是計量單位 piece，bread 本身不變。"}, {"t": "breads", "ok": false, "fb": "bread 是不可數名詞，不能加 s，要用 pieces of bread。"}, {"t": "pieces of breads", "ok": false, "fb": "單位變複數就好，bread 保持原形。"}]}, {"q": "My mother drinks a ____ of hot coffee every morning.", "opts": [{"t": "cup", "ok": true, "fb": "熱飲用 cup，像 a cup of tea、a cup of coffee。"}, {"t": "glass", "ok": false, "fb": "glass 通常用在冷飲，像 a glass of water。這裡是熱咖啡。"}, {"t": "piece", "ok": false, "fb": "piece 用在一塊、一片的固體，不用在飲料。"}, {"t": "bowl", "ok": false, "fb": "bowl 是碗，用在飯或湯，不用來裝咖啡。"}]}, {"q": "I don't have ____ with me now. Can you lend me one hundred dollars?", "opts": [{"t": "a money", "ok": false, "fb": "money 是不可數名詞，前面不能加 a。"}, {"t": "money", "ok": true, "fb": "money 是不可數名詞，直接用原形。"}, {"t": "moneys", "ok": false, "fb": "money 是不可數名詞，不能加 s。"}, {"t": "many money", "ok": false, "fb": "many 只能用在可數名詞，money 是不可數的。"}]}, {"q": "There are five ____ and a bowl of ____ on the table.", "opts": [{"t": "apple / rice", "ok": false, "fb": "前面有 five，apple 要變複數 apples。"}, {"t": "apples / rice", "ok": true, "fb": "apple 可數所以變複數；rice 不可數，用 a bowl of 計量。"}, {"t": "apples / rices", "ok": false, "fb": "前半對了，但 rice 是不可數名詞，不能加 s。"}, {"t": "apple / rices", "ok": false, "fb": "兩個都錯。apple 要變複數，rice 不能加 s。"}]}, {"q": "Please give me a ____ of milk and a ____ of cake.", "opts": [{"t": "glass / piece", "ok": true, "fb": "牛奶是冷飲用 glass；蛋糕一塊用 piece。"}, {"t": "piece / glass", "ok": false, "fb": "兩個放反了。牛奶要用杯子裝，蛋糕才是一塊。"}, {"t": "cup / bowl", "ok": false, "fb": "牛奶通常是冷的用 glass；蛋糕不會裝在碗裡。"}, {"t": "bowl / glass", "ok": false, "fb": "牛奶不用碗裝，蛋糕也不用杯子裝。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "I have a lot of homework today.", "ok": false, "fb": "這句是對的。homework 是不可數名詞，a lot of 兩種名詞都能用。"}, {"t": "There are three breads on the plate.", "ok": true, "fb": "這句錯了。bread 不可數，要寫成 three pieces of bread。"}, {"t": "She drinks two glasses of water every morning.", "ok": false, "fb": "這句是對的。變複數的是單位 glasses。"}, {"t": "We don't have much time.", "ok": false, "fb": "這句是對的。time 是不可數名詞，配 much。"}]}, {"q": "A: How about some tea?　B: Thanks. I'd like two ____ of tea, please.", "opts": [{"t": "cup", "ok": false, "fb": "前面有 two，單位要變複數 cups。"}, {"t": "cups", "ok": true, "fb": "茶是熱飲用 cup，數量是兩杯所以單位變複數。"}, {"t": "teas", "ok": false, "fb": "tea 是不可數名詞，要靠單位來計量。"}, {"t": "glasses", "ok": false, "fb": "熱飲習慣用 cup，glass 用在冷飲。"}]}], "kkN": 0, "stars": 0, "listenN": 1, "kk": [{"kind": "listen", "src": "108 年會考聽力 第 7 題", "audio": "../audio/108-07.mp3", "q": "聽一聽，選出最適合的回應。", "script": "I think I'll just have some soup. Maybe a salad too. How about you?", "opts": [{"t": "I'm serious.", "ok": false, "fb": "對方問你要點什麼，「我是認真的」答非所問。"}, {"t": "I hope it's good.", "ok": false, "fb": "這是在評論菜，沒有說自己要點什麼。"}, {"t": "I'll have the same.", "ok": true, "fb": "How about you?（你呢？）→ 我也點一樣的。"}]}, {"kind": "rw", "src": "會考風格改寫", "q": "I'm thirsty. Can I have ＿＿＿ of water?", "opts": [{"t": "a water", "ok": false, "fb": "water 不可數，不能加 a。"}, {"t": "two waters", "ok": false, "fb": "water 不可數，要用單位。"}, {"t": "a piece", "ok": false, "fb": "a piece of 用在蛋糕、紙等，水要用杯。"}, {"t": "a glass", "ok": true, "fb": "不可數名詞用單位：a glass of water。"}]}, {"kind": "rw", "src": "會考風格改寫", "q": "We need some ＿＿＿ for the cake. Let's go to the store.", "opts": [{"t": "egg", "ok": false, "fb": "some 後面接可數名詞要用複數。"}, {"t": "eggs", "ok": true, "fb": "some + 可數名詞複數：some eggs。"}, {"t": "an egg", "ok": false, "fb": "some 不能和 an 一起用。"}, {"t": "egges", "ok": false, "fb": "egg 直接加 s。"}]}]}, {"id": "quantifiers", "title": "數量形容詞、some / any、both / all", "unit": "第二冊 Unit 5 · B2 L5–6", "points": "<p>選數量形容詞的第一步永遠是：<strong>先看後面的名詞可不可數</strong>。</p><h3>可數配可數，不可數配不可數</h3><table><tr><th>意思</th><th>可數名詞</th><th>不可數名詞</th><th>兩種都可以</th></tr><tr><td>很多</td><td class=\"en\">many</td><td class=\"en\">much</td><td class=\"en\">a lot of / lots of</td></tr><tr><td>一些</td><td class=\"en\">a few</td><td class=\"en\">a little</td><td class=\"en\">some</td></tr></table><p class=\"en\"><span class=\"k1\">many</span> books　<span class=\"k2\">much</span> water　<span class=\"k3\">a lot of</span> books / water</p><h3>some 和 any</h3><table><tr><th>句型</th><th>用</th><th>例子</th></tr><tr><td>肯定句</td><td class=\"en\">some</td><td class=\"en\">I have <span class=\"k1\">some</span> money.</td></tr><tr><td>否定句</td><td class=\"en\">any</td><td class=\"en\">I don't have <span class=\"k2\">any</span> money.</td></tr><tr><td>疑問句</td><td class=\"en\">any</td><td class=\"en\">Do you have <span class=\"k2\">any</span> money?</td></tr><tr><td>邀請、請求</td><td class=\"en\">some</td><td class=\"en\">Would you like <span class=\"k1\">some</span> tea?</td></tr></table><p style=\"color:var(--muted);font-size:17px\">最後一列是例外：問句原則上用 any，但如果是<strong>請對方吃喝、或拜託對方</strong>，要用 some。</p><h3>both 和 all</h3><p class=\"en\"><span class=\"k1\">both</span> → 剛好兩個都<br><span class=\"k2\">all</span> → 三個以上，全部</p><p class=\"en\">I have two dogs. <span class=\"k1\">Both</span> of them are white.<br>There are thirty students. <span class=\"k2\">All</span> of them are here.</p>", "questions": [{"q": "There are ____ students on the playground. It's very noisy.", "opts": [{"t": "much", "ok": false, "fb": "students 是可數複數，要用 many。"}, {"t": "many", "ok": true, "fb": "students 可數，用 many。"}, {"t": "a little", "ok": false, "fb": "a little 用在不可數名詞，而且意思是「一點點」。"}, {"t": "much of", "ok": false, "fb": "much 用在不可數名詞，而且這裡的句型不需要 of。"}]}, {"q": "I don't have ____ time today. Let's talk about it tomorrow.", "opts": [{"t": "many", "ok": false, "fb": "time 是不可數名詞，要用 much。"}, {"t": "much", "ok": true, "fb": "time 是不可數名詞，否定句裡用 much。"}, {"t": "a few", "ok": false, "fb": "a few 用在可數名詞。"}, {"t": "a lot", "ok": false, "fb": "要寫成 a lot of 才能接名詞，不能只用 a lot。"}]}, {"q": "I still have ____ money in my pocket, so I can buy a drink.", "opts": [{"t": "a few", "ok": false, "fb": "money 是不可數名詞，要用 a little。"}, {"t": "a little", "ok": true, "fb": "money 不可數，表示「還有一點」用 a little。"}, {"t": "many", "ok": false, "fb": "many 只能用在可數名詞。"}, {"t": "a little of", "ok": false, "fb": "直接接名詞時不需要 of。"}]}, {"q": "I don't have ____ brothers or sisters. I'm the only child in my family.", "opts": [{"t": "some", "ok": false, "fb": "這是否定句，要用 any。"}, {"t": "any", "ok": true, "fb": "否定句裡表示「一個也沒有」，用 any。"}, {"t": "much", "ok": false, "fb": "brothers 和 sisters 是可數名詞，不用 much。"}, {"t": "a", "ok": false, "fb": "後面是複數名詞，前面不能加 a。"}]}, {"q": "A: Would you like ____ juice?　B: Yes, please. I'm really thirsty.", "opts": [{"t": "any", "ok": false, "fb": "這是請對方喝東西的邀請句，雖然是問句，仍然要用 some。"}, {"t": "some", "ok": true, "fb": "Would you like 是邀請，這種問句用 some 不用 any。"}, {"t": "many", "ok": false, "fb": "juice 是不可數名詞，不能用 many。"}, {"t": "a", "ok": false, "fb": "juice 是不可數名詞，前面不加 a。"}]}, {"q": "I have two cats. ____ of them are black.", "opts": [{"t": "All", "ok": false, "fb": "只有兩隻的時候用 Both；All 用在三個以上。"}, {"t": "Both", "ok": true, "fb": "剛好兩個都是，用 Both。"}, {"t": "Much", "ok": false, "fb": "much 是數量形容詞，不能這樣當主詞用。"}, {"t": "Any", "ok": false, "fb": "any 通常用在否定句或疑問句，不用在這種肯定的描述。"}]}, {"q": "There are thirty-five students in our class. ____ of them like our new English teacher.", "opts": [{"t": "Both", "ok": false, "fb": "Both 只能用在剛好兩個的時候，這裡有三十五個人。"}, {"t": "All", "ok": true, "fb": "三個以上的全部要用 All。"}, {"t": "Much", "ok": false, "fb": "students 是可數名詞，而且 much 不能這樣當主詞。"}, {"t": "A little", "ok": false, "fb": "a little 用在不可數名詞。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "There are a few apples in the basket.", "ok": false, "fb": "這句是對的。apples 可數，用 a few。"}, {"t": "How much books do you have?", "ok": true, "fb": "這句錯了。books 是可數名詞，要用 How many。"}, {"t": "She doesn't have any homework today.", "ok": false, "fb": "這句是對的。否定句用 any。"}, {"t": "We have a lot of rain in summer.", "ok": false, "fb": "這句是對的。a lot of 可以接不可數名詞。"}]}], "kkN": 5, "stars": 3, "listenN": 0, "kk": [{"kind": "orig", "src": "108 年會考 第 15 題", "q": "＿＿＿ other waiters in the restaurant have worked here longer than Clark; only Lois and Lana started working here before him.", "opts": [{"t": "All", "ok": false, "fb": "All 是「全部都」，但只有 Lois 和 Lana 兩個人比他早。"}, {"t": "Most", "ok": false, "fb": "Most 是「大部分」，但只有兩個人比他資深。"}, {"t": "Some", "ok": false, "fb": "Some 是「一些」，語氣上不像「只有兩個」那麼少。"}, {"t": "Few", "ok": true, "fb": "only Lois and Lana 表示「很少人」比他資深，用 Few（很少、幾乎沒有）。"}]}, {"kind": "orig", "src": "109 年會考 第 4 題", "q": "＿＿＿ of my sisters are older than I am. I'm the youngest of the three children in my family.", "opts": [{"t": "Both", "ok": true, "fb": "家裡三個小孩，我是最小的，所以兩個姊姊「兩個都」比我大：Both。"}, {"t": "Few", "ok": false, "fb": "Few 是「很少」，但兩個姊姊都比我大。"}, {"t": "Most", "ok": false, "fb": "Most 用在三個以上，這裡只有兩個姊姊。"}, {"t": "Some", "ok": false, "fb": "Some 表示「有些」，但兩個姊姊全都比我大。"}]}, {"kind": "orig", "src": "110 年會考 第 14 題", "q": "Nora: Can I check your drawer for some tools we can use?\nMatt: Sure. Take a look. See if you can find ＿＿＿ in there.", "opts": [{"t": "any", "ok": true, "fb": "在問句、if 子句裡，「一些」用 any：看看能不能找到任何（工具）。"}, {"t": "it", "ok": false, "fb": "it 指特定的一個東西，但前面說的是 some tools（不特定、複數）。"}, {"t": "others", "ok": false, "fb": "others 是「其他的」，但前面沒有提過哪些工具。"}, {"t": "those", "ok": false, "fb": "those 指「那些」特定的東西，但這裡是不特定的工具。"}]}, {"kind": "orig", "src": "114 年會考 第 14 題", "q": "I guess the rainwater has come in from the kitchen. See? ＿＿＿ of the windows are closed except the one in the kitchen.", "opts": [{"t": "All", "ok": true, "fb": "except the one in the kitchen：除了廚房那扇，「全部」都關著，用 All。"}, {"t": "Both", "ok": false, "fb": "Both 只能用在兩個，句子沒說只有兩扇窗。"}, {"t": "Most", "ok": false, "fb": "Most 是「大部分」，但有 except 時，前面要用「全部」才合理。"}, {"t": "Some", "ok": false, "fb": "Some 是「有些」，和 except（除了…以外都…）不搭。"}]}, {"kind": "orig", "src": "115 年會考 第 9 題", "q": "You can't push that door open with only one hand. It's too heavy. You have to use ＿＿＿!", "opts": [{"t": "all", "ok": false, "fb": "all 用在三個以上，人只有兩隻手。"}, {"t": "another", "ok": false, "fb": "another 是「另一隻」，但要推開門需要兩隻手一起用。"}, {"t": "both", "ok": true, "fb": "一隻手推不開，要用「兩隻手都」用上：both。"}, {"t": "one", "ok": false, "fb": "one 就是一隻手，前面說一隻手推不開。"}]}, {"kind": "rw", "src": "仿 109 年第 4 題", "q": "I have two brothers. ＿＿＿ of them like basketball, so we often play together after school.", "opts": [{"t": "Both", "ok": true, "fb": "兩個哥哥「兩個都」喜歡籃球：Both。"}, {"t": "All", "ok": false, "fb": "All 用在三個以上，這裡只有兩個。"}, {"t": "Few", "ok": false, "fb": "Few 是「很少」，但後面說常一起打球。"}, {"t": "Each", "ok": false, "fb": "Each of them 後面要接單數動詞 likes。"}]}]}, {"id": "how-many-much", "title": "How many / How much", "unit": "第二冊 Unit 5 · B2 L5–6", "points": "<p>問數量時，選 many 還是 much，一樣是看<strong>後面的名詞可不可數</strong>。</p><h3>基本句型</h3><table><tr><th>問句</th><th>接什麼</th><th>例子</th></tr><tr><td class=\"en\">How many</td><td>可數名詞複數</td><td class=\"en\">How many <span class=\"k1\">books</span> do you have?</td></tr><tr><td class=\"en\">How much</td><td>不可數名詞</td><td class=\"en\">How much <span class=\"k2\">water</span> do you drink?</td></tr></table><p class=\"en\">How many <span class=\"k1\">students</span> <span class=\"k3\">are there</span> in your class?<br>How much <span class=\"k2\">milk</span> <span class=\"k3\">is there</span> in the fridge?</p><p style=\"color:var(--muted);font-size:17px\">和 There is / are 一起用時，be 動詞也要跟著名詞變：可數複數配 are，不可數配 is。</p><h3>How much 也用來問價錢</h3><p class=\"en\"><span class=\"k2\">How much</span> is this pen?　→ It's fifty dollars.<br><span class=\"k2\">How much</span> are these shoes?　→ They're one thousand dollars.</p><p>問價錢一律用 How much，不管東西可不可數。</p><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">How many money do you have?</span>　→ money 不可數</p><p class=\"en\"><span class=\"bad\">How much books are there?</span>　→ books 可數</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">How many is this bag?</span>　→ 問價錢用 How much</p></div>", "questions": [{"q": "____ students are there in your English class?", "opts": [{"t": "How many", "ok": true, "fb": "students 是可數名詞的複數，用 How many。"}, {"t": "How much", "ok": false, "fb": "How much 用在不可數名詞，students 是可數的。"}, {"t": "How often", "ok": false, "fb": "How often 問的是多久一次，不是數量。"}, {"t": "How", "ok": false, "fb": "單獨的 How 問的是方法或狀態，問數量要加 many。"}]}, {"q": "____ water do you drink every day? You should drink more.", "opts": [{"t": "How many", "ok": false, "fb": "water 是不可數名詞，要用 How much。"}, {"t": "How much", "ok": true, "fb": "water 不可數，問數量用 How much。"}, {"t": "How long", "ok": false, "fb": "How long 問時間長度或長短，不是數量。"}, {"t": "How often", "ok": false, "fb": "How often 問頻率，但這裡問的是喝多少量。"}]}, {"q": "A: ____ is this dictionary?　B: It's three hundred and fifty dollars.", "opts": [{"t": "How many", "ok": false, "fb": "問價錢一律用 How much，不看東西可不可數。"}, {"t": "How much", "ok": true, "fb": "問價錢固定用 How much。"}, {"t": "How old", "ok": false, "fb": "How old 問年齡或使用多久，回答不會是價錢。"}, {"t": "What much", "ok": false, "fb": "英文沒有 What much 這種問法，問價錢固定用 How much。"}]}, {"q": "____ eggs ____ there in the refrigerator? I want to make a cake.", "opts": [{"t": "How many / are", "ok": true, "fb": "eggs 是可數複數，用 How many，be 動詞用 are。"}, {"t": "How many / is", "ok": false, "fb": "疑問詞對了，但 eggs 是複數，be 動詞要用 are。"}, {"t": "How much / is", "ok": false, "fb": "eggs 是可數名詞，要用 How many。"}, {"t": "How much / are", "ok": false, "fb": "eggs 可數，要用 How many 才對。"}]}, {"q": "____ milk ____ there in the bottle? It looks almost empty.", "opts": [{"t": "How many / are", "ok": false, "fb": "milk 是不可數名詞，要用 How much，be 動詞用 is。"}, {"t": "How much / is", "ok": true, "fb": "milk 不可數，用 How much，be 動詞用 is。"}, {"t": "How much / are", "ok": false, "fb": "疑問詞對了，但不可數名詞配單數的 is。"}, {"t": "How many / is", "ok": false, "fb": "milk 不可數，不能用 How many。"}]}, {"q": "A: How many bottles of juice do you need?　B: ____", "opts": [{"t": "Yes, I do.", "ok": false, "fb": "How many 是疑問詞，不能用 Yes / No 回答。"}, {"t": "Three, please.", "ok": true, "fb": "問數量，回答直接給數字。"}, {"t": "It's fifty dollars.", "ok": false, "fb": "這是回答價錢的答案，問句問的是要幾瓶。"}, {"t": "Twice a week.", "ok": false, "fb": "這是回答 How often 的答案。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "How much homework do you have today?", "ok": false, "fb": "這句是對的。homework 是不可數名詞。"}, {"t": "How many money do you need?", "ok": true, "fb": "這句錯了。money 是不可數名詞，要用 How much。"}, {"t": "How much are those apples?", "ok": false, "fb": "這句是對的。問價錢用 How much。"}, {"t": "How many chairs are there in the room?", "ok": false, "fb": "這句是對的。chairs 可數複數，配 How many 和 are。"}]}, {"q": "A: ____ do you want?　B: Two bowls, please. I'm really hungry.", "opts": [{"t": "How much rice", "ok": false, "fb": "雖然 rice 不可數用 How much 沒錯，但回答用了 two bowls，問句用 How many bowls 更貼切。"}, {"t": "How many bowls of rice", "ok": true, "fb": "回答是兩碗，問的是碗數。bowls 是可數的，用 How many。"}, {"t": "How many rice", "ok": false, "fb": "rice 是不可數名詞，不能直接用 How many。"}, {"t": "How much bowls", "ok": false, "fb": "bowls 是可數名詞的複數，要用 How many。"}]}], "kkN": 0, "stars": 0, "listenN": 1, "kk": [{"kind": "listen", "src": "112 年會考聽力 第 4 題", "audio": "../audio/112-04.mp3", "q": "聽一聽，選出最適合的回應。", "script": "How many eggs do we have? I want to make fried rice.", "opts": [{"t": "Tea eggs are my favorite.", "ok": false, "fb": "問的是有幾顆，不是最喜歡哪種蛋。"}, {"t": "We have thirty-five dollars.", "ok": false, "fb": "How many 問數量，這裡講的是錢，而且 eggs 才是重點。"}, {"t": "There are five in the refrigerator.", "ok": true, "fb": "How many eggs → 冰箱裡有五顆。"}]}, {"kind": "rw", "src": "會考風格改寫", "q": "A: ＿＿＿ is this T-shirt?\nB: It's 350 dollars.", "opts": [{"t": "How many", "ok": false, "fb": "How many 問數量，不問價錢。"}, {"t": "How old", "ok": false, "fb": "How old 問年紀。"}, {"t": "How much", "ok": true, "fb": "回答是價錢 → How much。"}, {"t": "How often", "ok": false, "fb": "How often 問頻率。"}]}, {"kind": "rw", "src": "會考風格改寫", "q": "A: How many ＿＿＿ are there in your class?\nB: Six.", "opts": [{"t": "students", "ok": true, "fb": "How many + 複數名詞：students。"}, {"t": "student", "ok": false, "fb": "How many 後面要用複數。"}, {"t": "money", "ok": false, "fb": "money 不可數，要用 How much。"}, {"t": "homework", "ok": false, "fb": "homework 不可數。"}]}]}, {"id": "past-be", "title": "過去簡單式（be 動詞）", "unit": "第二冊 Unit 5 · B2 L5–6", "points": "<p>過去式的 be 動詞只有兩個字，難的是<strong>判斷這句話講的是過去還是現在</strong>。</p><h3>現在變過去</h3><table><tr><th>主詞</th><th>現在</th><th>過去</th></tr><tr><td>I</td><td class=\"en\">am</td><td class=\"en\"><span class=\"k1\">was</span></td></tr><tr><td>He / She / It、單數名詞</td><td class=\"en\">is</td><td class=\"en\"><span class=\"k1\">was</span></td></tr><tr><td>You / We / They、複數名詞</td><td class=\"en\">are</td><td class=\"en\"><span class=\"k2\">were</span></td></tr></table><h3>否定與疑問</h3><p class=\"en\">否定：I <span class=\"k1\">wasn't</span> at home. / They <span class=\"k2\">weren't</span> happy.<br>疑問：<span class=\"k1\">Was</span> he sick? → Yes, he <span class=\"k1\">was</span>. / No, he <span class=\"k1\">wasn't</span>.<br>　　　<span class=\"k2\">Were</span> you there? → Yes, I <span class=\"k1\">was</span>.</p><p style=\"color:var(--muted);font-size:17px\">注意最後一行：問句用 Were you，但回答的主詞變成 I，所以簡答要用 was。</p><h3>看到這些字就是過去式</h3><p class=\"en\"><span class=\"k3\">yesterday　last night　last week　last year<br>two days ago　in 2020　then　just now</span></p><h3>There was / There were</h3><p class=\"en\">There <span class=\"k1\">was</span> a park here ten years ago.<br>There <span class=\"k2\">were</span> many people at the concert last night.</p><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">We was late.</span>　→ We 要配 were</p><p class=\"en\"><span class=\"bad\">Were you tired? Yes, I were.</span>　→ 主詞變 I 就用 was</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">He is sick yesterday.</span>　→ 有 yesterday 就要用過去式</p></div>", "questions": [{"q": "I ____ at home all day yesterday because it rained.", "opts": [{"t": "am", "ok": false, "fb": "句尾有 yesterday，是過去的事，要用過去式。"}, {"t": "was", "ok": true, "fb": "yesterday 表示過去，主詞 I 用 was。"}, {"t": "were", "ok": false, "fb": "主詞是 I，過去式要用 was。"}, {"t": "is", "ok": false, "fb": "主詞是 I 不能配 is，而且這是過去的事。"}]}, {"q": "Ted and his brother ____ in the park last Sunday afternoon.", "opts": [{"t": "was", "ok": false, "fb": "主詞是兩個人，是複數，過去式要用 were。"}, {"t": "were", "ok": true, "fb": "複數主詞的過去式用 were，last Sunday 表示過去。"}, {"t": "are", "ok": false, "fb": "last Sunday 表示過去，不能用現在式。"}, {"t": "is", "ok": false, "fb": "主詞是複數，而且是過去的事。"}]}, {"q": "The movie ____ interesting at all. I fell asleep in ten minutes.", "opts": [{"t": "wasn't", "ok": true, "fb": "後面說看十分鐘就睡著了，表示不好看；movie 是單數，過去式否定用 wasn't。"}, {"t": "weren't", "ok": false, "fb": "movie 是單數，要用 wasn't。"}, {"t": "isn't", "ok": false, "fb": "後面用了過去式 fell，整句在講過去的事。"}, {"t": "was", "ok": false, "fb": "看十分鐘就睡著，表示不有趣，要用否定。"}]}, {"q": "A: ____ you at the school library yesterday?　B: Yes, I ____ . I studied there for two hours.", "opts": [{"t": "Were / was", "ok": true, "fb": "問句主詞是 you 用 Were；回答主詞變成 I，所以用 was。"}, {"t": "Were / were", "ok": false, "fb": "問句對了，但回答的主詞是 I，要用 was。"}, {"t": "Was / was", "ok": false, "fb": "問句的主詞是 you，要用 Were。"}, {"t": "Are / am", "ok": false, "fb": "句中有 yesterday，是過去的事。"}]}, {"q": "My grandfather ____ a teacher thirty years ago, but now he ____ a farmer.", "opts": [{"t": "was / is", "ok": true, "fb": "thirty years ago 用過去式；now 用現在式。"}, {"t": "is / was", "ok": false, "fb": "兩個放反了。三十年前是過去，now 是現在。"}, {"t": "was / was", "ok": false, "fb": "後半有 now，是現在的狀況，要用現在式。"}, {"t": "is / is", "ok": false, "fb": "前半有 thirty years ago，是過去的事。"}]}, {"q": "There ____ many people at the night market last night.", "opts": [{"t": "was", "ok": false, "fb": "many people 是複數，要用 were。"}, {"t": "were", "ok": true, "fb": "many people 是複數，過去式用 were。"}, {"t": "are", "ok": false, "fb": "last night 表示過去，要用過去式。"}, {"t": "is", "ok": false, "fb": "主詞是複數，而且句子講的是昨晚的事。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "We were late for the movie last Friday.", "ok": false, "fb": "這句是對的。We 配 were，last Friday 是過去。"}, {"t": "She was in Japan two years ago.", "ok": false, "fb": "這句是對的。She 配 was，two years ago 是過去。"}, {"t": "They was very happy at the party.", "ok": true, "fb": "這句錯了。They 是複數，過去式要用 were。"}, {"t": "Was your brother sick yesterday?", "ok": false, "fb": "這句是對的。brother 是單數，過去式疑問句用 Was。"}]}, {"q": "Amy and I ____ classmates in elementary school, but we ____ in different classes now.", "opts": [{"t": "were / are", "ok": true, "fb": "小學時是過去用 were；now 是現在用 are。"}, {"t": "are / were", "ok": false, "fb": "兩個放反了。小學是過去，now 是現在。"}, {"t": "was / are", "ok": false, "fb": "Amy and I 是複數，過去式要用 were。"}, {"t": "were / were", "ok": false, "fb": "後半有 now，講的是現在的狀況。"}]}], "kkN": 0, "stars": 0, "listenN": 1, "kk": [{"kind": "listen", "src": "110 年會考聽力 第 7 題", "audio": "../audio/110-07.mp3", "q": "聽一聽，選出最適合的回應。", "script": "How was the fried chicken I bought you last night?", "opts": [{"t": "Just wonderful!", "ok": true, "fb": "How was …?（…怎麼樣？）→ 好吃極了！"}, {"t": "You were very sweet.", "ok": false, "fb": "問的是炸雞怎麼樣，不是在說對方人好。"}, {"t": "I would like to have some.", "ok": false, "fb": "炸雞昨晚已經吃了，不是現在想吃。"}]}, {"kind": "rw", "src": "會考風格改寫", "q": "A: Where ＿＿＿ you last night? I called you three times.\nB: Sorry, I was at the movies.", "opts": [{"t": "are", "ok": false, "fb": "last night 是過去。"}, {"t": "were", "ok": true, "fb": "last night → 過去式；主詞 you 用 were。"}, {"t": "was", "ok": false, "fb": "主詞 you 不用 was。"}, {"t": "did", "ok": false, "fb": "後面沒有動詞，要用 be 動詞。"}]}, {"kind": "rw", "src": "會考風格改寫", "q": "The test ＿＿＿ very hard yesterday. Many students didn't finish it.", "opts": [{"t": "was", "ok": true, "fb": "yesterday → 過去；主詞 The test 是單數：was。"}, {"t": "were", "ok": false, "fb": "主詞是單數。"}, {"t": "is", "ok": false, "fb": "yesterday 是過去。"}, {"t": "be", "ok": false, "fb": "要用變化過的 be 動詞。"}]}]}, {"id": "past-verb", "title": "過去簡單式（一般動詞）", "unit": "第三冊 Unit 6 · B3 L1–2", "points": "<p>一般動詞的過去式分<strong>規則變化</strong>和<strong>不規則變化</strong>。規則變化有拼字規則可循，不規則的只能背。</p><h3>規則變化四條</h3><table><tr><th>字尾</th><th>怎麼變</th><th>例子</th></tr><tr><td>一般</td><td>加 -ed</td><td class=\"en\">play → play<span class=\"k2\">ed</span></td></tr><tr><td>字尾是 e</td><td>加 -d</td><td class=\"en\">live → live<span class=\"k2\">d</span></td></tr><tr><td>子音 + y</td><td>去 y 加 -ied</td><td class=\"en\">study → stud<span class=\"k2\">ied</span></td></tr><tr><td>短母音 + 單子音</td><td>重複字尾加 -ed</td><td class=\"en\">stop → stop<span class=\"k2\">ped</span></td></tr></table><p style=\"color:var(--muted);font-size:17px\">這四條和現在進行式加 -ing 的規則幾乎一樣，可以一起記。</p><h3>常考的不規則變化</h3><table><tr><td class=\"en\">go → <span class=\"k1\">went</span></td><td class=\"en\">eat → <span class=\"k1\">ate</span></td><td class=\"en\">see → <span class=\"k1\">saw</span></td></tr><tr><td class=\"en\">have → <span class=\"k1\">had</span></td><td class=\"en\">do → <span class=\"k1\">did</span></td><td class=\"en\">get → <span class=\"k1\">got</span></td></tr><tr><td class=\"en\">come → <span class=\"k1\">came</span></td><td class=\"en\">take → <span class=\"k1\">took</span></td><td class=\"en\">buy → <span class=\"k1\">bought</span></td></tr><tr><td class=\"en\">make → <span class=\"k1\">made</span></td><td class=\"en\">write → <span class=\"k1\">wrote</span></td><td class=\"en\">run → <span class=\"k1\">ran</span></td></tr></table><h3>否定與疑問：助動詞變 did，動詞變回原形</h3><p class=\"en\">否定：I <span class=\"k2\">didn't</span> <span class=\"k3\">go</span> to school.　<span class=\"bad\">didn't went</span><br>疑問：<span class=\"k2\">Did</span> you <span class=\"k3\">go</span> to school?　<span class=\"bad\">Did you went</span><br>簡答：Yes, I <span class=\"k2\">did</span>. / No, I <span class=\"k2\">didn't</span>.</p><p style=\"color:var(--muted);font-size:17px\">只要句子裡出現了 did 或 didn't，過去的意思就已經表達完了，後面的動詞一定回到原形。</p><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">She didn't went home.</span>　→ didn't 後面用原形</p><p class=\"en\"><span class=\"bad\">He goed to Taipei.</span>　→ go 是不規則變化</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">I studyed English.</span>　→ 子音＋y 要改 ied</p></div>", "questions": [{"q": "We ____ English together and then ____ at a coffee shop yesterday.", "hint": "（study / stop）", "opts": [{"t": "studyed / stoped", "ok": false, "fb": "兩個都錯。study 的 y 前面是子音要改 ied；stop 是短母音＋單子音要重複 p。"}, {"t": "studied / stopped", "ok": true, "fb": "study 去 y 加 ied；stop 重複字尾再加 ed。"}, {"t": "studied / stoped", "ok": false, "fb": "study 對了，但 stop 是短母音＋單子音結尾，要重複 p 變成 stopped。"}, {"t": "studyed / stopped", "ok": false, "fb": "stop 對了，但 study 的 y 前面是子音 d，要改成 studied。"}]}, {"q": "Ted ____ to Taipei with his family last weekend.", "opts": [{"t": "goed", "ok": false, "fb": "go 是不規則動詞，過去式是 went，不加 ed。"}, {"t": "went", "ok": true, "fb": "go 的過去式是 went，屬於必須背的不規則變化。"}, {"t": "gone", "ok": false, "fb": "gone 不能單獨當過去式使用。"}, {"t": "going", "ok": false, "fb": "last weekend 是過去的事，而且前面沒有 be 動詞。"}]}, {"q": "I ____ my homework last night. I was too tired.", "opts": [{"t": "didn't did", "ok": false, "fb": "didn't 後面要接動詞原形，應該是 didn't do。"}, {"t": "didn't do", "ok": true, "fb": "否定用 didn't，後面的動詞回到原形 do。"}, {"t": "don't do", "ok": false, "fb": "last night 是過去的事，要用 didn't。"}, {"t": "not did", "ok": false, "fb": "否定要用助動詞 didn't，不能只放 not。"}]}, {"q": "____ you see the new movie last night? I heard it's great.", "opts": [{"t": "Did", "ok": true, "fb": "see 是一般動詞，過去式的疑問句用助動詞 Did。"}, {"t": "Do", "ok": false, "fb": "last night 表示過去，要用 Did。"}, {"t": "Were", "ok": false, "fb": "句子的動詞是 see，不是 be 動詞。"}, {"t": "Was", "ok": false, "fb": "一般動詞的疑問句要用助動詞 Did，不用 be 動詞。"}]}, {"q": "Did your brother ____ the math test last week?", "opts": [{"t": "passed", "ok": false, "fb": "Did 已經表示過去了，後面的動詞要回到原形。"}, {"t": "pass", "ok": true, "fb": "句子裡有 Did，後面的動詞一律用原形。"}, {"t": "passes", "ok": false, "fb": "Did 後面不會有第三人稱單數的變化。"}, {"t": "passing", "ok": false, "fb": "Did 後面接動詞原形，不接 V-ing。"}]}, {"q": "I ____ really tired last night, so I ____ to bed before nine.", "opts": [{"t": "was / went", "ok": true, "fb": "tired 是形容詞配 be 動詞的過去式 was；go 的過去式是 went。"}, {"t": "were / went", "ok": false, "fb": "主詞是 I，be 動詞的過去式要用 was。"}, {"t": "was / goed", "ok": false, "fb": "前半對了，但 go 是不規則動詞，過去式是 went。"}, {"t": "did / went", "ok": false, "fb": "tired 是形容詞，前面要用 be 動詞不是 did。"}]}, {"q": "Amy usually ____ TV after dinner, but last night she ____ for the test.", "hint": "（watch / study）", "opts": [{"t": "watches / studied", "ok": true, "fb": "usually 是平常的習慣用現在簡單式；last night 是過去用過去式。"}, {"t": "watched / studies", "ok": false, "fb": "兩個時態放反了。usually 是習慣，last night 是過去。"}, {"t": "watches / studies", "ok": false, "fb": "後半有 last night，是過去的事，要用過去式。"}, {"t": "watched / studied", "ok": false, "fb": "前半有 usually，講的是平常的習慣，要用現在簡單式。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "She didn't go to school yesterday.", "ok": false, "fb": "這句是對的。didn't 後面用原形 go。"}, {"t": "We watched a baseball game last Sunday.", "ok": false, "fb": "這句是對的。watch 是規則變化，加 ed。"}, {"t": "Did he bought a new bike?", "ok": true, "fb": "這句錯了。Did 後面的動詞要用原形，應該是 Did he buy。"}, {"t": "They ate dinner at a restaurant.", "ok": false, "fb": "這句是對的。eat 的過去式是 ate。"}]}], "kkN": 6, "stars": 3, "listenN": 0, "kk": [{"kind": "orig", "src": "107 年會考 第 4 題", "q": "I don't have any money with me because I ＿＿＿ my wallet this morning.", "opts": [{"t": "had lost", "ok": false, "fb": "had lost 是過去完成式，要有「比另一件過去的事更早」才用。這裡只說今天早上。"}, {"t": "would lose", "ok": false, "fb": "would lose 是「過去預計會」，但錢包已經掉了，不是預計。"}, {"t": "lost", "ok": true, "fb": "this morning 是過去的時間，錢包是早上掉的，用過去式 lost。"}, {"t": "was losing", "ok": false, "fb": "was losing 是「當時正在掉」，弄丟是一瞬間的事，不用進行式。"}]}, {"kind": "orig", "src": "109 年會考 第 9 題", "q": "Mozart ＿＿＿ his first music when he was only six years old.", "opts": [{"t": "is writing", "ok": false, "fb": "is writing 是現在進行式，但 when he was six 是過去。"}, {"t": "has written", "ok": false, "fb": "has written 是現在完成式，不能和 when he was six 這種明確的過去時間一起用。"}, {"t": "will write", "ok": false, "fb": "will write 是未來式，六歲那年早就過去了。"}, {"t": "wrote", "ok": true, "fb": "when he was only six years old 是過去的時間點，用過去式 wrote。"}]}, {"kind": "orig", "src": "111 年會考 第 19 題", "q": "Ariel ＿＿＿ every night for a week before her Chinese test and got a very good grade.", "opts": [{"t": "studied", "ok": true, "fb": "後面的 got 是過去式，兩個動作都是過去發生的，用 studied。"}, {"t": "studies", "ok": false, "fb": "studies 是現在式，但考試和 got a good grade 都已經過去了。"}, {"t": "has studied", "ok": false, "fb": "has studied 是現在完成式，句子在講已經結束的過去事件，配 got 要用過去式。"}, {"t": "was going to study", "ok": false, "fb": "was going to study 是「原本打算讀」，但她真的讀了也考好了。"}]}, {"kind": "orig", "src": "112 年會考 第 20 題", "q": "I ＿＿＿ swimming for several years before I went to this high school. I gave it up because of heavy schoolwork.", "opts": [{"t": "have practiced", "ok": false, "fb": "have practiced 表示到現在還在練，但後面說 I gave it up，已經放棄了。"}, {"t": "am practicing", "ok": false, "fb": "am practicing 是現在進行式，但他已經不游了。"}, {"t": "practiced", "ok": true, "fb": "before I went to this high school、I gave it up 都是過去的事，用過去式 practiced。"}, {"t": "would practice", "ok": false, "fb": "would practice 是「過去預計會」，這裡是真的練過。"}]}, {"kind": "orig", "src": "113 年會考 第 21 題", "q": "Mom: Linda, you've been playing computer games all evening! Have you finished your report?\nLinda: Well, ＿＿＿ most of it this afternoon, and I'll finish it by Friday.", "opts": [{"t": "I would do", "ok": false, "fb": "I would do 是「過去預計會做」，這裡是真的做了。"}, {"t": "I did", "ok": true, "fb": "this afternoon 已經過去（媽媽說現在是晚上），用過去式 I did。"}, {"t": "I was doing", "ok": false, "fb": "I was doing 是「當時正在做」，要搭配另一個同時發生的動作。"}, {"t": "I'll do", "ok": false, "fb": "I'll do 是未來式，但下午已經過去了。"}]}, {"kind": "orig", "src": "115 年會考 第 17 題", "q": "Do you know what Lindsey's first job was? Before becoming a movie star, she ＿＿＿ the floors at the supermarket.", "opts": [{"t": "mops", "ok": false, "fb": "mops 是現在式，但她現在是電影明星了，拖地是以前的工作。"}, {"t": "is mopping", "ok": false, "fb": "is mopping 是現在進行式，和 Before becoming a movie star 不合。"}, {"t": "has mopped", "ok": false, "fb": "has mopped 是現在完成式，不能用來說成為明星「之前」的那段經歷。"}, {"t": "mopped", "ok": true, "fb": "Before becoming a movie star 和 first job was 都是過去，用過去式 mopped。"}]}, {"kind": "rw", "src": "仿 115 年第 17 題", "q": "Before Mr. Lin opened his own restaurant, he ＿＿＿ as a cook at a hotel for ten years.", "opts": [{"t": "works", "ok": false, "fb": "works 是現在式，但開餐廳「之前」的工作是過去的事。"}, {"t": "is working", "ok": false, "fb": "現在進行式和 Before … opened 不合。"}, {"t": "worked", "ok": true, "fb": "Before he opened（過去）是線索，以前的工作用過去式 worked。"}, {"t": "will work", "ok": false, "fb": "will work 是未來，但那是以前的事。"}]}]}, {"id": "because-although", "title": "連接詞 because / so / although / but", "unit": "第三冊 Unit 6 · B3 L1–2", "points": "<p>這四個連接詞兩兩成對。難的不是意思，是<strong>中文可以兩個一起用，英文只能用一個</strong>。</p><h3>原因與結果</h3><p class=\"en\"><span class=\"k1\">Because</span> it was raining, we stayed home.<br>It was raining, <span class=\"k2\">so</span> we stayed home.</p><table><tr><th>連接詞</th><th>後面接</th></tr><tr><td class=\"en\">because</td><td>原因</td></tr><tr><td class=\"en\">so</td><td>結果</td></tr></table><h3>讓步與轉折</h3><p class=\"en\"><span class=\"k1\">Although</span> he was tired, he kept working.<br>He was tired, <span class=\"k2\">but</span> he kept working.</p><table><tr><th>連接詞</th><th>後面接</th></tr><tr><td class=\"en\">although</td><td>和結果相反的事實（雖然）</td></tr><tr><td class=\"en\">but</td><td>轉折（但是）</td></tr></table><h3>最重要的一條規則：只能用一個</h3><p class=\"en\"><span class=\"bad\">Because he was sick, so he didn't come.</span><br><span class=\"bad\">Although it was cold, but he went swimming.</span></p><p>中文說「因為⋯⋯所以⋯⋯」「雖然⋯⋯但是⋯⋯」是成對的，英文<strong>只能留一個</strong>：</p><p class=\"en\"><span class=\"k3\">Because</span> he was sick, he didn't come.　<span class=\"k0\">（或）</span>　He was sick, <span class=\"k3\">so</span> he didn't come.</p><h3>放句首要加逗號</h3><p class=\"en\"><span class=\"k1\">Because</span> I was late, I ran to school.<br>I ran to school <span class=\"k1\">because</span> I was late.</p><p>because 和 although 的子句放句首時，後面要加逗號；放句尾則不用。</p>", "questions": [{"q": "____ it was raining hard, we didn't go to the park.", "opts": [{"t": "Because", "ok": true, "fb": "下大雨是原因，放在句首用 Because。"}, {"t": "So", "ok": false, "fb": "so 後面接結果，而且不能放在句首當連接詞。"}, {"t": "But", "ok": false, "fb": "but 不能放在這個位置連接兩個句子。"}, {"t": "Although", "ok": false, "fb": "下大雨和不去公園是順理成章的，沒有相反的關係。"}]}, {"q": "Ted was very tired, ____ he still finished his homework.", "opts": [{"t": "because", "ok": false, "fb": "很累卻還是寫完功課，兩件事是相反的，不是因果。"}, {"t": "so", "ok": false, "fb": "很累的結果通常不是把功課寫完，這裡是轉折。"}, {"t": "but", "ok": true, "fb": "很累卻還是寫完，和預期相反，用 but。"}, {"t": "although", "ok": false, "fb": "although 要放在表示「雖然」的那半句前面，不是放在這個位置。"}]}, {"q": "____ Amy studied very hard, she didn't do well on the test.", "opts": [{"t": "Because", "ok": false, "fb": "很用功卻考不好，兩件事是相反的，不是因果關係。"}, {"t": "Although", "ok": true, "fb": "很用功卻考不好，和預期相反，用 Although 表示「雖然」。"}, {"t": "So", "ok": false, "fb": "so 不能放在句首連接兩個句子。"}, {"t": "But", "ok": false, "fb": "but 不能放句首，表示「雖然」要用 Although。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "Because he was sick, so he stayed home.", "ok": true, "fb": "這句錯了。英文不能 because 和 so 一起用，只能留一個。"}, {"t": "He was sick, so he stayed home.", "ok": false, "fb": "這句是對的。前面是原因，so 後面接結果。"}, {"t": "Because he was sick, he stayed home.", "ok": false, "fb": "這句是對的。Because 放句首，後面加逗號。"}, {"t": "He stayed home because he was sick.", "ok": false, "fb": "這句是對的。because 放句尾不用逗號。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "Although it was cold, but he went swimming.", "ok": true, "fb": "這句錯了。although 和 but 不能同時出現，只能用一個。"}, {"t": "Although it was cold, he went swimming.", "ok": false, "fb": "這句是對的。用 Although 就不再加 but。"}, {"t": "It was cold, but he went swimming.", "ok": false, "fb": "這句是對的。只用 but 表示轉折。"}, {"t": "He went swimming although it was cold.", "ok": false, "fb": "這句是對的。although 的子句也可以放句尾。"}]}, {"q": "Judy missed the school bus ____ she got up late this morning.", "opts": [{"t": "so", "ok": false, "fb": "晚起是原因，沒趕上公車是結果。so 後面要接結果。"}, {"t": "because", "ok": true, "fb": "空格後面接的是原因（晚起），用 because。"}, {"t": "although", "ok": false, "fb": "晚起和沒趕上公車是順理成章的，不是相反的關係。"}, {"t": "but", "ok": false, "fb": "兩件事之間沒有轉折，是明確的因果。"}]}, {"q": "I really like this restaurant, ____ the food is a little expensive.", "opts": [{"t": "so", "ok": false, "fb": "貴不是喜歡這家餐廳的結果，兩句是相反的。"}, {"t": "because", "ok": false, "fb": "沒有人會因為東西貴才喜歡一家店，這裡是轉折。"}, {"t": "but", "ok": true, "fb": "喜歡卻覺得貴，前後相反，用 but。"}, {"t": "although", "ok": false, "fb": "although 要放在「雖然」那一半的句首，位置不對。"}]}, {"q": "____ my brother is only ten, he can cook very well. He learned it ____ he loves food.", "opts": [{"t": "Although / because", "ok": true, "fb": "才十歲卻很會煮，是相反的用 Although；愛吃是學會的原因用 because。"}, {"t": "Because / although", "ok": false, "fb": "兩個放反了。年紀小和很會煮是相反的，愛吃才是原因。"}, {"t": "Although / so", "ok": false, "fb": "前半對了，但空格後面接的是原因，要用 because。"}, {"t": "Because / so", "ok": false, "fb": "年紀小不是很會煮的原因，兩者是相反的。"}]}], "kkN": 2, "stars": 2, "listenN": 0, "kk": [{"kind": "orig", "src": "110 年會考 第 10 題", "q": "Jimmy would not get up for breakfast, ＿＿＿ his dad had already tried to pull him from his bed several times.", "opts": [{"t": "although", "ok": true, "fb": "爸爸拉了好幾次，他「還是」不起床：前後相反，用 although（雖然）。"}, {"t": "because", "ok": false, "fb": "because 後面接原因，但爸爸拉他不是他不起床的原因。"}, {"t": "if", "ok": false, "fb": "if 是「如果」，爸爸已經拉過了，不是假設。"}, {"t": "until", "ok": false, "fb": "until 是「直到」，句意變成「直到爸爸拉他才不起床」，不通。"}]}, {"kind": "orig", "src": "114 年會考 第 15 題", "q": "＿＿＿ machines have been used to pick fruits for a long time, they were not used on strawberry farms until several years ago.", "opts": [{"t": "Although", "ok": true, "fb": "機器早就用來採水果，但草莓農場幾年前才開始用：前後相反，用 Although。"}, {"t": "Because", "ok": false, "fb": "Because 表示原因，但前句不是後句的原因。"}, {"t": "Before", "ok": false, "fb": "Before 是時間先後，句意不通。"}, {"t": "If", "ok": false, "fb": "If 是假設，但機器採水果是事實。"}]}, {"kind": "rw", "src": "仿 110 年第 10 題", "q": "＿＿＿ it was raining hard, the students still played soccer on the playground.", "opts": [{"t": "Although", "ok": true, "fb": "雨下很大，學生「還是」去踢球：前後相反，用 Although。"}, {"t": "Because", "ok": false, "fb": "下雨不是去踢球的原因。"}, {"t": "If", "ok": false, "fb": "雨已經在下了，不是假設。"}, {"t": "Until", "ok": false, "fb": "Until 是「直到」，句意不通。"}]}]}, {"id": "sub-conj", "title": "從屬連接詞 when / while / before / after / until", "unit": "第三冊 Unit 6 · B3 L1–2", "points": "<p>這五個連接詞用來說明<strong>兩件事發生的先後或同時</strong>。選錯了句子的意思就整個變了。</p><h3>五個連接詞</h3><table><tr><th>連接詞</th><th>意思</th><th>例子</th></tr><tr><td class=\"en\">when</td><td>當⋯⋯的時候</td><td class=\"en\"><span class=\"k1\">When</span> I got home, my mom was cooking.</td></tr><tr><td class=\"en\">while</td><td>在⋯⋯的期間</td><td class=\"en\"><span class=\"k1\">While</span> I was reading, he came in.</td></tr><tr><td class=\"en\">before</td><td>在⋯⋯之前</td><td class=\"en\">Wash your hands <span class=\"k1\">before</span> you eat.</td></tr><tr><td class=\"en\">after</td><td>在⋯⋯之後</td><td class=\"en\">I watch TV <span class=\"k1\">after</span> I finish my homework.</td></tr><tr><td class=\"en\">until</td><td>直到⋯⋯為止</td><td class=\"en\">I waited <span class=\"k1\">until</span> she came back.</td></tr></table><h3>when 和 while 怎麼分</h3><p class=\"en\"><span class=\"k1\">while</span> 後面習慣接<strong>持續中的長動作</strong>，常搭配進行式：<br><span class=\"k1\">While</span> I <span class=\"k2\">was taking</span> a shower, the phone rang.</p><p class=\"en\"><span class=\"k1\">when</span> 後面常接<strong>短暫發生的動作</strong>：<br><span class=\"k1\">When</span> the phone <span class=\"k2\">rang</span>, I was taking a shower.</p><p style=\"color:var(--muted);font-size:17px\">判斷方法：哪一件事做比較久，就放在 while 後面。</p><h3>位置與逗號</h3><p class=\"en\"><span class=\"k3\">Before</span> I go to bed, I brush my teeth.　→ 放句首，加逗號<br>I brush my teeth <span class=\"k3\">before</span> I go to bed.　→ 放句尾，不加逗號</p><p>兩種寫法意思完全一樣，只是順序不同。</p><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">I will call you when I will get home.</span>　→ 時間子句不用未來式</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">While the phone rang, I was sleeping.</span>　→ 短動作要用 when</p></div>", "questions": [{"q": "____ I was taking a shower, the phone suddenly rang.", "opts": [{"t": "While", "ok": true, "fb": "洗澡是持續中的長動作，放在 While 後面。"}, {"t": "Before", "ok": false, "fb": "電話是在洗澡的過程中響的，不是洗澡之前。"}, {"t": "After", "ok": false, "fb": "電話響的時候還在洗澡，不是洗完之後。"}, {"t": "Until", "ok": false, "fb": "until 表示「直到⋯⋯為止」，這裡不是在講持續到某個時間點。"}]}, {"q": "____ the bell rang, all the students ran out of the classroom.", "opts": [{"t": "While", "ok": false, "fb": "鈴響是一瞬間的短動作，要用 When。"}, {"t": "When", "ok": true, "fb": "鈴響是短暫發生的動作，用 When。"}, {"t": "Until", "ok": false, "fb": "句子的意思是鈴一響就衝出去，不是「直到鈴響為止」。"}, {"t": "Before", "ok": false, "fb":
