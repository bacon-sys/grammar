"學生是鈴響之後才跑出去的，不是之前。"}]}, {"q": "Please wash your hands ____ you eat dinner.", "opts": [{"t": "after", "ok": false, "fb": "洗手應該在吃飯之前，不是之後。"}, {"t": "before", "ok": true, "fb": "洗手要在吃飯之前，用 before。"}, {"t": "until", "ok": false, "fb": "until 是「直到為止」，意思不通。"}, {"t": "while", "ok": false, "fb": "一邊吃飯一邊洗手不合理。"}]}, {"q": "I usually take a walk ____ I finish my dinner.", "opts": [{"t": "before", "ok": false, "fb": "吃完飯才去散步，所以是吃完之後。"}, {"t": "after", "ok": true, "fb": "finish my dinner 表示吃完了，散步在那之後。"}, {"t": "until", "ok": false, "fb": "until 表示持續到某個時間點，意思不合。"}, {"t": "while", "ok": false, "fb": "一邊吃飯一邊散步不合理。"}]}, {"q": "The little boy cried ____ his mother came back.", "opts": [{"t": "until", "ok": true, "fb": "一直哭到媽媽回來為止，用 until。"}, {"t": "before", "ok": false, "fb": "before 只說明先後，表達不出「一直持續到」的意思。"}, {"t": "while", "ok": false, "fb": "媽媽回來是一瞬間的動作，不適合用 while。"}, {"t": "after", "ok": false, "fb": "意思會變成媽媽回來之後他才開始哭，不合理。"}]}, {"q": "____ my father was watching TV, my mother ____ the dishes.", "opts": [{"t": "While / was washing", "ok": true, "fb": "兩件事同時持續進行，用 While 搭配進行式。"}, {"t": "While / washes", "ok": false, "fb": "前半用了過去進行式，後半也要用過去式。"}, {"t": "Until / was washing", "ok": false, "fb": "這兩件事是同時發生，不是持續到某個時間點。"}, {"t": "Before / was washing", "ok": false, "fb": "兩件事是同時進行的，不是一前一後。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "When I got home, my sister was sleeping.", "ok": false, "fb": "這句是對的。回到家是短動作用 When。"}, {"t": "While the teacher was talking, Ted fell asleep.", "ok": false, "fb": "這句是對的。老師講話是持續的長動作，用 While。"}, {"t": "While the door opened, I was reading a book.", "ok": true, "fb": "這句錯了。開門是一瞬間的短動作，要用 When。"}, {"t": "I stayed in the library until it closed.", "ok": false, "fb": "這句是對的。待到圖書館關門為止，用 until。"}]}, {"q": "____ I was walking to school this morning, I ____ my English teacher.", "opts": [{"t": "While / met", "ok": true, "fb": "走路上學是持續的動作用 While；遇到老師是一瞬間的事，用過去式。"}, {"t": "When / was meeting", "ok": false, "fb": "遇到老師是一瞬間發生的事，不會用進行式。"}, {"t": "Until / met", "ok": false, "fb": "這不是「直到⋯⋯為止」的意思。"}, {"t": "After / met", "ok": false, "fb": "遇到老師是在走路的過程中發生的，不是走完之後。"}]}], "kkN": 2, "stars": 2, "listenN": 0, "kk": [{"kind": "orig", "src": "113 年會考 第 11 題", "q": "John will stay with his sister until he ＿＿＿ an apartment.", "opts": [{"t": "will find", "ok": false, "fb": "時間副詞子句（until、when、before）裡，不用 will，用現在式代替未來。"}, {"t": "would find", "ok": false, "fb": "would find 是過去的未來，和前面的 will stay 不搭。"}, {"t": "finds", "ok": true, "fb": "主要句 will stay，until 子句用現在式代替未來：finds。"}, {"t": "found", "ok": false, "fb": "found 是過去式，但找房子是之後的事。"}]}, {"kind": "orig", "src": "114 年會考 第 18 題", "q": "Before she ＿＿＿ about it, you should tell Daphne you broke her favorite cup.", "opts": [{"t": "asks", "ok": true, "fb": "before 子句用現在式代替未來：在她「（將來）問起」之前。"}, {"t": "asked", "ok": false, "fb": "asked 是過去式，但她還沒問。"}, {"t": "was asking", "ok": false, "fb": "was asking 是過去進行式，句意不通。"}, {"t": "will ask", "ok": false, "fb": "時間副詞子句裡不用 will，要用現在式 asks。"}]}, {"kind": "rw", "src": "仿 113 年第 11 題", "q": "We will start the meeting after Ms. Huang ＿＿＿ back from lunch.", "opts": [{"t": "will come", "ok": false, "fb": "after、when、until 的時間子句裡，不用 will。"}, {"t": "came", "ok": false, "fb": "過去式，但會議還沒開始。"}, {"t": "comes", "ok": true, "fb": "時間子句用現在式代替未來：after she comes back。"}, {"t": "has came", "ok": false, "fb": "has 後面要接 come，而且這裡用現在式就好。"}]}]}, {"id": "modals", "title": "助動詞 may / might / must / should", "unit": "第三冊 Unit 6 · B3 L1–2", "points": "<p>這四個助動詞表達的是<strong>說話者的態度</strong>：有多確定、該不該做。後面一律接動詞原形。</p><h3>四個助動詞</h3><table><tr><th>助動詞</th><th>意思</th><th>例子</th></tr><tr><td class=\"en\">may</td><td>可能、可以（請求許可）</td><td class=\"en\">It <span class=\"k1\">may</span> rain tomorrow.<br><span class=\"k1\">May</span> I come in?</td></tr><tr><td class=\"en\">might</td><td>可能（比 may 更不確定）</td><td class=\"en\">He <span class=\"k1\">might</span> be at home.</td></tr><tr><td class=\"en\">must</td><td>必須、一定是</td><td class=\"en\">You <span class=\"k1\">must</span> wear a helmet.<br>She <span class=\"k1\">must</span> be tired.</td></tr><tr><td class=\"en\">should</td><td>應該（建議）</td><td class=\"en\">You <span class=\"k1\">should</span> see a doctor.</td></tr></table><h3>確定的程度</h3><p class=\"en\"><span class=\"k1\">must</span>（幾乎確定）　＞　<span class=\"k2\">may</span>（有可能）　＞　<span class=\"k3\">might</span>（也許吧）</p><h3>後面一定接原形</h3><p class=\"en\">He <span class=\"k1\">should</span> <span class=\"k2\">go</span> to bed early.　<span class=\"bad\">should goes</span>　<span class=\"bad\">should to go</span></p><p style=\"color:var(--muted);font-size:17px\">助動詞不隨主詞變化，也不加 s。</p><h3>兩種否定差很多</h3><p class=\"en\">You <span class=\"k1\">mustn't</span> smoke here.　→ <strong>禁止</strong>，絕對不可以<br>You <span class=\"k2\">don't have to</span> come.　→ <strong>不必</strong>，來不來都行</p><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">She musts study.</span>　→ 助動詞不加 s</p><p class=\"en\"><span class=\"bad\">You should to call her.</span>　→ 後面不加 to</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">mustn't = 不必</span>　→ mustn't 是「禁止」</p></div>", "questions": [{"q": "You look really pale. You ____ see a doctor.", "opts": [{"t": "should", "ok": true, "fb": "給對方建議用 should。"}, {"t": "might", "ok": false, "fb": "might 表示可能性，不是在給建議。"}, {"t": "may", "ok": false, "fb": "may 表示可能或請求許可，這裡是建議對方去看醫生。"}, {"t": "must not", "ok": false, "fb": "意思會變成「禁止去看醫生」，和臉色蒼白的情境矛盾。"}]}, {"q": "Dark clouds are coming. It ____ rain this afternoon.", "opts": [{"t": "must not", "ok": false, "fb": "烏雲密布應該是可能會下雨，不是一定不會。"}, {"t": "may", "ok": true, "fb": "表示有可能發生，用 may。"}, {"t": "should", "ok": false, "fb": "should 是建議或應該，不用來講天氣的可能性。"}, {"t": "can", "ok": false, "fb": "can 表示能力或許可，講可能性用 may。"}]}, {"q": "Everyone ____ wear a helmet when riding a scooter. It's the law.", "opts": [{"t": "may", "ok": false, "fb": "法律規定是強制的，may 只表示可能或許可。"}, {"t": "might", "ok": false, "fb": "might 的語氣太弱，法律規定要用 must。"}, {"t": "must", "ok": true, "fb": "法律規定表示必須，用 must。"}, {"t": "should", "ok": false, "fb": "should 只是建議，但這裡說了是法律，語氣要更強。"}]}, {"q": "Judy didn't eat anything all day. She ____ be very hungry now.", "opts": [{"t": "must", "ok": true, "fb": "一整天沒吃東西，幾乎可以確定她很餓，用 must 表示「一定是」。"}, {"t": "might not", "ok": false, "fb": "一整天沒吃東西，不太可能不餓。"}, {"t": "should", "ok": false, "fb": "should 是「應該要做」，不是用來推測事實。"}, {"t": "can", "ok": false, "fb": "can 表示能力，不用來推測。"}]}, {"q": "My sister ____ come to the party, but she isn't sure yet.", "opts": [{"t": "must", "ok": false, "fb": "後面說她還不確定，must 的語氣太強了。"}, {"t": "might", "ok": true, "fb": "還不確定，可能性不高，用 might。"}, {"t": "should", "ok": false, "fb": "should 是建議，不是在講可能性。"}, {"t": "must not", "ok": false, "fb": "「還不確定」不等於「一定不會」。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "You should drink more water.", "ok": false, "fb": "這句是對的。should 後面接原形。"}, {"t": "She musts finish her report today.", "ok": true, "fb": "這句錯了。助動詞不隨主詞變化，不加 s，要寫 must。"}, {"t": "May I use your phone?", "ok": false, "fb": "這句是對的。May 用來請求許可。"}, {"t": "He might not come tonight.", "ok": false, "fb": "這句是對的。might 的否定直接加 not。"}]}, {"q": "A: ____ I open the window?　B: Sure, go ahead.", "opts": [{"t": "Must", "ok": false, "fb": "Must 是「必須」，用來問對方該不該做不合適。"}, {"t": "May", "ok": true, "fb": "有禮貌地請求許可用 May I。"}, {"t": "Should", "ok": false, "fb": "Should I 是在問對方意見，但回答 Sure, go ahead 是在給許可。"}, {"t": "Might", "ok": false, "fb": "might 表示可能性，不用來請求許可。"}]}, {"q": "This is a library. You ____ talk loudly here, but you ____ stay quiet the whole time.", "opts": [{"t": "mustn't / don't have to", "ok": true, "fb": "大聲說話是禁止的用 mustn't；全程安靜不是強制的，用 don't have to。"}, {"t": "don't have to / mustn't", "ok": false, "fb": "兩個放反了。圖書館禁止大聲說話，但沒有強制全程不出聲。"}, {"t": "mustn't / mustn't", "ok": false, "fb": "後半是「不必」而不是「禁止」，要用 don't have to。"}, {"t": "don't have to / don't have to", "ok": false, "fb": "前半在圖書館大聲說話是禁止的，要用 mustn't。"}]}], "kkN": 0, "stars": 0, "listenN": 2, "kk": [{"kind": "listen", "src": "114 年會考聽力 第 5 題", "audio": "../audio/114-05.mp3", "q": "聽一聽，選出最適合的回應。", "script": "Excuse me, where should I put these pencils?", "opts": [{"t": "Just leave them on the table.", "ok": true, "fb": "Where should I put …? → 放桌上就好。"}, {"t": "They're in the wrong drawer.", "ok": false, "fb": "這在說現在放錯地方，沒說該放哪。"}, {"t": "I need them for tomorrow's test.", "ok": false, "fb": "這在說為什麼需要鉛筆，答非所問。"}]}, {"kind": "listen", "src": "111 年會考聽力 第 4 題", "audio": "../audio/111-04.mp3", "q": "聽一聽，選出最適合的回應。", "script": "May I have the last piece of pizza?", "opts": [{"t": "It tastes good.", "ok": false, "fb": "對方在請求，要回答可不可以。"}, {"t": "Sure, have it.", "ok": true, "fb": "May I …?（我可以…嗎？）→ 當然，拿去吧。"}, {"t": "That's too bad.", "ok": false, "fb": "too bad 是「真可惜」，用在壞消息。"}]}, {"kind": "rw", "src": "會考風格改寫", "q": "You ＿＿＿ wear a helmet when you ride a scooter. It's the law.", "opts": [{"t": "may", "ok": false, "fb": "may 是「可以、也許」，但這是法律規定。"}, {"t": "might", "ok": false, "fb": "might 是「可能」，太不肯定。"}, {"t": "must", "ok": true, "fb": "It's the law → 一定要：must。"}, {"t": "don't have to", "ok": false, "fb": "法律規定，不能說不必。"}]}, {"kind": "rw", "src": "會考風格改寫", "q": "Jason didn't come to school today. He ＿＿＿ be sick, but I'm not sure.", "opts": [{"t": "must not", "ok": false, "fb": "must not 是「禁止」。"}, {"t": "might", "ok": true, "fb": "I'm not sure → 可能：might。"}, {"t": "should", "ok": false, "fb": "should 是「應該」，不是猜測。"}, {"t": "can't", "ok": false, "fb": "can't 是「不可能」，但他說不確定。"}]}]}, {"id": "past-cont", "title": "過去進行式", "unit": "第三冊 Unit 7 · B3 L3–4", "points": "<p>過去進行式講的是<strong>過去某個時間點，正在進行的事</strong>。公式和現在進行式一樣，只是 be 動詞變成過去式。</p><h3>公式</h3><div class=\"formula\"><span class=\"tag k0\">主詞</span><span class=\"plus\">+</span><span class=\"tag k1\">was / were</span><span class=\"plus\">+</span><span class=\"tag k2\">動詞-ing</span></div><table><tr><th>主詞</th><th>be 動詞</th><th>例子</th></tr><tr><td>I / He / She / It、單數</td><td class=\"en\">was</td><td class=\"en\">I <span class=\"k1\">was</span> <span class=\"k2\">reading</span>.</td></tr><tr><td>You / We / They、複數</td><td class=\"en\">were</td><td class=\"en\">They <span class=\"k1\">were</span> <span class=\"k2\">playing</span>.</td></tr></table><h3>三種時態放在一起看</h3><table><tr><th>時態</th><th>意思</th><th>例子</th></tr><tr><td>現在進行式</td><td>此刻正在</td><td class=\"en\">He <span class=\"k1\">is</span> sleeping.</td></tr><tr><td>過去進行式</td><td>過去某時正在</td><td class=\"en\">He <span class=\"k1\">was</span> sleeping.</td></tr><tr><td>過去簡單式</td><td>過去做了、做完了</td><td class=\"en\">He <span class=\"k3\">slept</span> for ten hours.</td></tr></table><h3>最常考：長動作配短動作</h3><p class=\"en\">I <span class=\"k1\">was taking</span> a shower <span class=\"k0\">when</span> the phone <span class=\"k3\">rang</span>.</p><p>一件事做到一半，另一件事突然發生。<strong>持續的長動作用過去進行式，突然的短動作用過去簡單式。</strong></p><h3>常見的時間提示</h3><p class=\"en\"><span class=\"k2\">at eight last night　at that time　this time yesterday</span></p><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">They was watching TV.</span>　→ They 要配 were</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">I was took a shower.</span>　→ be 後面接 V-ing</p></div>", "questions": [{"q": "I ____ my homework at eight o'clock last night.", "opts": [{"t": "was doing", "ok": true, "fb": "at eight last night 指過去的某個時間點，當時正在進行，用過去進行式。"}, {"t": "were doing", "ok": false, "fb": "主詞是 I，過去式的 be 動詞要用 was。"}, {"t": "am doing", "ok": false, "fb": "last night 是過去的事，不能用現在式。"}, {"t": "was do", "ok": false, "fb": "be 動詞後面要接 V-ing，不是原形。"}]}, {"q": "Ted and his friends ____ basketball when it suddenly started to rain.", "opts": [{"t": "was playing", "ok": false, "fb": "主詞是 Ted 和朋友們，是複數，要用 were。"}, {"t": "were playing", "ok": true, "fb": "複數主詞配 were；打球是持續中的動作，被下雨打斷。"}, {"t": "are playing", "ok": false, "fb": "句子講的是過去發生的事。"}, {"t": "were play", "ok": false, "fb": "be 動詞後面一定接 V-ing。"}]}, {"q": "A: I called you at nine but you didn't answer.　B: Sorry, I ____ a shower then.", "opts": [{"t": "took", "ok": false, "fb": "要表達「當時正在洗」才能解釋為什麼沒接電話，用過去進行式。"}, {"t": "was taking", "ok": true, "fb": "九點當下正在洗澡，所以沒接到電話，用過去進行式。"}, {"t": "am taking", "ok": false, "fb": "講的是九點那時候的事，是過去。"}, {"t": "was take", "ok": false, "fb": "be 動詞後面要用 V-ing。"}]}, {"q": "Yesterday afternoon I ____ TV when the doorbell ____ .", "opts": [{"t": "watched / was ringing", "ok": false, "fb": "兩個放反了。看電視是持續的長動作，門鈴響是一瞬間的事。"}, {"t": "was watching / rang", "ok": true, "fb": "看電視是持續中的動作用進行式；門鈴響是突然發生的，用過去簡單式。"}, {"t": "was watching / was ringing", "ok": false, "fb": "門鈴響是一瞬間的事，不會用進行式。"}, {"t": "watched / rang", "ok": false, "fb": "兩個都用過去簡單式，就看不出是「看到一半被打斷」。"}]}, {"q": "A: ____ you ____ when I called you last night?　B: Yes, I was. Sorry about that.", "opts": [{"t": "Were / sleeping", "ok": true, "fb": "主詞 you 配 Were，後面接 V-ing。"}, {"t": "Was / sleeping", "ok": false, "fb": "主詞是 you，要用 Were。"}, {"t": "Did / sleeping", "ok": false, "fb": "回答用了 Yes, I was，表示問句要用 be 動詞。"}, {"t": "Were / slept", "ok": false, "fb": "be 動詞後面要接 V-ing，不是過去式。"}]}, {"q": "Amy ____ at home last night. She ____ at her friend's birthday party.", "opts": [{"t": "wasn't / was dancing", "ok": true, "fb": "前半是過去的狀態用 wasn't；後半是當時正在做的事，用過去進行式。"}, {"t": "weren't / was dancing", "ok": false, "fb": "主詞 Amy 是單數，要用 wasn't。"}, {"t": "wasn't / danced", "ok": false, "fb": "要表達「當時正在派對上跳舞」，用過去進行式比較貼切。"}, {"t": "isn't / is dancing", "ok": false, "fb": "last night 表示過去的事。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "We were studying in the library at that time.", "ok": false, "fb": "這句是對的。We 配 were，後面接 V-ing。"}, {"t": "My sister was cooking when I got home.", "ok": false, "fb": "這句是對的。長動作用進行式，短動作用過去式。"}, {"t": "The students was listening to the teacher.", "ok": true, "fb": "這句錯了。students 是複數，要用 were listening。"}, {"t": "It was raining hard this time yesterday.", "ok": false, "fb": "這句是對的。It 配 was，後面接 raining。"}]}, {"q": "Look! Ted ____ on the playground now. This time yesterday he ____ there, too.", "opts": [{"t": "is running / was running", "ok": true, "fb": "Look! 和 now 用現在進行式；this time yesterday 用過去進行式。"}, {"t": "was running / is running", "ok": false, "fb": "兩個放反了。now 是現在，yesterday 是過去。"}, {"t": "runs / ran", "ok": false, "fb": "兩個時間點都在強調「當時正在跑」，要用進行式。"}, {"t": "is running / is running", "ok": false, "fb": "後半有 yesterday，是過去的事，be 動詞要用 was。"}]}], "kkN": 4, "stars": 3, "listenN": 0, "kk": [{"kind": "orig", "src": "107 年會考 第 3 題", "q": "When the baby cried, Mr. Wu ＿＿＿ in the kitchen and did not hear it.", "opts": [{"t": "cooked", "ok": false, "fb": "cooked 只說「煮了」，看不出寶寶哭的時候他正在煮。"}, {"t": "was cooking", "ok": true, "fb": "寶寶哭的那一刻，他「正在」廚房煮飯，用過去進行式 was cooking。"}, {"t": "has cooked", "ok": false, "fb": "has cooked 是現在完成式，和 cried、did not hear 這些過去式不搭。"}, {"t": "is going to cook", "ok": false, "fb": "is going to cook 是「打算煮」，但他當時已經在煮了。"}]}, {"kind": "orig", "src": "111 年會考 第 13 題", "q": "Yesterday when I got home from work, my brother ＿＿＿ for dinner, so he invited me to join him.", "opts": [{"t": "goes out", "ok": false, "fb": "goes out 是現在式，但 Yesterday 是過去。"}, {"t": "went out", "ok": false, "fb": "went out 表示他已經出門了，就不會邀我一起去。"}, {"t": "has gone out", "ok": false, "fb": "has gone out 表示他已經不在家，和 invited me to join him 矛盾。"}, {"t": "was going out", "ok": true, "fb": "我回到家那一刻，他「正要」出門吃飯，所以邀我一起：was going out。"}]}, {"kind": "orig", "src": "112 年會考 第 6 題", "q": "Rex did not feel the earthquake this morning. He ＿＿＿ in the park at the time.", "opts": [{"t": "jogged", "ok": false, "fb": "jogged 只說「慢跑了」，看不出地震發生時他正在跑。"}, {"t": "was jogging", "ok": true, "fb": "at the time（當時）是過去進行式的線索：地震時他「正在」慢跑。"}, {"t": "has jogged", "ok": false, "fb": "has jogged 是現在完成式，不能搭配 at the time。"}, {"t": "would jog", "ok": false, "fb": "would jog 是「過去習慣會」或「預計會」，不是當時正在做。"}]}, {"kind": "orig", "src": "115 年會考 第 16 題", "q": "Mr. Olson went to the doctor when he found he ＿＿＿ his hair. He hoped he would be able to keep his thick hair.", "opts": [{"t": "was losing", "ok": true, "fb": "他發現自己「正在」掉頭髮（還沒掉光，所以想保住），用過去進行式 was losing。"}, {"t": "is losing", "ok": false, "fb": "is losing 是現在式，但 went、found 都是過去式，要時態一致。"}, {"t": "will lose", "ok": false, "fb": "will lose 是未來式，和 found 不搭，而且頭髮已經在掉了。"}, {"t": "has lost", "ok": false, "fb": "has lost 是現在完成式，和過去式 found 不搭；而且掉光就沒辦法 keep 了。"}]}, {"kind": "rw", "src": "仿 112 年第 6 題", "q": "I didn't answer your call last night. I ＿＿＿ a shower at that time.", "opts": [{"t": "take", "ok": false, "fb": "take 是現在式，last night 是過去。"}, {"t": "was taking", "ok": true, "fb": "at that time（當時）→ 過去進行式：我那時正在洗澡。"}, {"t": "have taken", "ok": false, "fb": "現在完成式不能搭配 at that time。"}, {"t": "will take", "ok": false, "fb": "未來式和 last night 不合。"}]}]}, {"id": "infinitive", "title": "不定詞的用法", "unit": "第三冊 Unit 7 · B3 L3–4", "points": "<p>不定詞長這樣：<strong>to + 動詞原形</strong>。它讓一個動詞可以放進句子的其他位置。</p><h3>兩個主要用法</h3><table><tr><th>用法</th><th>說明</th><th>例子</th></tr><tr><td>當受詞</td><td>放在某些動詞後面</td><td class=\"en\">I want <span class=\"k1\">to go</span>.</td></tr><tr><td>表示目的</td><td>為了做某事</td><td class=\"en\">He went out <span class=\"k1\">to buy</span> milk.</td></tr></table><h3>後面接不定詞的常見動詞</h3><p class=\"en\"><span class=\"k2\">want　need　hope　plan　decide　learn　would like</span></p><p class=\"en\">I <span class=\"k2\">hope</span> <span class=\"k1\">to see</span> you soon.<br>We <span class=\"k2\">decided</span> <span class=\"k1\">to stay</span> home.</p><h3>表示目的：為了⋯⋯</h3><p class=\"en\">I came here <span class=\"k1\">to see</span> you.　<span class=\"bad\">for see you</span></p><p style=\"color:var(--muted);font-size:17px\">中文的「為了」常讓人想用 for，但 for 後面不能接動詞原形。表示目的一律用 to + 原形。</p><h3>助動詞後面不加 to</h3><p class=\"en\">I <span class=\"k3\">want to</span> swim.　<span class=\"k0\">但是</span>　I <span class=\"k3\">can</span> swim.　<span class=\"bad\">can to swim</span></p><p>can、must、should、may 這類助動詞後面直接接原形，不加 to。</p><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">I want be a doctor.</span>　→ 少了 to</p><p class=\"en\"><span class=\"bad\">He went there for buy a book.</span>　→ 目的用 to</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">She must to leave now.</span>　→ 助動詞後不加 to</p></div>", "questions": [{"q": "My little brother wants ____ a scientist in the future.", "opts": [{"t": "be", "ok": false, "fb": "want 後面要接不定詞，少了 to。"}, {"t": "to be", "ok": true, "fb": "want 後面接不定詞 to + 原形。"}, {"t": "being", "ok": false, "fb": "want 後面不接 V-ing，要用不定詞。"}, {"t": "to being", "ok": false, "fb": "to 後面要接動詞原形，不是 V-ing。"}]}, {"q": "Dad went to the supermarket ____ some milk and eggs.", "opts": [{"t": "buy", "ok": false, "fb": "表示目的要用不定詞，前面要加 to。"}, {"t": "to buy", "ok": true, "fb": "去超市的目的是買東西，用 to + 原形表示目的。"}, {"t": "buying", "ok": false, "fb": "表示目的用不定詞，不用 V-ing。"}, {"t": "for buy", "ok": false, "fb": "for 後面不能直接接動詞原形，表示目的要用 to。"}]}, {"q": "It was raining, so we decided ____ at home and watch a movie.", "opts": [{"t": "stay", "ok": false, "fb": "decide 後面要接不定詞，少了 to。"}, {"t": "to stay", "ok": true, "fb": "decide 後面固定接不定詞。"}, {"t": "staying", "ok": false, "fb": "decide 後面不接 V-ing。"}, {"t": "stayed", "ok": false, "fb": "decided 已經表示過去了，後面要接不定詞。"}]}, {"q": "Excuse me, I'd like ____ you a question about the homework.", "opts": [{"t": "ask", "ok": false, "fb": "would like 後面要接不定詞，少了 to。"}, {"t": "to ask", "ok": true, "fb": "would like 後面接不定詞，比 want 更有禮貌。"}, {"t": "asking", "ok": false, "fb": "would like 後面接不定詞，不接 V-ing。"}, {"t": "asked", "ok": false, "fb": "這個位置要用不定詞，不用過去式。"}]}, {"q": "Ted ____ to join the basketball team, and he ____ practice every day.", "opts": [{"t": "wants / must", "ok": true, "fb": "want 後面接不定詞；must 是助動詞，後面直接接原形 practice。"}, {"t": "wants / must to", "ok": false, "fb": "must 是助動詞，後面不加 to。"}, {"t": "want / must", "ok": false, "fb": "主詞 Ted 是第三人稱單數，動詞要加 s。"}, {"t": "wants to / must", "ok": false, "fb": "句子裡已經有 to join 了，不需要再多一個 to。"}]}, {"q": "Amy studies very hard because she hopes ____ a good senior high school.", "opts": [{"t": "enter", "ok": false, "fb": "hope 後面要接不定詞，少了 to。"}, {"t": "to enter", "ok": true, "fb": "hope 後面固定接不定詞。"}, {"t": "entering", "ok": false, "fb": "hope 後面不接 V-ing。"}, {"t": "enters", "ok": false, "fb": "這個位置要用不定詞，不會有第三人稱單數的變化。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "I need to finish my report tonight.", "ok": false, "fb": "這句是對的。need 後面接不定詞。"}, {"t": "She came here for see her grandmother.", "ok": true, "fb": "這句錯了。表示目的要用 to see，for 後面不能接原形動詞。"}, {"t": "We plan to visit Yilan next month.", "ok": false, "fb": "這句是對的。plan 後面接不定詞。"}, {"t": "You should call her right now.", "ok": false, "fb": "這句是對的。should 是助動詞，後面直接接原形。"}]}, {"q": "My sister needs ____ harder because she plans ____ abroad next year.", "opts": [{"t": "to study / to go", "ok": true, "fb": "need 和 plan 後面都接不定詞。"}, {"t": "study / go", "ok": false, "fb": "need 和 plan 都不是助動詞，後面要加 to。"}, {"t": "to study / go", "ok": false, "fb": "前半對了，但 plan 後面也要接不定詞 to go。"}, {"t": "studying / going", "ok": false, "fb": "這兩個動詞後面都接不定詞，不接 V-ing。"}]}], "kkN": 0, "stars": 0, "listenN": 2, "kk": [{"kind": "listen", "src": "115 年會考聽力 第 5 題", "audio": "../audio/115-05.mp3", "q": "聽一聽，選出最適合的回應。", "script": "Do you want to see a movie together?", "opts": [{"t": "I don't, either.", "ok": false, "fb": "either 用在附和否定句，但對方是在邀請。"}, {"t": "Sure, why not?", "ok": true, "fb": "Do you want to …? 是邀請 → 好啊，有何不可？"}, {"t": "It is a great movie.", "ok": false, "fb": "對方還沒說看哪部電影，這句沒回答要不要去。"}]}, {"kind": "listen", "src": "114 年會考聽力 第 7 題", "audio": "../audio/114-07.mp3", "q": "聽一聽，選出最適合的回應。", "script": "I've got a crazy idea. Do you want to hear it?", "opts": [{"t": "Sure, what is it?", "ok": true, "fb": "Do you want to hear it? → 好啊，是什麼？"}, {"t": "Really? That's crazy.", "ok": false, "fb": "還沒聽到點子，不能說它瘋狂。"}, {"t": "I haven't heard of it before.", "ok": false, "fb": "對方還沒說，談不上聽過沒聽過。"}]}, {"kind": "rw", "src": "會考風格改寫", "q": "Jenny decided ＿＿＿ a bike to school because the bus is always late.", "opts": [{"t": "to ride", "ok": true, "fb": "decide + to V：決定騎腳踏車上學。"}, {"t": "riding", "ok": false, "fb": "decide 後面接 to V，不接 V-ing。"}, {"t": "ride", "ok": false, "fb": "decide 後面要加 to。"}, {"t": "rides", "ok": false, "fb": "decide 後面不能接 rides。"}]}, {"kind": "rw", "src": "會考風格改寫", "q": "I went to the library ＿＿＿ some books for my report.", "opts": [{"t": "borrow", "ok": false, "fb": "去圖書館的「目的」要用 to V。"}, {"t": "borrowing", "ok": false, "fb": "表示目的不用 V-ing。"}, {"t": "borrowed", "ok": false, "fb": "前面已經有動詞 went。"}, {"t": "to borrow", "ok": true, "fb": "to V 表示目的：去圖書館「為了」借書。"}]}]}, {"id": "gerund", "title": "動名詞的用法", "unit": "第三冊 Unit 7 · B3 L3–4", "points": "<p>動名詞長得和現在分詞一樣是 <strong>V-ing</strong>，但它的角色是<strong>名詞</strong>。所以凡是名詞能站的位置，動名詞都能站。</p><h3>三個位置</h3><table><tr><th>位置</th><th>例子</th></tr><tr><td>當主詞</td><td class=\"en\"><span class=\"k1\">Swimming</span> is good exercise.</td></tr><tr><td>當受詞</td><td class=\"en\">I enjoy <span class=\"k1\">reading</span> comic books.</td></tr><tr><td>介系詞後面</td><td class=\"en\">He is good at <span class=\"k2\">playing</span> the guitar.</td></tr></table><p style=\"color:var(--muted);font-size:17px\">第三個位置是最常考的：<strong>介系詞後面一定接動名詞，不能接原形</strong>。</p><h3>後面接動名詞的常見動詞</h3><p class=\"en\"><span class=\"k2\">enjoy　finish　practice　mind　give up　keep</span></p><p class=\"en\">I <span class=\"k2\">finished</span> <span class=\"k1\">doing</span> my homework.<br>He <span class=\"k2\">gave up</span> <span class=\"k1\">eating</span> junk food.</p><h3>和不定詞怎麼分</h3><table><tr><th>只能接不定詞</th><th>只能接動名詞</th><th>兩種都可以</th></tr><tr><td class=\"en\">want, hope, plan,<br>decide, need</td><td class=\"en\">enjoy, finish,<br>practice, give up</td><td class=\"en\">like, love, start</td></tr></table><p class=\"en\">I <span class=\"k3\">want</span> <span class=\"k1\">to swim</span>.　I <span class=\"k3\">enjoy</span> <span class=\"k2\">swimming</span>.<br>I <span class=\"k3\">like</span> <span class=\"k1\">to swim</span>. = I <span class=\"k3\">like</span> <span class=\"k2\">swimming</span>.</p><h3>常見的介系詞片語</h3><p class=\"en\">be good at <span class=\"k2\">V-ing</span>　be interested in <span class=\"k2\">V-ing</span><br>before <span class=\"k2\">V-ing</span>　after <span class=\"k2\">V-ing</span>　thank you for <span class=\"k2\">V-ing</span></p><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">She is interested in collect stamps.</span>　→ 介系詞後接 V-ing</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">I enjoy to read books.</span>　→ enjoy 後面只能接 V-ing</p></div>", "questions": [{"q": "____ every morning is a good way to stay healthy.", "opts": [{"t": "Run", "ok": false, "fb": "句子開頭當主詞要用名詞的形式，動詞原形不能當主詞。"}, {"t": "Running", "ok": true, "fb": "動名詞可以當主詞，放在句首。"}, {"t": "To running", "ok": false, "fb": "to 後面要接原形，而且這裡用動名詞就可以了。"}, {"t": "Runs", "ok": false, "fb": "這是第三人稱單數的動詞變化，不能當主詞。"}]}, {"q": "My father enjoys ____ to music after a long day at work.", "opts": [{"t": "to listen", "ok": false, "fb": "enjoy 後面只能接動名詞，不接不定詞。"}, {"t": "listening", "ok": true, "fb": "enjoy 後面固定接 V-ing。"}, {"t": "listen", "ok": false, "fb": "enjoy 後面要接動名詞，不是原形。"}, {"t": "listened", "ok": false, "fb": "enjoy 後面接的是動名詞，不是過去式。"}]}, {"q": "Judy is really good at ____ pictures. She wants to be an artist.", "opts": [{"t": "draw", "ok": false, "fb": "at 是介系詞，後面一定接動名詞。"}, {"t": "to draw", "ok": false, "fb": "介系詞後面不能接不定詞。"}, {"t": "drawing", "ok": true, "fb": "be good at 的 at 是介系詞，後面接 V-ing。"}, {"t": "draws", "ok": false, "fb": "介系詞後面要接名詞或動名詞。"}]}, {"q": "Ted finished ____ his homework, and then he started ____ TV.", "opts": [{"t": "doing / watching", "ok": true, "fb": "finish 後面只能接動名詞；start 兩種都可以，這裡用 watching 沒問題。"}, {"t": "to do / watching", "ok": false, "fb": "finish 後面只能接動名詞，不能接不定詞。"}, {"t": "do / watch", "ok": false, "fb": "這兩個位置都不能用動詞原形。"}, {"t": "to do / to watch", "ok": false, "fb": "finish 後面不接不定詞。"}]}, {"q": "I want ____ English well, so I practice ____ English songs every day.", "opts": [{"t": "to speak / singing", "ok": true, "fb": "want 後面接不定詞；practice 後面接動名詞。"}, {"t": "speaking / to sing", "ok": false, "fb": "兩個放反了。want 接不定詞，practice 接動名詞。"}, {"t": "to speak / to sing", "ok": false, "fb": "前半對了，但 practice 後面只能接 V-ing。"}, {"t": "speaking / singing", "ok": false, "fb": "want 後面只能接不定詞 to speak。"}]}, {"q": "Remember to turn off the lights before ____ the classroom.", "opts": [{"t": "leave", "ok": false, "fb": "before 在這裡是介系詞，後面要接動名詞。"}, {"t": "leaving", "ok": true, "fb": "介系詞 before 後面接 V-ing。"}, {"t": "to leave", "ok": false, "fb": "介系詞後面不接不定詞。"}, {"t": "left", "ok": false, "fb": "介系詞後面要接動名詞，不是過去式。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "Thank you for helping me with my homework.", "ok": false, "fb": "這句是對的。for 是介系詞，後面接 V-ing。"}, {"t": "My sister is interested in collect stamps.", "ok": true, "fb": "這句錯了。in 是介系詞，後面要接 collecting。"}, {"t": "Reading before bed helps me sleep.", "ok": false, "fb": "這句是對的。動名詞當主詞。"}, {"t": "He gave up playing computer games.", "ok": false, "fb": "這句是對的。give up 後面接動名詞。"}]}, {"q": "My brother gave up ____ computer games, and now he spends more time ____ books.", "opts": [{"t": "playing / reading", "ok": true, "fb": "give up 後面接動名詞；spend time 後面也接 V-ing。"}, {"t": "to play / to read", "ok": false, "fb": "這兩個位置都要用動名詞。"}, {"t": "play / read", "ok": false, "fb": "兩個位置都不能用動詞原形。"}, {"t": "playing / to read", "ok": false, "fb": "前半對了，但 spend time 後面接的是 V-ing。"}]}], "kkN": 2, "stars": 2, "listenN": 0, "kk": [{"kind": "orig", "src": "108 年會考 第 3 題", "q": "Playing games on the cellphone ＿＿＿ popular with high school students.", "opts": [{"t": "is", "ok": true, "fb": "動名詞（Playing games）當主詞，視為一件事，是單數，用 is。"}, {"t": "are", "ok": false, "fb": "are 是複數，但主詞是「玩遊戲這件事」，不是 games。"}, {"t": "being", "ok": false, "fb": "being 不是動詞，句子會沒有主要動詞。"}, {"t": "to be", "ok": false, "fb": "to be 不是動詞，句子會沒有主要動詞。"}]}, {"kind": "orig", "src": "114 年會考 第 4 題", "q": "Cindy enjoys ＿＿＿ her dad read stories to her before bed.", "opts": [{"t": "to listen to", "ok": false, "fb": "enjoy 後面接 V-ing，不接 to V。"}, {"t": "listening to", "ok": true, "fb": "enjoy + V-ing：喜歡「聽」爸爸讀故事，用 listening to。"}, {"t": "listen to", "ok": false, "fb": "enjoy 後面不能直接接原形動詞。"}, {"t": "listens to", "ok": false, "fb": "listens 是動詞，不能接在 enjoy 後面當受詞。"}]}, {"kind": "rw", "src": "仿 108 年第 3 題", "q": "Taking pictures of birds ＿＿＿ my dad's favorite hobby.", "opts": [{"t": "are", "ok": false, "fb": "主詞是「拍鳥這件事」，不是 birds，用單數。"}, {"t": "is", "ok": true, "fb": "動名詞（Taking pictures）當主詞是單數：is。"}, {"t": "being", "ok": false, "fb": "being 不是動詞，句子會沒有主要動詞。"}, {"t": "to be", "ok": false, "fb": "to be 不是動詞，句子會沒有主要動詞。"}]}]}, {"id": "it-subject", "title": "it 當虛主詞", "unit": "第三冊 Unit 7 · B3 L3–4", "points": "<p>英文不喜歡句子的開頭太長。所以先放一個沒有意義的 <strong>it</strong> 佔住主詞的位置，真正的內容移到後面。</p><h3>基本句型</h3><div class=\"formula\"><span class=\"tag k1\">It is</span><span class=\"plus\">+</span><span class=\"tag k0\">形容詞</span><span class=\"plus\">+</span><span class=\"tag k2\">to + 原形</span></div><p class=\"en\"><span class=\"k1\">It</span> is important <span class=\"k2\">to eat breakfast</span>.</p><p>這裡的 it 沒有意思，真正的主詞是後面的 <span class=\"en\">to eat breakfast</span>。</p><h3>加上「對誰而言」</h3><p class=\"en\">It is hard <span class=\"k3\">for me</span> <span class=\"k2\">to get up early</span>.</p><p>用 <span class=\"en\">for + 人</span>，放在形容詞和不定詞中間。</p><h3>It takes：花多少時間</h3><div class=\"formula\"><span class=\"tag k1\">It takes</span><span class=\"plus\">+</span><span class=\"tag k0\">人</span><span class=\"plus\">+</span><span class=\"tag k3\">時間</span><span class=\"plus\">+</span><span class=\"tag k2\">to + 原形</span></div><p class=\"en\">It <span class=\"k1\">takes</span> <span class=\"k0\">me</span> <span class=\"k3\">thirty minutes</span> <span class=\"k2\">to walk</span> to school.<br>問法：<span class=\"k1\">How long</span> does it take to get there?</p><h3>it 的其他用途</h3><p class=\"en\">天氣：<span class=\"k1\">It</span> is rainy today.<br>時間：<span class=\"k1\">It</span> is ten o'clock now.<br>距離：<span class=\"k1\">It</span> is two kilometers from here.</p><p>這些句子裡的 it 同樣沒有實際意思，只是用來當主詞。</p><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">It is easy learning English.</span>　→ 要用 to learn</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">It takes me two hours finish it.</span>　→ 少了 to</p></div>", "questions": [{"q": "____ is very important to eat breakfast every morning.", "opts": [{"t": "It", "ok": true, "fb": "用 It 當虛主詞佔住位置，真正的主詞是後面的不定詞。"}, {"t": "That", "ok": false, "fb": "這個句型固定用 It 開頭。"}, {"t": "This", "ok": false, "fb": "虛主詞只能用 it，不用 this。"}, {"t": "He", "ok": false, "fb": "he 是指人，這裡需要沒有實際意義的虛主詞。"}]}, {"q": "It is not easy ____ a new language well.", "opts": [{"t": "learn", "ok": false, "fb": "這個句型後面要接不定詞，少了 to。"}, {"t": "to learn", "ok": true, "fb": "It is + 形容詞 + to + 原形，這是固定句型。"}, {"t": "learning", "ok": false, "fb": "這個句型後面接的是不定詞，不是動名詞。"}, {"t": "learns", "ok": false, "fb": "這個位置要用不定詞。"}]}, {"q": "It ____ me about thirty minutes to ride to school every day.", "opts": [{"t": "take", "ok": false, "fb": "主詞是 It，是第三人稱單數，動詞要加 s。"}, {"t": "takes", "ok": true, "fb": "It takes + 人 + 時間 + to + 原形，主詞 It 配 takes。"}, {"t": "spends", "ok": false, "fb": "這個句型固定用 take，spend 的主詞要是人。"}, {"t": "is taking", "ok": false, "fb": "這是講平常固定花的時間，用現在簡單式。"}]}, {"q": "It is really hard ____ my little brother to sit still for an hour.", "opts": [{"t": "of", "ok": false, "fb": "這個句型表示「對某人而言」要用 for。"}, {"t": "for", "ok": true, "fb": "要說明是對誰而言，用 for + 人。"}, {"t": "to", "ok": false, "fb": "to 後面要接動詞原形，不是人。"}, {"t": "with", "ok": false, "fb": "這個句型固定用 for 來表示對象。"}]}, {"q": "A: ____ does it take to walk from here to the station?　B: About ten minutes.", "opts": [{"t": "How long", "ok": true, "fb": "問需要花多久時間用 How long。"}, {"t": "How many", "ok": false, "fb": "How many 問的是數量，不是時間長度。"}, {"t": "How often", "ok": false, "fb": "How often 問的是多久一次，不是花多久。"}, {"t": "How far", "ok": false, "fb": "How far 問的是距離，但回答給的是時間。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "It is dangerous to swim in this river.", "ok": false, "fb": "這句是對的。It is + 形容詞 + to + 原形。"}, {"t": "It is fun learning new things.", "ok": true, "fb": "這句錯了。這個句型要接不定詞，應該是 It is fun to learn new things。"}, {"t": "It takes him an hour to finish the work.", "ok": false, "fb": "這句是對的。It takes + 人 + 時間 + to + 原形。"}, {"t": "It is ten thirty now.", "ok": false, "fb": "這句是對的。講時間用 It 當主詞。"}]}, {"q": "____ was cloudy yesterday, and ____ is sunny today.", "opts": [{"t": "It / it", "ok": true, "fb": "講天氣的句子固定用 it 當主詞，沒有實際意思。"}, {"t": "That / that", "ok": false, "fb": "講天氣只能用 it。"}, {"t": "The weather / the weather", "ok": false, "fb": "文法上不算錯，但講天氣最自然的說法是用 it。"}, {"t": "It / that", "ok": false, "fb": "前半對了，但後半講天氣也要用 it。"}]}, {"q": "It ____ me two hours ____ the report, and it was not easy ____ me.", "opts": [{"t": "took / to finish / for", "ok": true, "fb": "It took + 人 + 時間 + to + 原形；表示對誰而言用 for。"}, {"t": "spent / to finish / for", "ok": false, "fb": "這個句型主詞是 It，要用 take，不用 spend。"}, {"t": "took / finishing / for", "ok": false, "fb": "這個句型後面接的是不定詞，不是動名詞。"}, {"t": "took / to finish / to", "ok": false, "fb": "表示「對我而言」要用 for me，不是 to me。"}]}], "kkN": 0, "stars": 0, "listenN": 0, "kk": [{"kind": "rw", "src": "會考風格改寫", "q": "＿＿＿ is important to drink enough water every day.", "opts": [{"t": "It", "ok": true, "fb": "It 當虛主詞，真正的主詞是後面的 to drink …。"}, {"t": "This", "ok": false, "fb": "虛主詞要用 It。"}, {"t": "That", "ok": false, "fb": "虛主詞要用 It。"}, {"t": "There", "ok": false, "fb": "There is 後面要接名詞，不接 important to V。"}]}, {"kind": "rw", "src": "會考風格改寫", "q": "It's not easy ＿＿＿ English well, but you can do it if you practice.", "opts": [{"t": "learn", "ok": false, "fb": "It's + 形容詞 + to V，learn 前面少了 to。"}, {"t": "learned", "ok": false, "fb": "過去式不能放這裡。"}, {"t": "to learn", "ok": true, "fb": "It's not easy to learn …：把英文學好不容易。"}, {"t": "for learn", "ok": false, "fb": "for 後面接人，不接原形動詞。"}]}]}, {"id": "directions", "title": "問路與搭乘交通工具", "unit": "第三冊 Unit 8 · B3 L5–6", "points": "<p>這個主題考的是<strong>固定說法</strong>。意思猜得出來，但用字錯一個就扣分，所以要整句記。</p><h3>怎麼問路</h3><p class=\"en\"><span class=\"k1\">Excuse me.</span> How can I <span class=\"k2\">get to</span> the train station?<br><span class=\"k1\">Excuse me.</span> Where is the post office?<br>Is there a bank <span class=\"k2\">near here</span>?</p><p style=\"color:var(--muted);font-size:17px\">「到達某地」固定說 <span class=\"en\">get to</span>，不說 go to the station 來問路。</p><h3>怎麼指路</h3><table><tr><th>說法</th><th>意思</th></tr><tr><td class=\"en\">Go straight.</td><td>直走</td></tr><tr><td class=\"en\">Turn left / right.</td><td>左轉／右轉</td></tr><tr><td class=\"en\">Go down Zhongshan Road.</td><td>沿著中山路走</td></tr><tr><td class=\"en\">It's on your left.</td><td>在你的左手邊</td></tr><tr><td class=\"en\">It's across from the park.</td><td>在公園對面</td></tr></table><p class=\"en\"><span class=\"bad\">Turn to left</span>　→ 正確是 <span class=\"k1\">turn left</span>，中間不加 to</p><h3>交通工具的三種說法</h3><table><tr><th>說法</th><th>例子</th></tr><tr><td class=\"en\">take + the + 交通工具</td><td class=\"en\">I <span class=\"k1\">take the bus</span> to school.</td></tr><tr><td class=\"en\">by + 交通工具</td><td class=\"en\">I go to school <span class=\"k1\">by bus</span>.</td></tr><tr><td class=\"en\">走路</td><td class=\"en\">I go to school <span class=\"k1\">on foot</span>.</td></tr></table><p class=\"en\"><span class=\"bad\">by a bus</span>　<span class=\"bad\">by foot</span>　→ by 後面不加冠詞，走路固定說 on foot</p><h3>上下車</h3><p class=\"en\"><span class=\"k2\">get on</span> the bus（上車）　<span class=\"k2\">get off</span> the bus（下車）</p>", "questions": [{"q": "Excuse me. How can I ____ the train station from here?", "opts": [{"t": "get to", "ok": true, "fb": "問路時「到達某地」的固定說法是 get to。"}, {"t": "go", "ok": false, "fb": "go 後面要有 to，而且問路習慣用 get to。"}, {"t": "take", "ok": false, "fb": "take 後面接的是交通工具，不是地點。"}, {"t": "arrive", "ok": false, "fb": "arrive 後面要接 at 或 in，而且問路的固定說法是 get to。"}]}, {"q": "Go straight for two blocks, and then ____ at the first corner.", "opts": [{"t": "turn left", "ok": true, "fb": "左轉固定說 turn left，中間不加 to。"}, {"t": "turn to left", "ok": false, "fb": "turn 和 left 中間不加 to。"}, {"t": "turn the left", "ok": false, "fb": "left 前面不加冠詞。"}, {"t": "turning left", "ok": false, "fb": "這是祈使句，要用動詞原形開頭。"}]}, {"q": "My school is far from my home, so I ____ to school every day.", "opts": [{"t": "take the bus", "ok": true, "fb": "take + the + 交通工具，是搭乘的固定說法。"}, {"t": "take bus", "ok": false, "fb": "用 take 時，交通工具前面要加 the。"}, {"t": "by the bus", "ok": false, "fb": "by 後面不加冠詞，而且 by bus 前面需要動詞 go。"}, {"t": "ride bus", "ok": false, "fb": "ride 用在腳踏車、機車這類跨坐的交通工具。"}]}, {"q": "The bookstore is just around the corner. You can go there ____ .", "opts": [{"t": "by foot", "ok": false, "fb": "走路不說 by foot，固定說法是 on foot。"}, {"t": "on foot", "ok": true, "fb": "走路的固定說法是 on foot。"}, {"t": "by walk", "ok": false, "fb": "沒有這種說法。walk 是動詞，走路的固定片語是 on foot。"}, {"t": "on feet", "ok": false, "fb": "固定片語是 on foot，用單數。"}]}, {"q": "We're almost there. Let's ____ the bus at the next stop.", "opts": [{"t": "get on", "ok": false, "fb": "get on 是上車，但我們已經在車上，快到了要下車。"}, {"t": "get off", "ok": true, "fb": "下車固定說 get off。"}, {"t": "get in", "ok": false, "fb": "公車用 get on / get off，get in 用在小客車。"}, {"t": "get to", "ok": false, "fb": "get to 後面接地點，不是交通工具。"}]}, {"q": "A: Excuse me. Is there a post office near here?　B: ____ It's across from the bank.", "opts": [{"t": "Yes, there is.", "ok": true, "fb": "Is there 開頭的問句，簡答用 there is。"}, {"t": "Yes, it is.", "ok": false, "fb": "問句用了 Is there，簡答也要用 there。"}, {"t": "Yes, I do.", "ok": false, "fb": "問句不是用助動詞 do 開頭。"}, {"t": "Yes, there has.", "ok": false, "fb": "這個句型用 be 動詞，不用 have。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "Go down this street and you'll see it on your right.", "ok": false, "fb": "這句是對的。go down 是沿著某條路走。"}, {"t": "My father goes to work by a car.", "ok": true, "fb": "這句錯了。by 後面不加冠詞，要寫 by car。"}, {"t": "The hospital is across from the park.", "ok": false, "fb": "這句是對的。across from 是在對面。"}, {"t": "We got on the train at Yilan Station.", "ok": false, "fb": "這句是對的。上車用 get on。"}]}, {"q": "A: ____ me. How ____ I get to the night market?　B: Take the MRT and get off at the next stop.", "opts": [{"t": "Excuse / can", "ok": true, "fb": "問路先說 Excuse me；問怎麼去用 How can I get to。"}, {"t": "Sorry / can", "ok": false, "fb": "向陌生人搭話用 Excuse me，Sorry 是道歉用的。"}, {"t": "Excuse / do", "ok": false, "fb": "這個固定問法是 How can I get to，不用 do。"}, {"t": "Excuse / will", "ok": false, "fb": "問路的固定說法用 can，不用 will。"}]}], "kkN": 0, "stars": 0, "listenN": 2, "kk": [{"kind": "listen", "src": "108 年會考聽力 第 9 題", "audio": "../audio/108-09.mp3", "q": "聽一聽，選出最適合的回應。", "script": "Excuse me, how do I get to St. Paul's Church?", "opts": [{"t": "I think it is quite convenient.", "ok": false, "fb": "問的是怎麼去，不是方不方便。"}, {"t": "It's just right across the park there.", "ok": true, "fb": "問路 → 指出位置：就在公園對面。"}, {"t": "It might take ten to fifteen minutes.", "ok": false, "fb": "這是回答 How long，不是怎麼去。"}]}, {"kind": "listen", "src": "107 年會考聽力 第 6 題", "audio": "../audio/107-06.mp3", "q": "聽一聽，選出最適合的回應。", "script": "Excuse me, do you know where the nearest supermarket is?", "opts": [{"t": "There's one down the street.", "ok": true, "fb": "問最近的超市在哪 → 沿著這條街就有一家。"}, {"t": "I often shop at the one near my office.", "ok": false, "fb": "問的是「最近的」在哪，不是你常去哪家。"}, {"t": "A new supermarket will open next week.", "ok": false, "fb": "下週才開，現在問路幫不上忙。"}]}, {"kind": "rw", "src": "會考風格改寫", "q": "A: Excuse me. How can I get to the train station?\nB: ＿＿＿", "opts": [{"t": "It's ten dollars.", "ok": false, "fb": "問的是怎麼去，不是價錢。"}, {"t": "At ten o'clock.", "ok": false, "fb": "問的是怎麼去，不是時間。"}, {"t": "I'm going to the station.", "ok": false, "fb": "沒有回答怎麼去。"}, {"t": "Go straight and turn left at the bank.", "ok": true, "fb": "問路 → 直走，在銀行左轉。"}]}, {"kind": "rw", "src": "會考風格改寫", "q": "You can take Bus 251 to the museum. It's only three ＿＿＿ from here.", "opts": [{"t": "ways", "ok": false, "fb": "坐公車的距離用「站」。"}, {"t": "stops", "ok": true, "fb": "公車「站」→ three stops。"}, {"t": "roads", "ok": false, "fb": "road 是馬路，不是站。"}, {"t": "doors", "ok": false, "fb": "door 是門。"}]}]}, {"id": "future", "title": "未來式", "unit": "第三冊 Unit 8 · B3 L5–6", "points": "<p>未來式有兩種說法，意思相近但語感不同：<strong>will 用在當下決定或預測，be going to 用在早就計畫好的事</strong>。</p><h3>兩種句型</h3><table><tr><th>句型</th><th>結構</th><th>例子</th></tr><tr><td class=\"en\">will</td><td class=\"en\">will + 原形</td><td class=\"en\">I <span class=\"k1\">will call</span> you later.</td></tr><tr><td class=\"en\">be going to</td><td class=\"en\">am/is/are going to + 原形</td><td class=\"en\">I <span class=\"k2\">am going to visit</span> Japan.</td></tr></table><p class=\"en\">電話響了 → I <span class=\"k1\">will</span> answer it.　（當下才決定）<br>機票買好了 → I <span class=\"k2\">am going to</span> fly to Japan.　（早就計畫）</p><h3>否定與疑問</h3><p class=\"en\">否定：I <span class=\"k1\">won't</span> go.　<span class=\"bad\">willn't</span>　<span class=\"bad\">don't will</span><br>疑問：<span class=\"k1\">Will</span> you be at home? → Yes, I <span class=\"k1\">will</span>. / No, I <span class=\"k1\">won't</span>.<br>　　　<span class=\"k2\">Are</span> you <span class=\"k2\">going to</span> watch the game?</p><h3>will 後面一定是原形</h3><p class=\"en\">Ted <span class=\"k1\">will be</span> fourteen next month.　<span class=\"bad\">will is</span><br>She <span class=\"k1\">will go</span> to Japan.　<span class=\"bad\">will goes</span></p><h3>時間子句裡不用未來式</h3><p class=\"en\">I will call you <span class=\"k3\">when I get home</span>.　<span class=\"bad\">when I will get home</span></p><p style=\"color:var(--muted);font-size:17px\">when、before、after 這類時間子句裡，<strong>用現在式代替未來式</strong>。主要子句才用 will。</p><h3>常見的時間提示</h3><p class=\"en\"><span class=\"k2\">tomorrow　next week　next year　soon　later　tonight</span></p>", "questions": [{"q": "Don't worry about the report. I ____ help you with it.", "opts": [{"t": "will", "ok": true, "fb": "當下才決定要幫忙，用 will。"}, {"t": "am going to", "ok": false, "fb": "be going to 用在早就計畫好的事，這裡是聽到對方煩惱才決定幫忙。"}, {"t": "help", "ok": false, "fb": "這句在講未來要做的事，要加未來式。"}, {"t": "will to", "ok": false, "fb": "will 後面直接接原形，不加 to。"}]}, {"q": "I ____ go to the party tonight. I have too much homework.", "opts": [{"t": "won't", "ok": true, "fb": "will 的否定縮寫是 won't。"}, {"t": "willn't", "ok": false, "fb": "沒有這種拼法，will not 的縮寫是 won't。"}, {"t": "don't will", "ok": false, "fb": "will 本身就是助動詞，不需要再加 don't。"}, {"t": "am not will", "ok": false, "fb": "will 前面不加 be 動詞。"}]}, {"q": "Ted ____ fifteen years old next month. His family will have a party for him.", "opts": [{"t": "will is", "ok": false, "fb": "will 後面一定接動詞原形，is 要改成 be。"}, {"t": "will be", "ok": true, "fb": "will 後面接原形，be 動詞的原形是 be。"}, {"t": "is", "ok": false, "fb": "next month 表示未來，要用未來式。"}, {"t": "will was", "ok": false, "fb": "will 後面接原形，不接過去式。"}]}, {"q": "A: Will you be at home this evening?　B: ____ I have to go to my aunt's house.", "opts": [{"t": "Yes, I will.", "ok": false, "fb": "後面說要去阿姨家，表示不在家。"}, {"t": "No, I won't.", "ok": true, "fb": "要去阿姨家表示不在家，Will 開頭的問句用 won't 否定簡答。"}, {"t": "No, I don't.", "ok": false, "fb": "問句用 Will 開頭，簡答也要用 will 或 won't。"}, {"t": "No, I'm not.", "ok": false, "fb": "問句沒有用 be 動詞當助動詞。"}]}, {"q": "A: What ____ you ____ do this weekend?　B: I'm going to visit my grandparents.", "opts": [{"t": "are / going to", "ok": true, "fb": "回答用了 be going to，問句也用同樣的句型。"}, {"t": "will / going to", "ok": false, "fb": "going to 前面要用 be 動詞，不是 will。"}, {"t": "do / going to", "ok": false, "fb": "be going to 的疑問句要把 be 動詞提前。"}, {"t": "are / go to", "ok": false, "fb": "固定句型是 be going to，不是 be go to。"}]}, {"q": "I will give you a call when I ____ to the station.", "opts": [{"t": "will get", "ok": false, "fb": "when 引導的時間子句裡不用未來式，用現在式代替。"}, {"t": "get", "ok": true, "fb": "時間子句用現在式代替未來式，主要子句才用 will。"}, {"t": "got", "ok": false, "fb": "整句講的是未來的事，不用過去式。"}, {"t": "am getting", "ok": false, "fb": "這裡用現在簡單式就可以了。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "She will goes to Japan next summer.", "ok": true, "fb": "這句錯了。will 後面接原形，應該是 will go。"}, {"t": "They are going to move to Taipei.", "ok": false, "fb": "這句是對的。be going to 後面接原形。"}, {"t": "It won't rain tomorrow.", "ok": false, "fb": "這句是對的。won't 後面接原形。"}, {"t": "We will be back before six.", "ok": false, "fb": "這句是對的。will 後面用 be 動詞的原形。"}]}, {"q": "A: The phone is ringing!　B: OK, I ____ answer it.　A: Thanks. I ____ cook dinner now, so I can't.", "opts": [{"t": "will / am going to", "ok": true, "fb": "接電話是當下決定用 will；準備煮晚餐是本來就要做的事，用 be going to。"}, {"t": "am going to / will", "ok": false, "fb": "兩個放反了。聽到電話響才決定去接，是當下的決定。"}, {"t": "will / will", "ok": false, "fb": "後半是本來就要做的事，用 be going to 更貼切。"}, {"t": "answer / am going to", "ok": false, "fb": "前半在講接下來要做的事，要用未來式。"}]}], "kkN": 7, "stars": 3, "listenN": 0, "kk": [{"kind": "orig", "src": "107 年會考 第 8 題", "q": "Dad: Have you brushed your teeth yet?\nAnn: No, but I ＿＿＿ before I go to bed.", "opts": [{"t": "haven't", "ok": false, "fb": "haven't 只能回答「還沒刷」，前面已經說 No 了，後面要講之後的打算。"}, {"t": "have", "ok": false, "fb": "have 是「已經刷了」，和 No 矛盾。"}, {"t": "won't", "ok": false, "fb": "won't 是「不會刷」，和 but（轉折）的意思相反。"}, {"t": "will", "ok": true, "fb": "before I go to bed 是之後的事：「還沒刷，但睡前會刷」，用 will。"}]}, {"kind": "orig", "src": "108 年會考 第 11 題", "q": "＿＿＿ that last piece of pie? If not, can I have it? I didn't eat much this morning.", "opts": [{"t": "Had you eaten", "ok": false, "fb": "Had you eaten 是過去完成式，問的是之前，但派還在，是在問接下來。"}, {"t": "Were you eating", "ok": false, "fb": "Were you eating 是過去進行式，問「當時正在吃嗎」，句意不通。"}, {"t": "Do you eat", "ok": false, "fb": "Do you eat 是問習慣，這裡問的是這一塊派等一下要不要吃。"}, {"t": "Are you going to eat", "ok": true, "fb": "問對方「你打算吃那最後一塊派嗎？」是問接下來的打算，用 be going to。"}]}, {"kind": "orig", "src": "109 年會考 第 14 題", "q": "We were so sure that Jerry ＿＿＿ well on the difficult job. His past experience in other work showed he was the right guy for it. So when he failed, no one believed it.", "opts": [{"t": "had done", "ok": false, "fb": "had done 是「之前已經做好了」，但後面說他失敗了。"}, {"t": "did", "ok": false, "fb": "did 是「確實做好了」，但他失敗了。"}, {"t": "has done", "ok": false, "fb": "has done 是現在完成式，和前面的過去式 were 不搭。"}, {"t": "would do", "ok": true, "fb": "在過去（were so sure）預料之後的事，用 would + 原形：過去的未來。"}]}, {"kind": "orig", "src": "110 年會考 第 7 題", "q": "My sister is coming to my home today. She ＿＿＿ with me for a week.", "opts": [{"t": "stays", "ok": false, "fb": "stays 是現在式，用來說習慣，這裡是即將發生的事。"}, {"t": "stayed", "ok": false, "fb": "stayed 是過去式，但她今天才來。"}, {"t": "has stayed", "ok": false, "fb": "has stayed 表示已經住了一陣子，但她還沒到。"}, {"t": "will stay", "ok": true, "fb": "她今天才來，接下來會住一週，是未來的事，用 will stay。"}]}, {"kind": "orig", "src": "112 年會考 第 12 題", "q": "Ed and Jill ＿＿＿ camping this weekend, so they have to finish their homework by Friday.", "opts": [{"t": "went", "ok": false, "fb": "went 是過去式，但 this weekend 還沒到（作業要在週五前寫完）。"}, {"t": "were going", "ok": false, "fb": "were going 是過去進行式，和 this weekend、have to 不合。"}, {"t": "are going", "ok": true, "fb": "已經安排好的近期計畫，可以用現在進行式表示未來：are going camping。"}, {"t": "have gone", "ok": false, "fb": "have gone 是現在完成式，表示已經去了，和 have to finish homework 矛盾。"}]}, {"kind": "orig", "src": "112 年會考 第 14 題", "q": "If we play some interesting games in class, there ＿＿＿ more fun in learning English.", "opts": [{"t": "are", "ok": false, "fb": "are 是現在式，但 if 子句說的是「如果會」，主要句要用未來式。"}, {"t": "has", "ok": false, "fb": "There be 句型不能把 be 換成 has。"}, {"t": "will be", "ok": true, "fb": "If 子句用現在式，主要句用未來式：there will be。"}, {"t": "will have", "ok": false, "fb": "There be 句型不能用 will have。"}]}, {"kind": "orig", "src": "114 年會考 第 10 題", "q": "Christmas ＿＿＿ and I want to visit my aunt abroad. Do you have any plans yet?", "opts": [{"t": "came", "ok": false, "fb": "came 是過去式，但後面在問有沒有計畫，聖誕節還沒到。"}, {"t": "comes", "ok": false, "fb": "comes 是現在式，用來說固定的事實，這裡要說「快到了」。"}, {"t": "is coming", "ok": true, "fb": "is coming 表示「就快到了」，用現在進行式表示即將發生。"}, {"t": "was coming", "ok": false, "fb": "was coming 是過去進行式，和後面的現在式 want、Do you have 不合。"}]}, {"kind": "rw", "src": "仿 110 年第 7 題", "q": "My cousin is moving to Yilan next month. He ＿＿＿ at our school, and I can't wait to see him every day.", "opts": [{"t": "studies", "ok": false, "fb": "現在式說習慣，但他下個月才搬來。"}, {"t": "studied", "ok": false, "fb": "過去式，但事情還沒發生。"}, {"t": "has studied", "ok": false, "fb": "現在完成式表示已經讀了，但他還沒來。"}, {"t": "will study", "ok": true, "fb": "next month 搬來，之後會在我們學校讀書：will study。"}]}]}, {"id": "weather", "title": "詢問天氣的用法", "unit": "第三冊 Unit 8 · B3 L5–6", "points": "<p>天氣題的兩個考點：<strong>問句的固定說法</strong>，以及<strong>天氣字的名詞和形容詞不一樣</strong>。</p><h3>兩種問法，意思一樣</h3><p class=\"en\"><span class=\"k1\">How's the weather</span> in Yilan?<br><span class=\"k1\">What's the weather like</span> in Yilan?<br>→ <span class=\"k2\">It's</span> rainy and cool.</p><p style=\"color:var(--muted);font-size:17px\">注意 What's the weather <strong>like</strong> 不能少掉 like，而 How's the weather 不能加 like。</p><h3>名詞變形容詞：加 -y</h3><table><tr><th>名詞</th><th>形容詞</th></tr><tr><td class=\"en\">rain（雨）</td><td class=\"en\">rain<span class=\"k2\">y</span></td></tr><tr><td class=\"en\">wind（風）</td><td class=\"en\">wind<span class=\"k2\">y</span></td></tr><tr><td class=\"en\">cloud（雲）</td><td class=\"en\">cloud<span class=\"k2\">y</span></td></tr><tr><td class=\"en\">snow（雪）</td><td class=\"en\">snow<span class=\"k2\">y</span></td></tr><tr><td class=\"en\">sun（太陽）</td><td class=\"en\">sun<span class=\"k2\">ny</span>（n 要重複）</td></tr></table><h3>It's raining 和 It's rainy</h3><p class=\"en\">It <span class=\"k1\">is raining</span> now.　→ rain 當<strong>動詞</strong>，現在正在下<br>It <span class=\"k2\">is rainy</span> today.　→ rainy 當<strong>形容詞</strong>，形容今天的天氣</p><p class=\"en\"><span class=\"bad\">It's rain today.</span>　→ 要用形容詞 rainy</p><h3>冷熱的形容詞</h3><p class=\"en\"><span class=\"k3\">hot</span>（熱）　<span class=\"k3\">warm</span>（溫暖）　<span class=\"k3\">cool</span>（涼爽）　<span class=\"k3\">cold</span>（冷）</p>", "questions": [{"q": "A: ____ the weather like in Taipei today?　B: It's cloudy and cool.", "opts": [{"t": "What's", "ok": true, "fb": "What's the weather like 是固定問法，不能少掉 like。"}, {"t": "How's", "ok": false, "fb": "How's the weather 後面不加 like，兩種問法不能混用。"}, {"t": "How is it", "ok": false, "fb": "這樣問文法不通，問天氣要用 How is the weather 或 What is the weather like。"}, {"t": "What", "ok": false, "fb": "少了 be 動詞，應該是 What's 或 What is。"}]}, {"q": "A: ____ the weather in Yilan?　B: It's rainy almost every day in winter.", "opts": [{"t": "What's", "ok": false, "fb": "用 What's 的話句尾要加 like，這句沒有 like。"}, {"t": "How's", "ok": true, "fb": "How's the weather 後面不加 like，直接問。"}, {"t": "How's like", "ok": false, "fb": "How's 後面不加 like。"}, {"t": "What like", "ok": false, "fb": "語序不對，應該是 What's the weather like。"}]}, {"q": "Look outside! It's ____ hard. Don't forget your umbrella.", "opts": [{"t": "rain", "ok": false, "fb": "be 動詞後面要接形容詞或 V-ing，不能接原形動詞。"}, {"t": "raining", "ok": true, "fb": "Look! 表示現在正在下，rain 當動詞用進行式。"}, {"t": "rainy", "ok": false, "fb": "rainy 是形容詞，後面不能接 hard 這個副詞。"}, {"t": "rained", "ok": false, "fb": "Look outside 表示現在正在發生。"}]}, {"q": "It was very ____ yesterday. My umbrella almost flew away.", "opts": [{"t": "wind", "ok": false, "fb": "wind 是名詞，要用形容詞 windy。"}, {"t": "windy", "ok": true, "fb": "形容天氣要用形容詞，wind 加 y 變成 windy。"}, {"t": "winding", "ok": false, "fb": "沒有這種天氣形容詞。"}, {"t": "winds", "ok": false, "fb": "這是名詞的複數，不能用來形容天氣。"}]}, {"q": "It's a beautiful day today. It's ____ and warm.", "opts": [{"t": "suny", "ok": false, "fb": "拼錯了。sun 加 y 時 n 要重複，寫成 sunny。"}, {"t": "sunny", "ok": true, "fb": "sun 變形容詞時要重複 n，再加 y。"}, {"t": "sun", "ok": false, "fb": "sun 是名詞，形容天氣要用 sunny。"}, {"t": "sunning", "ok": false, "fb": "沒有這種天氣形容詞，正確是 sunny。"}]}, {"q": "A: How's the weather in Yilan in winter?　B: ____", "opts": [{"t": "It's Monday.", "ok": false, "fb": "這是回答星期幾的答案。"}, {"t": "It's cold and rainy.", "ok": true, "fb": "問天氣就回答天氣狀況。"}, {"t": "It's five o'clock.", "ok": false, "fb": "這是回答時間的答案。"}, {"t": "Yes, it is.", "ok": false, "fb": "疑問詞開頭的問句不能用 Yes / No 回答。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "It's snowy on the mountain today.", "ok": false, "fb": "這句是對的。snow 加 y 變成形容詞。"}, {"t": "It's rain in Taipei now.", "ok": true, "fb": "這句錯了。要寫 It's raining 或 It's rainy。"}, {"t": "What's the weather like tomorrow?", "ok": false, "fb": "這句是對的。What's 的問法要加 like。"}, {"t": "It was cloudy all day yesterday.", "ok": false, "fb": "這句是對的。cloudy 是形容詞，配過去式 was。"}]}, {"q": "A: ____ was the weather like last weekend?　B: It ____ really hot, so we stayed home.", "opts": [{"t": "What / was", "ok": true, "fb": "What... like 的問法；last weekend 是過去，be 動詞用 was。"}, {"t": "How / was", "ok": false, "fb": "句尾有 like，疑問詞要用 What。"}, {"t": "What / is", "ok": false, "fb": "last weekend 表示過去，be 動詞要用 was。"}, {"t": "How / is", "ok": false, "fb": "句尾有 like 要用 What，而且時態也錯了。"}]}], "kkN": 0, "stars": 0, "listenN": 1, "kk": [{"kind": "listen", "src": "111 年會考聽力 第 6 題", "audio": "../audio/111-06.mp3", "q": "聽一聽，選出最適合的回應。", "script": "It's cold out here. Let's go back to get our coats.", "opts": [{"t": "I haven't heard about it.", "ok": false, "fb": "對方提議回去拿外套，不是在講新聞。"}, {"t": "That's a good idea.", "ok": true, "fb": "Let's … 是提議 → 好主意。"}, {"t": "But the coat looks better.", "ok": false, "fb": "沒有在比較外套，答非所問。"}]}, {"kind": "rw", "src": "會考風格改寫", "q": "A: ＿＿＿\nB: It's cloudy and windy. You'd better take a jacket.", "opts": [{"t": "What's the weather like today?", "ok": true, "fb": "回答在說天氣 → 今天天氣如何？"}, {"t": "What day is it today?", "ok": false, "fb": "回答不是星期幾。"}, {"t": "What's the date today?", "ok": false, "fb": "回答不是日期。"}, {"t": "How are you today?", "ok": false, "fb": "回答不是在說自己好不好。"}]}, {"kind": "rw", "src": "會考風格改寫", "q": "It was ＿＿＿ yesterday, so we couldn't play baseball outside.", "opts": [{"t": "sunny", "ok": false, "fb": "晴天可以打棒球。"}, {"t": "sun", "ok": false, "fb": "sun 是名詞，要用形容詞 sunny。"}, {"t": "rainy", "ok": true, "fb": "下雨，所以不能在外面打棒球：rainy。"}, {"t": "rain", "ok": false, "fb": "rain 是名詞或動詞，It was 後面要接形容詞。"}]}]}, {"id": "ditransitive", "title": "授與動詞", "unit": "第四冊 Unit 9 · B4 L1–2", "points": "<p>授與動詞就是「<strong>給誰什麼東西</strong>」的動詞。它後面可以接兩個受詞，而且有兩種排法。</p><h3>兩種寫法，意思一樣</h3><div class=\"formula\"><span class=\"tag k1\">動詞</span><span class=\"plus\">+</span><span class=\"tag k0\">人</span><span class=\"plus\">+</span><span class=\"tag k2\">物</span></div><div class=\"formula\"><span class=\"tag k1\">動詞</span><span class=\"plus\">+</span><span class=\"tag k2\">物</span><span class=\"plus\">+</span><span class=\"tag k3\">to / for</span><span class=\"plus\">+</span><span class=\"tag k0\">人</span></div><p class=\"en\">He gave <span class=\"k0\">me</span> <span class=\"k2\">a book</span>.<br>He gave <span class=\"k2\">a book</span> <span class=\"k3\">to</span> <span class=\"k0\">me</span>.</p><p style=\"color:var(--muted);font-size:17px\">換成第二種寫法時，<strong>介系詞不能漏掉</strong>，而且人要用受格。</p><h3>用 to 還是 for？</h3><table><tr><th>介系詞</th><th>動詞</th><th>概念</th></tr><tr><td class=\"en\"><span class=\"k1\">to</span></td><td class=\"en\">give, send, show,<br>teach, tell, write, lend, pass</td><td>東西從我這裡「傳到」對方</td></tr><tr><td class=\"en\"><span class=\"k2\">for</span></td><td class=\"en\">buy, make, cook, get, sing</td><td>我「為了」對方做這件事</td></tr></table><p class=\"en\">My mom made <span class=\"k2\">a cake</span> <span class=\"k2\">for</span> me.　<span class=\"bad\">made a cake to me</span><br>She sent <span class=\"k1\">a letter</span> <span class=\"k1\">to</span> me.　<span class=\"bad\">sent a letter for me</span></p><h3>人換成代名詞時</h3><p class=\"en\">He gave <span class=\"k0\">me</span> a book.　<span class=\"bad\">gave I a book</span></p><p>人的位置一律用受格：me、him、her、us、them。</p>", "questions": [{"q": "My grandmother gave ____ a red envelope on Chinese New Year.", "opts": [{"t": "I", "ok": false, "fb": "動詞後面的人要用受格，I 是主格。"}, {"t": "me", "ok": true, "fb": "授與動詞後面的人要用受格 me。"}, {"t": "my", "ok": false, "fb": "my 是所有格形容詞，後面要接名詞。"}, {"t": "mine", "ok": false, "fb": "mine 是所有格代名詞，意思是「我的東西」。"}]}, {"q": "Ted showed his new comic book ____ his classmates.", "opts": [{"t": "for", "ok": false, "fb": "show 是把東西拿給對方看，東西傳到對方那裡，要用 to。"}, {"t": "to", "ok": true, "fb": "show 屬於用 to 的那一組。"}, {"t": "with", "ok": false, "fb": "這個句型只會用 to 或 for。"}, {"t": "不填", "ok": false, "fb": "東西放在前面時，後面的人前面一定要有介系詞。"}]}, {"q": "My mother made a birthday cake ____ me yesterday.", "opts": [{"t": "to", "ok": false, "fb": "make 是「為了某人做」，要用 for。"}, {"t": "for", "ok": true, "fb": "make、buy、cook 這類「為某人做某事」的動詞用 for。"}, {"t": "at", "ok": false, "fb": "這個句型只會用 to 或 for。"}, {"t": "不填", "ok": false, "fb": "東西放在人前面時，人前面必須有介系詞。"}]}, {"q": "Could you please pass ____ ?", "opts": [{"t": "me the salt", "ok": true, "fb": "動詞後面先接人再接物，兩個受詞中間不加介系詞。"}, {"t": "the salt me", "ok": false, "fb": "物放前面時，人的前面要加介系詞，寫成 the salt to me。"}, {"t": "to me the salt", "ok": false, "fb": "人放在物前面時不加介系詞。"}, {"t": "the salt for me", "ok": false, "fb": "pass 是把東西遞給對方，要用 to 不是 for。"}]}, {"q": "Mr. Lin teaches ____ . He is a very patient teacher.", "opts": [{"t": "English us", "ok": false, "fb": "順序錯了。人放前面是 us English，物放前面要加 to。"}, {"t": "us English", "ok": true, "fb": "動詞後面先人後物，中間不加介系詞。"}, {"t": "English for us", "ok": false, "fb": "teach 屬於用 to 的那一組，不用 for。"}, {"t": "to us English", "ok": false, "fb": "人放在前面時不需要介系詞。"}]}, {"q": "My father bought a new bike ____ my little brother for his birthday.", "opts": [{"t": "to", "ok": false, "fb": "buy 是「為某人買」，要用 for。"}, {"t": "for", "ok": true, "fb": "buy 屬於用 for 的那一組。"}, {"t": "of", "ok": false, "fb": "這個句型只會用 to 或 for。"}, {"t": "不填", "ok": false, "fb": "物放在人前面時，人前面要有介系詞。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "She sent a postcard to her friend in Japan.", "ok": false, "fb": "這句是對的。send 用 to。"}, {"t": "He cooked dinner to his family last night.", "ok": true, "fb": "這句錯了。cook 是為某人做菜，要用 for his family。"}, {"t": "Please give me your phone number.", "ok": false, "fb": "這句是對的。人在前、物在後，中間不加介系詞。"}, {"t": "My sister wrote a letter to her teacher.", "ok": false, "fb": "這句是對的。write 用 to。"}]}, {"q": "Amy showed her drawing ____ , and then she gave ____ as a gift.", "opts": [{"t": "to me / it to me", "ok": true, "fb": "物放前面時人前要加 to；第二個空格的物是代名詞 it，也要放在人前面加 to。"}, {"t": "me / me it", "ok": false, "fb": "第一個空格的物已經放前面了，人前面要加 to。"}, {"t": "for me / it for me", "ok": false, "fb": "show 和 give 都屬於用 to 的那一組。"}, {"t": "to me / me it", "ok": false, "fb": "前半對了，但後半的順序怪怪的，應該是 gave it to me。"}]}], "kkN": 0, "stars": 0, "listenN": 1, "kk": [{"kind": "listen", "src": "112 年會考聽力 第 11 題", "audio": "../audio/112-11.mp3", "q": "聽一聽，選出最適合的回應。", "script": "Can I get you something to drink while you're looking at the menu?", "opts": [{"t": "Yes, I'll order now.", "ok": false, "fb": "服務生問的是要不要先喝點什麼，不是要不要點餐。"}, {"t": "Yes, I can have a drink.", "ok": false, "fb": "can 是能力，這樣回答很奇怪，沒有說要什麼。"}, {"t": "Yes, I'll have a coffee, please.", "ok": true, "fb": "get you something（幫你拿點東西）→ 好，請給我一杯咖啡。"}]}, {"kind": "rw", "src": "會考風格改寫", "q": "Dad bought a new phone ＿＿＿ me for my birthday.", "opts": [{"t": "to", "ok": false, "fb": "buy 的「給某人」用 for，不用 to。"}, {"t": "with", "ok": false, "fb": "with 不表示「給某人」。"}, {"t": "for", "ok": true, "fb": "buy + 物 + for + 人：爸爸買了一支手機給我。"}, {"t": "of", "ok": false, "fb": "of 不表示「給某人」。"}]}, {"kind": "rw", "src": "會考風格改寫", "q": "Could you pass ＿＿＿? I can't reach it.", "opts": [{"t": "me the salt", "ok": true, "fb": "pass + 人 + 物：把鹽遞給我。"}, {"t": "the salt me", "ok": false, "fb": "物在前要加 to：pass the salt to me。"}, {"t": "to me the salt", "ok": false, "fb": "to 不能放在人和物中間這樣用。"}, {"t": "me to the salt", "ok": false, "fb": "意思變成「把我遞給鹽」。"}]}]}, {"id": "linking-verbs", "title": "連綴動詞", "unit": "第四冊 Unit 9 · B4 L1–2", "points": "<p>連綴動詞不是在講「做什麼動作」，而是在<strong>描述主詞的狀態</strong>。所以它後面接的是<strong>形容詞，不是副詞</strong>。</p><h3>常見的連綴動詞</h3><table><tr><th>動詞</th><th>意思</th><th>例子</th></tr><tr><td class=\"en\">look</td><td>看起來</td><td class=\"en\">You <span class=\"k1\">look</span> <span class=\"k2\">tired</span>.</td></tr><tr><td class=\"en\">sound</td><td>聽起來</td><td class=\"en\">That <span class=\"k1\">sounds</span> <span class=\"k2\">great</span>.</td></tr><tr><td class=\"en\">taste</td><td>嚐起來</td><td class=\"en\">It <span class=\"k1\">tastes</span> <span class=\"k2\">sweet</span>.</td></tr><tr><td class=\"en\">smell</td><td>聞起來</td><td class=\"en\">It <span class=\"k1\">smells</span> <span class=\"k2\">good</span>.</td></tr><tr><td class=\"en\">feel</td><td>感覺</td><td class=\"en\">I <span class=\"k1\">feel</span> <span class=\"k2\">happy</span>.</td></tr><tr><td class=\"en\">become / get</td><td>變得</td><td class=\"en\">It <span class=\"k1\">becomes</span> <span class=\"k2\">cold</span>.</td></tr></table><h3>後面接形容詞，不接副詞</h3><p class=\"en\">You look <span class=\"k2\">tired</span>.　<span class=\"bad\">look tiredly</span><br>It sounds <span class=\"k2\">good</span>.　<span class=\"bad\">sounds well</span></p><p style=\"color:var(--muted);font-size:17px\">判斷方法：把連綴動詞換成 be 動詞，句子意思還通，就表示後面要接形容詞。<span class=\"en\">You look tired. ≈ You are tired.</span></p><h3>後面要接名詞時，加 like</h3><p class=\"en\">She looks <span class=\"k2\">young</span>.　→ 接形容詞<br>She looks <span class=\"k3\">like</span> <span class=\"k2\">her mother</span>.　→ 接名詞要加 like</p><p class=\"en\"><span class=\"bad\">She looks her mother.</span>　<span class=\"bad\">It sounds like great.</span></p><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">The cake tastes well.</span>　→ 要用形容詞 good</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">He looks like sad.</span>　→ 接形容詞不加 like</p></div>", "questions": [{"q": "You ____ today. Did you sleep well last night?", "opts": [{"t": "look tiredly", "ok": false, "fb": "look 是連綴動詞，後面接形容詞不接副詞。"}, {"t": "look tired", "ok": true, "fb": "連綴動詞 look 後面接形容詞 tired。"}, {"t": "look like tired", "ok": false, "fb": "後面接形容詞時不加 like。"}, {"t": "looks tired", "ok": false, "fb": "主詞是 You，動詞不加 s。"}]}, {"q": "A: Let's go to the night market tonight.　B: That ____ ! I'm in.", "opts": [{"t": "sounds great", "ok": true, "fb": "sound 是連綴動詞，後面接形容詞 great。"}, {"t": "sounds greatly", "ok": false, "fb": "連綴動詞後面接形容詞，不接副詞。"}, {"t": "sounds like great", "ok": false, "fb": "great 是形容詞，前面不加 like。"}, {"t": "sound great", "ok": false, "fb": "主詞 That 是第三人稱單數，動詞要加 s。"}]}, {"q": "This soup ____ . Did you put too much salt in it?", "opts": [{"t": "tastes salty", "ok": true, "fb": "taste 是連綴動詞，後面接形容詞 salty。"}, {"t": "tastes saltily", "ok": false, "fb": "連綴動詞後面要用形容詞。"}, {"t": "taste salty", "ok": false, "fb": "主詞 This soup 是單數，動詞要加 s。"}, {"t": "tastes like salty", "ok": false, "fb": "salty 是形容詞，前面不加 like。"}]}, {"q": "Judy ____ her mother. They have the same eyes and smile.", "opts": [{"t": "looks", "ok": false, "fb": "後面接的是名詞 her mother，要加 like。"}, {"t": "looks like", "ok": true, "fb": "連綴動詞後面接名詞時要加 like。"}, {"t": "looks as", "ok": false, "fb": "這個用法固定是 look like。"}, {"t": "look like", "ok": false, "fb": "主詞 Judy 是第三人稱單數，動詞要加 s。"}]}, {"q": "Something ____ in the kitchen. Is Mom baking cookies?", "opts": [{"t": "smells good", "ok": true, "fb": "smell 是連綴動詞，後面接形容詞 good。"}, {"t": "smells well", "ok": false, "fb": "well 是副詞，連綴動詞後面要用形容詞 good。"}, {"t": "smell good", "ok": false, "fb": "Something 當主詞視為單數，動詞要加 s。"}, {"t": "is smelling good", "ok": false, "fb": "連綴動詞通常不用進行式。"}]}, {"q": "It ____ cold in the evening. You should take a jacket with you.", "opts": [{"t": "gets", "ok": true, "fb": "get 當連綴動詞是「變得」，後面接形容詞。"}, {"t": "gets to", "ok": false, "fb": "get to 是「到達」，後面接地點。"}, {"t": "get", "ok": false, "fb": "主詞 It 是第三人稱單數，動詞要加 s。"}, {"t": "gets like", "ok": false, "fb": "cold 是形容詞，前面不加 like。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "The music sounds beautiful.", "ok": false, "fb": "這句是對的。連綴動詞後面接形容詞。"}, {"t": "I feel happy about the good news.", "ok": false, "fb": "這句是對的。feel 後面接形容詞。"}, {"t": "These cookies taste well.", "ok": true, "fb": "這句錯了。well 是副詞，應該用形容詞 good。"}, {"t": "He looks like a basketball player.", "ok": false, "fb": "這句是對的。後面是名詞，要加 like。"}]}, {"q": "Amy ____ sad today, and she also ____ her sister when she's upset.", "opts": [{"t": "looks / sounds like", "ok": true, "fb": "sad 是形容詞不加 like；her sister 是名詞要加 like。"}, {"t": "looks like / sounds", "ok": false, "fb": "兩個放反了。形容詞前不加 like，名詞前才要加。"}, {"t": "looks like / sounds like", "ok": false, "fb": "sad 是形容詞，前面不加 like。"}, {"t": "looks / sounds", "ok": false, "fb": "後半接的是名詞 her sister，要加 like。"}]}], "kkN": 0, "stars": 0, "listenN": 2, "kk": [{"kind": "listen", "src": "108 年會考聽力 第 4 題", "audio": "../audio/108-04.mp3", "q": "聽一聽，選出最適合的回應。", "script": "Your sweater looks beautiful. Where did you get it?", "opts": [{"t": "You can try it on.", "ok": false, "fb": "問的是在哪裡買的，不是要不要試穿。"}, {"t": "I went to the store on foot.", "ok": false, "fb": "Where 問地方，但這句在說怎麼去商店。"}, {"t": "It's a present from my aunt.", "ok": true, "fb": "Where did you get it? → 這是阿姨送的禮物。"}]}, {"kind": "listen", "src": "114 年會考聽力 第 6 題", "audio": "../audio/114-06.mp3", "q": "聽一聽，選出最適合的回應。", "script": "What's in the kitchen? It smells great!", "opts": [{"t": "Yes, a dress.", "ok": false, "fb": "What 問句不能用 Yes 回答，而且洋裝不會在廚房裡香香的。"}, {"t": "Your favorite apple pie.", "ok": true, "fb": "It smells great → 廚房裡是你最愛的蘋果派。"}, {"t": "I bought some new plates.", "ok": false, "fb": "盤子不會「聞起來很香」。"}]}, {"kind": "rw", "src": "會考風格改寫", "q": "This soup smells ＿＿＿. Can I have some?", "opts": [{"t": "well", "ok": false, "fb": "連綴動詞（smell、look、taste）後面接形容詞，不接副詞。"}, {"t": "good", "ok": true, "fb": "smell + 形容詞：聞起來很好。"}, {"t": "goodly", "ok": false, "fb": "沒有 goodly 這個字。"}, {"t": "nicely", "ok": false, "fb": "連綴動詞後面要接形容詞。"}]}, {"kind": "rw", "src": "會考風格改寫", "q": "You look ＿＿＿. Did you stay up late last night?", "opts": [{"t": "happily", "ok": false, "fb": "look（看起來）後面要接形容詞。"}, {"t": "happy", "ok": false, "fb": "熬夜不會讓人看起來開心。"}, {"t": "tiredly", "ok": false, "fb": "look 後面要接形容詞。"}, {"t": "tired", "ok": true, "fb": "look + 形容詞：你看起來很累，熬夜了嗎？"}]}]}, {"id": "if-clause", "title": "if 條件句", "unit": "第四冊 Unit 9 · B4 L1–2", "points": "<p>if 條件句講的是「<strong>如果⋯⋯就會⋯⋯</strong>」。整個主題只有一條核心規則，但考得非常密集。</p><h3>核心規則：前現在、後未來</h3><div class=\"formula\"><span class=\"tag k1\">If + 現在簡單式</span><span class=\"plus\">,</span><span class=\"tag k2\">will + 原形</span></div><p class=\"en\"><span class=\"k1\">If it rains</span> tomorrow, <span class=\"k2\">I will stay</span> home.</p><p style=\"color:var(--muted);font-size:17px\">雖然講的是明天的事，但 <strong>if 的那一半不能用 will</strong>。這是這個主題唯一也是最重要的考點。</p><p class=\"en\"><span class=\"bad\">If it will rain tomorrow, I will stay home.</span></p><h3>兩種順序都可以</h3><p class=\"en\"><span class=\"k1\">If you study hard</span>, you <span class=\"k2\">will pass</span> the test.<br>You <span class=\"k2\">will pass</span> the test <span class=\"k1\">if you study hard</span>.</p><p>if 子句放句首要加逗號，放句尾不用。</p><h3>主要子句也可以是祈使句或助動詞</h3><p class=\"en\">If you <span class=\"k1\">are</span> tired, <span class=\"k2\">take</span> a rest.<br>If you <span class=\"k1\">don't hurry</span>, you <span class=\"k2\">may miss</span> the bus.</p><h3>和 when 的差別</h3><p class=\"en\"><span class=\"k3\">If</span> it rains, we won't go.　→ 會不會下雨還不知道<br><span class=\"k3\">When</span> I get home, I will call you.　→ 一定會到家，只是時間問題</p><p>if 是「不確定會不會發生」，when 是「一定會發生」。兩者後面都用現在式。</p><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">If he will come, I will be happy.</span>　→ if 子句用現在式</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">If it rains, I stay home.</span>　→ 主要子句要用 will</p></div>", "questions": [{"q": "If it ____ tomorrow, we will cancel the picnic.", "opts": [{"t": "will rain", "ok": false, "fb": "if 子句裡不用未來式，要用現在簡單式。"}, {"t": "rains", "ok": true, "fb": "雖然講的是明天，但 if 子句要用現在簡單式。"}, {"t": "rained", "ok": false, "fb": "講的是明天的事，不用過去式。"}, {"t": "is raining", "ok": false, "fb": "這裡用現在簡單式就可以了。"}]}, {"q": "If you study hard, you ____ the exam next week.", "opts": [{"t": "pass", "ok": false, "fb": "主要子句要用未來式，加上 will。"}, {"t": "will pass", "ok": true, "fb": "if 子句用現在式，主要子句用 will + 原形。"}, {"t": "passed", "ok": false, "fb": "next week 是未來的事。"}, {"t": "will passes", "ok": false, "fb": "will 後面接動詞原形，不加 s。"}]}, {"q": "We ____ go hiking if the weather ____ nice this Sunday.", "opts": [{"t": "will / is", "ok": true, "fb": "主要子句用 will，if 子句用現在式。"}, {"t": "will / will be", "ok": false, "fb": "if 子句不用未來式，要用現在式 is。"}, {"t": "are / is", "ok": false, "fb": "主要子句講的是這個星期天的計畫，要用 will。"}, {"t": "will / was", "ok": false, "fb": "this Sunday 是未來，不用過去式。"}]}, {"q": "If you ____ tired, ____ a short rest.", "opts": [{"t": "are / take", "ok": true, "fb": "if 子句用現在式；主要子句是祈使句，用動詞原形。"}, {"t": "will be / take", "ok": false, "fb": "if 子句不用未來式。"}, {"t": "are / will take", "ok": false, "fb": "這裡是在給建議，用祈使句比較自然。"}, {"t": "are / taking", "ok": false, "fb": "祈使句要用動詞原形開頭。"}]}, {"q": "If you ____ now, you may miss the school bus.", "opts": [{"t": "won't hurry", "ok": false, "fb": "if 子句的否定用 don't，不用 won't。"}, {"t": "don't hurry", "ok": true, "fb": "if 子句用現在簡單式，否定用 don't。"}, {"t": "didn't hurry", "ok": false, "fb": "講的是現在和接下來的事，不用過去式。"}, {"t": "not hurry", "ok": false, "fb": "否定要用助動詞 don't。"}]}, {"q": "I ____ call you ____ I get to the airport. My flight lands at six.", "opts": [{"t": "will / when", "ok": true, "fb": "一定會到機場，所以用 when；主要子句用 will，時間子句用現在式。"}, {"t": "will / if", "ok": false, "fb": "班機會降落是確定的事，用 when 比 if 合適。"}, {"t": "am / when", "ok": false, "fb": "主要子句講的是未來要做的事，要用 will。"}, {"t": "will / because", "ok": false, "fb": "這裡在講時間先後，不是在說原因。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "If he comes, I will tell him the news.", "ok": false, "fb": "這句是對的。if 子句用現在式，主要子句用 will。"}, {"t": "If it will snow tomorrow, we won't go out.", "ok": true, "fb": "這句錯了。if 子句不能用未來式，要改成 If it snows。"}, {"t": "You will be late if you don't leave now.", "ok": false, "fb": "這句是對的。if 子句放句尾不加逗號。"}, {"t": "If you are hungry, eat something first.", "ok": false, "fb": "這句是對的。主要子句可以是祈使句。"}]}, {"q": "If Ted ____ to the party, Amy ____ very happy. But he isn't sure yet.", "opts": [{"t": "comes / will be", "ok": true, "fb": "if 子句用現在式且主詞是第三人稱單數要加 s；主要子句用 will be。"}, {"t": "will come / will be", "ok": false, "fb": "if 子句不用未來式。"}, {"t": "come / will be", "ok": false, "fb": "主詞 Ted 是第三人稱單數，動詞要加 s。"}, {"t": "comes / is", "ok": false, "fb": "主要子句講的是如果發生後的結果，要用 will。"}]}], "kkN": 0, "stars": 0, "listenN": 0, "kk": [{"kind": "rw", "src": "會考風格改寫", "q": "If it ＿＿＿ tomorrow, we will stay home and watch movies.", "opts": [{"t": "will rain", "ok": false, "fb": "if 子句說未來的條件時，用現在式，不用 will。"}, {"t": "rains", "ok": true, "fb": "If 子句用現在式代替未來：If it rains …。"}, {"t": "rained", "ok": false, "fb": "過去式，但說的是明天。"}, {"t": "is raining", "ok": false, "fb": "說的是明天的條件，用現在簡單式。"}]}, {"kind": "rw", "src": "會考風格改寫", "q": "If you finish your homework early, you ＿＿＿ play video games.", "opts": [{"t": "can", "ok": true, "fb": "If 子句現在式，主要句可以用 can / will：你就可以玩電動。"}, {"t": "could have", "ok": false, "fb": "這是假設過去的說法。"}, {"t": "played", "ok": false, "fb": "過去式不合。"}, {"t": "to play", "ok": false, "fb": "缺少動詞。"}]}]}, {"id": "compound-pronouns", "title": "複合不定代名詞", "unit": "第四冊 Unit 9 · B4 L1–2", "points": "<p>這類字由 <span class=\"en\">some / any / no / every</span> 加上 <span class=\"en\">thing / one / body</span> 組成，用來指<strong>不特定的人或東西</strong>。</p><h3>組合表</h3><table><tr><th></th><th>東西</th><th>人</th></tr><tr><td>某個</td><td class=\"en\">something</td><td class=\"en\">someone / somebody</td></tr><tr><td>任何（否定、疑問）</td><td class=\"en\">anything</td><td class=\"en\">anyone / anybody</td></tr><tr><td>沒有任何</td><td class=\"en\">nothing</td><td class=\"en\">no one / nobody</td></tr><tr><td>每個、全部</td><td class=\"en\">everything</td><td class=\"en\">everyone / everybody</td></tr></table><h3>規則一：一律當單數</h3><p class=\"en\"><span class=\"k1\">Everyone is</span> here.　<span class=\"bad\">Everyone are here.</span><br><span class=\"k1\">Something is</span> wrong.　<span class=\"bad\">Something are wrong.</span></p><p style=\"color:var(--muted);font-size:17px\">就算 everyone 感覺是很多人，文法上仍然是單數，動詞要加 s。</p><h3>規則二：形容詞放後面</h3><p class=\"en\">I want to eat something <span class=\"k2\">special</span>.　<span class=\"bad\">special something</span><br>Is there anything <span class=\"k2\">new</span>?</p><p>一般形容詞放名詞前面，但這類字的形容詞要放<strong>後面</strong>。</p><h3>規則三：some 系列用肯定，any 系列用否定和疑問</h3><p class=\"en\">I have <span class=\"k1\">something</span> to tell you.<br>I don't have <span class=\"k3\">anything</span> to do.<br>Is there <span class=\"k3\">anyone</span> in the room?</p><h3>nothing 本身就是否定</h3><p class=\"en\">I have <span class=\"k2\">nothing</span> to say.　= I <span class=\"k3\">don't</span> have <span class=\"k3\">anything</span> to say.<br><span class=\"bad\">I don't have nothing to say.</span></p><p>一個句子裡不能有兩個否定。</p>", "questions": [{"q": "Everyone in my class ____ ready for the English test.", "opts": [{"t": "are", "ok": false, "fb": "Everyone 文法上當單數看，要用 is。"}, {"t": "is", "ok": true, "fb": "everyone 雖然指很多人，文法上是單數主詞。"}, {"t": "were", "ok": false, "fb": "everyone 是單數，而且句子講的是現在。"}, {"t": "be", "ok": false, "fb": "be 是原形，句子裡要用 is。"}]}, {"q": "I'm hungry. I want to eat ____ .", "opts": [{"t": "something hot", "ok": true, "fb": "這類字的形容詞要放在後面。"}, {"t": "hot something", "ok": false, "fb": "位置錯了。something 的形容詞放後面。"}, {"t": "anything hot", "ok": false, "fb": "這是肯定句，用 something。"}, {"t": "nothing hot", "ok": false, "fb": "意思會變成不想吃東西，和肚子餓矛盾。"}]}, {"q": "I looked everywhere, but I didn't find ____ .", "opts": [{"t": "something", "ok": false, "fb": "這是否定句，要用 anything。"}, {"t": "anything", "ok": true, "fb": "否定句裡用 anything。"}, {"t": "nothing", "ok": false, "fb": "句子已經有 didn't 了，再用 nothing 會變成雙重否定。"}, {"t": "everything", "ok": false, "fb": "意思會變成「沒找到全部」，和句意不合。"}]}, {"q": "A: Is there ____ at the door?　B: No, I don't hear anything.", "opts": [{"t": "someone", "ok": false, "fb": "疑問句通常用 anyone。"}, {"t": "anyone", "ok": true, "fb": "疑問句裡用 anyone。"}, {"t": "no one", "ok": false, "fb": "問句不會用 no one 來問。"}, {"t": "everyone", "ok": false, "fb": "門口不會是「每個人」，這裡問的是有沒有人。"}]}, {"q": "____ was in the classroom. All the students went to the playground.", "opts": [{"t": "No one", "ok": true, "fb": "後面說學生都去操場了，表示教室裡一個人也沒有。"}, {"t": "Everyone", "ok": false, "fb": "後面說學生都去操場，教室裡不會有每個人。"}, {"t": "Anyone", "ok": false, "fb": "anyone 不會放在句首當肯定句的主詞。"}, {"t": "Someone", "ok": false, "fb": "後面說學生都去操場了，和「有某個人在」矛盾。"}]}, {"q": "I have ____ to tell you. Can we talk after class?", "opts": [{"t": "something important", "ok": true, "fb": "這是肯定句用 something，形容詞放後面。"}, {"t": "important something", "ok": false, "fb": "形容詞要放在 something 後面。"}, {"t": "anything important", "ok": false, "fb": "這是肯定句，用 something。"}, {"t": "nothing important", "ok": false, "fb": "意思會變成沒什麼重要的事，和「想談一談」矛盾。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "Everybody likes the new teacher.", "ok": false, "fb": "這句是對的。Everybody 當單數，動詞加 s。"}, {"t": "I don't have nothing to say.", "ok": true, "fb": "這句錯了。一句話不能有兩個否定，要改成 anything 或拿掉 don't。"}, {"t": "Is there anything wrong with your phone?", "ok": false, "fb": "這句是對的。疑問句用 anything，形容詞放後面。"}, {"t": "Nobody knows the answer.", "ok": false, "fb": "這句是對的。Nobody 本身就是否定，動詞用肯定形式。"}]}, {"q": "____ wrong with the computer. ____ can turn it on.", "opts": [{"t": "Something is / No one", "ok": true, "fb": "something 當單數主詞配 is；沒有人能開機用 No one。"}, {"t": "Something are / No one", "ok": false, "fb": "something 是單數，要用 is。"}, {"t": "Anything is / Everyone", "ok": false, "fb": "肯定句用 something；而且如果每個人都能開機就不算故障。"}, {"t": "Something is / Anyone", "ok": false, "fb": "前半對了，但 anyone 不能放在句首當肯定句的主詞。"}]}], "kkN": 0, "stars": 0, "listenN": 1, "kk": [{"kind": "listen", "src": "107 年會考聽力 第 7 題", "audio": "../audio/107-07.mp3", "q": "聽一聽，選出最適合的回應。", "script": "Can we watch something else? This TV program is terrible.", "opts": [{"t": "When will it start?", "ok": false, "fb": "對方覺得節目很爛想換台，不是問幾點開始。"}, {"t": "Do we need a new TV?", "ok": false, "fb": "爛的是節目，不是電視。"}, {"t": "What do you want to watch?", "ok": true, "fb": "something else（別的東西）→ 那你想看什麼？"}]}, {"kind": "rw", "src": "會考風格改寫", "q": "I'm hungry. Is there ＿＿＿ to eat in the fridge?", "opts": [{"t": "something", "ok": false, "fb": "問句裡通常用 anything。"}, {"t": "nothing", "ok": false, "fb": "nothing 是「什麼都沒有」，放在問句裡意思不通。"}, {"t": "anything", "ok": true, "fb": "問句用 anything：冰箱裡有什麼可以吃的嗎？"}, {"t": "everything", "ok": false, "fb": "everything 是「每樣東西」。"}]}, {"kind": "rw", "src": "會考風格改寫", "q": "I knocked on the door, but ＿＿＿ answered. The house was empty.", "opts": [{"t": "somebody", "ok": false, "fb": "房子是空的，所以「沒有人」應門。"}, {"t": "nobody", "ok": true, "fb": "The house was empty → 沒有人應門：nobody。"}, {"t": "anybody", "ok": false, "fb": "anybody 要搭配否定字，這裡沒有 not。"}, {"t": "everybody", "ok": false, "fb": "房子是空的。"}]}]}, {"id": "adj-degree", "title": "形容詞的級", "unit": "第四冊 Unit 10 · B4 L3–4", "points": "<p>形容詞有三個等級：<strong>原級</strong>（一樣）、<strong>比較級</strong>（比較）、<strong>最高級</strong>（最）。先看句子裡有沒有 than 或 the，就知道要用哪一級。</p><h3>三個等級的句型</h3><table><tr><th>等級</th><th>句型</th><th>例子</th></tr><tr><td>原級</td><td class=\"en\">as + 原級 + as</td><td class=\"en\">Ted is <span class=\"k1\">as tall as</span> Amy.</td></tr><tr><td>比較級</td><td class=\"en\">比較級 + than</td><td class=\"en\">Ted is <span class=\"k2\">taller than</span> Amy.</td></tr><tr><td>最高級</td><td class=\"en\">the + 最高級</td><td class=\"en\">Ted is <span class=\"k3\">the tallest</span> in our class.</td></tr></table><h3>變化規則</h3><table><tr><th>情況</th><th>比較級</th><th>最高級</th></tr><tr><td>短的形容詞</td><td class=\"en\">tall → tall<span class=\"k2\">er</span></td><td class=\"en\">tall<span class=\"k3\">est</span></td></tr><tr><td>字尾是 e</td><td class=\"en\">nice → nice<span class=\"k2\">r</span></td><td class=\"en\">nice<span class=\"k3\">st</span></td></tr><tr><td>子音 + y</td><td class=\"en\">easy → eas<span class=\"k2\">ier</span></td><td class=\"en\">eas<span class=\"k3\">iest</span></td></tr><tr><td>短母音＋單子音</td><td class=\"en\">hot → ho<span class=\"k2\">tter</span></td><td class=\"en\">ho<span class=\"k3\">ttest</span></td></tr><tr><td>長的形容詞</td><td class=\"en\"><span class=\"k2\">more</span> interesting</td><td class=\"en\"><span class=\"k3\">most</span> interesting</td></tr></table><h3>不規則變化</h3><p class=\"en\">good / well → <span class=\"k1\">better</span> → <span class=\"k1\">best</span><br>bad → <span class=\"k1\">worse</span> → <span class=\"k1\">worst</span><br>many / much → <span class=\"k1\">more</span> → <span class=\"k1\">most</span></p><h3>最高級後面：in 還是 of</h3><p class=\"en\">the tallest <span class=\"k1\">in</span> my class　→ in + 地方、團體<br>the tallest <span class=\"k2\">of</span> the three boys　→ of + 數量、複數</p><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">He is more taller than me.</span>　→ 不能同時用 more 和 -er</p><p class=\"en\"><span class=\"bad\">She is tallest girl.</span>　→ 最高級前面要加 the</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">as taller as</span>　→ as...as 中間用原級</p></div>", "questions": [{"q": "Ted is two years older, so he is ____ than his little brother.", "opts": [{"t": "tall", "ok": false, "fb": "句子裡有 than，要用比較級。"}, {"t": "taller", "ok": true, "fb": "有 than 就用比較級，tall 加 er。"}, {"t": "tallest", "ok": false, "fb": "最高級不會和 than 一起用。"}, {"t": "more tall", "ok": false, "fb": "tall 是短形容詞，直接加 er，不用 more。"}]}, {"q": "Amy is ____ student in our class. She always gets the highest score.", "opts": [{"t": "smarter", "ok": false, "fb": "句子裡沒有 than，而且 in our class 表示範圍，要用最高級。"}, {"t": "the smartest", "ok": true, "fb": "in our class 表示在某個範圍內最⋯⋯，用最高級且前面加 the。"}, {"t": "smartest", "ok": false, "fb": "最高級前面要加 the。"}, {"t": "the most smart", "ok": false, "fb": "smart 是短形容詞，直接加 est。"}]}, {"q": "This book is ____ than the one I read last week.", "opts": [{"t": "interestinger", "ok": false, "fb": "interesting 是長形容詞，不能直接加 er。"}, {"t": "more interesting", "ok": true, "fb": "音節多的長形容詞，比較級用 more。"}, {"t": "most interesting", "ok": false, "fb": "句子裡有 than，要用比較級不是最高級。"}, {"t": "more interestinger", "ok": false, "fb": "more 和 er 不能同時使用。"}]}, {"q": "The food here is ____ than the food at that restaurant.", "opts": [{"t": "gooder", "ok": false, "fb": "good 是不規則變化，比較級是 better。"}, {"t": "better", "ok": true, "fb": "good 的比較級是 better，屬於不規則變化。"}, {"t": "more good", "ok": false, "fb": "good 有自己的不規則變化，不用 more。"}, {"t": "best", "ok": false, "fb": "句子裡有 than，要用比較級。"}]}, {"q": "Ted is ____ his sister. They are both 160 centimeters tall.", "opts": [{"t": "as tall as", "ok": true, "fb": "兩人一樣高，用 as + 原級 + as。"}, {"t": "as taller as", "ok": false, "fb": "as...as 中間要用原級，不用比較級。"}, {"t": "taller than", "ok": false, "fb": "兩個人一樣高，不是比較高。"}, {"t": "as tallest as", "ok": false, "fb": "as...as 中間用原級。"}]}, {"q": "Judy is the youngest ____ the four sisters in her family.", "opts": [{"t": "in", "ok"
