: false, "fb": "後面是「四個姊妹」這種數量，要用 of。"}, {"t": "of", "ok": true, "fb": "最高級後面接數量或複數時用 of。"}, {"t": "at", "ok": false, "fb": "最高級後面只用 in 或 of。"}, {"t": "than", "ok": false, "fb": "than 用在比較級，不用在最高級。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "My bag is heavier than yours.", "ok": false, "fb": "這句是對的。heavy 的 y 前面是子音，改成 ier。"}, {"t": "He runs more faster than me.", "ok": true, "fb": "這句錯了。more 和 er 不能同時用，應該是 faster。"}, {"t": "This is the hottest day of the year.", "ok": false, "fb": "這句是對的。hot 要重複 t 再加 est。"}, {"t": "Math is as difficult as English for me.", "ok": false, "fb": "這句是對的。as...as 中間用原級。"}]}, {"q": "Today is ____ than yesterday, but last Sunday was ____ day of this month.", "opts": [{"t": "hotter / the hottest", "ok": true, "fb": "有 than 用比較級；of this month 表示範圍，用最高級加 the。"}, {"t": "hot / the hottest", "ok": false, "fb": "前半有 than，要用比較級 hotter。"}, {"t": "hotter / hottest", "ok": false, "fb": "前半對了，但最高級前面要加 the。"}, {"t": "the hottest / hotter", "ok": false, "fb": "兩個放反了。有 than 的那半要用比較級。"}]}], "kkN": 3, "stars": 2, "listenN": 0, "kk": [{"kind": "orig", "src": "109 年會考 第 15 題", "q": "For Mike, the price is ＿＿＿ important thing when he shops for jeans. He cares even more about the shape and the size of the pockets.", "opts": [{"t": "the more", "ok": false, "fb": "the more 不能這樣直接放在名詞前當「最」。"}, {"t": "the most", "ok": false, "fb": "the most 是「最重要」，但後面說他更在意形狀和口袋。"}, {"t": "the less", "ok": false, "fb": "the less 不能這樣用在單一事物前面。"}, {"t": "the least", "ok": true, "fb": "他更在意形狀和口袋，所以價格是「最不重要」的：the least。"}]}, {"kind": "orig", "src": "111 年會考 第 10 題", "q": "Bob is ＿＿＿ of the boys in the family. He never does any housework. His brothers at least take out the garbage sometimes.", "opts": [{"t": "lazier", "ok": false, "fb": "lazier 是比較級，比較兩個時用，這裡是「家裡所有男孩之中」。"}, {"t": "the lazy", "ok": false, "fb": "the lazy 不能接 of the boys 表示「最懶」。"}, {"t": "the lazier", "ok": false, "fb": "比較級前面通常不加 the，而且這裡是很多人比較。"}, {"t": "the laziest", "ok": true, "fb": "of the boys in the family（在所有男孩之中）是最高級的線索：the laziest。"}]}, {"kind": "orig", "src": "112 年會考 第 18 題", "q": "Business at Jane's shop has not been good these days. And the new supermarket across the street only makes things ＿＿＿.", "opts": [{"t": "easier", "ok": false, "fb": "easier（更容易）是好事，和生意不好的語氣相反。"}, {"t": "worse", "ok": true, "fb": "生意已經不好，對面又開了新超市，讓情況「更糟」：worse。"}, {"t": "more boring", "ok": false, "fb": "more boring 和生意好壞無關。"}, {"t": "more convenient", "ok": false, "fb": "more convenient（更方便）是好事，和前面的語氣相反。"}]}, {"kind": "rw", "src": "仿 111 年第 10 題", "q": "Kevin runs very fast. He is ＿＿＿ runner in our class. No one can catch him.", "opts": [{"t": "faster", "ok": false, "fb": "比較級用在兩個之間，這裡是全班。"}, {"t": "the fast", "ok": false, "fb": "the fast 不是最高級。"}, {"t": "fastest", "ok": false, "fb": "最高級前面要加 the。"}, {"t": "the fastest", "ok": true, "fb": "in our class、No one can catch him → 最高級：the fastest。"}]}]}, {"id": "causative", "title": "使役動詞與感官動詞", "unit": "第四冊 Unit 10 · B4 L3–4", "points": "<p>這兩類動詞有一個共同的特徵：<strong>後面接「受詞 + 原形動詞」，中間不加 to</strong>。</p><h3>使役動詞：叫某人做某事</h3><div class=\"formula\"><span class=\"tag k1\">make / let / have</span><span class=\"plus\">+</span><span class=\"tag k0\">人</span><span class=\"plus\">+</span><span class=\"tag k2\">原形動詞</span></div><table><tr><td class=\"en\">make</td><td>強迫、使得</td><td class=\"en\">My mom <span class=\"k1\">made</span> me <span class=\"k2\">clean</span> my room.</td></tr><tr><td class=\"en\">let</td><td>允許</td><td class=\"en\">My dad <span class=\"k1\">lets</span> me <span class=\"k2\">play</span> games.</td></tr><tr><td class=\"en\">have</td><td>請、要求</td><td class=\"en\">I'll <span class=\"k1\">have</span> him <span class=\"k2\">call</span> you.</td></tr></table><h3>感官動詞：看到、聽到某人做某事</h3><div class=\"formula\"><span class=\"tag k1\">see / hear / watch / feel</span><span class=\"plus\">+</span><span class=\"tag k0\">人</span><span class=\"plus\">+</span><span class=\"tag k2\">原形動詞</span></div><p class=\"en\">I <span class=\"k1\">saw</span> Ted <span class=\"k2\">walk</span> into the classroom.<br>I <span class=\"k1\">heard</span> someone <span class=\"k2\">call</span> my name.</p><h3>關鍵：中間不加 to</h3><p class=\"en\">She made me <span class=\"k2\">wait</span>.　<span class=\"bad\">made me to wait</span><br>I saw him <span class=\"k2\">leave</span>.　<span class=\"bad\">saw him to leave</span></p><p style=\"color:var(--muted);font-size:17px\">對照一下：<span class=\"en\">want / ask / tell</span> 這類動詞後面<strong>要加 to</strong>。<br><span class=\"en\">She <span class=\"k3\">told</span> me <span class=\"k3\">to wait</span>.</span></p><h3>help 兩種都可以</h3><p class=\"en\">Can you help me <span class=\"k2\">carry</span> this? = Can you help me <span class=\"k3\">to carry</span> this?</p>", "questions": [{"q": "My mother made me ____ my room before I went out.", "opts": [{"t": "clean", "ok": true, "fb": "使役動詞 make 後面接原形動詞，中間不加 to。"}, {"t": "to clean", "ok": false, "fb": "make 後面不加 to。"}, {"t": "cleaned", "ok": false, "fb": "make 後面接原形，不接過去式。"}, {"t": "cleaning", "ok": false, "fb": "使役動詞後面接原形動詞。"}]}, {"q": "My parents don't let me ____ out alone at night.", "opts": [{"t": "go", "ok": true, "fb": "let 後面接原形動詞。"}, {"t": "to go", "ok": false, "fb": "let 是使役動詞，後面不加 to。"}, {"t": "going", "ok": false, "fb": "let 後面接原形，不接 V-ing。"}, {"t": "goes", "ok": false, "fb": "let 後面用原形，不會有第三人稱單數變化。"}]}, {"q": "I heard someone ____ my name, but when I turned around, nobody was there.", "opts": [{"t": "call", "ok": true, "fb": "感官動詞 hear 後面接原形動詞。"}, {"t": "to call", "ok": false, "fb": "感官動詞後面不加 to。"}, {"t": "calls", "ok": false, "fb": "這個位置用原形動詞。"}, {"t": "to calling", "ok": false, "fb": "感官動詞後面直接接原形。"}]}, {"q": "We watched the children ____ soccer on the playground for an hour.", "opts": [{"t": "to play", "ok": false, "fb": "watch 是感官動詞，後面不加 to。"}, {"t": "play", "ok": true, "fb": "感官動詞 watch 後面接原形動詞。"}, {"t": "plays", "ok": false, "fb": "這個位置要用原形動詞。"}, {"t": "to playing", "ok": false, "fb": "感官動詞後面直接接原形。"}]}, {"q": "Excuse me, can you help me ____ this heavy box to the office?", "opts": [{"t": "carry", "ok": true, "fb": "help 後面接原形或不定詞都可以，carry 是正確的。"}, {"t": "carrying", "ok": false, "fb": "help 後面接原形或 to + 原形，不接 V-ing。"}, {"t": "carried", "ok": false, "fb": "這個位置要用原形。"}, {"t": "to carrying", "ok": false, "fb": "to 後面要接原形動詞。"}]}, {"q": "The teacher ____ us ____ quiet during the test.", "opts": [{"t": "told / to be", "ok": true, "fb": "tell 不是使役動詞，後面要接不定詞。"}, {"t": "told / be", "ok": false, "fb": "tell 後面要加 to，和 make、let 不一樣。"}, {"t": "made / to be", "ok": false, "fb": "make 後面不加 to。"}, {"t": "let / to be", "ok": false, "fb": "let 後面不加 to。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "She made me to wait for an hour.", "ok": true, "fb": "這句錯了。make 後面接原形，應該是 made me wait。"}, {"t": "I saw him leave the classroom.", "ok": false, "fb": "這句是對的。感官動詞後面接原形。"}, {"t": "My father let me use his computer.", "ok": false, "fb": "這句是對的。let 後面接原形。"}, {"t": "He asked me to close the window.", "ok": false, "fb": "這句是對的。ask 後面要接不定詞。"}]}, {"q": "My father made me ____ my homework first, and then he let me ____ TV.", "opts": [{"t": "finish / watch", "ok": true, "fb": "make 和 let 都是使役動詞，後面都接原形動詞。"}, {"t": "to finish / to watch", "ok": false, "fb": "使役動詞後面不加 to。"}, {"t": "finish / to watch", "ok": false, "fb": "前半對了，但 let 後面也不加 to。"}, {"t": "finishing / watching", "ok": false, "fb": "使役動詞後面接原形，不接 V-ing。"}]}], "kkN": 2, "stars": 2, "listenN": 0, "kk": [{"kind": "orig", "src": "111 年會考 第 16 題", "q": "David looked out of the balcony window and saw a woman get in his car ＿＿＿ away.", "opts": [{"t": "drive", "ok": false, "fb": "saw a woman get … 後面已經有一個原形動詞 get，第二個動作前要加 and。"}, {"t": "drove", "ok": false, "fb": "drove 是過去式；感官動詞 see 後面要接原形，而且要用 and 連接。"}, {"t": "and drive", "ok": true, "fb": "see + 人 + 原形 + and + 原形：看見她上車「並且」開走。"}, {"t": "and drove", "ok": false, "fb": "and 後面要和 get 對稱，用原形 drive，不是 drove。"}]}, {"kind": "orig", "src": "112 年會考 第 4 題", "q": "People got very excited when they watched Ms. Smith ＿＿＿ at the party.", "opts": [{"t": "danced", "ok": false, "fb": "watch + 人 + 原形或 V-ing，不能接過去式 danced。"}, {"t": "dancing", "ok": true, "fb": "感官動詞 watch + 人 + V-ing：看著她「正在跳舞」。"}, {"t": "has danced", "ok": false, "fb": "has danced 是完成式，不能接在感官動詞的受詞後面。"}, {"t": "to dance", "ok": false, "fb": "感官動詞後面不接 to V。"}]}, {"kind": "rw", "src": "仿 112 年第 4 題", "q": "I heard someone ＿＿＿ my name, so I turned around.", "opts": [{"t": "call", "ok": true, "fb": "感官動詞 hear + 人 + 原形（或 V-ing）：聽到有人叫我的名字。"}, {"t": "to call", "ok": false, "fb": "感官動詞後面不接 to V。"}, {"t": "called", "ok": false, "fb": "hear + 人 + 過去式不對。"}, {"t": "has called", "ok": false, "fb": "完成式不能接在受詞後面。"}]}]}, {"id": "possessive-reflexive", "title": "所有格代名詞與反身代名詞", "unit": "第四冊 Unit 9–10 · B4", "points": "<p>這兩種代名詞都用來避免重複，但功能完全不同：所有格代名詞代替「<strong>某人的東西</strong>」，反身代名詞代替「<strong>自己</strong>」。</p><h3>所有格代名詞：後面不接名詞</h3><table><tr><th>所有格形容詞</th><th>所有格代名詞</th></tr><tr><td class=\"en\">my book</td><td class=\"en\">mine</td></tr><tr><td class=\"en\">your book</td><td class=\"en\">yours</td></tr><tr><td class=\"en\">his book</td><td class=\"en\">his</td></tr><tr><td class=\"en\">her book</td><td class=\"en\">hers</td></tr><tr><td class=\"en\">our book</td><td class=\"en\">ours</td></tr><tr><td class=\"en\">their book</td><td class=\"en\">theirs</td></tr></table><p class=\"en\">This is <span class=\"k1\">my</span> bag.　→ my 後面接名詞<br>This bag is <span class=\"k2\">mine</span>.　→ mine 後面什麼都不接</p><h3>反身代名詞</h3><table><tr><td class=\"en\">myself</td><td class=\"en\">yourself</td><td class=\"en\">himself</td><td class=\"en\">herself</td></tr><tr><td class=\"en\">itself</td><td class=\"en\">ourselves</td><td class=\"en\">yourselves</td><td class=\"en\">themselves</td></tr></table><p style=\"color:var(--muted);font-size:17px\">單數結尾是 -self，複數結尾是 -selves。</p><h3>反身代名詞的三種用法</h3><table><tr><th>用法</th><th>例子</th></tr><tr><td>受詞和主詞是同一人</td><td class=\"en\">He hurt <span class=\"k1\">himself</span>.</td></tr><tr><td>加強語氣（親自）</td><td class=\"en\">I made it <span class=\"k1\">myself</span>.</td></tr><tr><td class=\"en\">by oneself（獨自）</td><td class=\"en\">She lives <span class=\"k1\">by herself</span>.</td></tr></table><p class=\"en\">He hurt <span class=\"k1\">himself</span>.　→ 傷到的是他自己<br>He hurt <span class=\"k2\">him</span>.　→ 傷到的是別人</p><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">This book is my.</span>　→ 後面沒接名詞要用 mine</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">They enjoyed themself.</span>　→ 複數要用 themselves</p></div>", "questions": [{"q": "That umbrella isn't mine. I think it's ____ .", "opts": [{"t": "her", "ok": false, "fb": "her 後面要接名詞，這裡後面沒有名詞，要用 hers。"}, {"t": "hers", "ok": true, "fb": "後面沒接名詞，用所有格代名詞 hers。"}, {"t": "herself", "ok": false, "fb": "herself 是反身代名詞，不表示「她的東西」。"}, {"t": "she", "ok": false, "fb": "she 是主格，不能表示所有。"}]}, {"q": "Be careful with the knife! Don't cut ____ .", "opts": [{"t": "you", "ok": false, "fb": "受詞和主詞是同一個人時，要用反身代名詞。"}, {"t": "yourself", "ok": true, "fb": "叫對方別切到自己，受詞和主詞同一人，用 yourself。"}, {"t": "yours", "ok": false, "fb": "yours 是「你的東西」，不是「你自己」。"}, {"t": "your", "ok": false, "fb": "your 後面要接名詞。"}]}, {"q": "The cake looks great! Did you make it ____ ?", "opts": [{"t": "yourself", "ok": true, "fb": "強調「你親自做的」，用反身代名詞加強語氣。"}, {"t": "yours", "ok": false, "fb": "yours 表示「你的東西」，語意不通。"}, {"t": "you", "ok": false, "fb": "句子已經有主詞 you 了，這裡要用反身代名詞。"}, {"t": "your", "ok": false, "fb": "your 後面要接名詞。"}]}, {"q": "My grandmother lives ____ in the countryside, but she isn't lonely.", "opts": [{"t": "by hers", "ok": false, "fb": "固定片語是 by + 反身代名詞。"}, {"t": "by herself", "ok": true, "fb": "by oneself 是「獨自」的固定說法。"}, {"t": "by her", "ok": false, "fb": "這個片語要用反身代名詞 herself。"}, {"t": "herself", "ok": false, "fb": "表示「獨自」要加上 by。"}]}, {"q": "The students enjoyed ____ very much at the school trip.", "opts": [{"t": "themself", "ok": false, "fb": "students 是複數，反身代名詞要用 themselves。"}, {"t": "themselves", "ok": true, "fb": "複數主詞的反身代名詞結尾是 -selves。"}, {"t": "them", "ok": false, "fb": "玩得開心的是他們自己，要用反身代名詞。"}, {"t": "theirs", "ok": false, "fb": "theirs 表示「他們的東西」。"}]}, {"q": "Our classroom is on the second floor. Where is ____ ?", "opts": [{"t": "your", "ok": false, "fb": "後面沒有接名詞，要用所有格代名詞 yours。"}, {"t": "yours", "ok": true, "fb": "yours 代替 your classroom，後面不接名詞。"}, {"t": "yourself", "ok": false, "fb": "問的是你們的教室，不是你自己。"}, {"t": "you", "ok": false, "fb": "問的是教室在哪裡，不是人在哪裡。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "These books are ours, not theirs.", "ok": false, "fb": "這句是對的。兩個所有格代名詞後面都沒接名詞。"}, {"t": "He looked at himself in the mirror.", "ok": false, "fb": "這句是對的。看的是他自己，用反身代名詞。"}, {"t": "This new bike is my.", "ok": true, "fb": "這句錯了。後面沒接名詞，要用 mine。"}, {"t": "We painted the wall by ourselves.", "ok": false, "fb": "這句是對的。複數用 ourselves。"}]}, {"q": "This seat is ____ , not yours. And please don't talk to ____ like that.", "opts": [{"t": "mine / me", "ok": true, "fb": "前面後面沒接名詞用 mine；介系詞 to 後面用受格 me。"}, {"t": "my / myself", "ok": false, "fb": "my 後面要接名詞；對方跟我講話，受詞不是我自己。"}, {"t": "mine / myself", "ok": false, "fb": "前半對了，但說話的是對方，受詞要用 me 不是 myself。"}, {"t": "my / me", "ok": false, "fb": "後面沒有接名詞，第一個空格要用 mine。"}]}], "kkN": 4, "stars": 3, "listenN": 0, "kk": [{"kind": "orig", "src": "108 年會考 第 6 題", "q": "The book under Mary's desk is ＿＿＿, but I don't know why it is there.", "opts": [{"t": "us", "ok": false, "fb": "us 是受格「我們」，書不會是「我們」。"}, {"t": "me", "ok": false, "fb": "me 是受格「我」，書不會是「我」。"}, {"t": "my", "ok": false, "fb": "my 是所有格，後面一定要接名詞（my book）。"}, {"t": "mine", "ok": true, "fb": "這本書是「我的」，後面沒有名詞，用所有格代名詞 mine = my book。"}]}, {"kind": "orig", "src": "109 年會考 第 6 題", "q": "My wife enjoys going to the movies with her friends, but I like to watch TV at home by ＿＿＿.", "opts": [{"t": "I", "ok": false, "fb": "by 是介系詞，後面不能接主格 I。"}, {"t": "me", "ok": false, "fb": "by me 是「被我」，不是「自己一個人」。"}, {"t": "myself", "ok": true, "fb": "by oneself = 自己一個人：by myself。"}, {"t": "mine", "ok": false, "fb": "by mine 意思是「在我的東西旁邊」，句意不通。"}]}, {"kind": "orig", "src": "113 年會考 第 20 題", "q": "I want to find another dentist because ＿＿＿ pulled out a good tooth last time I went to him.", "opts": [{"t": "I", "ok": false, "fb": "主詞是牙醫，不是「我」。"}, {"t": "me", "ok": false, "fb": "me 是受格，不能當主詞。"}, {"t": "mine", "ok": true, "fb": "mine = my dentist（我的牙醫），當主詞：我的牙醫上次拔掉了一顆好牙。"}, {"t": "myself", "ok": false, "fb": "myself 是反身代名詞，不能當主詞。"}]}, {"kind": "orig", "src": "114 年會考 第 17 題", "q": "Jane's parents are always happy to see their grandchildren, but mine ＿＿＿ less so when I visit them with my kids.", "opts": [{"t": "is", "ok": false, "fb": "mine 在這裡 = my parents（複數），不能用 is。"}, {"t": "are", "ok": true, "fb": "mine = my parents，是複數，用 are：我爸媽就沒那麼高興。"}, {"t": "do", "ok": false, "fb": "do 是助動詞，後面的 less so 是形容詞概念，要用 be 動詞。"}, {"t": "does", "ok": false, "fb": "does 是單數助動詞，而且這裡要用 be 動詞。"}]}, {"kind": "rw", "src": "仿 108 年第 6 題", "q": "Tom: Is this red umbrella yours?\nAmy: No, it's not ＿＿＿. Mine is blue.", "opts": [{"t": "my", "ok": false, "fb": "my 後面一定要接名詞。"}, {"t": "me", "ok": false, "fb": "me 是受格，雨傘不會是「我」。"}, {"t": "myself", "ok": false, "fb": "myself 是反身代名詞，這裡在說「誰的」。"}, {"t": "mine", "ok": true, "fb": "mine = my umbrella，後面沒有名詞，用所有格代名詞。"}]}]}, {"id": "adverbs", "title": "情態副詞與副詞的級", "unit": "第四冊 Unit 11 · B4 L5–6", "points": "<p>副詞用來修飾<strong>動詞</strong>，說明動作怎麼進行。形容詞則修飾名詞。考題幾乎都在考這兩者的分辨。</p><h3>形容詞變副詞</h3><table><tr><th>規則</th><th>例子</th></tr><tr><td>一般加 -ly</td><td class=\"en\">careful → careful<span class=\"k2\">ly</span></td></tr><tr><td>子音 + y 改 -ily</td><td class=\"en\">happy → happ<span class=\"k2\">ily</span>　easy → eas<span class=\"k2\">ily</span></td></tr><tr><td>字尾是 le 改 -ly</td><td class=\"en\">simple → simp<span class=\"k2\">ly</span></td></tr></table><h3>長得一樣的和特別的</h3><p class=\"en\">fast → <span class=\"k1\">fast</span>　hard → <span class=\"k1\">hard</span>　early → <span class=\"k1\">early</span>　late → <span class=\"k1\">late</span><br>good → <span class=\"k3\">well</span>　（這個最常考）</p><p class=\"en\">He is a <span class=\"k0\">good</span> singer.　→ 形容詞修飾名詞<br>He sings <span class=\"k3\">well</span>.　→ 副詞修飾動詞</p><h3>怎麼判斷該用哪個</h3><p>看它在修飾什麼：修飾<strong>名詞</strong>用形容詞，修飾<strong>動詞</strong>用副詞。</p><p class=\"en\">She is a <span class=\"k0\">careful</span> driver.　<span class=\"k0\">（修飾 driver）</span><br>She drives <span class=\"k2\">carefully</span>.　<span class=\"k2\">（修飾 drives）</span></p><h3>副詞的比較級與最高級</h3><table><tr><th>副詞類型</th><th>比較級</th><th>最高級</th></tr><tr><td class=\"en\">-ly 的副詞</td><td class=\"en\"><span class=\"k2\">more</span> carefully</td><td class=\"en\"><span class=\"k3\">most</span> carefully</td></tr><tr><td class=\"en\">fast, hard, early</td><td class=\"en\">fast<span class=\"k2\">er</span></td><td class=\"en\">fast<span class=\"k3\">est</span></td></tr><tr><td class=\"en\">well</td><td class=\"en\"><span class=\"k1\">better</span></td><td class=\"en\"><span class=\"k1\">best</span></td></tr></table>", "questions": [{"q": "Please listen ____ . I will only say it once.", "opts": [{"t": "careful", "ok": false, "fb": "這裡修飾的是動詞 listen，要用副詞。"}, {"t": "carefully", "ok": true, "fb": "修飾動詞 listen，用副詞 carefully。"}, {"t": "care", "ok": false, "fb": "care 是名詞或動詞，不能修飾另一個動詞。"}, {"t": "carefuly", "ok": false, "fb": "拼錯了，careful 加 ly 是 carefully，兩個 l。"}]}, {"q": "My brother is a ____ swimmer. He swims very ____ .", "opts": [{"t": "good / well", "ok": true, "fb": "修飾名詞 swimmer 用形容詞 good；修飾動詞 swims 用副詞 well。"}, {"t": "well / good", "ok": false, "fb": "兩個放反了。名詞前用形容詞，動詞後用副詞。"}, {"t": "good / good", "ok": false, "fb": "後半修飾的是動詞 swims，要用副詞 well。"}, {"t": "well / well", "ok": false, "fb": "前半修飾名詞 swimmer，要用形容詞 good。"}]}, {"q": "The children smiled ____ when they saw the presents.", "opts": [{"t": "happy", "ok": false, "fb": "修飾動詞 smiled 要用副詞。"}, {"t": "happily", "ok": true, "fb": "happy 的 y 前面是子音，改成 happily。"}, {"t": "happyly", "ok": false, "fb": "拼錯了。子音＋y 要改成 ily。"}, {"t": "happiness", "ok": false, "fb": "這是名詞，不能修飾動詞。"}]}, {"q": "Ted runs ____ than anyone else in our class.", "opts": [{"t": "more fast", "ok": false, "fb": "fast 是短副詞，直接加 er。"}, {"t": "faster", "ok": true, "fb": "fast 的副詞和形容詞長得一樣，比較級直接加 er。"}, {"t": "more faster", "ok": false, "fb": "more 和 er 不能同時使用。"}, {"t": "fastly", "ok": false, "fb": "沒有 fastly 這個字，fast 本身就是副詞。"}]}, {"q": "My sister sings ____ than I do, so she joined the school choir.", "opts": [{"t": "gooder", "ok": false, "fb": "修飾動詞要用副詞 well，而且 good 的變化是不規則的。"}, {"t": "better", "ok": true, "fb": "well 的比較級是 better，修飾動詞 sings。"}, {"t": "more well", "ok": false, "fb": "well 有自己的不規則變化 better。"}, {"t": "best", "ok": false, "fb": "句子裡有 than，要用比較級。"}]}, {"q": "You should drive ____ in the rain. The road is slippery.", "opts": [{"t": "more slowly", "ok": true, "fb": "slowly 是 -ly 結尾的副詞，比較級用 more。"}, {"t": "slowlier", "ok": false, "fb": "-ly 結尾的副詞不加 er，要用 more。"}, {"t": "more slow", "ok": false, "fb": "修飾動詞 drive 要用副詞 slowly。"}, {"t": "most slowly", "ok": false, "fb": "這裡是比較而不是最高級。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "She speaks English very well.", "ok": false, "fb": "這句是對的。修飾動詞 speaks 用副詞 well。"}, {"t": "He is a careful student.", "ok": false, "fb": "這句是對的。修飾名詞 student 用形容詞。"}, {"t": "The old man walked slow to the park.", "ok": true, "fb": "這句錯了。修飾動詞 walked 要用副詞 slowly。"}, {"t": "My father gets up early every day.", "ok": false, "fb": "這句是對的。early 本身就是副詞。"}]}, {"q": "Amy worked ____ on the project, and she finished it ____ than the others.", "opts": [{"t": "hard / earlier", "ok": true, "fb": "hard 本身就是副詞；early 的比較級是 earlier。"}, {"t": "hardly / earlier", "ok": false, "fb": "hardly 的意思是「幾乎不」，和努力工作的意思相反。"}, {"t": "hard / more early", "ok": false, "fb": "前半對了，但 early 是短副詞，比較級直接加 ier。"}, {"t": "hardly / more early", "ok": false, "fb": "兩個都錯。hardly 是「幾乎不」，而 early 的比較級是 earlier。"}]}], "kkN": 0, "stars": 0, "listenN": 0, "kk": [{"kind": "rw", "src": "會考風格改寫", "q": "The old man walked ＿＿＿ because his legs hurt.", "opts": [{"t": "slowly", "ok": true, "fb": "形容「走」的方式要用副詞：slowly。"}, {"t": "slow", "ok": false, "fb": "slow 是形容詞，不能形容動詞 walked。"}, {"t": "quickly", "ok": false, "fb": "腳痛走不快。"}, {"t": "quick", "ok": false, "fb": "quick 是形容詞，意思也不對。"}]}, {"kind": "rw", "src": "會考風格改寫", "q": "Sam speaks English ＿＿＿ than his sister. He lived in the US for five years.", "opts": [{"t": "good", "ok": false, "fb": "形容「說」要用副詞，而且有 than 要用比較級。"}, {"t": "better", "ok": true, "fb": "well 的比較級是 better：說得比妹妹好。"}, {"t": "more well", "ok": false, "fb": "well 的比較級是 better。"}, {"t": "best", "ok": false, "fb": "有 than 用比較級，不是最高級。"}]}]}, {"id": "indefinite-pronouns", "title": "不定代名詞與數量代名詞", "unit": "第四冊 Unit 11 · B4 L5–6", "points": "<p>這類代名詞用來<strong>代替前面提過的名詞</strong>，避免一直重複同一個字。</p><h3>one 和 ones</h3><p class=\"en\">This bag is too big. Do you have a smaller <span class=\"k1\">one</span>?　→ 代替單數 bag<br>These shoes are too small. I want bigger <span class=\"k1\">ones</span>.　→ 代替複數 shoes</p><p style=\"color:var(--muted);font-size:17px\">one 代替<strong>同類但不同個</strong>的東西；it 代替<strong>同一個</strong>東西。<br><span class=\"en\">I lost my pen. I'll buy a new <span class=\"k1\">one</span>.</span>（買另一枝）<br><span class=\"en\">I lost my pen. I found <span class=\"k2\">it</span> later.</span>（找回同一枝）</p><h3>another 和 the other</h3><table><tr><th>用法</th><th>意思</th><th>例子</th></tr><tr><td class=\"en\">another</td><td>再一個（還有很多）</td><td class=\"en\">This is too small. Show me <span class=\"k1\">another</span>.</td></tr><tr><td class=\"en\">the other</td><td>剩下的那一個（只有兩個）</td><td class=\"en\">I have two pens. One is red; <span class=\"k2\">the other</span> is blue.</td></tr><tr><td class=\"en\">the others</td><td>剩下的全部</td><td class=\"en\">Two are mine; <span class=\"k2\">the others</span> are hers.</td></tr></table><h3>數量代名詞</h3><p class=\"en\">I have three brothers. <span class=\"k3\">All of them</span> like sports.<br>I have two cats. <span class=\"k3\">Both of them</span> are black.<br><span class=\"k3\">None of them</span> came to the party.</p><table><tr><td class=\"en\">both</td><td>兩個都</td></tr><tr><td class=\"en\">all</td><td>三個以上全部</td></tr><tr><td class=\"en\">none</td><td>一個也沒有</td></tr><tr><td class=\"en\">some</td><td>其中一些</td></tr></table>", "questions": [{"q": "This shirt is too big for me. Do you have a smaller ____ ?", "opts": [{"t": "it", "ok": false, "fb": "it 指同一件衣服，但這裡要的是另一件比較小的。"}, {"t": "one", "ok": true, "fb": "one 代替同類但不同件的東西。"}, {"t": "ones", "ok": false, "fb": "shirt 是單數，要用 one。"}, {"t": "other", "ok": false, "fb": "other 不能單獨這樣用，而且這裡用 one 就可以。"}]}, {"q": "These shoes are too small. Could you show me some bigger ____ ?", "opts": [{"t": "one", "ok": false, "fb": "shoes 是複數，要用 ones。"}, {"t": "ones", "ok": true, "fb": "代替複數名詞要用 ones。"}, {"t": "it", "ok": false, "fb": "it 指的是同一雙鞋，而且是單數。"}, {"t": "them", "ok": false, "fb": "them 指的是同樣那幾雙，這裡要的是別雙。"}]}, {"q": "I have two sisters. One is a teacher, and ____ is a nurse.", "opts": [{"t": "another", "ok": false, "fb": "only 兩個人的時候，剩下的那一個要用 the other。"}, {"t": "the other", "ok": true, "fb": "總共兩個，說完一個之後剩下的那一個用 the other。"}, {"t": "other", "ok": false, "fb": "other 不能單獨當代名詞用，要加 the。"}, {"t": "the others", "ok": false, "fb": "the others 指剩下的「全部」，但這裡只剩一個人。"}]}, {"q": "This cake is delicious. Can I have ____ piece?", "opts": [{"t": "the other", "ok": false, "fb": "the other 用在只剩最後一個的情況，這裡還有很多。"}, {"t": "another", "ok": true, "fb": "再要一個、而且還有很多，用 another。"}, {"t": "other", "ok": false, "fb": "other 後面接單數名詞時要加 the 或 an。"}, {"t": "the others", "ok": false, "fb": "the others 是複數，後面不接單數名詞 piece。"}]}, {"q": "I have two dogs, and ____ of them are very friendly.", "opts": [{"t": "all", "ok": false, "fb": "只有兩隻的時候用 both，all 用在三個以上。"}, {"t": "both", "ok": true, "fb": "剛好兩隻都很友善，用 both。"}, {"t": "none", "ok": false, "fb": "none 是一隻也沒有，和句意相反。"}, {"t": "another", "ok": false, "fb": "another 是「再一個」，不能用在這個句型。"}]}, {"q": "I invited ten friends, but ____ of them came. I was really disappointed.", "opts": [{"t": "all", "ok": false, "fb": "後面說很失望，表示沒有人來。"}, {"t": "none", "ok": true, "fb": "一個也沒來，用 none，正好對應後面的失望。"}, {"t": "both", "ok": false, "fb": "both 用在剛好兩個的情況，這裡有十個人。"}, {"t": "another", "ok": false, "fb": "another 不能用在這個句型。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "There are five eggs. Some of them are broken.", "ok": false, "fb": "這句是對的。some of them 表示其中一些。"}, {"t": "I lost my key. I have to buy a new one.", "ok": false, "fb": "這句是對的。one 代替同類的另一把鑰匙。"}, {"t": "I have two pens. One is red, and another is black.", "ok": true, "fb": "這句錯了。總共只有兩枝，剩下的那一枝要用 the other。"}, {"t": "These apples are small. I want bigger ones.", "ok": false, "fb": "這句是對的。複數用 ones。"}]}, {"q": "There are thirty students in my class. ____ of them are girls, and ____ are boys.", "opts": [{"t": "Some / the others", "ok": true, "fb": "其中一些是女生用 Some；剩下的全部是男生用 the others。"}, {"t": "Some / another", "ok": false, "fb": "剩下的是一群人，要用 the others。"}, {"t": "Both / the others", "ok": false, "fb": "全班有三十個人，Both 只能用在剛好兩個的情況。"}, {"t": "None / the others", "ok": false, "fb": "None 表示一個也沒有，和後面的句子矛盾。"}]}], "kkN": 3, "stars": 2, "listenN": 0, "kk": [{"kind": "orig", "src": "109 年會考 第 13 題", "q": "Ms. Johnson has been taking phone calls since she entered the office this morning. Just when she thought she could finally leave work, ＿＿＿ call came in.", "opts": [{"t": "another", "ok": true, "fb": "一整天接了很多通，正要下班時「又來一通」：another（再一個）。"}, {"t": "each", "ok": false, "fb": "each 是「每一個」，後面要接單數名詞，但句意不是「每一通」。"}, {"t": "the next", "ok": false, "fb": "the next 是「下一個」，要有排好的順序，這裡是突然又來一通。"}, {"t": "the other", "ok": false, "fb": "the other 用在只有兩個時的「另一個」，但她接了很多通。"}]}, {"kind": "orig", "src": "111 年會考 第 18 題", "q": "Buses to the airport only come once every hour, and we just missed ＿＿＿. Why don't we take a taxi?", "opts": [{"t": "another", "ok": false, "fb": "another 是「另一班」，但我們錯過的是剛剛那班。"}, {"t": "it", "ok": false, "fb": "it 指「特定的那一個」，前面說的是 buses（複數、不特定）。"}, {"t": "one", "ok": true, "fb": "one 代替前面提過的同一類東西中的「一個」：剛錯過一班。"}, {"t": "them", "ok": false, "fb": "them 是複數，我們只錯過一班。"}]}, {"kind": "orig", "src": "114 年會考 第 8 題", "q": "Mr. and Mrs. Wu have three daughters. Two are in high school, and ＿＿＿ is in elementary school.", "opts": [{"t": "each", "ok": false, "fb": "each 是「每一個」，但只講剩下的那一個。"}, {"t": "the other", "ok": true, "fb": "三個女兒，兩個講完了，剩下的「最後一個」用 the other。"}, {"t": "the one", "ok": false, "fb": "the one 要接說明（the one who…），這裡沒有。"}, {"t": "the next", "ok": false, "fb": "the next 是「下一個」，要有順序，這裡是剩下的那一個。"}]}, {"kind": "rw", "src": "仿 114 年第 8 題", "q": "I have two pens. One is black, and ＿＿＿ is red.", "opts": [{"t": "another", "ok": false, "fb": "another 用在三個以上的「另一個」；只有兩支筆時用 the other。"}, {"t": "the other", "ok": true, "fb": "兩支筆，一支講完了，剩下的那一支：the other。"}, {"t": "others", "ok": false, "fb": "others 是複數，這裡只剩一支。"}, {"t": "one", "ok": false, "fb": "one 不能表示「剩下的那一個」。"}]}]}, {"id": "spend-cost-take", "title": "花費動詞 spend / take / cost / pay", "unit": "第四冊 Unit 11 · B4 L5–6", "points": "<p>這四個動詞都在講「花費」，差別在<strong>主詞是誰</strong>，以及<strong>花的是時間還是錢</strong>。先看主詞，答案就出來了。</p><h3>四個句型</h3><table><tr><th>動詞</th><th>主詞</th><th>句型</th></tr><tr><td class=\"en\">spend</td><td>人</td><td class=\"en\">人 + spend + 時間/錢 + <span class=\"k1\">on</span> 名詞</td></tr><tr><td class=\"en\">take</td><td class=\"k2\">It</td><td class=\"en\">It + take + 人 + 時間 + <span class=\"k1\">to</span> 原形</td></tr><tr><td class=\"en\">cost</td><td>物</td><td class=\"en\">物 + cost + 人 + 錢</td></tr><tr><td class=\"en\">pay</td><td>人</td><td class=\"en\">人 + pay + 錢 + <span class=\"k1\">for</span> 物</td></tr></table><h3>例句對照</h3><p class=\"en\">I <span class=\"k1\">spent</span> two hours <span class=\"k3\">on</span> my homework.<br>I <span class=\"k1\">spent</span> 500 dollars <span class=\"k3\">on</span> this book.<br><span class=\"k2\">It took</span> me two hours <span class=\"k3\">to finish</span> my homework.<br>This book <span class=\"k1\">cost</span> me 500 dollars.<br>I <span class=\"k1\">paid</span> 500 dollars <span class=\"k3\">for</span> this book.</p><p style=\"color:var(--muted);font-size:17px\">同一件事可以用四種說法，但主詞和介系詞要跟著換。</p><h3>spend 的另一種用法</h3><p class=\"en\">I spent two hours <span class=\"k2\">doing</span> my homework.</p><p>spend 後面接動作時，用 <strong>V-ing</strong>，不是不定詞。</p><h3>過去式</h3><p class=\"en\">spend → <span class=\"k1\">spent</span>　take → <span class=\"k1\">took</span><br>cost → <span class=\"k1\">cost</span>（不變）　pay → <span class=\"k1\">paid</span></p><div class=\"warn\"><strong>最容易被扣分的地方</strong><p class=\"en\"><span class=\"bad\">I spent two hours to do my homework.</span>　→ spend 後面接 V-ing</p><p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">It costs me two hours.</span>　→ cost 用在錢，時間要用 take</p></div>", "questions": [{"q": "It ____ me about forty minutes to ride my bike to school.", "opts": [{"t": "takes", "ok": true, "fb": "主詞是 It、花的是時間，用 take。"}, {"t": "spends", "ok": false, "fb": "spend 的主詞要是人，不是 It。"}, {"t": "costs", "ok": false, "fb": "cost 用在花錢，而且主詞要是物品。"}, {"t": "pays", "ok": false, "fb": "pay 的主詞是人，而且用在花錢。"}]}, {"q": "This new smartphone ____ me twenty thousand dollars.", "opts": [{"t": "took", "ok": false, "fb": "take 的主詞是 It，而且用在時間。"}, {"t": "cost", "ok": true, "fb": "主詞是物品、花的是錢，用 cost。過去式也是 cost。"}, {"t": "spent", "ok": false, "fb": "spend 的主詞要是人。"}, {"t": "paid", "ok": false, "fb": "pay 的主詞要是人，不是手機。"}]}, {"q": "My sister ____ three hours ____ her science project last night.", "opts": [{"t": "spent / on", "ok": true, "fb": "主詞是人用 spend，後面接名詞時用介系詞 on。"}, {"t": "spent / for", "ok": false, "fb": "spend 後面接名詞時用 on，不是 for。"}, {"t": "took / on", "ok": false, "fb": "take 的主詞是 It，不是人。"}, {"t": "cost / on", "ok": false, "fb": "cost 的主詞是物品，而且用在錢。"}]}, {"q": "I ____ five hundred dollars ____ this pair of shoes.", "opts": [{"t": "paid / for", "ok": true, "fb": "主詞是人用 pay，後面接物品時用介系詞 for。"}, {"t": "paid / on", "ok": false, "fb": "pay 後面接物品時用 for，用 on 的是 spend。"}, {"t": "cost / for", "ok": false, "fb": "cost 的主詞要是物品，不是人。"}, {"t": "took / for", "ok": false, "fb": "take 用在花時間，主詞是 It。"}]}, {"q": "Ted spent the whole afternoon ____ computer games.", "opts": [{"t": "to play", "ok": false, "fb": "spend 後面接動作時要用 V-ing。"}, {"t": "playing", "ok": true, "fb": "spend + 時間 + V-ing，這是固定用法。"}, {"t": "play", "ok": false, "fb": "spend 後面接動作要用 V-ing。"}, {"t": "played", "ok": false, "fb": "spend 後面接的是動名詞。"}]}, {"q": "A: How long does it ____ to get to Taipei by train?　B: About an hour.", "opts": [{"t": "take", "ok": true, "fb": "問花多久時間用 It takes，疑問句裡用原形 take。"}, {"t": "spend", "ok": false, "fb": "spend 的主詞要是人。"}, {"t": "cost", "ok": false, "fb": "回答給的是時間，cost 用在錢。"}, {"t": "pay", "ok": false, "fb": "pay 用在花錢，而且主詞要是人。"}]}, {"q": "下列哪一句是錯的？", "opts": [{"t": "It cost me two hours to finish the report.", "ok": true, "fb": "這句錯了。花時間要用 take，cost 用在花錢。"}, {"t": "I spent two hours doing my homework.", "ok": false, "fb": "這句是對的。spend 後面接 V-ing。"}, {"t": "The ticket cost him 300 dollars.", "ok": false, "fb": "這句是對的。主詞是物品、花的是錢。"}, {"t": "She paid 50 dollars for the drink.", "ok": false, "fb": "這句是對的。pay 後面接物品用 for。"}]}, {"q": "The concert ticket ____ me 1,500 dollars, and it ____ me two hours to get to the concert hall.", "opts": [{"t": "cost / took", "ok": true, "fb": "票是物品、花的是錢用 cost；花時間用 It takes 的過去式 took。"}, {"t": "took / cost", "ok": false, "fb": "兩個放反了。錢用 cost，時間用 take。"}, {"t": "spent / took", "ok": false, "fb": "spend 的主詞要是人，不是票。"}, {"t": "cost / spent", "ok": false, "fb": "前半對了，但主詞是 it，花時間要用 took。"}]}], "kkN": 2, "stars": 2, "listenN": 0, "kk": [{"kind": "orig", "src": "107 年會考 第 10 題", "q": "It took the police lots of time ＿＿＿ who entered Liu's house and killed her one year ago.", "opts": [{"t": "and found out", "ok": false, "fb": "It takes + 人 + 時間 + to V，不能用 and 連接。"}, {"t": "find out", "ok": false, "fb": "find out 是原形，前面少了 to。"}, {"t": "finding out", "ok": false, "fb": "It takes … 句型要接 to V，不是 V-ing。"}, {"t": "to find out", "ok": true, "fb": "It took + 人 + 時間 + to V：警方花了很多時間「去查出」是誰。"}]}, {"kind": "orig", "src": "111 年會考 第 8 題", "q": "Although it took me lots of time ＿＿＿ a big meal for ten people, I was happy that everyone enjoyed it.", "opts": [{"t": "prepare", "ok": false, "fb": "prepare 是原形，前面少了 to。"}, {"t": "to prepare", "ok": true, "fb": "It took me + 時間 + to V：我花了很多時間「去準備」。"}, {"t": "preparing", "ok": false, "fb": "It takes … 句型要接 to V；V-ing 是 spend 的用法（spend time preparing）。"}, {"t": "prepared", "ok": false, "fb": "prepared 是過去式，不能放在這個位置。"}]}, {"kind": "rw", "src": "仿 111 年第 8 題", "q": "It took Grandpa two hours ＿＿＿ the old bike, but now it looks like new.", "opts": [{"t": "fix", "ok": false, "fb": "It takes + 時間 + to V，fix 前面少了 to。"}, {"t": "to fix", "ok": true, "fb": "It took + 人 + 時間 + to V：爺爺花了兩小時修腳踏車。"}, {"t": "fixing", "ok": false, "fb": "V-ing 是 spend 的用法（spent two hours fixing）。"}, {"t": "fixed", "ok": false, "fb": "過去式不能放在這裡。"}]}]}, {"id": "b5-present-perfect", "title": "現在完成式", "unit": "第五冊 Unit 12 · B5 L1–2", "points": "<p>現在完成式說的是<strong>「從過去到現在」</strong>的事：已經做完、做過幾次，或從以前一直持續到現在。</p>\n<div class=\"formula\"><span class=\"tag k1\">have / has</span><span class=\"plus\">+</span><span class=\"tag k2\">過去分詞 p.p.</span></div>\n<table><tr><th>用法</th><th>常見線索字</th><th>例句</th></tr>\n<tr><td>已經完成</td><td class=\"en\">already, yet, just</td><td class=\"en\">I <span class=\"k1\">have</span> <span class=\"k2\">finished</span> my homework.</td></tr>\n<tr><td>經驗（做過幾次）</td><td class=\"en\">ever, never, once, twice, before</td><td class=\"en\">Have you <span class=\"k2\">ever been</span> to Japan?</td></tr>\n<tr><td>持續到現在</td><td class=\"en\">for + 一段時間<br>since + 起點</td><td class=\"en\">He <span class=\"k1\">has</span> <span class=\"k2\">lived</span> here <span class=\"k1\">for</span> ten years.<br>He <span class=\"k1\">has</span> <span class=\"k2\">lived</span> here <span class=\"k1\">since</span> 2015.</td></tr></table>\n<h3>for 和 since 怎麼分</h3>\n<p><span class=\"k1\">for</span> 後面接「多久」：for two weeks、for a long time。<br><span class=\"k1\">since</span> 後面接「從什麼時候開始」：since last year、since he came to Taiwan。</p>\n<h3>否定與問句</h3>\n<p class=\"en\">I <span class=\"k1\">haven't</span> seen the movie yet.<br><span class=\"k1\">Has</span> she finished? — Yes, she <span class=\"k1\">has</span>. / No, she <span class=\"k1\">hasn't</span>.</p>\n<div class=\"warn\"><strong>最容易被扣分的地方</strong>\n<p class=\"en\"><span class=\"bad\">I have seen him yesterday.</span>　→ 有 yesterday、last week、ago 這種「明確的過去時間」，要用過去式 saw。</p>\n<p class=\"en\"><span class=\"bad\">He has lived here since ten years.</span>　→ ten years 是「多久」，要用 for。</p>\n<p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">She have gone home.</span>　→ 第三人稱單數用 has。</p></div>", "questions": [{"q": "I ＿＿＿ my homework, so I can watch TV now.", "opts": [{"t": "finish", "ok": false, "fb": "現在式說習慣，這裡是「已經寫完」。"}, {"t": "have finished", "ok": true, "fb": "已經寫完，所以現在可以看電視：have finished。"}, {"t": "am finishing", "ok": false, "fb": "正在寫就還不能看電視。"}, {"t": "will finish", "ok": false, "fb": "還沒寫完，就不能說 so I can watch TV now。"}]}, {"q": "Mr. Lin has taught English ＿＿＿ 2010.", "opts": [{"t": "for", "ok": false, "fb": "for 後面接一段時間，2010 是起點。"}, {"t": "ago", "ok": false, "fb": "ago 用在過去式，放在時間後面。"}, {"t": "since", "ok": true, "fb": "since + 起點：從 2010 年到現在。"}, {"t": "in", "ok": false, "fb": "in 2010 只說那一年，配過去式。"}]}, {"q": "We have known each other ＿＿＿ ten years.", "opts": [{"t": "for", "ok": true, "fb": "ten years 是「多久」：for ten years。"}, {"t": "since", "ok": false, "fb": "since 後面要接起點，不接一段時間。"}, {"t": "before", "ok": false, "fb": "before 不接一段時間來表示持續。"}, {"t": "ago", "ok": false, "fb": "ten years ago 是過去的時間點，要配過去式。"}]}, {"q": "A: Have you ever eaten stinky tofu?\nB: Yes, ＿＿＿. I love it!", "opts": [{"t": "I do", "ok": false, "fb": "問句用 Have，回答也用 have。"}, {"t": "I did", "ok": false, "fb": "問句用 Have，回答也用 have。"}, {"t": "I am", "ok": false, "fb": "問句用 Have，不是 be 動詞。"}, {"t": "I have", "ok": true, "fb": "Have you ever …? → Yes, I have."}]}, {"q": "My brother ＿＿＿ to Japan three times.", "opts": [{"t": "goes", "ok": false, "fb": "three times 是經驗次數，用現在完成式。"}, {"t": "has been", "ok": true, "fb": "去過幾次（經驗）→ has been to。"}, {"t": "has go", "ok": false, "fb": "has 後面要接過去分詞。"}, {"t": "is going", "ok": false, "fb": "進行式不表示去過幾次。"}]}, {"q": "Tina ＿＿＿ her keys yesterday, so she couldn't get into the house.", "opts": [{"t": "has lost", "ok": false, "fb": "yesterday 是明確的過去時間，不能用現在完成式。"}, {"t": "have lost", "ok": false, "fb": "主詞是單數，而且有 yesterday。"}, {"t": "lost", "ok": true, "fb": "yesterday → 過去式 lost。"}, {"t": "loses", "ok": false, "fb": "yesterday 是過去。"}]}, {"q": "A: Is Dad home?\nB: No, he ＿＿＿ out. He'll be back at six.", "opts": [{"t": "has gone", "ok": true, "fb": "has gone out：已經出去了（人現在不在）。"}, {"t": "has been", "ok": false, "fb": "has been out 不是「出去了還沒回來」的常用說法。"}, {"t": "goes", "ok": false, "fb": "現在式說習慣。"}, {"t": "is go", "ok": false, "fb": "is 後面不接原形。"}]}, {"q": "I haven't seen Amy ＿＿＿ she moved to Taipei.", "opts": [{"t": "for", "ok": false, "fb": "for 後面接一段時間，這裡是一個起點事件。"}, {"t": "ago", "ok": false, "fb": "ago 用在過去式。"}, {"t": "when", "ok": false, "fb": "when 不表示「從那時起一直」。"}, {"t": "since", "ok": true, "fb": "since + 子句（起點）：自從她搬到台北後就沒見過。"}]}], "kkN": 4, "stars": 3, "listenN": 2, "kk": [{"kind": "orig", "src": "109 年會考 第 7 題", "q": "For the past twenty years, my father ＿＿＿ in a school library. But he'll leave the job next month.", "opts": [{"t": "worked", "ok": false, "fb": "worked 表示已經結束的過去，但他下個月才離職，現在還在做。"}, {"t": "has worked", "ok": true, "fb": "For the past twenty years：從二十年前到現在一直在做 → 現在完成式 has worked。"}, {"t": "is working", "ok": false, "fb": "is working 只說現在正在做，不能搭配 for the past twenty years 表示持續。"}, {"t": "works", "ok": false, "fb": "works 是現在式說習慣，不能表示「做了二十年」。"}]}, {"kind": "orig", "src": "110 年會考 第 5 題", "q": "Paul misses his parents a lot. He ＿＿＿ them since he came to work in Taiwan a year ago.", "opts": [{"t": "didn't see", "ok": false, "fb": "didn't see 是過去式，不能和 since（自從…到現在）一起用。"}, {"t": "doesn't see", "ok": false, "fb": "doesn't see 是現在式，不能和 since 一起用。"}, {"t": "hasn't seen", "ok": true, "fb": "since he came to Taiwan：從那時到現在都沒見到 → hasn't seen。"}, {"t": "won't see", "ok": false, "fb": "won't see 是未來，和 since 不合。"}]}, {"kind": "orig", "src": "112 年會考 第 22 題", "q": "The new medicine that just came out on the market ＿＿＿ thousands of lives.", "opts": [{"t": "and saved", "ok": false, "fb": "句子缺主要動詞，and saved 前面沒有可以對等連接的動詞。"}, {"t": "has saved", "ok": true, "fb": "主詞 The new medicine 需要主要動詞：新藥（到目前為止）已經救了數千條人命 → has saved。"}, {"t": "saving", "ok": false, "fb": "saving 不是主要動詞，句子會沒有動詞。"}, {"t": "to save", "ok": false, "fb": "to save 不是主要動詞，句子會沒有動詞。"}]}, {"kind": "orig", "src": "113 年會考 第 15 題", "q": "I can't tell you what I think of the movie because I ＿＿＿ it. I'll probably watch it this Saturday.", "opts": [{"t": "am not seeing", "ok": false, "fb": "am not seeing 是進行式，「看過沒」要用完成式。"}, {"t": "don't see", "ok": false, "fb": "don't see 是現在式說習慣。"}, {"t": "haven't seen", "ok": true, "fb": "這週六才要看，所以「到現在還沒看過」→ haven't seen。"}, {"t": "won't see", "ok": false, "fb": "won't see 和後面「這週六可能會看」矛盾。"}]}, {"kind": "listen", "src": "113 年會考聽力 第 10 題", "audio": "../audio/113-10.mp3", "q": "聽一聽，選出最適合的回應。", "script": "Where have you decided to go for your vacation this year?", "opts": [{"t": "Sounds great. I can't wait.", "ok": false, "fb": "對方在問你決定去哪裡，不是邀請你。"}, {"t": "Yes, I have visited many interesting places.", "ok": false, "fb": "Where 問句不能用 Yes 回答。"}, {"t": "I just can't choose between Japan and France.", "ok": true, "fb": "Where have you decided …? → 還沒決定：在日本和法國之間選不出來。"}]}, {"kind": "listen", "src": "111 年會考聽力 第 11 題", "audio": "../audio/111-11.mp3", "q": "聽一聽，選出最適合的回應。", "script": "Have you spoken to Miranda? She's been trying to find you all afternoon.", "opts": [{"t": "She's busy, perhaps.", "ok": false, "fb": "對方是說 Miranda 在找你，不是問她忙不忙。"}, {"t": "There's no Miranda here.", "ok": false, "fb": "對方問的是你有沒有跟她說過話。"}, {"t": "I was looking for her, too.", "ok": true, "fb": "Have you spoken to …?（說過話了嗎？）→ 還沒，我也在找她。"}]}, {"kind": "rw", "src": "仿 110 年第 5 題", "q": "Lily ＿＿＿ her grandparents since she moved to Taipei last year. She misses them a lot.", "opts": [{"t": "didn't visit", "ok": false, "fb": "since 表示「從那時到現在」，要用完成式。"}, {"t": "doesn't visit", "ok": false, "fb": "現在式不能和 since 一起用。"}, {"t": "won't visit", "ok": false, "fb": "未來式和 since 不合。"}, {"t": "hasn't visited", "ok": true, "fb": "since she moved：從搬家到現在都沒去看 → hasn't visited。"}]}]}, {"id": "b5-emotion", "title": "情緒動詞（-ing 與 -ed）", "unit": "第五冊 Unit 12 · B5 L1–2", "points": "<p>surprise、excite、interest、bore、tire 這些「讓人有感覺」的動詞，變成形容詞時有兩種樣子。</p>\n<table><tr><th>形式</th><th>意思</th><th>通常形容</th><th>例句</th></tr>\n<tr><td><span class=\"tag k2\">-ing</span></td><td>令人…的</td><td>事情、東西</td><td class=\"en\">The movie is <span class=\"k2\">boring</span>.</td></tr>\n<tr><td><span class=\"tag k1\">-ed</span></td><td>（人）感到…的</td><td>人的感受</td><td class=\"en\">I am <span class=\"k1\">bored</span>.</td></tr></table>\n<h3>常見的一組組</h3>\n<p class=\"en\">exciting / excited　interesting / interested　surprising / surprised<br>boring / bored　tiring / tired　amazing / amazed</p>\n<h3>常見搭配</h3>\n<p class=\"en\">be interested <span class=\"k1\">in</span>　be surprised <span class=\"k1\">at</span>　be excited <span class=\"k1\">about</span>　be tired <span class=\"k1\">of</span></p>\n<div class=\"warn\"><strong>最容易被扣分的地方</strong>\n<p class=\"en\"><span class=\"bad\">I'm boring.</span>　→ 這是「我很無聊（讓別人覺得無趣）」，想說「我覺得無聊」要用 I'm bored.</p>\n<p class=\"en\" style=\"margin-bottom:0\">人也可以用 -ing：He is an interesting person.（他是個有趣的人＝讓人覺得有趣）</p></div>", "questions": [{"q": "The basketball game was very ＿＿＿. Everyone was shouting.", "opts": [{"t": "exciting", "ok": true, "fb": "比賽「令人興奮」用 -ing。"}, {"t": "excited", "ok": false, "fb": "-ed 是人感到興奮，比賽不會感到。"}, {"t": "bored", "ok": false, "fb": "大家都在叫，不是無聊。"}, {"t": "boring", "ok": false, "fb": "大家都在叫，比賽不無聊。"}]}, {"q": "I'm ＿＿＿ in history. I read history books every day.", "opts": [{"t": "interesting", "ok": false, "fb": "-ing 是「令人感興趣的」，說自己的感受用 -ed。"}, {"t": "interested", "ok": true, "fb": "be interested in：我對歷史有興趣。"}, {"t": "interest", "ok": false, "fb": "interest 是名詞或動詞，be 後面要形容詞。"}, {"t": "to interest", "ok": false, "fb": "be 後面要形容詞。"}]}, {"q": "After running for two hours, the students felt ＿＿＿.", "opts": [{"t": "tiring", "ok": false, "fb": "-ing 是「令人疲累的」，學生的感受用 -ed。"}, {"t": "tire", "ok": false, "fb": "felt 後面要形容詞。"}, {"t": "tired", "ok": true, "fb": "人感到累：tired。"}, {"t": "excited", "ok": false, "fb": "跑了兩小時，比較合理的是累。"}]}, {"q": "We were ＿＿＿ at the news. No one thought it could happen.", "opts": [{"t": "surprising", "ok": false, "fb": "人的感受用 -ed。"}, {"t": "surprise", "ok": false, "fb": "be 後面要形容詞。"}, {"t": "bored", "ok": false, "fb": "No one thought it could happen 表示驚訝，不是無聊。"}, {"t": "surprised", "ok": true, "fb": "be surprised at：對消息感到驚訝。"}]}, {"q": "This book is so ＿＿＿ that I fell asleep.", "opts": [{"t": "boring", "ok": true, "fb": "書「令人無聊」：boring，所以我睡著了。"}, {"t": "bored", "ok": false, "fb": "-ed 是人的感受，書不會感到無聊。"}, {"t": "interesting", "ok": false, "fb": "有趣的書不會讓人睡著。"}, {"t": "interested", "ok": false, "fb": "-ed 是人的感受。"}]}, {"q": "Ben is an ＿＿＿ person. He always tells funny stories.", "opts": [{"t": "interested", "ok": false, "fb": "-ed 是「感到有興趣的」，這裡要說他讓人覺得有趣。"}, {"t": "interesting", "ok": true, "fb": "他是個「有趣的（令人感興趣的）」人。"}, {"t": "bored", "ok": false, "fb": "會講好笑故事的人不是感到無聊。"}, {"t": "boring", "ok": false, "fb": "會講好笑故事的人不無聊。"}]}, {"q": "Are you ＿＿＿ about the school trip next week?", "opts": [{"t": "exciting", "ok": false, "fb": "問人的感受用 -ed。"}, {"t": "excite", "ok": false, "fb": "be 後面要形容詞。"}, {"t": "excited", "ok": true, "fb": "be excited about：對校外教學感到興奮嗎？"}, {"t": "tiring", "ok": false, "fb": "tiring 不能接 about 表示期待。"}]}, {"q": "The kids are tired ＿＿＿ eating the same food every day.", "opts": [{"t": "in", "ok": false, "fb": "be tired of 才是「厭倦」。"}, {"t": "at", "ok": false, "fb": "be surprised at，不是 tired at。"}, {"t": "about", "ok": false, "fb": "be excited about，不是 tired about。"}, {"t": "of", "ok": true, "fb": "be tired of + V-ing：厭倦每天吃一樣的。"}]}], "kkN": 0, "stars": 0, "listenN": 1, "kk": [{"kind": "listen", "src": "115 年會考聽力 第 10 題", "audio": "../audio/115-10.mp3", "q": "聽一聽，選出最適合的回應。", "script": "I finally finished my painting for the City Art Festival after so many months.", "opts": [{"t": "How much time do you need?", "ok": false, "fb": "對方已經畫完了。"}, {"t": "You should be proud of yourself.", "ok": true, "fb": "辛苦完成作品 → 你應該為自己感到驕傲。"}, {"t": "I'm surprised you haven't started.", "ok": false, "fb": "對方是畫完了，不是還沒開始。"}]}, {"kind": "rw", "src": "會考風格改寫", "q": "The students were ＿＿＿ when they heard the school trip was canceled.", "opts": [{"t": "disappointing", "ok": false, "fb": "-ing 是「令人失望的」，學生的感受用 -ed。"}, {"t": "disappointed", "ok": true, "fb": "校外教學取消，學生感到失望：disappointed。"}, {"t": "exciting", "ok": false, "fb": "取消不會令人興奮。"}, {"t": "excited", "ok": false, "fb": "取消校外教學不會讓學生興奮。"}]}, {"kind": "rw", "src": "會考風格改寫", "q": "I've seen that movie three times. It's really ＿＿＿.", "opts": [{"t": "amazing", "ok": true, "fb": "看了三次 → 電影「令人驚嘆」：amazing。"}, {"t": "amazed", "ok": false, "fb": "-ed 是人感到驚訝，電影不會。"}, {"t": "bored", "ok": false, "fb": "-ed 是人的感受，而且看三次表示很喜歡。"}, {"t": "boring", "ok": false, "fb": "無聊的電影不會看三次。"}]}]}, {"id": "b5-that-clause", "title": "that 引導的名詞子句", "unit": "第五冊 Unit 12 · B5 L1–2", "points": "<p>想把一整句話放進另一句裡當「受詞」時，用 <span class=\"k1\">that</span> 把它包起來。這個 that <strong>本身沒有意思</strong>，常常可以省略。</p>\n<div class=\"formula\"><span class=\"tag k0\">主詞 + think / know / hope / say …</span><span class=\"plus\">+</span><span class=\"tag k1\">(that)</span><span class=\"plus\">+</span><span class=\"tag k2\">主詞 + 動詞</span></div>\n<p class=\"en\">I think <span class=\"k1\">(that)</span> <span class=\"k2\">she is right</span>.<br>Tom said <span class=\"k1\">(that)</span> <span class=\"k2\">he was tired</span>.</p>\n<h3>常接 that 子句的動詞與形容詞</h3>\n<p class=\"en\">think, know, hope, say, believe, feel, hear, find<br>I'm sure that … / I'm glad that … / I'm afraid that …</p>\n<h3>主要句是過去式時</h3>\n<p>說的是過去的事，that 子句通常也用過去式：<span class=\"en\">He said that he <span class=\"k2\">was</span> busy.</span></p>\n<div class=\"warn\"><strong>最容易被扣分的地方</strong>\n<p class=\"en\"><span class=\"bad\">I think that is a good idea to go.</span>　→ that 後面要接「完整的一句話」。</p>\n<p class=\"en\" style=\"margin-bottom:0\">想說「我認為不…」，英文習慣說 <span class=\"k1\">I don't think</span> he will come.，不說 I think he won't come。</p></div>", "questions": [{"q": "I hope ＿＿＿ you can come to my party.", "opts": [{"t": "what", "ok": false, "fb": "what 子句要有缺少的東西，這句是完整的一句話。"}, {"t": "if", "ok": false, "fb": "if 是「是否」，hope 後面不接。"}, {"t": "that", "ok": true, "fb": "hope + that + 完整句子：希望你能來。"}, {"t": "which", "ok": false, "fb": "which 不能引導 hope 後面的句子。"}]}, {"q": "Mia said that she ＿＿＿ sick, so she didn't go to school yesterday.", "opts": [{"t": "is", "ok": false, "fb": "said 是過去式，說的是昨天的事。"}, {"t": "was", "ok": true, "fb": "主要句 said 是過去式，that 子句也用過去式 was。"}, {"t": "will be", "ok": false, "fb": "昨天的事，不是未來。"}, {"t": "be", "ok": false, "fb": "要有主要動詞。"}]}, {"q": "A: Will it rain tomorrow?\nB: I ＿＿＿ so. The sky is clear today.", "opts": [{"t": "think", "ok": false, "fb": "天空很晴朗，應該是「不認為」會下雨。"}, {"t": "hope", "ok": false, "fb": "誰會希望下雨？而且天空晴朗。"}, {"t": "know", "ok": false, "fb": "know so 不是常用說法。"}, {"t": "don't think", "ok": true, "fb": "I don't think so：我不認為會下雨。"}]}, {"q": "I'm sure ＿＿＿ he will win the race. He practices every day.", "opts": [{"t": "that", "ok": true, "fb": "I'm sure that …：我確定他會贏。"}, {"t": "what", "ok": false, "fb": "what 子句裡要缺東西。"}, {"t": "which", "ok": false, "fb": "which 不接在 sure 後面。"}, {"t": "to", "ok": false, "fb": "to 後面要接原形動詞，這裡是一整句。"}]}, {"q": "Do you know ＿＿＿ Jenny is moving to Kaohsiung?", "opts": [{"t": "what", "ok": false, "fb": "what 子句裡要缺東西，Jenny is moving … 是完整的。"}, {"t": "that", "ok": true, "fb": "know + that + 完整句子：你知道 Jenny 要搬去高雄嗎？"}, {"t": "who", "ok": false, "fb": "who 要缺主詞，這裡主詞是 Jenny。"}, {"t": "to", "ok": false, "fb": "to 後面不接整句。"}]}, {"q": "We were glad ＿＿＿ everyone liked the food.", "opts": [{"t": "what", "ok": false, "fb": "what 子句要缺東西。"}, {"t": "because of", "ok": false, "fb": "because of 後面接名詞，不接句子。"}, {"t": "to", "ok": false, "fb": "to 後面接原形動詞。"}, {"t": "that", "ok": true, "fb": "be glad that …：很高興大家都喜歡。"}]}, {"q": "I don't think he ＿＿＿ the truth. His story doesn't make sense.", "opts": [{"t": "tell", "ok": false, "fb": "主詞 he 要用 tells。"}, {"t": "telling", "ok": false, "fb": "要有主要動詞。"}, {"t": "is telling", "ok": true, "fb": "I don't think + 完整句子：我不認為他在說實話。"}, {"t": "to tell", "ok": false, "fb": "that 子句裡要有主要動詞。"}]}, {"q": "Tom heard ＿＿＿ there would be a typhoon this weekend.", "opts": [{"t": "that", "ok": true, "fb": "heard + that + 句子：聽說週末會有颱風。"}, {"t": "what", "ok": false, "fb": "what 子句要缺東西，there would be a typhoon 是完整的。"}, {"t": "if", "ok": false, "fb": "if 是「是否」，聽說的是一件事。"}, {"t": "about", "ok": false, "fb": "about 後面不能直接接句子。"}]}], "kkN": 0, "stars": 0, "listenN": 1, "kk": [{"kind": "listen", "src": "115 年會考聽力 第 11 題", "audio": "../audio/115-11.mp3", "q": "聽一聽，選出最適合的回應。", "script": "Has anyone said you look like the handsome doctor in the movie The Big Hospital?", "opts": [{"t": "Yes. Did you like it?", "ok": false, "fb": "對方問有沒有人「說過」你像那位醫生，不是問電影。"}, {"t": "Actually, you're the first one.", "ok": true, "fb": "Has anyone said (that) …?（有人說過…嗎）→ 你是第一個這樣說的人。"}, {"t": "No, I don't want to be a doctor.", "ok": false, "fb": "對方說的是長得像醫生角色，不是問你想不想當醫生。"}]}, {"kind": "rw", "src": "會考風格改寫", "q": "Grandma believes ＿＿＿ eating fruit every day keeps you healthy.", "opts": [{"t": "what", "ok": false, "fb": "what 子句要缺東西。"}, {"t": "if", "ok": false, "fb": "奶奶是「相信」一件事，不是問是否。"}, {"t": "which", "ok": false, "fb": "which 前面要有名詞。"}, {"t": "that", "ok": true, "fb": "believe + that + 完整句子：相信每天吃水果讓人健康。"}]}, {"kind": "rw", "src": "會考風格改寫", "q": "A: Is the store open today?\nB: I'm afraid ＿＿＿. It's closed on Mondays.", "opts": [{"t": "so", "ok": false, "fb": "I'm afraid so 是「恐怕是的（有開）」，但後面說週一休息。"}, {"t": "not", "ok": true, "fb": "I'm afraid not：恐怕沒有。"}, {"t": "that", "ok": false, "fb": "that 後面要接句子。"}, {"t": "it", "ok": false, "fb": "I'm afraid it 不是完整說法。"}]}]}, {"id": "b5-tag-q", "title": "附加問句", "unit": "第五冊 Unit 12 · B5 L1–2", "points": "<p>附加問句是放在句尾的小問句，意思像「…對吧？」「…不是嗎？」。規則是<strong>前肯後否、前否後肯</strong>。</p>\n<table><tr><th>前面的句子</th><th>附加問句</th><th>例句</th></tr>\n<tr><td>肯定</td><td>否定</td><td class=\"en\">You are tired, <span class=\"k1\">aren't you</span>?</td></tr>\n<tr><td>否定</td><td>肯定</td><td class=\"en\">She can't swim, <span class=\"k1\">can she</span>?</td></tr></table>\n<h3>三個步驟</h3>\n<ol><li>找前面句子的<strong>助動詞或 be 動詞</strong>（沒有就用 do / does / did）。</li>\n<li>前肯後否、前否後肯。</li>\n<li>主詞換成<strong>代名詞</strong>（Tom → he，the book → it，動名詞主詞 → it）。</li></ol>\n<p class=\"en\">Tom <span class=\"k2\">likes</span> dogs, <span class=\"k1\">doesn't he</span>?<br>They <span class=\"k2\">went</span> home, <span class=\"k1\">didn't they</span>?<br>Playing games is fun, <span class=\"k1\">isn't it</span>?</p>\n<div class=\"warn\"><strong>最容易被扣分的地方</strong>\n<p class=\"en\">句子裡有 never、seldom、little、few 這種否定字，也算否定：He <span class=\"k2\">never</span> lies, <span class=\"k1\">does he</span>?</p>\n<p class=\"en\" style=\"margin-bottom:0\">祈使句：Open the door, <span class=\"k1\">will you</span>?　Let's go, <span class=\"k1\">shall we</span>?</p></div>", "questions": [{"q": "You are Amy's brother, ＿＿＿?", "opts": [{"t": "are you", "ok": false, "fb": "前面是肯定句，後面要否定。"}, {"t": "aren't you", "ok": true, "fb": "前肯後否：aren't you?"}, {"t": "don't you", "ok": false, "fb": "前面是 be 動詞 are，不用 do。"}, {"t": "isn't it", "ok": false, "fb": "主詞是 you，不是 it。"}]}, {"q": "Ken can't ride a bike, ＿＿＿?", "opts": [{"t": "can't he", "ok": false, "fb": "前面是否定，後面要肯定。"}, {"t": "does he", "ok": false, "fb": "前面的助動詞是 can。"}, {"t": "can't Ken", "ok": false, "fb": "主詞要換成代名詞，而且要用肯定。"}, {"t": "can he", "ok": true, "fb": "前否後肯，助動詞用 can：can he?"}]}, {"q": "Your mother likes cooking, ＿＿＿?", "opts": [{"t": "doesn't she", "ok": true, "fb": "前面是一般動詞 likes（現在式、單數），用 doesn't she。"}, {"t": "isn't she", "ok": false, "fb": "前面沒有 be 動詞。"}, {"t": "does she", "ok": false, "fb": "前面是肯定，後面要否定。"}, {"t": "don't they", "ok": false, "fb": "主詞是 your mother，用 she。"}]}, {"q": "They went to Tainan last week, ＿＿＿?", "opts": [{"t": "don't they", "ok": false, "fb": "went 是過去式，要用 did。"}, {"t": "did they", "ok": false, "fb": "前面是肯定，後面要否定。"}, {"t": "didn't they", "ok": true, "fb": "過去式一般動詞 → didn't they?"}, {"t": "weren't they", "ok": false, "fb": "前面沒有 be 動詞。"}]}, {"q": "Peter never eats breakfast, ＿＿＿?", "opts": [{"t": "doesn't he", "ok": false, "fb": "never 本身就是否定，後面要用肯定。"}, {"t": "does he", "ok": true, "fb": "never 是否定字，前否後肯：does he?"}, {"t": "isn't he", "ok": false, "fb": "前面是一般動詞 eats。"}, {"t": "didn't he", "ok": false, "fb": "eats 是現在式。"}]}, {"q": "Swimming in the river is dangerous, ＿＿＿?", "opts": [{"t": "isn't swimming", "ok": false, "fb": "主詞要換成代名詞。"}, {"t": "aren't they", "ok": false, "fb": "動名詞主詞是單數，用 it。"}, {"t": "isn't it", "ok": true, "fb": "動名詞（Swimming in the river）當主詞 → it：isn't it?"}, {"t": "doesn't it", "ok": false, "fb": "前面是 be 動詞 is。"}]}, {"q": "Let's take a break, ＿＿＿?", "opts": [{"t": "will you", "ok": false, "fb": "will you 用在一般祈使句（Open the door, will you?）。"}, {"t": "don't we", "ok": false, "fb": "Let's 的附加問句不是 don't we。"}, {"t": "aren't we", "ok": false, "fb": "Let's 句子沒有 be 動詞。"}, {"t": "shall we", "ok": true, "fb": "Let's …, shall we? 是固定用法。"}]}, {"q": "The children have finished their lunch, ＿＿＿?", "opts": [{"t": "haven't they", "ok": true, "fb": "助動詞是 have，主詞 the children → they：haven't they?"}, {"t": "didn't they", "ok": false, "fb": "前面的助動詞是 have，不是 did。"}, {"t": "have they", "ok": false, "fb": "前面是肯定，後面要否定。"}, {"t": "hasn't it", "ok": false, "fb": "主詞是複數的 children。"}]}], "kkN": 1, "stars": 1, "listenN": 0, "kk": [{"kind": "orig", "src": "115 年會考 第 8 題", "q": "Having three cups of coffee a day can't be bad for our health, ＿＿＿?", "opts": [{"t": "can it", "ok": true, "fb": "動名詞主詞是單數，用 it；前面否定 can't，後面用肯定 can it。"}, {"t": "can they", "ok": false, "fb": "動名詞主詞要用 it，不用 they。"}, {"t": "is it", "ok": false, "fb": "前面的助動詞是 can，不是 is。"}, {"t": "are they", "ok": false, "fb": "前面的助動詞是 can，主詞也不是複數。"}]}, {"kind": "rw", "src": "仿 115 年第 8 題", "q": "Playing games on your phone all night isn't good for you, ＿＿＿?", "opts": [{"t": "isn't it", "ok": false, "fb": "前面是否定 isn't，後面要肯定。"}, {"t": "are they", "ok": false, "fb": "動名詞主詞用 it，不用 they。"}, {"t": "is it", "ok": true, "fb": "動名詞主詞 → it；前否後肯：is it?"}, {"t": "doesn't it", "ok": false, "fb": "前面是 be 動詞 is。"}]}]}, {"id": "b5-passive", "title": "被動語態", "unit": "第五冊 Unit 13 · B5 L3–4", "points": "<p>主詞是「被做」的一方時，用被動語態。想一想：主詞自己會做這件事嗎？不會的話，就用被動。</p>\n<div class=\"formula\"><span class=\"tag k1\">be 動詞</span><span class=\"plus\">+</span><span class=\"tag k2\">過去分詞 p.p.</span><span class=\"plus\">(+</span><span class=\"tag k0\">by 做的人</span><span class=\"plus\">)</span></div>\n<p class=\"en\">People speak English in many countries.<br>→ English <span class=\"k1\">is</span> <span class=\"k2\">spoken</span> in many countries.</p>\n<h3>時態看 be 動詞</h3>\n<table><tr><th>時態</th><th>被動形式</th><th>例句</th></tr>\n<tr><td>現在式</td><td class=\"en\">am / is / are + p.p.</td><td class=\"en\">The room <span class=\"k1\">is</span> <span class=\"k2\">cleaned</span> every day.</td></tr>\n<tr><td>過去式</td><td class=\"en\">was / were + p.p.</td><td class=\"en\">The window <span class=\"k1\">was</span> <span class=\"k2\">broken</span> yesterday.</td></tr>\n<tr><td>未來式</td><td class=\"en\">will be + p.p.</td><td class=\"en\">The game <span class=\"k1\">will be</span> <span class=\"k2\">played</span> tomorrow.</td></tr>\n<tr><td>助動詞</td><td class=\"en\">can / must / should be + p.p.</td><td class=\"en\">Phones <span class=\"k1\">must be</span> <span class=\"k2\">turned</span> off.</td></tr>\n<tr><td>不定詞</td><td class=\"en\">to be + p.p.</td><td class=\"en\">I don't like <span class=\"k1\">to be</span> <span class=\"k2\">told</span> what to do.</td></tr></table>\n<div class=\"warn\"><strong>最容易被扣分的地方</strong>\n<p class=\"en\"><span class=\"bad\">The cake was eat by Tom.</span>　→ be 後面要接過去分詞 eaten。</p>\n<p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">The housework are shared …</span>　→ be 動詞看主詞：housework 是單數，用 is shared。</p></div>", "questions": [{"q": "This bridge ＿＿＿ in 1990.", "opts": [{"t": "built", "ok": false, "fb": "橋不會自己蓋，要用被動。"}, {"t": "is built", "ok": false, "fb": "in 1990 是過去，用 was。"}, {"t": "was built", "ok": true, "fb": "橋是「被」蓋的，1990 是過去：was built。"}, {"t": "was build", "ok": false, "fb": "be 後面要接過去分詞 built。"}], "hint": "（build）"}, {"q": "English ＿＿＿ in many countries around the world.", "opts": [{"t": "speaks", "ok": false, "fb": "英文不會自己說話，要用被動。"}, {"t": "is spoken", "ok": true, "fb": "英文「被說」，說的是現在的事實：is spoken。"}, {"t": "is speaking", "ok": false, "fb": "這是主動進行式「正在說」。"}, {"t": "spoken", "ok": false, "fb": "少了 be 動詞。"}], "hint": "（speak）"}, {"q": "The classroom ＿＿＿ by the students every afternoon.", "opts": [{"t": "is cleaned", "ok": true, "fb": "教室被學生打掃，every afternoon 是習慣：is cleaned。"}, {"t": "cleans", "ok": false, "fb": "教室不會自己打掃。"}, {"t": "is cleaning", "ok": false, "fb": "主動進行式，意思變成教室在打掃東西。"}, {"t": "cleaned", "ok": false, "fb": "少了 be 動詞，而且 every afternoon 是現在習慣。"}]}, {"q": "My bike ＿＿＿ last night. I have to walk to school today.", "opts": [{"t": "stole", "ok": false, "fb": "腳踏車不會偷東西。"}, {"t": "is stolen", "ok": false, "fb": "last night 是過去。"}, {"t": "was steal", "ok": false, "fb": "be 後面要接過去分詞 stolen。"}, {"t": "was stolen", "ok": true, "fb": "腳踏車被偷，昨晚：was stolen。"}]}, {"q": "The results ＿＿＿ next Monday.", "opts": [{"t": "announce", "ok": false, "fb": "結果不會自己公布。"}, {"t": "will be announced", "ok": true, "fb": "未來的被動：will be + p.p.。"}, {"t": "will announce", "ok": false, "fb": "主動，意思變成結果會公布某事。"}, {"t": "were announced", "ok": false, "fb": "next Monday 是未來。"}], "hint": "（announce）"}, {"q": "Cellphones must ＿＿＿ off during the test.", "opts": [{"t": "turn", "ok": false, "fb": "手機不會自己關，要用被動。"}, {"t": "turned", "ok": false, "fb": "must 後面要接原形 be。"}, {"t": "be turned", "ok": true, "fb": "助動詞的被動：must be + p.p.。"}, {"t": "be turn", "ok": false, "fb": "be 後面要接過去分詞 turned。"}]}, {"q": "These cookies ＿＿＿ by my grandma. They're delicious!", "opts": [{"t": "were made", "ok": true, "fb": "餅乾是奶奶做的（已經做好）：were made。"}, {"t": "made", "ok": false, "fb": "餅乾不會自己做東西。"}, {"t": "were make", "ok": false, "fb": "be 後面要接過去分詞 made。"}, {"t": "was made", "ok": false, "fb": "主詞 cookies 是複數。"}]}, {"q": "Many trees ＿＿＿ down by the strong wind during the typhoon.", "opts": [{"t": "blew", "ok": false, "fb": "樹不會自己吹倒別的東西。"}, {"t": "are blown", "ok": false, "fb": "during the typhoon 是過去發生的事。"}, {"t": "was blown", "ok": false, "fb": "主詞 trees 是複數。"}, {"t": "were blown", "ok": true, "fb": "颱風時樹被吹倒，複數過去式：were blown。"}]}], "kkN": 5, "stars": 3, "listenN": 1, "kk": [{"kind": "orig", "src": "107 年會考 第 11 題", "q": "Many famous people visit this restaurant. Popular singers like A-mei and Jay Chou ＿＿＿ here with their friends.", "opts": [{"t": "to be often seen", "ok": false, "fb": "to be often seen 不是主要動詞，句子會沒有動詞。"}, {"t": "often seen", "ok": false, "fb": "often seen 少了 be 動詞。"}, {"t": "are often seen", "ok": true, "fb": "歌手「被看到」在這裡出現，常常發生：are often seen（現在式被動）。"}, {"t": "and are often seen", "ok": false, "fb": "and 前面沒有可以對等連接的動詞。"}]}, {"kind": "orig", "src": "109 年會考 第 11 題", "q": "Alison doesn't like ＿＿＿ what to do. She only does things she wants to do.", "opts": [{"t": "told", "ok": false, "fb": "like 後面不能直接接過去分詞 told。"}, {"t": "to tell", "ok": false, "fb": "to tell 是主動「告訴別人」，但她是「被告知」要做什麼。"}, {"t": "be told", "ok": false, "fb": "like 後面要接 to V，be told 前面少了 to。"}, {"t": "to be told", "ok": true, "fb": "她不喜歡「被」告知要做什麼：to be told（不定詞的被動）。"}]}, {"kind": "orig", "src": "111 年會考 第 17 題", "q": "The police haven't found the little girl who ＿＿＿ at a supermarket. They'll keep doing all they can to find her.", "opts": [{"t": "took away", "ok": false, "fb": "took away 是主動，意思變成女孩帶走了別人。"}, {"t": "taken away", "ok": false, "fb": "taken away 少了 be 動詞。"}, {"t": "has taken away", "ok": false, "fb": "has taken away 是主動，意思不對。"}, {"t": "was taken away", "ok": true, "fb": "女孩「被」帶走，發生在過去：was taken away。"}]}, {"kind": "orig", "src": "112 年會考 第 13 題", "q": "Doraemon, a blue Japanese robot cat, has hated mice since his ears ＿＿＿ by a mouse.", "opts": [{"t": "bit", "ok": false, "fb": "bit 是主動，意思變成耳朵咬了老鼠。"}, {"t": "bite", "ok": false, "fb": "bite 是主動原形，少了 be 動詞。"}, {"t": "were bitten", "ok": true, "fb": "耳朵「被」老鼠咬，是過去發生的事：were bitten（ears 是複數）。"}, {"t": "have bitten", "ok": false, "fb": "have bitten 是主動完成式，意思變成耳朵咬了東西。"}]}, {"kind": "orig", "src": "113 年會考 第 19 題", "q": "The housework in Mr. and Mrs. Wang's family ＿＿＿ between them and their kids. Everyone's got their own job to do.", "opts": [{"t": "is shared", "ok": true, "fb": "家事「被」分擔；主詞 the housework 是單數（不可數）：is shared。"}, {"t": "are shared", "ok": false, "fb": "housework 不可數，用單數 is，不用 are。"}, {"t": "shares", "ok": false, "fb": "家事不會自己分擔別人，要用被動。"}, {"t": "share", "ok": false, "fb": "share 是主動，而且主詞是單數。"}]}, {"kind": "listen", "src": "112 年會考聽力 第 9 題", "audio": "../audio/112-09.mp3", "q": "聽一聽，選出最適合的回應。", "script": "Excuse me, I'm looking for a John Smith. I was told that I could find him here.", "opts": [{"t": "Where did you find him?", "ok": false, "fb": "對方還沒找到人。"}, {"t": "Oh yeah, I've already told him.", "ok": false, "fb": "was told 是「有人告訴我」，不是要你去告訴誰。"}, {"t": "Wait a minute, please. I'll get him for you.", "ok": true, "fb": "對方在找 John Smith → 請稍等，我幫你叫他。"}]}, {"kind": "rw", "src": "仿 113 年第 19 題", "q": "The garbage in our class ＿＿＿ out by two students every day.", "opts": [{"t": "is taken", "ok": true, "fb": "垃圾「被」拿出去；garbage 不可數，用單數 is：is taken。"}, {"t": "are taken", "ok": false, "fb": "garbage 不可數，用單數。"}, {"t": "takes", "ok": false, "fb": "垃圾不會自己拿東西。"}, {"t": "taking", "ok": false, "fb": "少了 be 動詞，而且要用被動。"}]}]}, {"id": "b5-indirect-q", "title": "間接問句", "unit": "第五冊 Unit 13 · B5 L3–4", "points": "<p>把一個問句放進另一個句子裡，就變成間接問句。最重要的規則：<strong>疑問詞後面改回「主詞 + 動詞」的直述句順序</strong>。</p>\n<table><tr><th>直接問句</th><th>間接問句</th></tr>\n<tr><td class=\"en\">Where <span class=\"k1\">is</span> <span class=\"k2\">the station</span>?</td><td class=\"en\">Do you know where <span class=\"k2\">the station</span> <span class=\"k1\">is</span>?</td></tr>\n<tr><td class=\"en\">What <span class=\"k1\">does</span> <span class=\"k2\">he</span> want?</td><td class=\"en\">I don't know what <span class=\"k2\">he</span> <span class=\"k1\">wants</span>.</td></tr>\n<tr><td class=\"en\">When <span class=\"k1\">did</span> <span class=\"k2\">she</span> leave?</td><td class=\"en\">Can you tell me when <span class=\"k2\">she</span> <span class=\"k1\">left</span>?</td></tr></table>\n<h3>三個步驟</h3>\n<ol><li>保留疑問詞（who、what、where、when、why、how）。</li>\n<li>改成「主詞 + 動詞」的順序。</li>\n<li>拿掉 do / does / did，把時態還給動詞。</li></ol>\n<h3>會考常考：選哪個疑問詞</h3>\n<p>看後面怎麼回答：回答時間 → when；回答原因 → why；回答方式 → how。</p>\n<div class=\"warn\"><strong>最容易被扣分的地方</strong>\n<p class=\"en\"><span class=\"bad\">Do you know where is the station?</span>　→ 改成 where the station is。</p>\n<p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">I don't know what does he want.</span>　→ 拿掉 does：what he wants。</p></div>", "questions": [{"q": "Can you tell me ＿＿＿?", "opts": [{"t": "where is the bus stop", "ok": false, "fb": "間接問句要用直述句順序，不能 is 在前。"}, {"t": "where does the bus stop is", "ok": false, "fb": "不能同時有 does 和 is。"}, {"t": "where the bus stop is", "ok": true, "fb": "疑問詞 + 主詞 + 動詞：where the bus stop is。"}, {"t": "the bus stop is where", "ok": false, "fb": "疑問詞要放在最前面。"}]}, {"q": "I don't know ＿＿＿.", "opts": [{"t": "what he wants", "ok": true, "fb": "What does he want? → what he wants（拿掉 does，動詞加 s）。"}, {"t": "what does he want", "ok": false, "fb": "間接問句不保留 does。"}, {"t": "what he want", "ok": false, "fb": "主詞 he，動詞要加 s。"}, {"t": "what wants he", "ok": false, "fb": "順序錯了。"}]}, {"q": "A: Do you know ＿＿＿ the concert starts?\nB: At seven thirty.", "opts": [{"t": "where", "ok": false, "fb": "回答是時間，不是地點。"}, {"t": "when", "ok": true, "fb": "回答 At seven thirty 是時間 → when。"}, {"t": "why", "ok": false, "fb": "回答不是原因。"}, {"t": "who", "ok": false, "fb": "回答不是人。"}]}, {"q": "Please tell me ＿＿＿ you were late again.", "opts": [{"t": "what", "ok": false, "fb": "what 子句裡要缺東西，you were late again 是完整的。"}, {"t": "who", "ok": false, "fb": "who 要缺主詞。"}, {"t": "where", "ok": false, "fb": "老師要問的是遲到的原因。"}, {"t": "why", "ok": true, "fb": "問遲到的原因 → why。"}]}, {"q": "Do you remember ＿＿＿ last weekend?", "opts": [{"t": "where did we go", "ok": false, "fb": "間接問句不用 did 倒裝。"}, {"t": "where we went", "ok": true, "fb": "Where did we go? → where we went。"}, {"t": "where we go", "ok": false, "fb": "last weekend 是過去，要用 went。"}, {"t": "where went we", "ok": false, "fb": "順序錯了。"}]}, {"q": "I wonder ＿＿＿ Kevin is so happy today.", "opts": [{"t": "what", "ok": false, "fb": "what 子句要缺東西。"}, {"t": "which", "ok": false, "fb": "which 要接在選項中選一個。"}, {"t": "why", "ok": true, "fb": "想知道「為什麼」他今天這麼開心 → why。"}, {"t": "whose", "ok": false, "fb": "whose 後面要接名詞。"}]}, {"q": "Mom asked me ＿＿＿.", "opts": [{"t": "how much the shoes cost", "ok": true, "fb": "How much did the shoes cost? → how much the shoes cost（過去式 cost 不變）。"}, {"t": "how much did the shoes cost", "ok": false, "fb": "間接問句不用 did 倒裝。"}, {"t": "how much cost the shoes", "ok": false, "fb": "順序錯了。"}, {"t": "the shoes cost how much", "ok": false, "fb": "疑問詞要放前面。"}]}, {"q": "Nobody knows ＿＿＿ broke the window.", "opts": [{"t": "what", "ok": false, "fb": "what 問東西，打破窗戶的是人。"}, {"t": "where", "ok": false, "fb": "問的是誰打破的。"}, {"t": "when", "ok": false, "fb": "問的是誰打破的。"}, {"t": "who", "ok": true, "fb": "who 當主詞：誰打破了窗戶。"}]}], "kkN": 4, "stars": 3, "listenN": 2, "kk": [{"kind": "orig", "src": "107 年會考 第 9 題", "q": "Alice: Do you know ＿＿＿ Grandma is going to visit us?\nWilly: It's next week. She told me on the phone.", "opts": [{"t": "where", "ok": false, "fb": "回答 It's next week 是時間，不是地點。"}, {"t": "when", "ok": true, "fb": "回答是時間 → when：你知道奶奶什麼時候要來嗎？"}, {"t": "whether", "ok": false, "fb": "whether 是「是否」，回答不會是 It's next week。"}, {"t": "why", "ok": false, "fb": "回答不是原因。"}]}, {"kind": "orig", "src": "109 年會考 第 10 題", "q": "Jill: Have you decided ＿＿＿ you will celebrate your 30th birthday?\nSue: Yeah, I'm going to have a big barbecue party.", "opts": [{"t": "how", "ok": true, "fb": "回答在說「用什麼方式」慶祝（辦烤肉派對）→ how。"}, {"t": "where", "ok": false, "fb": "回答不是地點。"}, {"t": "what", "ok": false, "fb": "what 子句要缺東西，you will celebrate your birthday 是完整的。"}, {"t": "when", "ok": false, "fb": "回答不是時間。"}]}, {"kind": "orig", "src": "112 年會考 第 10 題", "q": "Jerry wanted to know ＿＿＿ he was kicked off the soccer team, but no one gave him a good reason.", "opts": [{"t": "where", "ok": false, "fb": "後面說沒人給他好的理由，問的是原因。"}, {"t": "when", "ok": false, "fb": "後面說的是理由，不是時間。"}, {"t": "whether", "ok": false, "fb": "whether 是「是否」，但他已經被踢出球隊了。"}, {"t": "why", "ok": true, "fb": "no one gave him a good reason → 他想知道「為什麼」：why。"}]}, {"kind": "orig", "src": "115 年會考 第 10 題", "q": "Alan works hard in his new job, and he wants to know ＿＿＿ his boss feels about him.", "opts": [{"t": "how", "ok": true, "fb": "想知道老闆「覺得他怎麼樣」：how … feels about him。"}, {"t": "that", "ok": false, "fb": "that 子句是確定的事，「想知道」後面接的是不確定的問題。"}, {"t": "whether", "ok": false, "fb": "whether 是「是否」，feels about him 前面需要「怎麼」。"}, {"t": "why", "ok": false, "fb": "why 是原因，句意變成老闆為什麼對他有感覺，不通。"}]}, {"kind": "listen", "src": "113 年會考聽力 第 8 題", "audio": "../audio/113-08.mp3", "q": "聽一聽，選出最適合的回應。", "script": "Can you tell me what your dog looks like? I can help you look for it.", "opts": [{"t": "It's been with me for ten years.", "ok": false, "fb": "問的是長什麼樣子，不是養多久。"}, {"t": "It's small, gray, and has a long tail.", "ok": true, "fb": "what your dog looks like（狗長什麼樣子）→ 小小的、灰色、尾巴很長。"}, {"t": "We call it Milky because it likes milk.", "ok": false, "fb": "這是在說名字，不是外表。"}]}, {"kind": "listen", "src": "114 年會考聽力 第 11 題", "audio": "../audio/114-11.mp3", "q": "聽一聽，選出最適合的回應。", "script": "Do you know where I can find Dr. Holland? I need to talk to him.", "opts": [{"t": "I'm not sure if he's with me.", "ok": false, "fb": "他在不在你身邊，你自己最清楚，這句不合理。"}, {"t": "No, have you tried calling him?", "ok": true, "fb": "Do you know where …? → 不知道，你打電話給他了嗎？"}, {"t": "Yes, you can ask him by yourself.", "ok": false, "fb": "說知道，卻沒有說他在哪裡。"}]}, {"kind": "rw", "src": "仿 112 年第 10 題", "q": "Mom wants to know ＿＿＿ I came home so late, but I don't want to tell her.", "opts": [{"t": "where", "ok": false, "fb": "媽媽想知道的是晚回家的原因。"}, {"t": "when", "ok": false, "fb": "晚回家這件事已經知道，問的是原因。"}, {"t": "why", "ok": true, "fb": "想知道「為什麼」這麼晚回家：why。"}, {"t": "whether", "ok": false, "fb": "已經晚回家了，不是問「是否」。"}]}]}, {"id": "b5-wh-to", "title": "名詞片語（疑問詞 + to V）", "unit": "第五冊 Unit 13 · B5 L3–4", "points": "<p>「疑問詞 + to V」可以當成一個名詞，意思是「該怎麼做、該做什麼、該去哪裡」。常放在 know、learn、decide、tell、teach、show 後面。</p>\n<div class=\"formula\"><span class=\"tag k1\">what / how / where / when / which / who</span><span class=\"plus\">+</span><span class=\"tag k2\">to V</span></div>\n<table><tr><th>片語</th><th>意思</th><th>例句</th></tr>\n<tr><td class=\"en\">how to V</td><td>如何、怎麼做</td><td class=\"en\">I don't know <span class=\"k1\">how</span> <span class=\"k2\">to swim</span>.</td></tr>\n<tr><td class=\"en\">what to V</td><td>做什麼</td><td class=\"en\">She didn't know <span class=\"k1\">what</span> <span class=\"k2\">to say</span>.</td></tr>\n<tr><td class=\"en\">where to V</td><td>去哪裡</td><td class=\"en\">Tell me <span class=\"k1\">where</span> <span class=\"k2\">to go</span>.</td></tr>\n<tr><td class=\"en\">when to V</td><td>什麼時候</td><td class=\"en\">We decided <span class=\"k1\">when</span> <span class=\"k2\">to leave</span>.</td></tr>\n<tr><td class=\"en\">which + 名詞 + to V</td><td>選哪一個</td><td class=\"en\">I can't decide <span class=\"k1\">which</span> shirt <span class=\"k2\">to buy</span>.</td></tr></table>\n<h3>和間接問句可以互換</h3>\n<p class=\"en\">I don't know how <span class=\"k2\">to use</span> it. = I don't know how <span class=\"k2\">I can use</span> it.</p>\n<div class=\"warn\"><strong>最容易被扣分的地方</strong>\n<p class=\"en\"><span class=\"bad\">I don't know how to swimming.</span>　→ to 後面接原形 swim。</p>\n<p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">I don't know why to go.</span>　→ why 通常不接 to V。</p></div>", "questions": [{"q": "My grandpa doesn't know ＿＿＿ a smartphone.", "opts": [{"t": "how use", "ok": false, "fb": "how 後面要接 to V。"}, {"t": "how to use", "ok": true, "fb": "how to use：不知道怎麼用智慧型手機。"}, {"t": "how using", "ok": false, "fb": "疑問詞後面接 to V，不接 V-ing。"}, {"t": "to how use", "ok": false, "fb": "疑問詞要放在 to 前面。"}]}, {"q": "There are so many dishes on the menu. I can't decide ＿＿＿.", "opts": [{"t": "what to eating", "ok": false, "fb": "to 後面接原形。"}, {"t": "to eat what", "ok": false, "fb": "疑問詞要放前面。"}, {"t": "what eat", "ok": false, "fb": "what 後面要接 to V。"}, {"t": "what to order", "ok": true, "fb": "菜單上很多菜，不知道「該點什麼」：what to order。"}]}, {"q": "Could you tell me ＿＿＿ buy the tickets?", "opts": [{"t": "where to", "ok": true, "fb": "where to buy：告訴我去哪裡買票。"}, {"t": "where I", "ok": false, "fb": "where I 後面要接 can buy 這種完整動詞。"}, {"t": "to where", "ok": false, "fb": "疑問詞要放前面。"}, {"t": "why to", "ok": false, "fb": "why 通常不接 to V。"}]}, {"q": "The teacher showed us ＿＿＿ make a paper plane.", "opts": [{"t": "what to", "ok": false, "fb": "make a paper plane 已經有受詞，問的是「方法」。"}, {"t": "which to", "ok": false, "fb": "which 要接名詞或在幾個中選。"}, {"t": "how to", "ok": true, "fb": "教我們「怎麼」摺紙飛機：how to。"}, {"t": "where to", "ok": false, "fb": "不是問地點。"}]}, {"q": "I can't decide ＿＿＿ to wear to the party, the red one or the blue one.", "opts": [{"t": "what dress", "ok": false, "fb": "有兩件可以選時用 which。"}, {"t": "which dress", "ok": true, "fb": "在紅的和藍的之間選：which dress to wear。"}, {"t": "how dress", "ok": false, "fb": "不是問方法。"}, {"t": "where dress", "ok": false, "fb": "不是問地點。"}]}, {"q": "She was so nervous that she didn't know ＿＿＿.", "opts": [{"t": "what to saying", "ok": false, "fb": "to 後面接原形。"}, {"t": "to say what", "ok": false, "fb": "疑問詞要在前面。"}, {"t": "what say", "ok": false, "fb": "what 後面要接 to V。"}, {"t": "what to say", "ok": true, "fb": "緊張到不知道「該說什麼」。"}]}, {"q": "I don't know how to do it. = I don't know how ＿＿＿ do it.", "opts": [{"t": "I can", "ok": true, "fb": "疑問詞 + to V 可以改寫成疑問詞 + 主詞 + can + V。"}, {"t": "can I", "ok": false, "fb": "間接問句用直述句順序。"}, {"t": "to can", "ok": false, "fb": "沒有 to can 這種說法。"}, {"t": "I to", "ok": false, "fb": "順序錯了。"}]}, {"q": "We haven't decided ＿＿＿ to start the trip. Maybe next Monday.", "opts": [{"t": "where", "ok": false, "fb": "回答是時間，不是地點。"}, {"t": "what", "ok": false, "fb": "what 後面要缺受詞，這裡是在說時間。"}, {"t": "when", "ok": true, "fb": "Maybe next Monday → 什麼時候出發：when to start。"}, {"t": "who", "ok": false, "fb": "不是問人。"}]}], "kkN": 0, "stars": 0, "listenN": 0, "kk": [{"kind": "rw", "src": "會考風格改寫", "q": "This is my first time taking the MRT. Could you show me ＿＿＿ buy a ticket?", "opts": [{"t": "how to", "ok": true, "fb": "第一次搭捷運，請人教「怎麼」買票：how to。"}, {"t": "what to", "ok": false, "fb": "buy a ticket 已經有受詞。"}, {"t": "when to", "ok": false, "fb": "問的是方法，不是時間。"}, {"t": "why to", "ok": false, "fb": "why 通常不接 to V。"}]}, {"kind": "rw", "src": "會考風格改寫", "q": "I have so many things to do this weekend. I don't know ＿＿＿.", "opts": [{"t": "where to starting", "ok": false, "fb": "to 後面接原形。"}, {"t": "to start where", "ok": false, "fb": "疑問詞要放前面。"}, {"t": "what start", "ok": false, "fb": "疑問詞後面要接 to V。"}, {"t": "where to start", "ok": true, "fb": "事情太多，不知道從哪裡開始：where to start。"}]}]}, {"id": "b5-whether", "title": "名詞子句 whether / if", "unit": "第五冊 Unit 13 · B5 L3–4", "points": "<p>把一個 <strong>Yes / No 問句</strong>放進句子裡時，用 <span class=\"k1\">whether</span> 或 <span class=\"k1\">if</span>，意思是「是否」。後面一樣用「主詞 + 動詞」的順序。</p>\n<table><tr><th>直接問句</th><th>放進句子裡</th></tr>\n<tr><td class=\"en\"><span class=\"k1\">Is</span> <span class=\"k2\">he</span> at home?</td><td class=\"en\">I don't know <span class=\"k1\">if / whether</span> <span class=\"k2\">he</span> is at home.</td></tr>\n<tr><td class=\"en\"><span class=\"k1\">Can</span> <span class=\"k2\">you</span> come?</td><td class=\"en\">Please tell me <span class=\"k1\">whether</span> <span class=\"k2\">you</span> can come.</td></tr>\n<tr><td class=\"en\"><span class=\"k1\">Did</span> <span class=\"k2\">she</span> pass?</td><td class=\"en\">I wonder <span class=\"k1\">if</span> <span class=\"k2\">she</span> passed.</td></tr></table>\n<h3>whether 和 if 不一樣的地方</h3>\n<ul><li><span class=\"k1\">whether … or not</span> 可以連在一起用：I don't know whether he will come or not.</li>\n<li>句首、介系詞後面只能用 whether：It depends on <span class=\"k1\">whether</span> it rains.</li></ul>\n<h3>不要和 that 搞混</h3>\n<p>that 子句是「一件確定的事」；whether / if 是「不確定是不是」。<br><span class=\"en\">I know <span class=\"k1\">that</span> he is right.</span>（確定）／<span class=\"en\">I'm not sure <span class=\"k1\">whether</span> he is right.</span>（不確定）</p>\n<div class=\"warn\"><strong>最容易被扣分的地方</strong>\n<p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">I don't know if is he at home.</span>　→ if 後面用直述句：if he is at home。</p></div>", "questions": [{"q": "I'm not sure ＿＿＿ Tom will come to the party.", "opts": [{"t": "that", "ok": false, "fb": "not sure 表示不確定，要用 whether / if。"}, {"t": "whether", "ok": true, "fb": "不確定他「是否」會來：whether。"}, {"t": "what", "ok": false, "fb": "what 子句要缺東西。"}, {"t": "where", "ok": false, "fb": "不是問地點。"}]}, {"q": "Can you tell me ＿＿＿?", "opts": [{"t": "if is the museum open today", "ok": false, "fb": "if 後面要用直述句順序。"}, {"t": "is the museum open today", "ok": false, "fb": "放進句子裡要用 if / whether 連接。"}, {"t": "that the museum open today", "ok": false, "fb": "少了 be 動詞，而且這是在問是否。"}, {"t": "if the museum is open today", "ok": true, "fb": "if + 主詞 + 動詞：博物館今天是否開放。"}]}, {"q": "I wonder ＿＿＿ she passed the test.", "opts": [{"t": "if", "ok": true, "fb": "想知道她「是否」通過：if。"}, {"t": "that", "ok": false, "fb": "wonder 表示不確定，用 if / whether。"}, {"t": "what", "ok": false, "fb": "what 子句要缺東西。"}, {"t": "which", "ok": false, "fb": "which 要在選項中選。"}]}, {"q": "I don't know whether he will help us ＿＿＿.", "opts": [{"t": "or", "ok": false, "fb": "whether … or not 才是完整用法。"}, {"t": "and not", "ok": false, "fb": "沒有 whether … and not。"}, {"t": "or not", "ok": true, "fb": "whether … or not：不知道他會不會幫我們。"}, {"t": "if not", "ok": false, "fb": "whether 後面配 or not。"}]}, {"q": "Our trip depends on ＿＿＿ it rains tomorrow.", "opts": [{"t": "if", "ok": false, "fb": "介系詞 on 後面只能用 whether。"}, {"t": "whether", "ok": true, "fb": "介系詞後面用 whether：取決於明天是否下雨。"}, {"t": "that", "ok": false, "fb": "取決於的是「會不會」，不是確定的事。"}, {"t": "what", "ok": false, "fb": "what 子句要缺東西。"}]}, {"q": "A: Did Amy go to the library?\nB: I don't know ＿＿＿.", "opts": [{"t": "if did she go", "ok": false, "fb": "if 後面不用 did 倒裝。"}, {"t": "that she went", "ok": false, "fb": "B 不知道「是不是」去了。"}, {"t": "whether she go", "ok": false, "fb": "過去的事，要用 went。"}, {"t": "if she went", "ok": true, "fb": "Did she go? → if she went。"}]}, {"q": "I know ＿＿＿ you are worried, but everything will be fine.", "opts": [{"t": "that", "ok": true, "fb": "我「知道」你在擔心，是確定的事：that。"}, {"t": "whether", "ok": false, "fb": "說話者很確定，不用「是否」。"}, {"t": "if", "ok": false, "fb": "if 是「是否」，這裡是確定的事。"}, {"t": "what", "ok": false, "fb": "what 子句要缺東西。"}]}, {"q": "Please ask the clerk ＿＿＿ they have this T-shirt in a bigger size.", "opts": [{"t": "that", "ok": false, "fb": "問店員「有沒有」，不是確定的事。"}, {"t": "what", "ok": false, "fb": "what 子句要缺東西。"}, {"t": "if", "ok": true, "fb": "問店員是否有大一號：if。"}, {"t": "which", "ok": false, "fb": "which 要接名詞在選項中選。"}]}], "kkN": 0, "stars": 0, "listenN": 0, "kk": [{"kind": "rw", "src": "會考風格改寫", "q": "Jack asked me ＿＿＿ I wanted to join his basketball team.", "opts": [{"t": "that", "ok": false, "fb": "Jack 是在問我，不是說一件確定的事。"}, {"t": "what", "ok": false, "fb": "what 子句要缺東西。"}, {"t": "if", "ok": true, "fb": "問我「是否」想加入：if。"}, {"t": "where", "ok": false, "fb": "不是問地點。"}]}, {"kind": "rw", "src": "會考風格改寫", "q": "We'll have the barbecue outside or inside. It depends on ＿＿＿ it rains.", "opts": [{"t": "if", "ok": false, "fb": "介系詞 on 後面要用 whether。"}, {"t": "whether", "ok": true, "fb": "depends on whether …：取決於會不會下雨。"}, {"t": "that", "ok": false, "fb": "下不下雨不確定，不用 that。"}, {"t": "what", "ok": false, "fb": "what 子句要缺東西。"}]}]}, {"id": "b5-prep-phrase", "title": "介系詞片語後位修飾", "unit": "第五冊 Unit 14 · B5 L5–6", "points": "<p>中文說「桌上的書」，形容的話放在前面；英文常把<strong>介系詞片語放在名詞後面</strong>來形容它。</p>\n<div class=\"formula\"><span class=\"tag k2\">名詞</span><span class=\"plus\">+</span><span class=\"tag k1\">介系詞片語</span></div>\n<table><tr><th>英文</th><th>中文</th></tr>\n<tr><td class=\"en\">the book <span class=\"k1\">on the desk</span></td><td>桌上的書</td></tr>\n<tr><td class=\"en\">the girl <span class=\"k1\">in the red dress</span></td><td>穿紅洋裝的女孩</td></tr>\n<tr><td class=\"en\">the man <span class=\"k1\">with a hat</span></td><td>戴帽子的男人</td></tr>\n<tr><td class=\"en\">the house <span class=\"k1\">by the river</span></td><td>河邊的房子</td></tr></table>\n<h3>主詞變長時，動詞看前面的名詞</h3>\n<p class=\"en\">The books <span class=\"k1\">on the desk</span> <span class=\"k2\">are</span> mine.（主詞是 books）<br>The boy <span class=\"k1\">with two dogs</span> <span class=\"k2\">is</span> my cousin.（主詞是 boy）</p>\n<div class=\"warn\"><strong>最容易被扣分的地方</strong>\n<p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">The boy with two dogs are my cousin.</span>　→ 主詞是 the boy（單數），不是 dogs。</p></div>", "questions": [{"q": "The girl ＿＿＿ is my sister.", "opts": [{"t": "wears the blue sweater", "ok": false, "fb": "句子已經有動詞 is，不能再放 wears。"}, {"t": "in the blue sweater", "ok": true, "fb": "介系詞片語放在名詞後面：in the blue sweater。"}, {"t": "on the blue sweater", "ok": false, "fb": "穿衣服用 in。"}, {"t": "the blue sweater", "ok": false, "fb": "少了介系詞，意思不完整。"}], "hint": "（穿藍色毛衣的）"}, {"q": "The books on the shelf ＿＿＿ very old.", "opts": [{"t": "is", "ok": false, "fb": "主詞是 books（複數），不是 shelf。"}, {"t": "be", "ok": false, "fb": "要用變化過的 be 動詞。"}, {"t": "are", "ok": true, "fb": "主詞 The books 是複數：are。"}, {"t": "was", "ok": false, "fb": "主詞是複數。"}]}, {"q": "Do you know the man ＿＿＿ a big hat?", "opts": [{"t": "with", "ok": true, "fb": "with a big hat：戴著大帽子的男人。"}, {"t": "on", "ok": false, "fb": "on a hat 是「在帽子上」。"}, {"t": "by", "ok": false, "fb": "by a big hat 是「在大帽子旁邊」，不是戴著。"}, {"t": "at", "ok": false, "fb": "at 不表示穿戴。"}]}, {"q": "The house ＿＿＿ the river
