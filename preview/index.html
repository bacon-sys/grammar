belongs to Mr. Wu.", "opts": [{"t": "in", "ok": false, "fb": "in the river 是在河裡面。"}, {"t": "under", "ok": false, "fb": "under the river 是在河底下。"}, {"t": "on", "ok": false, "fb": "on the river 是在河面上。"}, {"t": "by", "ok": true, "fb": "by the river：河邊的房子。"}], "hint": "（河邊的）"}, {"q": "The boy with two dogs ＿＿＿ running in the park.", "opts": [{"t": "are", "ok": false, "fb": "主詞是 the boy（單數），不是 dogs。"}, {"t": "is", "ok": true, "fb": "主詞 The boy 是單數：is。"}, {"t": "be", "ok": false, "fb": "要用變化過的 be 動詞。"}, {"t": "were", "ok": false, "fb": "主詞是單數。"}]}, {"q": "The students ＿＿＿ Class 9A won first place.", "opts": [{"t": "at", "ok": false, "fb": "at 不表示「屬於某班」。"}, {"t": "on", "ok": false, "fb": "on 不表示「屬於某班」。"}, {"t": "in", "ok": true, "fb": "in Class 9A：九年 A 班的學生。"}, {"t": "to", "ok": false, "fb": "to 不表示所屬。"}], "hint": "（九年 A 班的）"}, {"q": "The picture ＿＿＿ is beautiful.", "opts": [{"t": "on the wall", "ok": true, "fb": "牆上的畫：on the wall。"}, {"t": "in the wall", "ok": false, "fb": "in the wall 是在牆壁裡面。"}, {"t": "the wall on", "ok": false, "fb": "介系詞要放在名詞前面。"}, {"t": "at wall", "ok": false, "fb": "少了 the，而且掛在牆上用 on。"}], "hint": "（牆上的那幅畫）"}, {"q": "The cookies in the jar ＿＿＿ by my mom.", "opts": [{"t": "was made", "ok": false, "fb": "主詞是 cookies（複數）。"}, {"t": "made", "ok": false, "fb": "餅乾是被做的，要有 be 動詞。"}, {"t": "is made", "ok": false, "fb": "主詞是複數。"}, {"t": "were made", "ok": true, "fb": "主詞 The cookies 是複數，而且是被做的：were made。"}]}], "kkN": 0, "stars": 0, "listenN": 1, "kk": [{"kind": "listen", "src": "111 年會考聽力 第 8 題", "audio": "../audio/111-08.mp3", "q": "聽一聽，選出最適合的回應。", "script": "Who was the guy next to Amanda at dinner?", "opts": [{"t": "He was on her right.", "ok": false, "fb": "Who 問「是誰」，不是位置。"}, {"t": "That was her husband.", "ok": true, "fb": "the guy next to Amanda（坐在 Amanda 旁邊的男人）是誰 → 她先生。"}, {"t": "They were having dinner.", "ok": false, "fb": "這在說他們在做什麼，不是那個人是誰。"}]}, {"kind": "rw", "src": "會考風格改寫", "q": "The man with two big suitcases ＿＿＿ looking for a taxi.", "opts": [{"t": "is", "ok": true, "fb": "主詞是 the man（單數），不是 suitcases。"}, {"t": "are", "ok": false, "fb": "主詞是 the man，不是 suitcases。"}, {"t": "be", "ok": false, "fb": "要用變化過的 be 動詞。"}, {"t": "were", "ok": false, "fb": "主詞是單數。"}]}, {"kind": "rw", "src": "會考風格改寫", "q": "Who is the girl ＿＿＿?", "opts": [{"t": "wears glasses", "ok": false, "fb": "句子已經有動詞 is，不能再接 wears。"}, {"t": "on glasses", "ok": false, "fb": "on 不表示戴著。"}, {"t": "with glasses", "ok": true, "fb": "with glasses：戴眼鏡的女孩。"}, {"t": "glasses", "ok": false, "fb": "少了介系詞。"}]}]}, {"id": "b5-relative", "title": "關係代名詞 who / which / that", "unit": "第五冊 Unit 14 · B5 L5–6", "points": "<p>想用<strong>一整句話</strong>去形容一個名詞時，就用關係代名詞把兩句接起來，放在名詞後面。</p>\n<table><tr><th>先行詞（被形容的名詞）</th><th>關係代名詞</th><th>例句</th></tr>\n<tr><td>人</td><td class=\"en\"><span class=\"k1\">who</span> / that</td><td class=\"en\">The girl <span class=\"k1\">who</span> sits next to me is Amy.</td></tr>\n<tr><td>東西、動物</td><td class=\"en\"><span class=\"k1\">which</span> / that</td><td class=\"en\">The bag <span class=\"k1\">which</span> I bought is red.</td></tr></table>\n<h3>兩句合一句的步驟</h3>\n<p class=\"en\">I have a friend. + <span class=\"k2\">She</span> lives in Tainan.<br>→ I have a friend <span class=\"k1\">who</span> lives in Tainan.（who 取代 she，she 就不能再寫）</p>\n<h3>關代當受詞時可以省略</h3>\n<p class=\"en\">The song <span class=\"k0\">(that)</span> <span class=\"k2\">we learned</span> is beautiful.<br>Fiona loves listening to her children sing songs <span class=\"k2\">they learned</span> at school.（會考 110 年）</p>\n<h3>動詞看先行詞</h3>\n<p class=\"en\">Students <span class=\"k1\">who</span> <span class=\"k2\">want</span> to go … （students 是複數）<br>The boy <span class=\"k1\">who</span> <span class=\"k2\">wants</span> to go … （boy 是單數）</p>\n<div class=\"warn\"><strong>最容易被扣分的地方</strong>\n<p class=\"en\"><span class=\"bad\">The man who he helped me</span>　→ who 已經取代 he，不能再寫 he。</p>\n<p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">the girl answered the phone was Kate</span>　→ 一句話裡兩個動詞，中間要用 who 接起來：the girl <span class=\"k1\">who</span> answered the phone。</p></div>", "questions": [{"q": "The man ＿＿＿ lives next door is a doctor.", "opts": [{"t": "who", "ok": true, "fb": "先行詞是人（the man），用 who。"}, {"t": "which", "ok": false, "fb": "which 用在東西、動物。"}, {"t": "he", "ok": false, "fb": "兩句之間要用關係代名詞連接。"}, {"t": "what", "ok": false, "fb": "what 前面不能有先行詞。"}]}, {"q": "This is the phone ＿＿＿ my dad gave me for my birthday.", "opts": [{"t": "who", "ok": false, "fb": "先行詞是東西（phone），不用 who。"}, {"t": "what", "ok": false, "fb": "what 前面不能有先行詞。"}, {"t": "which", "ok": true, "fb": "先行詞是東西：which（也可以用 that）。"}, {"t": "it", "ok": false, "fb": "要用關係代名詞把兩句接起來。"}]}, {"q": "I have a friend who ＿＿＿ three languages.", "opts": [{"t": "speak", "ok": false, "fb": "先行詞 a friend 是單數，動詞要加 s。"}, {"t": "speaking", "ok": false, "fb": "關代後面要有動詞。"}, {"t": "he speaks", "ok": false, "fb": "who 已經取代 he。"}, {"t": "speaks", "ok": true, "fb": "先行詞 a friend 是單數：speaks。"}]}, {"q": "Students ＿＿＿ late will not be allowed in.", "opts": [{"t": "come", "ok": false, "fb": "一句話兩個動詞（come、will not be），中間要用關代連接。"}, {"t": "who come", "ok": true, "fb": "Students who come late：遲到的學生。"}, {"t": "who comes", "ok": false, "fb": "先行詞 students 是複數，用 come。"}, {"t": "they come", "ok": false, "fb": "要用關代，不能直接接 they。"}]}, {"q": "The cake ＿＿＿ was delicious.", "opts": [{"t": "we made yesterday", "ok": true, "fb": "關代當受詞可以省略：The cake (that) we made yesterday。"}, {"t": "who we made yesterday", "ok": false, "fb": "先行詞是東西，不用 who。"}, {"t": "we made it yesterday", "ok": false, "fb": "關代取代 it，it 不能再寫。"}, {"t": "what we made yesterday", "ok": false, "fb": "what 前面不能有先行詞。"}], "hint": "（我們昨天做的）"}, {"q": "Do you know the girl ＿＿＿ with Tom?", "opts": [{"t": "talks", "ok": false, "fb": "一句話已經有動詞 know，要用關代把第二個動詞接起來。"}, {"t": "who talk", "ok": false, "fb": "先行詞是單數的 the girl。"}, {"t": "who is talking", "ok": true, "fb": "the girl who is talking with Tom：正在和 Tom 說話的女孩。"}, {"t": "she is talking", "ok": false, "fb": "要用關代，不能直接接 she。"}]}, {"q": "Dogs are animals ＿＿＿ are friendly to people.", "opts": [{"t": "who", "ok": false, "fb": "先行詞是動物，用 which / that。"}, {"t": "that", "ok": true, "fb": "先行詞是動物，用 that（或 which）。"}, {"t": "what", "ok": false, "fb": "what 前面不能有先行詞。"}, {"t": "they", "ok": false, "fb": "要用關代接起來。"}]}, {"q": "The woman ＿＿＿ is my English teacher.", "opts": [{"t": "you saw her yesterday", "ok": false, "fb": "關代取代 her，her 不能再寫。"}, {"t": "which you saw yesterday", "ok": false, "fb": "先行詞是人，不用 which。"}, {"t": "what you saw yesterday", "ok": false, "fb": "what 前面不能有先行詞。"}, {"t": "you saw yesterday", "ok": true, "fb": "受格關代可以省略：The woman (who/that) you saw yesterday。"}], "hint": "（你昨天見到的那位）"}], "kkN": 4, "stars": 3, "listenN": 0, "kk": [{"kind": "orig", "src": "110 年會考 第 12 題", "q": "Fiona loves listening to her children sing songs ＿＿＿ at school.", "opts": [{"t": "are learned", "ok": false, "fb": "are learned 是被動，但歌是孩子們學的，而且少了關代。"}, {"t": "that learned", "ok": false, "fb": "that learned 少了主詞（誰學的）。"}, {"t": "they learned", "ok": true, "fb": "songs (that) they learned at school：關代當受詞可省略 → they learned。"}, {"t": "that they are learned", "ok": false, "fb": "that they are learned 意思不通。"}]}, {"kind": "orig", "src": "112 年會考 第 19 題", "q": "Scott wasn't sure if the young woman before him was ＿＿＿ pulled him out of a car on fire.", "opts": [{"t": "who", "ok": false, "fb": "who 前面要有先行詞，was 後面少了名詞。"}, {"t": "the one", "ok": false, "fb": "the one 後面還有動詞 pulled，要用關代接起來。"}, {"t": "the one she", "ok": false, "fb": "the one she pulled him out 多了 she，句子不通。"}, {"t": "the one who", "ok": true, "fb": "the one who pulled him out：那位把他從火車裡拉出來的人。"}]}, {"kind": "orig", "src": "113 年會考 第 12 題", "q": "Students ＿＿＿ to go on the school trip should ask their parents first.", "opts": [{"t": "who want", "ok": true, "fb": "想去的學生：Students who want to go …（先行詞是人，用 who）。"}, {"t": "want", "ok": false, "fb": "一句話裡已經有 should ask，第二個動詞 want 要用關代接起來。"}, {"t": "who they want", "ok": false, "fb": "who 已經取代主詞，不能再寫 they。"}, {"t": "what they want", "ok": false, "fb": "what 前面不能有先行詞。"}]}, {"kind": "orig", "src": "115 年會考 第 11 題", "q": "I thought the girl ＿＿＿ was Kate, but it was her sister, Candy. They sounded almost the same.", "opts": [{"t": "answered the phone", "ok": false, "fb": "一句話裡有 answered 和 was 兩個動詞，中間要用關代連接。"}, {"t": "she answered the phone", "ok": false, "fb": "she answered the phone 前面少了關代，而且 she 多餘。"}, {"t": "who answered the phone", "ok": true, "fb": "the girl who answered the phone：接電話的那個女孩。"}, {"t": "and answered the phone", "ok": false, "fb": "and answered 前面沒有可以對等連接的動詞。"}]}, {"kind": "rw", "src": "仿 113 年第 12 題", "q": "People ＿＿＿ in this building must not smoke anywhere inside.", "opts": [{"t": "work", "ok": false, "fb": "一句話已經有 must not smoke，第二個動詞要用關代接起來。"}, {"t": "who work", "ok": true, "fb": "People who work in this building：在這棟大樓工作的人。"}, {"t": "who they work", "ok": false, "fb": "who 已經取代主詞，不能再寫 they。"}, {"t": "what work", "ok": false, "fb": "what 前面不能有先行詞。"}]}]}, {"id": "b5-participle", "title": "分詞片語（V-ing / p.p. 修飾名詞）", "unit": "第五冊 Unit 14 · B5 L5–6", "points": "<p>分詞片語可以放在名詞後面形容它，像是把關係代名詞子句「縮短」。</p>\n<table><tr><th>分詞</th><th>意思</th><th>例句</th></tr>\n<tr><td><span class=\"tag k2\">V-ing</span></td><td><strong>主動</strong>、正在做</td><td class=\"en\">The boy <span class=\"k2\">playing the piano</span> is Ken.<br>（= who is playing the piano）</td></tr>\n<tr><td><span class=\"tag k1\">p.p.</span></td><td><strong>被動</strong>、被做的</td><td class=\"en\">The car <span class=\"k1\">made in Japan</span> is expensive.<br>（= which was made in Japan）</td></tr></table>\n<h3>判斷方法：名詞自己做，還是被做？</h3>\n<p>女孩<strong>自己在唱歌</strong> → the girl <span class=\"k2\">singing</span> a song<br>信<strong>被寫</strong> → the letter <span class=\"k1\">written</span> by Tom</p>\n<h3>放在名詞前面的單一分詞</h3>\n<p class=\"en\">a <span class=\"k2\">sleeping</span> baby（正在睡覺的寶寶）　a <span class=\"k1\">broken</span> window（被打破的窗戶）</p>\n<div class=\"warn\"><strong>最容易被扣分的地方</strong>\n<p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">The language speaking in Brazil is Portuguese.</span>　→ 語言是被說的：spoken。</p></div>", "questions": [{"q": "The boy ＿＿＿ the guitar is my brother.", "opts": [{"t": "plays", "ok": false, "fb": "句子已經有動詞 is，第二個動作要改成分詞。"}, {"t": "playing", "ok": true, "fb": "男孩自己在彈吉他（主動）：playing。"}, {"t": "played", "ok": false, "fb": "p.p. 是被動，男孩不是被彈。"}, {"t": "to play", "ok": false, "fb": "to play 表示「將要」，這裡是正在彈。"}]}, {"q": "I like the pictures ＿＿＿ by my little sister.", "opts": [{"t": "draw", "ok": false, "fb": "句子已經有動詞 like。"}, {"t": "drawing", "ok": false, "fb": "畫是被畫的，不是自己在畫。"}, {"t": "drawn", "ok": true, "fb": "畫「被」妹妹畫：drawn by my little sister。"}, {"t": "drew", "ok": false, "fb": "drew 是過去式動詞，這裡要分詞。"}]}, {"q": "Don't wake up the ＿＿＿ baby.", "opts": [{"t": "sleeping", "ok": true, "fb": "正在睡覺的寶寶：sleeping baby。"}, {"t": "slept", "ok": false, "fb": "slept 不放在名詞前表示「睡著的」。"}, {"t": "sleep", "ok": false, "fb": "名詞前要用形容詞性的分詞。"}, {"t": "asleep", "ok": false, "fb": "asleep 不放在名詞前面。"}]}, {"q": "The language ＿＿＿ in Brazil is Portuguese.", "opts": [{"t": "speaks", "ok": false, "fb": "句子已經有動詞 is。"}, {"t": "speaking", "ok": false, "fb": "語言不會自己說話。"}, {"t": "spoke", "ok": false, "fb": "spoke 是過去式動詞。"}, {"t": "spoken", "ok": true, "fb": "語言「被說」：spoken in Brazil。"}]}, {"q": "Be careful! There is some ＿＿＿ glass on the floor.", "opts": [{"t": "breaking", "ok": false, "fb": "玻璃是被打破的。"}, {"t": "broken", "ok": true, "fb": "被打破的玻璃：broken glass。"}, {"t": "break", "ok": false, "fb": "名詞前要用分詞。"}, {"t": "broke", "ok": false, "fb": "broke 是過去式動詞。"}]}, {"q": "Who is the woman ＿＿＿ to Mr. Lin?", "opts": [{"t": "talks", "ok": false, "fb": "句子已經有 is。"}, {"t": "talked", "ok": false, "fb": "女人自己在說話，是主動。"}, {"t": "talking", "ok": true, "fb": "正在和林先生說話的女人：talking。"}, {"t": "to talk", "ok": false, "fb": "這裡說的是正在說話。"}]}, {"q": "This is a book ＿＿＿ in 1920.", "opts": [{"t": "written", "ok": true, "fb": "書是被寫的：written in 1920。"}, {"t": "writing", "ok": false, "fb": "書不會自己寫。"}, {"t": "wrote", "ok": false, "fb": "wrote 是過去式動詞。"}, {"t": "write", "ok": false, "fb": "要用分詞。"}]}, {"q": "The students ＿＿＿ in the classroom are doing a test.", "opts": [{"t": "sat", "ok": false, "fb": "sat 是過去式動詞，句子已經有 are doing。"}, {"t": "seated by", "ok": false, "fb": "seated by 後面要接做的人，這裡說的是坐在教室裡。"}, {"t": "sit", "ok": false, "fb": "要用分詞。"}, {"t": "sitting", "ok": true, "fb": "學生自己坐著（主動）：sitting in the classroom。"}]}], "kkN": 0, "stars": 0, "listenN": 0, "kk": [{"kind": "rw", "src": "會考風格改寫", "q": "The man ＿＿＿ next to the window is our new teacher.", "opts": [{"t": "stands", "ok": false, "fb": "句子已經有動詞 is。"}, {"t": "standing", "ok": true, "fb": "男人自己站著（主動）：standing。"}, {"t": "stood", "ok": false, "fb": "stood 是過去式動詞。"}, {"t": "to stand", "ok": false, "fb": "這裡說的是正站在那裡。"}]}, {"kind": "rw", "src": "會考風格改寫", "q": "I bought some cookies ＿＿＿ by a famous baker.", "opts": [{"t": "make", "ok": false, "fb": "句子已經有動詞 bought。"}, {"t": "making", "ok": false, "fb": "餅乾不會自己做東西。"}, {"t": "makes", "ok": false, "fb": "要用分詞。"}, {"t": "made", "ok": true, "fb": "餅乾「被」做：made by a famous baker。"}]}]}, {"id": "b5-what", "title": "複合關係代名詞 what", "unit": "第五冊 Unit 14 · B5 L5–6", "points": "<p><span class=\"k1\">what</span> = <span class=\"k1\">the thing(s) that</span>，意思是「…的東西、…的事」。what 自己就包含了先行詞，所以<strong>前面不能再放名詞</strong>。</p>\n<div class=\"formula\"><span class=\"tag k1\">what</span><span class=\"plus\">=</span><span class=\"tag k0\">the thing that</span></div>\n<p class=\"en\"><span class=\"k1\">What</span> he said is true.（他說的話是真的）<br>This is <span class=\"k1\">what</span> I want.（這就是我想要的東西）<br>I can't believe <span class=\"k1\">what</span> I saw.（我不敢相信我看到的）</p>\n<h3>what 和 that / which 的差別</h3>\n<table><tr><th></th><th>前面有名詞嗎？</th><th>例句</th></tr>\n<tr><td class=\"en\">what</td><td>沒有</td><td class=\"en\">This is <span class=\"k1\">what</span> I bought.</td></tr>\n<tr><td class=\"en\">that / which</td><td>有</td><td class=\"en\">This is <span class=\"k2\">the bag</span> <span class=\"k1\">that</span> I bought.</td></tr></table>\n<div class=\"warn\"><strong>最容易被扣分的地方</strong>\n<p class=\"en\" style=\"margin-bottom:0\"><span class=\"bad\">This is the bag what I bought.</span>　→ 前面已經有 the bag，用 that / which。</p></div>", "questions": [{"q": "＿＿＿ you said made me very happy.", "opts": [{"t": "That", "ok": false, "fb": "that 當關代時前面要有名詞。"}, {"t": "Which", "ok": false, "fb": "which 前面要有名詞。"}, {"t": "What", "ok": true, "fb": "What you said = The things that you said：你說的話。"}, {"t": "It", "ok": false, "fb": "It you said 不通。"}]}, {"q": "This is not ＿＿＿ I ordered. I ordered a hamburger.", "opts": [{"t": "what", "ok": true, "fb": "這不是我點的東西：what I ordered。"}, {"t": "that", "ok": false, "fb": "前面沒有名詞，不能用 that 當關代。"}, {"t": "which", "ok": false, "fb": "which 前面要有名詞。"}, {"t": "who", "ok": false, "fb": "點的是東西。"}]}, {"q": "This is the bike ＿＿＿ I bought last week.", "opts": [{"t": "what", "ok": false, "fb": "前面已經有 the bike，不能用 what。"}, {"t": "that", "ok": true, "fb": "先行詞 the bike 是東西：that。"}, {"t": "who", "ok": false, "fb": "bike 不是人。"}, {"t": "where", "ok": false, "fb": "where 用在地點，後面要是完整句子。"}]}, {"q": "Please tell me ＿＿＿ you need. I'll buy it for you.", "opts": [{"t": "that", "ok": false, "fb": "前面沒有名詞，而且「你需要的東西」用 what。"}, {"t": "which", "ok": false, "fb": "which 前面要有名詞或選項。"}, {"t": "who", "ok": false, "fb": "需要的是東西。"}, {"t": "what", "ok": true, "fb": "what you need：你需要的東西。"}]}, {"q": "I can't believe ＿＿＿ I just saw. It was a real tiger!", "opts": [{"t": "that", "ok": false, "fb": "saw 後面缺受詞，又沒有先行詞，用 what。"}, {"t": "what", "ok": true, "fb": "what I just saw：我剛剛看到的東西。"}, {"t": "which", "ok": false, "fb": "which 前面要有名詞。"}, {"t": "it", "ok": false, "fb": "it 不能接 I just saw。"}]}, {"q": "＿＿＿ Kevin needs now is a good rest.", "opts": [{"t": "What", "ok": true, "fb": "What Kevin needs：Kevin 現在需要的是…。"}, {"t": "That", "ok": false, "fb": "That 當關代前面要有名詞。"}, {"t": "Who", "ok": false, "fb": "需要的是休息，不是人。"}, {"t": "Which", "ok": false, "fb": "Which 不能這樣當主詞。"}]}, {"q": "The movie ＿＿＿ we saw yesterday const GROUPS = [{"name": "第一冊", "sub": "B1 · Unit 1–2", "ids": ["noun-plural", "articles", "pronouns", "be-qa", "adjectives", "wh-questions", "greetings", "imperative", "place-prep", "there-be", "present-cont"]}, {"name": "第二冊", "sub": "B2 · Unit 3–5", "ids": ["conjunctions", "too-either-also", "can-haveto", "present-simple", "time-prep", "which", "ordinal-date", "frequency", "countable", "quantifiers", "how-many-much", "past-be"]}, {"name": "第三冊", "sub": "B3 · Unit 6–8", "ids": ["past-verb", "because-although", "sub-conj", "modals", "past-cont", "infinitive", "gerund", "it-subject", "directions", "future", "weather"]}, {"name": "第四冊", "sub": "B4 · Unit 9–11", "ids": ["ditransitive", "linking-verbs", "if-clause", "compound-pronouns", "adj-degree", "causative", "possessive-reflexive", "adverbs", "indefinite-pronouns", "spend-cost-take"]}, {"name": "第五冊", "sub": "B5 · Unit 12–14", "ids": ["b5-present-perfect", "b5-emotion", "b5-that-clause", "b5-tag-q", "b5-passive", "b5-indirect-q", "b5-wh-to", "b5-whether", "b5-prep-phrase", "b5-relative", "b5-participle", "b5-what", "b5-rel-adverb"]}];

let store = {};
function save(){}

const app = document.getElementById('app');
const hTitle = document.getElementById('hTitle');
const hSub = document.getElementById('hSub');
const backBtn = document.getElementById('backBtn');
backBtn.addEventListener('click', showMenu);

function el(tag, cls, text){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function starText(n){ return n ? '★'.repeat(n) : ''; }

function showMenu(){
  hTitle.textContent = '國中英語文法小助手';
  hSub.textContent = '第一～六冊 · 含會考實戰';
  backBtn.style.display = 'none';
  app.innerHTML = '';
  window.scrollTo(0,0);

  const intro = el('div','intro');
  intro.textContent = '選一個想練的文法主題。每個主題都有重點整理、基本練習和會考實戰題，答錯會告訴你錯在哪裡。';
  app.appendChild(intro);

  const lg = el('div','legend');
  lg.innerHTML = '<b>★★★</b> 會考 9 年考 4 題以上，一定要會　<b>★★</b> 考 2–3 題　<b>★</b> 考過 1 題<br>'
    + '<span class="chip listen" style="margin-left:0">聽力考過</span> 會考聽力出現過這個句型　'
    + '<span class="chip rare">較少直接考</span> 會考很少直接考，但讀文章時還是會用到';
  app.appendChild(lg);

  GROUPS.forEach(g => {
    const head = el('div','grouphead');
    head.appendChild(el('h2',null,g.name));
    head.appendChild(el('span',null,g.sub));
    app.appendChild(head);

    const list = el('div','topiclist');
    g.ids.forEach(id => {
      const idx = TOPICS.findIndex(t => t.id === id);
      const t = TOPICS[idx];
      const b = el('button','topicbtn' + (t.stars === 3 ? ' hot' : ''));
      b.type = 'button';
      b.appendChild(el('span','no', String(idx+1)));
      const nm = el('span','nm', t.title);
      if (!t.kkN && t.listenN) nm.appendChild(el('span','chip listen','聽力考過'));
      if (!t.kkN && !t.listenN) nm.appendChild(el('span','chip rare','較少直接考'));
      b.appendChild(nm);
      const s = el('span','stars s' + t.stars, starText(t.stars) || '·');
      if (t.stars) s.setAttribute('aria-label', '會考重要度 ' + t.stars + ' 顆星');
      b.appendChild(s);
      const rec = store[t.id];
      const st = el('span','st');
      if (rec && typeof rec.best === 'number'){
        st.textContent = '本次 ' + rec.best + '%';
        if (rec.best === 100) st.className = 'st done';
      } else {
        st.textContent = '未練習';
      }
      b.appendChild(st);
      b.addEventListener('click', () => showTopic(idx));
      list.appendChild(b);
    });
    app.appendChild(list);
  });
}

function showTopic(idx){
  const t = TOPICS[idx];
  hTitle.textContent = t.title;
  hSub.textContent = t.unit + (t.stars ? '　會考 ' + starText(t.stars) : '');
  backBtn.style.display = 'inline-block';
  app.innerHTML = '';
  window.scrollTo(0,0);

  const pc = el('div','card');
  pc.appendChild(el('h2',null,'先看重點'));
  const holder = el('div');
  holder.innerHTML = t.points;
  holder.querySelectorAll('table').forEach(tb => {
    const w = el('div','tablescroll');
    tb.parentNode.insertBefore(w, tb);
    w.appendChild(tb);
  });
  pc.appendChild(holder);
  app.appendChild(pc);

  const qc = el('div','card');
  qc.appendChild(el('h2',null,'換你試試看'));
  app.appendChild(qc);
  makeQuiz(qc, t.questions, { key: t.id, label: '基本題', next: t.kk.length ? '去做會考實戰' : null });

  if (t.kk.length){
    const kc = el('div','card'); kc.id = 'kkCard';
    const hd = el('div','kkhead');
    hd.appendChild(el('h2',null,'會考實戰'));
    if (t.stars) hd.appendChild(el('span','stars', starText(t.stars)));
    kc.appendChild(hd);
    const nO = t.kk.filter(k => k.kind === 'orig').length;
    const nL = t.kk.filter(k => k.kind === 'listen').length;
    const nR = t.kk.filter(k => k.kind === 'rw').length;
    let note = [];
    if (nO) note.push('會考原題 ' + nO + ' 題');
    if (nL) note.push('會考聽力原題 ' + nL + ' 題');
    if (nR) note.push('改寫題 ' + nR + ' 題');
    let msg = note.join('、') + '。';
    if (!t.kkN && !t.listenN) msg = '會考較少直接考這個主題，先用改寫題練習。' + msg;
    msg += '考過的原題不會再出一模一樣的，練的是會考「怎麼考」。';
    kc.appendChild(el('p','kknote', msg));
    app.appendChild(kc);
    makeQuiz(kc, t.kk, { key: t.id + '#kk', label: '會考實戰', next: null });
  }
}

const BADGE = { orig: ['orig','會考原題'], listen: ['listen','會考聽力原題'], rw: ['rw','改寫題'] };

function makeQuiz(card, list, cfg){
  const st = { i: 0, result: new Array(list.length).fill(null), wrong: [] };
  const prog = el('div','progress');
  const body = el('div');
  card.appendChild(prog); card.appendChild(body);

  function drawProgress(){
    prog.innerHTML = '';
    list.forEach((_, i) => {
      let cls = 'dot';
      if (st.result[i] === true) cls += ' done';
      else if (st.result[i] === false) cls += ' miss';
      else if (i === st.i) cls += ' now';
      prog.appendChild(el('span', cls));
    });
  }

  function render(){
    if (st.i >= list.length) return finish();
    drawProgress();
    const item = list[st.i];
    body.innerHTML = '';
    body.appendChild(el('p','qnum', cfg.label + ' 第 ' + (st.i+1) + ' 題 / 共 ' + list.length + ' 題'));
    if (item.kind){
      const b = BADGE[item.kind];
      body.appendChild(el('span','badge ' + b[0], b[1] + ' · ' + item.src));
    }
    if (item.audio){
      const au = document.createElement('audio');
      au.controls = true; au.preload = 'none'; au.src = item.audio;
      body.appendChild(au);
    }
    const qt = el('p','qtext en', item.q);
    if (item.hint) qt.appendChild(el('span','hintword','　' + item.hint));
    body.appendChild(qt);

    const box = el('div'); body.appendChild(box);
    const fbBox = el('div'); body.appendChild(fbBox);
    let missed = false;

    item.opts.forEach((o, i) => {
      const b = el('button','opt');
      b.type = 'button';
      b.appendChild(el('span','letter','(' + 'ABCD'[i] + ')'));
      b.appendChild(document.createTextNode(o.t));
      b.addEventListener('click', () => {
        if (o.ok){
          b.classList.add('picked-right');
          Array.prototype.forEach.call(box.children, x => { x.disabled = true; });
          if (st.result[st.i] === null) st.result[st.i] = !missed;
          feedback(fbBox, true, o.fb, missed, item);
        } else {
          missed = true;
          st.result[st.i] = false;
          b.classList.add('picked-wrong');
          b.disabled = true;
          if (!st.wrong.some(w => w.q === item.q && w.pick === o.t)){
            st.wrong.push({ q: item.q, pick: o.t, fb: o.fb });
          }
          feedback(fbBox, false, o.fb, missed, item);
        }
        drawProgress();
      });
      box.appendChild(b);
    });
  }

  function feedback(host, ok, text, missed, item){
    host.innerHTML = '';
    const d = el('div','fb ' + (ok ? 'yes' : 'no'));
    d.appendChild(el('strong', null, ok ? (missed ? '這次對了' : '答對了') : '再看一次'));
    d.appendChild(document.createTextNode(text));
    host.appendChild(d);
    if (ok && item.script){
      const det = document.createElement('details');
      det.className = 'script';
      det.appendChild(el('summary', null, '看播音內容'));
      det.appendChild(el('div','en', item.script));
      host.appendChild(det);
    }
    if (ok){
      const n = el('button','btn', st.i === list.length - 1 ? '看結果' : '下一題');
      n.type = 'button';
      n.addEventListener('click', () => { st.i++; render(); });
      host.appendChild(n);
    } else {
      const p = el('p', null, '選選看其他選項。');
      p.style.cssText = 'margin:12px 0 0;color:var(--muted);font-size:17px';
      host.appendChild(p);
    }
  }

  function finish(){
    drawProgress();
    const right = st.result.filter(r => r === true).length;
    const pct = Math.round(right / list.length * 100);
    const rec = store[cfg.key] || {};
    rec.best = Math.max(rec.best || 0, pct);
    rec.last = pct;
    store[cfg.key] = rec;
    save();

    body.innerHTML = '';
    body.appendChild(el('p','score', pct + '%'));
    body.appendChild(el('p','scorelabel', cfg.label + ' ' + list.length + ' 題中，一次就答對 ' + right + ' 題'));
    if (st.wrong.length){
      body.appendChild(el('h3',null,'這些地方要再看一次'));
      const box = el('div','review');
      const ul = document.createElement('ul');
      ul.style.margin = '0';
      st.wrong.forEach(w => {
        const li = document.createElement('li');
        li.appendChild(el('strong', null, '你選了 ' + w.pick + '：'));
        li.appendChild(document.createTextNode(w.fb));
        ul.appendChild(li);
      });
      box.appendChild(ul);
      body.appendChild(box);
    } else {
      body.appendChild(el('p', null, '全部一次答對，做得很好。'));
    }
    const again = el('button','btn ghost','再練一次');
    again.type = 'button';
    again.addEventListener('click', () => { st.i = 0; st.result.fill(null); st.wrong = []; render(); });
    body.appendChild(again);
    if (cfg.next){
      const nx = el('button','btn', cfg.next);
      nx.type = 'button';
      nx.addEventListener('click', () => document.getElementById('kkCard').scrollIntoView({behavior:'smooth'}));
      body.appendChild(nx);
    } else {
      const back = el('button','btn','換一個主題');
      back.type = 'button';
      back.addEventListener('click', showMenu);
      body.appendChild(back);
    }
  }

  render();
}

const nQ = TOPICS.reduce((s, t) => s + t.questions.length + t.kk.length, 0);
document.getElementById('ft').textContent = '大同國中英語科 · 共 ' + TOPICS.length + ' 個文法主題、' + nQ + ' 題（含會考實戰）';

showMenu();
</script>
